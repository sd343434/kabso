// kabso_live_music (D201): background music mixed into the host's microphone on
// flutter_webrtc's capture post-processing, and the system audio-file picker.
// The app's own Gradle files stay untouched.
group 'com.kabso.kabso_live_music'
version '1.0'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// Same rule as flutter_webrtc and kabso_camera_fx: AGP 9 with built-in Kotlin
// rejects KGP; apply it only when built-in Kotlin is off.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlinActive = agpMajor >= 9 &&
    (!project.hasProperty('android.builtInKotlin') ||
        Boolean.parseBoolean(project.property('android.builtInKotlin').toString()))
if (!builtInKotlinActive && !project.plugins.hasPlugin('kotlin-android')) {
    apply plugin: 'kotlin-android'
}

android {
    namespace 'com.kabso.kabso_live_music'
    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 23
    }
}

def kotlinExt = project.extensions.findByName('kotlin')
if (kotlinExt?.hasProperty('compilerOptions')) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}

dependencies {
    // compileOnly: flutter_webrtc ships this exact WebRTC build (its
    // ExternalAudioProcessingFactory runs the mixer); a second copy must not
    // resolve.
    compileOnly 'io.github.webrtc-sdk:android:150.7871.01'
    compileOnly 'androidx.annotation:annotation:1.1.0'

    // JVM tests of the plain-Kotlin mixing rules (MixMath.kt).
    testImplementation 'junit:junit:4.13.2'
}

# SCRATCH (D168 debugging only, never merged): formats, regenerates and
# analyzes the app, runs the chosen tests, and pushes the results to
# claude/kl-168-ci-out so the session can read them (logs are not reachable).
name: CI
on:
  push:
    branches: ["claude/kl-168-ci-debug"]
permissions:
  contents: write
jobs:
  mobile-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
          pub-cache: true
      - name: Run
        working-directory: apps/mobile
        run: |
          mkdir -p ../../ci-out
          flutter pub get --enforce-lockfile > ../../ci-out/pubget.txt 2>&1 || true
          flutter gen-l10n > ../../ci-out/genl10n.txt 2>&1 || true
          dart run build_runner build --delete-conflicting-outputs > ../../ci-out/build_runner.txt 2>&1 || true
          dart format lib test > ../../ci-out/format.txt 2>&1 || true
          flutter analyze > ../../ci-out/analyze.txt 2>&1 || true
          if [ -f ../../ci-tests.txt ]; then tests="$(cat ../../ci-tests.txt)"; else tests=""; fi
          flutter test $tests --reporter expanded > ../../ci-out/test.txt 2>&1 || true
          tail -c 200000 ../../ci-out/test.txt > ../../ci-out/test-tail.txt
          grep -n "\[E\]\|FAILED\|Error:\|error:" ../../ci-out/test.txt | head -400 > ../../ci-out/test-errors.txt || true
      - name: Push results
        run: |
          git config user.name "ci-debug"
          git config user.email "ci-debug@users.noreply.github.com"
          rm -f ci-out/test.txt
          git checkout -B claude/kl-168-ci-out
          git add -A
          git commit -q -m "ci-out ${GITHUB_SHA::8}" || true
          git push -f origin HEAD:claude/kl-168-ci-out

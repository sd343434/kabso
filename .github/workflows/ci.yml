# Kabso Live — continuous integration.
#
# Jobs run only when their part of the monorepo changed (see `changes`). `ci-ok` is the single
# required status check for branch protection: it passes when every job either succeeded or was
# skipped because nothing relevant changed.
#
# Third-party actions are pinned to full commit SHAs (the comment names the release tag) and
# service images to registry digests (refresh with scripts/image-digests.sh). Dependabot
# (.github/dependabot.yml) proposes action SHA bumps weekly.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

# Cancellation rule: a run may only be cancelled by a newer run that executes at least the
# same jobs (KL-010; run 10 lost its mobile/Android verification to a docs-only push).
#  - pull_request: paths-filter diffs the whole PR against its base, so a newer run of the same
#    PR covers a superset of files -> cancel the older run (saves the most minutes).
#  - push to a branch that is NOT the repository default branch: never cancel a run in
#    progress. Runs of one branch queue in one group; GitHub only replaces a run that is still
#    *pending* with the newer one, and paths-filter diffs such a branch against its merge-base
#    with the default branch, so the newer run again covers a superset.
#    Cost: at most one running + one queued run per branch.
#  - push to the repository default branch (today `claude/amazing-tesla-5aj3um`, see
#    docs/DEPLOYMENT.md §2), push to `main`, and workflow_dispatch: unique group per run, never
#    cancelled or replaced. On the default branch paths-filter only diffs against the previous
#    push (`before`), so replacing a queued run could leave a commit untested (KL-010-D1).
concurrency:
  group: >-
    ci-${{ github.workflow }}-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
      (github.event_name == 'push' && github.ref_name != github.event.repository.default_branch &&
       github.ref != 'refs/heads/main') && format('ref-{0}', github.ref) ||
      format('run-{0}', github.run_id)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  FLUTTER_VERSION: "3.47.7"
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the upstream checksums file.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files through the API
    outputs:
      api: ${{ steps.filter.outputs.api == 'true' || github.event_name == 'workflow_dispatch' }}
      mobile: ${{ steps.filter.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch' }}
      contracts: ${{ steps.filter.outputs.contracts == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api:
              - "apps/api/**"
              - "infra/postgres/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".github/workflows/ci.yml"
            mobile:
              - "apps/mobile/**"
              - "docs/contracts/design-tokens.json"
              - ".github/workflows/ci.yml"
            contracts:
              - "docs/contracts/**"
              - "redocly.yaml"
              - "tools/redocly/**"
              - ".github/workflows/ci.yml"

  api:
    name: API (lint, typecheck, test, e2e, build)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        # postgres:16.15-alpine (multi-arch index digest, resolved 2026-10-15)
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: kabso
          POSTGRES_PASSWORD: ci_test_password_not_secret
          POSTGRES_DB: kabso_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kabso -d kabso_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        # redis:7.4-alpine (multi-arch index digest, resolved 2026-10-15)
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Clearly non-secret values that only exist inside this ephemeral CI job.
      NODE_ENV: test
      CI: "true"
      PORT: "3000"
      # SEC-011 / KL-013: the API and the e2e suite use the DML-only runtime role; Prisma's CLI
      # (migrate deploy) uses the migration/owner role. Both are created by the "Bootstrap
      # database roles" step; the service's POSTGRES_USER (kabso) is only the admin.
      DATABASE_URL: postgresql://kabso_app:ci_app_password_not_secret@localhost:5432/kabso_test?schema=public
      MIGRATION_DATABASE_URL: postgresql://kabso_migrator:ci_migrator_password_not_secret@localhost:5432/kabso_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      JWT_ACCESS_SECRET: ci-test-only-jwt-secret-not-used-anywhere-else-0123456789
      RATE_LIMIT_KEY_SECRET: ci-test-only-rate-limit-hmac-key-not-a-secret-0123456789
      TRUST_PROXY: "false"
      # >= ARGON2_MAX_CONCURRENCY (default = vCPU count; 4 on ubuntu-24.04 runners) + 4.
      # Job-level env, so it is in the process environment before Node starts.
      UV_THREADPOOL_SIZE: "16"
      JWT_ACCESS_TTL_SECONDS: "900"
      REFRESH_TTL_SECONDS: "2592000"
      APP_PUBLIC_URL: http://localhost:3000
      MAIL_TRANSPORT: log
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false # pnpm store is cached by pnpm/action-setup below
      # pnpm version comes from the `packageManager` field of the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm --filter ./apps/api prisma:generate
      # Same script as staging/production (docs/DEPLOYMENT.md §5.1), run as the admin user inside
      # the service container so its psql 16 is used. Values come from the step env, not argv.
      - name: Bootstrap database roles
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          KABSO_DB_MIGRATOR_USER: kabso_migrator
          KABSO_DB_MIGRATOR_PASSWORD: ci_migrator_password_not_secret
          KABSO_DB_APP_USER: kabso_app
          KABSO_DB_APP_PASSWORD: ci_app_password_not_secret
        run: >-
          docker exec -i
          -e KABSO_DB_MIGRATOR_USER -e KABSO_DB_MIGRATOR_PASSWORD
          -e KABSO_DB_APP_USER -e KABSO_DB_APP_PASSWORD
          "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U kabso -d kabso_test -f -
          < infra/postgres/bootstrap-roles.sql
      - name: Apply migrations (migrate deploy, migration role)
        run: pnpm --filter ./apps/api prisma:migrate:deploy
      - name: Lint
        run: pnpm --filter ./apps/api lint
      - name: Format check
        run: pnpm --filter ./apps/api format:check
      - name: Typecheck
        run: pnpm --filter ./apps/api typecheck
      - name: Unit tests
        run: pnpm --filter ./apps/api test
      - name: E2E tests (real Postgres + Redis, runtime role)
        run: pnpm --filter ./apps/api test:e2e
      - name: Build
        run: pnpm --filter ./apps/api build

  mobile:
    name: Mobile (codegen drift, format, analyze, test)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - name: Flutter version
        run: flutter --version
      - name: Pub get (lockfile enforced)
        run: flutter pub get --enforce-lockfile
      - name: Regenerate code
        run: dart run build_runner build --delete-conflicting-outputs
      # Generated code is committed (decision D5); it must match what build_runner produces.
      - name: Fail on generated-code drift
        run: |
          git diff --exit-code -- .
          untracked="$(git ls-files --others --exclude-standard -- .)"
          if [ -n "$untracked" ]; then
            echo "::error::build_runner produced files that are not committed:"
            echo "$untracked"
            exit 1
          fi
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  android:
    name: Android debug APK
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/mobile/android/*.gradle*
            apps/mobile/android/**/gradle-wrapper.properties
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      # The Android SDK is preinstalled on GitHub's ubuntu runner image ($ANDROID_HOME).
      - name: Flutter doctor
        run: flutter doctor -v
      - name: Pub get (lockfile enforced)
        run: flutter pub get --enforce-lockfile
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kabso-live-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  ios:
    name: iOS build (no codesign)
    needs: changes
    # macOS minutes are ~10x Linux: only on manual dispatch or pushes to main. NOTE: `main` does
    # not exist yet (default branch is claude/amazing-tesla-5aj3um), so today iOS runs only on
    # workflow_dispatch. Kept on purpose; see docs/DEPLOYMENT.md §2 (default branch).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.mobile == 'true')
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - name: Pub get (lockfile enforced)
        run: flutter pub get --enforce-lockfile
      - name: Build iOS (unsigned)
        run: flutter build ios --no-codesign

  contracts:
    name: Contracts (OpenAPI lint)
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      # Redocly CLI is pinned with an npm lockfile (sha512 integrity) in tools/redocly (SEC-021).
      - name: Install pinned Redocly CLI
        run: npm ci --prefix tools/redocly --ignore-scripts --no-audit --no-fund
      - name: Lint OpenAPI (rules in redocly.yaml)
        env:
          REDOCLY_TELEMETRY: "off"
          REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
        run: tools/redocly/node_modules/.bin/redocly lint docs/contracts/openapi.yaml --format=github-actions

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not only the tip
          persist-credentials: false
      # The gitleaks CLI is used directly (gitleaks-action needs a paid licence for orgs).
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --exit-code 1 .'

  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, api, mobile, android, ios, contracts, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # ALLOWLIST, not denylist (KL-010c). In run 29 (38755740110, 3b80e0a) the `ios` job never
      # got a macOS runner and ended `abandoned`; the old check only rejected failure|cancelled,
      # so this required check passed although a job never ran. Now only `success` and
      # `skipped` (path-filtered or gated jobs) pass; every other value (failure, cancelled,
      # abandoned, timed_out, null, or anything GitHub adds later) fails and is named.
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "Job results:"
          jq -r 'to_entries[] | "  \(.key): \(.value.result // "null")"' <<<"$NEEDS"
          total="$(jq 'length' <<<"$NEEDS")"
          if [ "$total" -eq 0 ]; then
            echo "::error::No job results received; failing closed."
            exit 1
          fi
          bad="$(jq -r 'to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key)=\(.value.result // "null")"' <<<"$NEEDS")"
          if [ -n "$bad" ]; then
            while IFS= read -r line; do
              echo "::error::Job '${line%%=*}' ended with result '${line#*=}' (only success or skipped pass)."
            done <<<"$bad"
            exit 1
          fi
          echo "All ${total} jobs succeeded or were skipped."

# TEMPORARY (D252, removed before merge): runs the codegen and formatters this agent's sandbox lacks (no Flutter SDK,
# no npm registry) and commits their output back to the branch; prints `flutter analyze` and the VIP tests' result.
name: claude-vip-tools (temporary)

on:
  push:
    branches:
      - claude/kl-252-purchase-vip

permissions:
  contents: write

concurrency:
  group: claude-vip-tools
  cancel-in-progress: true

jobs:
  tools:
    if: ${{ !contains(github.event.head_commit.message, '[tools]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
          pub-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Mobile — pub get (l10n), build_runner, dart format
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          dart format lib test
      - name: API and admin — install, prisma generate, prettier
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter ./apps/api prisma:generate
          pnpm --filter ./apps/api exec prettier --write src test
      - name: Commit the generated and formatted files
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add -A apps
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore(vip): codegen and format from the tools workflow [tools]" \
              -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
              -m "Claude-Session: https://claude.ai/code/session_01EeAD3Zu8RxSbNSASC3hKot"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Mobile — render the VIP screenshots and commit them
        working-directory: apps/mobile
        run: |
          flutter test test/features/vip/vip_shots_test.dart || true
          mkdir -p ../../docs/design/review/d252-vip-shots
          cp build/shots/*.png ../../docs/design/review/d252-vip-shots/ || true
          cd ../..
          git add docs/design/review/d252-vip-shots
          if ! git diff --cached --quiet; then
            git commit -m "chore(vip): screenshots of the VIP screen (temporary) [tools]" \
              -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
              -m "Claude-Session: https://claude.ai/code/session_01EeAD3Zu8RxSbNSASC3hKot"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Mobile — analyze (report only)
        if: always()
        working-directory: apps/mobile
        run: flutter analyze || true
      - name: Mobile — VIP tests (report only)
        if: always()
        working-directory: apps/mobile
        run: |
          flutter test test/features/vip test/features/profile/me_hub_screen_test.dart \
            test/core/error_mapper_test.dart test/features/programs || true
      - name: API — typecheck and lint (report only)
        if: always()
        run: |
          pnpm --filter ./apps/api typecheck || true
          pnpm --filter ./apps/api exec eslint src/modules/vip src/modules/admin-panel/admin-vip.controller.ts test/d252-purchase-vip.e2e-spec.ts || true
          pnpm --filter ./apps/api exec vitest run --config vitest.config.ts src/modules/vip src/common/errors || true
      - name: Admin — typecheck, lint, test (report only)
        if: always()
        run: |
          pnpm --filter @kabso/admin typecheck || true
          pnpm --filter @kabso/admin lint || true
          pnpm --filter @kabso/admin test || true

# TEMPORARY: screenshot of the Me hub before/after D249 (never merged).
name: Shot
on:
  push:
    branches: ["claude/kl-249-shot"]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: PK rematch shots
        run: flutter test test/features/live/zz_pk_rematch_shot_test.dart
      - name: Commit shots back to this branch
        run: |
          mkdir -p ../../shots && cp build/shots/*.png ../../shots/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ../../shots
          git commit -m "shots [skip ci]"
          git push origin HEAD:claude/kl-249-shot

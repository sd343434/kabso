# Weekly dependency update PRs. Grouped to keep review load low; majors arrive separately.
#
# Cooldown (SEC-015): a new release is only proposed once it is old enough, so day-0
# compromised or broken releases are not picked up automatically. Cooldown applies to version
# updates only; Dependabot *security* updates are never delayed.
# Schema verified against the Dependabot options reference (`cooldown`: default-days,
# semver-major/minor/patch-days, include, exclude; SemVer-specific days are supported for
# npm and pub, only `default-days` for github-actions and docker-compose).
version: 2
updates:
  - package-ecosystem: npm # pnpm workspace (root package.json + pnpm-lock.yaml, incl. apps/api)
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Decision D10: TypeScript is pinned to the 6.0 line (`~6.0.3` in apps/api/package.json)
      # because TS 7 lacks the compiler API that typescript-eslint and @nestjs/cli need.
      # Ignore major AND minor: TypeScript does not follow SemVer (minor releases ship breaking
      # type-checking changes) and `~` only admits 6.0.x anyway, so a 6.1 PR could never be
      # merged without a decision. Patch updates (6.0.x fixes) stay enabled.
      # (Dependabot run 38751156859 failed with unknown_error trying to move typescript.)
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # @types/node must track the Node.js runtime major (Node 22: .nvmrc, engines, CI
      # NODE_VERSION). A @types/node 23+/24+ bump would type APIs the runtime lacks.
      # Move it together with a Node major upgrade, by decision.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm # pinned Redocly CLI used by the `contracts` CI job (SEC-021)
    directory: /tools/redocly
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(tools)"
    cooldown:
      default-days: 7
      semver-major-days: 14

  - package-ecosystem: pub
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps-mobile)"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      pub-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Bumps tags and digests in docker-compose.yml. The CI service-container images in
  # .github/workflows/ci.yml are not scanned by Dependabot: refresh them together with this
  # file using scripts/image-digests.sh.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(infra)"
    cooldown:
      default-days: 7
    ignore:
      # Decision D2: PostgreSQL 16 and Redis 7 are the supported majors. Moving to a new major
      # needs a decision (data upgrade path, managed-service parity), not a Dependabot PR.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: redis
        update-types: ["version-update:semver-major"]

# Kabso Live — media node kernel settings (D350), installed by install.sh to /etc/sysctl.d/.
#
# ESTIMATE, not LiveKit documentation: the LiveKit self-hosting pages read on 2026-11-09 (deployment, VM, ports,
# distributed, benchmarks, Kubernetes) give no sysctl values. These are the usual settings for a UDP-heavy SFU on a
# 1 Gbit/s port; the load test checks them (`netstat -su`: "receive buffer errors" must stay 0, LOAD_TEST plan §4).
#
# Pion's UDP sockets keep the kernel's default buffer size, so the defaults matter, not only the maxima.
net.core.rmem_default = 2097152
net.core.wmem_default = 2097152
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
# Packets queued per CPU before the stack processes them (bursts of ~100 kpps at 1 Gbit/s).
net.core.netdev_max_backlog = 50000
# Many TURN/TLS and signalling connections.
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192
fs.file-max = 2097152

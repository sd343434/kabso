# Kabso Live — single-server deployment (KL-069, docs/DEPLOYMENT.md §11).
#
# Not the local dev stack (that is /docker-compose.yml). Driven by infra/deploy/install.sh and
# infra/deploy/update.sh on the server; every value comes from /etc/kabso/*.env, which
# install.sh generates ON the server (never in git). Only Caddy (80/443) and the LiveKit media
# ports are published; the API, PostgreSQL and Redis are reachable only on the internal network.
name: kabso

services:
  postgres:
    # postgres:16.15-alpine — multi-arch index digest resolved 2026-10-15 (scripts/image-digests.sh)
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    env_file: /etc/kabso/postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ../postgres/bootstrap-roles.sql:/kabso/bootstrap-roles.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    # redis:7.4-alpine — multi-arch index digest resolved 2026-10-15
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot job, run by update.sh before the API is (re)started: `prisma migrate deploy` as the
  # migration role. Only this service gets MIGRATION_DATABASE_URL (docs/DEPLOYMENT.md §5).
  migrate:
    image: ${KABSO_API_IMAGE:?set in /etc/kabso/kabso.env}
    profiles: ["jobs"]
    env_file: /etc/kabso/migrate.env
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  api:
    image: ${KABSO_API_IMAGE:?set in /etc/kabso/kabso.env}
    restart: unless-stopped
    env_file: /etc/kabso/api.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  livekit:
    # livekit/livekit-server:v1.9.1 — multi-arch index digest resolved 2026-10-25
    image: livekit/livekit-server:v1.9.1@sha256:c039a1bfa154c8479ac369c380665638e92a7e9531e69664549c0c0d3eb65e63
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - /etc/kabso/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # WebRTC media: TCP fallback and the single UDP mux port (livekit.yaml rtc.*).
      - "7881:7881/tcp"
      - "7882:7882/udp"
    networks: [internal]

  caddy:
    # caddy:2.10.2-alpine — multi-arch index digest resolved 2026-10-25
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    env_file: /etc/kabso/kabso.env
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, livekit]
    networks: [internal]

networks:
  internal:

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:

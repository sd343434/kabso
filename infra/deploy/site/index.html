<style>
:root{--red:#C2000B;--red2:#FF2A36;--ink:#0F0F0F;--mut:rgba(255,255,255,.62);--glow:#FF2A36}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:#fff;font-family:Cairo,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-tap-highlight-color:transparent}
.bg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(70vmax 40vmax at 50% 20%,rgba(194,0,11,.30),transparent 62%),radial-gradient(80vmax 30vmax at 50% 100%,color-mix(in srgb,var(--glow) 30%,transparent),transparent 70%);transition:background 1s}
#fx{position:fixed;inset:0;z-index:8;pointer-events:none}
header{position:fixed;top:0;inset-inline:0;z-index:9;display:flex;justify-content:space-between;align-items:center;padding:18px clamp(16px,4vw,44px)}
.brand{display:flex;align-items:center;gap:clamp(5px,.6vw,9px);font:800 20px Inter;letter-spacing:-.02em;direction:ltr}
.brand .mark{height:clamp(22px,2.4vw,34px);width:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));animation:nod 4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes nod{0%,80%,100%{transform:none}86%{transform:rotate(-8deg)}92%{transform:rotate(6deg)}}
.brand .wm{display:flex;flex-direction:column;line-height:1}.brand .wm b{font:900 clamp(13px,1.35vw,19px) Inter;letter-spacing:.02em}.brand .wm small{font:600 clamp(6px,.58vw,8px) Inter;letter-spacing:.38em;color:rgba(255,255,255,.7);margin-top:clamp(2px,.25vw,3px)}

.live{display:inline-flex;align-items:center;gap:8px;direction:ltr;font:700 12px Inter;letter-spacing:.14em;padding:7px 12px;border-radius:999px;background:rgba(194,0,11,.16);border:1px solid rgba(255,42,54,.45)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--red2);animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,42,54,.7)}80%,100%{box-shadow:0 0 0 10px rgba(255,42,54,0)}}
.txt{position:fixed;inset-inline:0;top:clamp(78px,13vh,140px);z-index:5;text-align:center;padding:0 16px}
h1{font:900 clamp(60px,11vw,124px)/1.08 Cairo}
h1 span{display:inline-block;padding:0 .08em;background:linear-gradient(100deg,#fff 0%,#fff 38%,var(--glow) 50%,#fff 62%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4.5s ease-in-out infinite}
.finale h1 span{animation:shine 1.2s ease-in-out infinite,jelly .8s ease 2}
@keyframes shine{0%{background-position:120% 0}60%,100%{background-position:-120% 0}}
@keyframes jelly{30%{transform:scale(1.15,.9)}50%{transform:scale(.92,1.08)}70%{transform:scale(1.04,.97)}}
.sub{font:800 clamp(15px,2.3vh,21px) Cairo;color:var(--mut)}
.sub b{color:#fff}
.en{font:700 clamp(10px,1.5vh,13px) Inter;letter-spacing:.4em;text-transform:uppercase;color:rgba(255,255,255,.42);direction:ltr;margin-top:6px}
.stores{margin-top:16px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;direction:ltr}
.store{display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:14px;background:#fff;color:#0F0F0F;text-align:left;min-width:156px}
.store svg{width:22px;height:22px}.store small{display:block;font:600 10px Inter;opacity:.6}.store strong{font:800 15px Inter}
/* stage */
#stage{position:fixed;inset:0;z-index:4;pointer-events:none}
.floor{position:fixed;inset-inline:0;bottom:0;height:var(--fh);z-index:3;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 60%),radial-gradient(60% 120% at 50% 0%,color-mix(in srgb,var(--glow) 26%,transparent),transparent 70%);border-top:1px solid rgba(255,255,255,.10)}
.spot{position:fixed;top:-10vh;bottom:0;width:var(--sw);margin-left:calc(var(--sw)/-2);z-index:3;pointer-events:none;opacity:0;transition:left .7s cubic-bezier(.5,0,.3,1),opacity .5s;
 background:linear-gradient(180deg,rgba(255,255,255,0),color-mix(in srgb,var(--glow) 18%,rgba(255,255,255,.10)) 70%,color-mix(in srgb,var(--glow) 30%,rgba(255,255,255,.18)));clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);filter:blur(2px)}
.spot.on{opacity:1}
.finale .spot{opacity:1;width:calc(var(--sw)*3.2);margin-left:calc(var(--sw)*-1.6)}
.ch{position:absolute;pointer-events:auto;cursor:pointer;transform-origin:50% 100%}
.ch .mv{position:absolute;inset:0;transform-origin:50% 100%}
.ch .br{position:absolute;inset:0;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite;animation-delay:var(--d)}
.ch img{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));transition:filter .4s}
.ch .rf{position:absolute;left:0;right:0;top:100%;height:100%;transform:scaleY(-1);transform-origin:50% 50%;opacity:.16;-webkit-mask:linear-gradient(0deg,#000,transparent 28%);mask:linear-gradient(0deg,#000,transparent 28%);pointer-events:none}
.ch .rf img{filter:none}
.ch .sh{position:absolute;left:20%;right:20%;bottom:-3%;height:7%;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(5px)}
.ch.lit img{filter:drop-shadow(0 10px 14px rgba(0,0,0,.45)) drop-shadow(0 0 22px var(--c))}
@keyframes breathe{50%{transform:scale(1.025,.975)}}
.bub{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%) scale(0);transform-origin:50% 100%;background:#fff;color:#0F0F0F;font:900 clamp(12px,1.7vh,15px) Cairo;padding:6px 12px;border-radius:14px;white-space:nowrap;box-shadow:0 10px 24px rgba(0,0,0,.4);transition:transform .35s cubic-bezier(.3,1.6,.5,1);z-index:20}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.bub.on{transform:translateX(-50%) scale(1)}
.mob .bub{font-size:14px}
/* signature moves */
.m-grow{animation:grow 1.4s cubic-bezier(.3,1.4,.5,1)}@keyframes grow{20%{transform:scale(1.1,.82)}45%{transform:scale(.88,1.25)}65%{transform:scale(1.06,.94)}100%{transform:none}}
.m-hop{animation:hop3 1.4s ease}@keyframes hop3{0%,33%,66%,100%{transform:translateY(0) scale(1)}8%,41%,74%{transform:translateY(0) scale(1.1,.88)}18%,51%,84%{transform:translateY(-32%) scale(.94,1.06)}}
.m-wave{animation:wave 1.4s ease-in-out}@keyframes wave{15%{transform:rotate(-10deg)}30%{transform:rotate(10deg)}45%{transform:rotate(-10deg)}60%{transform:rotate(10deg)}75%{transform:rotate(-5deg)}}
.m-flutter{animation:flut 1.6s ease-in-out}@keyframes flut{0%,100%{transform:none}20%{transform:translateY(-22%) scaleX(.86)}30%{transform:translateY(-26%) scaleX(1.04)}40%{transform:translateY(-30%) scaleX(.86)}50%{transform:translateY(-32%) scaleX(1.04)}60%{transform:translateY(-30%) scaleX(.86)}70%{transform:translateY(-24%) scaleX(1.04)}85%{transform:translateY(-6%)}}
.m-spin{animation:spin 1.3s cubic-bezier(.4,0,.2,1)}@keyframes spin{0%{transform:none}20%{transform:scale(1.1,.85)}55%{transform:translateY(-34%) rotateY(360deg)}80%{transform:translateY(0) rotateY(360deg) scale(1.08,.92)}100%{transform:rotateY(360deg)}}
.m-flap{animation:flap 1.4s ease}@keyframes flap{0%,100%{transform:none}10%,30%,50%,70%{transform:translateY(-14%) scaleX(1.08)}20%,40%,60%{transform:translateY(-22%) scaleX(.92)}85%{transform:translateY(0) scale(1.06,.94)}}
.m-prance{animation:prance 1.4s ease}@keyframes prance{25%{transform:translateY(-26%) rotate(-12deg)}50%{transform:translateY(0) rotate(0) scale(1.06,.94)}75%{transform:translateY(-20%) rotate(10deg)}}
.m-sneeze{animation:sneeze 1.5s ease}@keyframes sneeze{0%{transform:none}30%{transform:scale(.94,1.06) rotate(4deg)}40%{transform:scale(.9,1.12) rotate(6deg)}48%{transform:translateX(-8%) scale(1.12,.88) rotate(-8deg)}56%{transform:translateX(-4%) rotate(3deg)}64%{transform:translateX(-6%) rotate(-3deg)}72%{transform:translateX(-3%) rotate(2deg)}100%{transform:none}}
.m-blaze{animation:blaze 1.6s ease}@keyframes blaze{0%,100%{transform:none;filter:none}30%{transform:translateY(-16%) scale(1.12);filter:brightness(1.35) saturate(1.3)}60%{transform:translateY(-12%) scale(1.08);filter:brightness(1.25)}}
.m-royal{animation:royal 2s cubic-bezier(.3,1.4,.5,1)}@keyframes royal{0%{transform:none}25%{transform:scale(.9,1.08)}45%{transform:translateY(-12%) scale(1.3)}80%{transform:translateY(-8%) scale(1.25)}100%{transform:none}}
.m-jump{animation:jmp .8s cubic-bezier(.3,1.5,.5,1)}@keyframes jmp{40%{transform:translateY(-30%) rotate(var(--rot,6deg))}70%{transform:translateY(0) scale(1.1,.9)}}
.ch .rays{position:absolute;left:50%;top:40%;width:260%;aspect-ratio:1;margin-left:-130%;margin-top:-130%;border-radius:50%;background:repeating-conic-gradient(rgba(255,210,80,.55) 0 6deg,transparent 6deg 20deg);-webkit-mask:radial-gradient(circle,#000 14%,transparent 62%);mask:radial-gradient(circle,#000 14%,transparent 62%);opacity:0;transition:opacity .5s;animation:rot 10s linear infinite;pointer-events:none;z-index:-1}
.ch.k10.lit .rays,.finale .ch.k10 .rays{opacity:1}
@keyframes rot{to{transform:rotate(360deg)}}
footer{position:fixed;bottom:0;inset-inline:0;z-index:9;text-align:center;padding:8px;font:500 11px Inter;color:rgba(255,255,255,.4);direction:ltr}
.in{opacity:0;transform:translateY(14px);animation:in .9s cubic-bezier(.2,.8,.2,1) forwards}.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}
@keyframes in{to{opacity:1;transform:none}}
.ch{opacity:0;transition:opacity .4s}.ch.show{opacity:1}
.ch.slide{transition:opacity .4s,left .7s cubic-bezier(.5,0,.3,1),top .7s cubic-bezier(.5,0,.3,1),width .7s cubic-bezier(.5,0,.3,1),height .7s cubic-bezier(.5,0,.3,1)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.in,.ch{opacity:1}}
</style>
</head>

const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const R=(a,b)=>a+Math.random()*(b-a);
function fx(i){if(RM)return;const p=L[i],s=p.sc*dpr,x=p.cx*dpr,y=p.y*dpr,t=C[i].fx;const add=o=>Q.push(Object.assign({l:1,r:0,vr:R(-.1,.1),g:.12},o));
 if(t=='leaf'||t=='leaf2')add({x:x+R(-60,60)*s,y:y-R(40,120)*s,vx:R(-2,2)*dpr,vy:R(-3,-1)*dpr,k:'leaf',c:t=='leaf'?'#5CCB5F':'#FF8A2A',z:R(8,13)*dpr,g:.05});
 if(t=='heart')add({x:x+R(-50,50)*s,y:y-R(60,140)*s,vx:R(-1,1)*dpr,vy:R(-3,-1.5)*dpr,k:'heart',c:Math.random()<.5?'#FF5C9A':'#FFB3CF',z:R(9,14)*dpr,g:-.02});
 if(t=='bell'||t=='spark'||t=='gold'||t=='rainbow'){const cols=t=='rainbow'?['#FF5C6C','#FFB23A','#FFE14A','#5CD67A','#4FA3FF','#A57BFF']:t=='spark'?['#E7C6FF','#FFB3E6','#fff']:['#FFD24A','#fff'];
  add({x:x+R(-110,110)*s,y:y+R(-200,40)*s,vx:R(-1.5,1.5)*dpr,vy:R(-2.5,-.5)*dpr,k:'star',c:cols[Math.random()*cols.length|0],z:R(6,11)*dpr,g:.02})}
 if(t=='feather')add({x:x+R(-90,90)*s,y:y+R(-40,60)*s,vx:R(-2,2)*dpr,vy:R(-2,0)*dpr,k:'leaf',c:'#8DB8FF',z:R(8,12)*dpr,g:.03});
 if(t=='fire')for(let j=0;j<3;j++)add({x:x-40*s,y:y+40*s,vx:R(-9,-5)*dpr,vy:R(-1.5,1)*dpr,k:'dot',c:['#FFE14A','#FF8A00','#FF3B1F'][j],z:R(7,14)*dpr,g:-.04});
 if(t=='ember')for(let j=0;j<2;j++)add({x:x+R(-120,120)*s,y:y+R(-60,120)*s,vx:R(-1,1)*dpr,vy:R(-5,-2)*dpr,k:'dot',c:Math.random()<.5?'#FFC23A':'#FF6A00',z:R(3,6)*dpr,g:-.03})}
function bigBurst(cx,cy){if(RM)return;for(let j=0;j<70;j++){const a=R(0,6.28),v=R(3,10)*dpr;Q.push({x:cx*dpr,y:cy*dpr,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3*dpr,l:1.3,k:'star',c:Math.random()<.6?'#FFD24A':'#fff',z:R(6,12)*dpr,g:.15,r:0,vr:.1})}}
function confetti(){if(RM)return;const cols=C.map(c=>c.c);for(let j=0;j<140;j++)Q.push({x:R(0,CW),y:R(-CHh*.3,-10),vx:R(-1.5,1.5)*dpr,vy:R(2,6)*dpr,l:2.2,k:'conf',c:cols[j%10],z:R(6,11)*dpr,g:.04,r:R(0,6),vr:R(-.2,.2)})}
function heart(x,y,z){g.beginPath();g.moveTo(x,y+z*.35);g.bezierCurveTo(x+z,y-z*.4,x+z*.5,y-z,x,y-z*.45);g.bezierCurveTo(x-z*.5,y-z,x-z,y-z*.4,x,y+z*.35);g.fill()}
function star(x,y,z){g.beginPath();for(let j=0;j<8;j++){const a=Math.PI*j/4-Math.PI/2,rr=j%2?z*.3:z;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.fill()}
(function f(){g.clearRect(0,0,CW,CHh);Q=Q.filter(q=>q.l>0&&q.y<CHh+40);for(const q of Q){q.x+=q.vx;q.y+=q.vy;q.vy+=q.g*dpr;q.vx*=.99;q.r+=q.vr;q.l-=.014;
 g.globalAlpha=Math.min(1,q.l);g.fillStyle=q.c;g.save();g.translate(q.x,q.y);g.rotate(q.r);
 if(q.k=='leaf'){g.beginPath();g.ellipse(0,0,q.z,q.z*.45,0,0,6.28);g.fill()}else if(q.k=='heart')heart(0,0,q.z);else if(q.k=='star')star(0,0,q.z);
 else if(q.k=='conf')g.fillRect(-q.z/2,-q.z/3,q.z,q.z*.6);else{g.beginPath();g.arc(0,0,q.z*q.l*.7+1,0,6.28);g.fill()}g.restore()}
 g.globalAlpha=1;requestAnimationFrame(f)})();
show();
</script>

packages:
  - apps/api
  # v1.60-social (D191): the admin panel's static web app.
  - apps/admin

# pnpm 10 does not run dependency lifecycle scripts unless allow-listed.
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/engines'
  - '@swc/core'
  - argon2
  - esbuild
  - prisma
  # v1.5-social (CP-006): libvips prebuilt binaries for image processing.
  - sharp

# Not needed: optional native watcher (Nest CLI) and resolver (jest) prebuilt binaries.
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - unrs-resolver
  # D152 (firebase-admin): optional postinstall checks, not needed to send pushes.
  - '@firebase/util'
  - protobufjs

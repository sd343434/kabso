openapi: 3.1.0
info:
  title: Kabso Live API
  version: 1.4.0
  description: |
    Authoritative HTTP contract. Conventions (errors, pagination, auth, rate limits) are defined in
    CONVENTIONS.md and apply to every operation. Phase 1 scope: health, authentication, sessions,
    current user. v1.3 (Phase 2 slice 1, KL-036) adds live discovery, the host lifecycle of live
    rooms (behind `LIVE_HOSTING_ENABLED`), public profiles and follow (CONVENTIONS §10; data design
    in DB_PHASE2_DISCOVERY.md). v1.4 (KL-048, owner decision D44) adds image uploads for avatars
    and live-room covers (behind `MEDIA_UPLOADS_ENABLED`, default off; no storage provider is
    activated) and an optional, user-chosen country with a discovery filter (CONVENTIONS §11; data
    design in DB_PHASE2_MEDIA.md). Later phases append paths; existing shapes change only via
    contract proposal.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: health
    description: "Liveness and readiness probes (unversioned)."
  - name: auth
    description: "Registration, login, token refresh, email verification and password reset."
  - name: sessions
    description: "Management of the caller's device sessions."
  - name: me
    description: "The authenticated user."
  - name: users
    description: "Public user lookups, public profiles and follow."
  - name: live
    description: "Live discovery (categories, room lists, room detail) and the host lifecycle of live rooms (v1.3); covers and the country filter (v1.4)."
  - name: media
    description: "Image uploads for avatars and live-room covers (v1.4, behind MEDIA_UPLOADS_ENABLED)."
  - name: reference
    description: "Static reference data: the list of selectable countries (v1.4)."
paths:
  /health/live:
    get:
      tags: [health]
      operationId: healthLive
      summary: "Liveness probe"
      security: []
      responses:
        '200':
          description: Process is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /health/ready:
    get:
      tags: [health]
      operationId: healthReady
      summary: "Readiness probe (database, Redis)"
      security: []
      responses:
        '200':
          description: Dependencies (database, redis) reachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '503':
          description: A dependency is down.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: "Start a verify-first registration (never reveals whether the email exists)"
      description: |
        v1.2 (CONVENTIONS §6 "Verify-first registration"). Always 202 with a constant body when
        the request is valid and the username is free — whether or not the email is registered.
        No account and no tokens are created here; complete with `registerVerify`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '202':
          description: Verification code emailed if the address can register (constant body).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationPending' }
        '400': { $ref: '#/components/responses/Error' }
        '409':
          description: USERNAME_TAKEN only (taken by an account or a live pending registration).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/auth/register/verify:
    post:
      tags: [auth]
      operationId: registerVerify
      summary: "Complete registration with the emailed code; creates the account and a session"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterVerifyRequest' }
      responses:
        '201':
          description: Account created (email verified) and session started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '409':
          description: USERNAME_TAKEN (backstop race only).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: TOKEN_INVALID for every failure (unknown email, wrong/expired code, attempts exhausted, email registered meanwhile).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/auth/register/resend:
    post:
      tags: [auth]
      operationId: registerResend
      summary: "Re-send the registration code (always 202)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202':
          description: Always returned for a valid body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationPending' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: "Sign in with email or username"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: "Rotate the refresh token and issue a new token pair"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              additionalProperties: false
              properties:
                refreshToken: { type: string, minLength: 10, maxLength: 200 }
      responses:
        '200':
          description: New token pair (refresh token rotated).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: "Revoke the current session"
      description: Revokes the session identified by the access token.
      responses:
        '204': { description: Session revoked. }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/email/verify:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: "Confirm an email address with a single-use token"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 10, maxLength: 200 }
      responses:
        '204': { description: Email verified. }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/email/resend:
    post:
      tags: [auth]
      operationId: resendVerificationEmail
      summary: "Re-send the verification email"
      description: Re-sends the verification email for the authenticated user (no-op if verified).
      responses:
        '202': { description: Accepted. }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: "Request a password-reset email (non-enumerating)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202': { description: 'Always returned, whether or not the email exists.' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: "Set a new password with a reset token"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 10, maxLength: 200 }
                newPassword: { $ref: '#/components/schemas/Password' }
      responses:
        '204': { description: Password changed; all sessions revoked. }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: "List the caller's active sessions"
      responses:
        '200':
          description: Active sessions of the caller, newest first (bounded, max 50).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SessionInfo' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/sessions/{sessionId}:
    delete:
      tags: [sessions]
      operationId: revokeSession
      summary: "Revoke one of the caller's sessions"
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: A malformed id is treated as not found (404), never 400.
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: "Get the authenticated user"
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    patch:
      tags: [me]
      operationId: updateMe
      summary: "Update the caller's profile and preferences (v1.2: locale; v1.4: avatar, country)"
      description: |
        Partial update; at least one property is required and every property is optional
        (v1.4 relaxes the v1.2 body, where `locale` was required, so a v1.2 client keeps working).
        The update is all-or-nothing: if any property fails, nothing is changed.
        - `avatarUploadId` (v1.4, CONVENTIONS §11.4): the id of the caller's own upload with
          `purpose = avatar` and `status = READY` that is not attached anywhere yet. Anything else
          (unknown, another user's, wrong purpose, not READY, already attached, REJECTED) →
          400 `VALIDATION_FAILED` (`field "avatarUploadId"`, `issue "invalid_value"`). `null`
          removes the avatar. A non-null value while `MEDIA_UPLOADS_ENABLED=false` → 503
          `MEDIA_UPLOADS_UNAVAILABLE`; `null` is always accepted.
        - `country` (v1.4, CONVENTIONS §11.7): ISO 3166-1 alpha-2 code from the vendored list
          (`listCountries`), or `null` to clear it. Only ever what the user chose; never inferred.
          A well-formed code that is not on the list → 400 (`field "country"`,
          `issue "invalid_value"`).

        Check order after body parsing: auth → rate limit → body schema → `avatarUploadId`
        feature gate (503) → `avatarUploadId` and `country` values (400).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
            examples:
              locale:
                summary: v1.2 body (still valid)
                value: { locale: ar }
              avatarAndCountry:
                summary: Set an uploaded avatar and a country
                value: { avatarUploadId: 0192f1e0-2222-7bbb-8ccc-0d0e0f101112, country: SA }
              clear:
                summary: Remove the avatar and clear the country
                value: { avatarUploadId: null, country: null }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503':
          description: MEDIA_UPLOADS_UNAVAILABLE (a non-null `avatarUploadId` while uploads are disabled) or SERVICE_UNAVAILABLE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/users/username-availability:
    get:
      tags: [users]
      operationId: checkUsernameAvailability
      summary: "Check whether a username is available"
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Username' }
      responses:
        '200':
          description: Availability (reserved or invalid-but-well-formed names report false).
          content:
            application/json:
              schema:
                type: object
                required: [username, available]
                properties:
                  username: { type: string }
                  available: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/users/{username}:
    get:
      tags: [users]
      operationId: getPublicProfile
      summary: "Get a user's public profile (v1.3)"
      description: |
        CONVENTIONS §10.5. Never contains an email address. A malformed, unknown, reserved,
        pending-registration-only, SUSPENDED or DELETED username returns the same 404
        `NOT_FOUND` (no distinction, and no 400 for a malformed name). `liveRoomId` is set only
        while the user has a LIVE room with a fresh heartbeat (§10.2). The static route
        `/users/username-availability` cannot collide: `-` is not allowed in usernames.
        v1.4: `avatarUrl` / `avatarThumbUrl` follow the moderation visibility rule (§11.5: a
        PENDING avatar is shown only when `isSelf`); `country` is null unless the user chose one.
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: The public profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicProfile' }
              examples:
                otherUserLive:
                  summary: Another user who is live now and is followed by the caller
                  value:
                    id: 0192f1c2-7a10-7c3e-9d2a-3b4c5d6e7f80
                    username: layla.k
                    displayName: ليلى
                    avatarUrl: null
                    avatarThumbUrl: null
                    bio: null
                    country: null
                    isPrivate: false
                    followerCount: 12
                    followingCount: 40
                    isFollowing: true
                    isSelf: false
                    liveRoomId: 0192f1d0-1111-7aaa-8bbb-0c0d0e0f1011
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/users/{username}/follow:
    put:
      tags: [users]
      operationId: followUser
      summary: "Follow a user (idempotent, v1.3)"
      description: |
        CONVENTIONS §10.6. Following someone already followed is a no-op that returns 200 with
        the same body. Target unknown / suspended / deleted / malformed → 404 `NOT_FOUND`. The
        caller's own username → 400 `VALIDATION_FAILED` (`field: "username"`,
        `issue: "invalid_value"`). Target with `isPrivate = true` → 403 `AUTH_FORBIDDEN` for a
        **new** follow (follow requests are deferred). v1.3.1 (QA-002): a caller who already
        follows a private target gets the idempotent 200 `{isFollowing: true, …}`; no edge is
        created.
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: The caller now follows the user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowState' }
              example: { isFollowing: true, followerCount: 13 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [users]
      operationId: unfollowUser
      summary: "Unfollow a user (idempotent, v1.3)"
      description: |
        CONVENTIONS §10.6. Unfollowing someone not followed is a no-op that returns 200. Errors
        as for `followUser`, except that a private target can always be unfollowed (no 403).
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: The caller does not follow the user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowState' }
              example: { isFollowing: false, followerCount: 12 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/config:
    get:
      tags: [live]
      operationId: getLiveConfig
      summary: "Live feature switch and server-driven timings (v1.3)"
      description: |
        Lets the client render honest states (`hostingEnabled = false` → "Going live is not
        available yet"; HL-H6 "Unavailable") and take the heartbeat cadence from the server
        instead of hard-coding it (CONVENTIONS §10.3).
      responses:
        '200':
          description: Current live configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveConfig' }
              example:
                hostingEnabled: false
                heartbeatIntervalSeconds: 15
                heartbeatStaleAfterSeconds: 45
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/categories:
    get:
      tags: [live]
      operationId: listLiveCategories
      summary: "List active live categories (bounded, not paginated; v1.3)"
      description: |
        Active categories ordered by `sortOrder` ascending, then `slug` ascending. The list is
        server-curated and capped at 100 active rows (CONVENTIONS §10.1), so it is returned
        whole with no `page` object. It is **empty** until categories are created (none are
        seeded, D37). `name` is localized (§10.1).
      responses:
        '200':
          description: Active categories (possibly empty).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/LiveCategory' }
              examples:
                empty:
                  summary: Production today (no categories created)
                  value: { data: [] }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms:
    get:
      tags: [live]
      operationId: listLiveRooms
      summary: "List live rooms for a discovery tab (cursor-paginated; v1.3)"
      description: |
        CONVENTIONS §10.2 and §10.4. Only rooms with `status = LIVE`, a fresh heartbeat and an
        `ACTIVE` host. Stale rooms are filtered out; this read never writes (v1.3.1, SEC-035). Orderings: `popular` = viewerCount desc, startedAt desc, id desc; `new` =
        startedAt desc, id desc; `following` = rooms of hosts the caller follows, startedAt desc,
        id desc. `category` filters every tab. A well-formed slug that is unknown or inactive
        returns an empty list (200). Rankings can change between pages; **clients dedupe by
        `id`** (HL-H5). While `viewerCount` is always 0 (no presence yet), `popular` orders like
        `new`. v1.4: `country` filters every tab by the room's country (the host's chosen
        country, CONVENTIONS §11.8) and is bound into the cursor; it combines with `category`.
      parameters:
        - name: tab
          in: query
          required: true
          schema: { type: string, enum: [popular, new, following] }
        - name: category
          in: query
          required: false
          description: 'Category slug. Malformed → 400 `VALIDATION_FAILED` (`field "category"`).'
          schema: { $ref: '#/components/schemas/CategorySlug' }
        - name: country
          in: query
          required: false
          description: 'v1.4. ISO 3166-1 alpha-2 code (uppercase). Malformed → 400 `VALIDATION_FAILED` (`field "country"`, `issue "invalid_format"`); well-formed but not on the vendored list → 400 (`issue "invalid_value"`). Rooms whose host chose no country never match a country filter.'
          schema: { $ref: '#/components/schemas/CountryCode' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of live rooms.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoomPage' }
              examples:
                empty:
                  summary: Nobody is live
                  value:
                    data: []
                    page: { nextCursor: null, hasMore: false }
                onePage:
                  summary: One room, more pages follow
                  value:
                    data:
                      - id: 0192f1d0-1111-7aaa-8bbb-0c0d0e0f1011
                        title: سهرة طرب
                        mode: SOLO
                        viewerCount: 0
                        startedAt: '2026-10-16T19:00:00.000Z'
                        coverUrl: null
                        coverThumbUrl: null
                        category: null
                        country: null
                        host:
                          id: 0192f1c2-7a10-7c3e-9d2a-3b4c5d6e7f80
                          username: layla.k
                          displayName: ليلى
                          avatarUrl: null
                          avatarThumbUrl: null
                    page: { nextCursor: eyJ2IjoxLCJ0IjoibmV3In0.q2Fm0b7xT1sYg8aE3k9Lzw, hasMore: true }
        '400':
          description: VALIDATION_FAILED — bad `tab`, malformed `category`, malformed or unlisted `country` (v1.4), `limit` out of range, or a malformed, tampered or mismatched `cursor` (`field "cursor"`, `issue "invalid_value"`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      tags: [live]
      operationId: startLiveRoom
      summary: "Go live: create the caller's LIVE room (v1.3, behind LIVE_HOSTING_ENABLED)"
      description: |
        CONVENTIONS §10.3. Body parsing comes first on every route (CONVENTIONS §4, v1.3.1
        QA-001): malformed JSON or an oversized body → 400 `VALIDATION_FAILED` before every
        check below, even without a token or while hosting is disabled. Then, in order: auth →
        rate limit → `LIVE_HOSTING_ENABLED` (else
        503 `LIVE_HOSTING_UNAVAILABLE`, no `Retry-After`) → body → `categorySlug` resolves to an
        **active** category (else 400, `field "categorySlug"`, `issue "invalid_value"`) → the
        caller has no LIVE room with a fresh heartbeat (else 409 `LIVE_ROOM_ALREADY_ACTIVE`; a
        LIVE room with a stale heartbeat is ended with `HEARTBEAT_TIMEOUT` in the same
        transaction and the new room is created). Only `SOLO` rooms can be created; the request
        has no `mode`. No `Idempotency-Key`: a retry after a lost response gets 409 and the
        client resumes the room found via `getPublicProfile` (own username → `liveRoomId`).
        Requires a verified email (every v1.2+ account is verified at creation; a legacy
        unverified account gets 403 `AUTH_FORBIDDEN`).
        v1.4: optional `coverUploadId` (CONVENTIONS §11.4). It is checked after `categorySlug`:
        a non-null value while `MEDIA_UPLOADS_ENABLED=false` → 503 `MEDIA_UPLOADS_UNAVAILABLE`;
        a value that is not the caller's own unattached READY `room_cover` upload → 400
        (`field "coverUploadId"`, `issue "invalid_value"`). The room's `country` is copied from
        the host's profile at go-live (§11.8); the request has no `country` field.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartLiveRoomRequest' }
            example: { title: سهرة طرب, categorySlug: music, coverUploadId: 0192f1e0-3333-7ccc-8ddd-0e0f10111213 }
      responses:
        '201':
          description: Room created; the caller starts heartbeats at the cadence from `getLiveConfig`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoom' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409':
          description: LIVE_ROOM_ALREADY_ACTIVE — the caller already has a LIVE room with a fresh heartbeat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/Error' }
        '503':
          description: LIVE_HOSTING_UNAVAILABLE (hosting disabled by config), MEDIA_UPLOADS_UNAVAILABLE (v1.4; `coverUploadId` sent while uploads are disabled) or SERVICE_UNAVAILABLE (dependency down).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/live/rooms/{roomId}:
    get:
      tags: [live]
      operationId: getLiveRoom
      summary: "Get a live room, including ended rooms (v1.3)"
      description: |
        A LIVE room whose heartbeat is stale is never reported as LIVE: it is returned as
        `ENDED` with `endReason = HEARTBEAT_TIMEOUT` and `endedAt = lastHeartbeatAt` (§10.2;
        v1.3.1: computed, or by ending that single room). Nonexistent rooms, malformed ids
        and rooms whose host is not `ACTIVE` all return 404 `NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '200':
          description: The room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoom' }
              examples:
                ended:
                  summary: A room the host ended
                  value:
                    id: 0192f1d0-1111-7aaa-8bbb-0c0d0e0f1011
                    title: سهرة طرب
                    mode: SOLO
                    viewerCount: 0
                    startedAt: '2026-10-16T19:00:00.000Z'
                    coverUrl: null
                    coverThumbUrl: null
                    category: { slug: music, name: موسيقى }
                    country: null
                    host:
                      id: 0192f1c2-7a10-7c3e-9d2a-3b4c5d6e7f80
                      username: layla.k
                      displayName: ليلى
                      avatarUrl: null
                      avatarThumbUrl: null
                    status: ENDED
                    endedAt: '2026-10-16T20:12:45.120Z'
                    endReason: HOST_ENDED
                    coverModeration: null
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/heartbeat:
    post:
      tags: [live]
      operationId: heartbeatLiveRoom
      summary: "Host keep-alive for a LIVE room (v1.3)"
      description: |
        Host only. Send every `heartbeatIntervalSeconds` (15 s); a room without a heartbeat for
        `heartbeatStaleAfterSeconds` (45 s) disappears from lists and is ended with
        `HEARTBEAT_TIMEOUT`. Not the host / nonexistent / malformed id → 404 `NOT_FOUND`. Room
        already ended (host, timeout, suspension, admin) → 409 `LIVE_ROOM_ENDED`: the client
        stops heartbeats and shows the ended state; it must go live again for a new room.
        Hosting disabled by config → 503 `LIVE_HOSTING_UNAVAILABLE` (the room then times out).
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '204': { description: Heartbeat recorded. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: LIVE_ROOM_ENDED — the room is no longer live.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/Error' }
        '503':
          description: |
            LIVE_HOSTING_UNAVAILABLE — hosting is disabled by config (`LIVE_HOSTING_ENABLED=false`).
            Returned to every caller before the ownership check; the client stops heartbeats and
            re-checks `getLiveConfig`. SERVICE_UNAVAILABLE — a dependency is down.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/live/rooms/{roomId}/end:
    post:
      tags: [live]
      operationId: endLiveRoom
      summary: "End the caller's live room (idempotent, v1.3)"
      description: |
        Host only. Ends a LIVE room with `endReason = HOST_ENDED` and returns it. Ending a room
        that is already `ENDED` returns 200 with the room unchanged (its original `endReason`
        and `endedAt` are kept). Allowed even when hosting is disabled. Not the host /
        nonexistent / malformed id → 404 `NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '200':
          description: The ended room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoom' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/cover:
    put:
      tags: [live]
      operationId: setLiveRoomCover
      summary: "Replace or remove the cover of the caller's LIVE room (v1.4)"
      description: |
        CONVENTIONS §11.4. Host only. Body `{coverUploadId}`: the caller's own unattached READY
        `room_cover` upload, or `null` to remove the cover. The previous cover is detached and
        deleted after the grace period (§11.6). Title and category stay fixed after go-live
        (§10.3); only the cover can change.

        Check order after body parsing: auth → rate limit → `LIVE_HOSTING_ENABLED` (else 503
        `LIVE_HOSTING_UNAVAILABLE`, for every caller, before the ownership check) → body schema →
        room exists and the caller is the host (else 404 `NOT_FOUND`; malformed id too) → room is
        LIVE with a fresh heartbeat (else 409 `LIVE_ROOM_ENDED`; a stale room is ended with
        `HEARTBEAT_TIMEOUT` as in `heartbeatLiveRoom`) → a non-null `coverUploadId` while
        `MEDIA_UPLOADS_ENABLED=false` → 503 `MEDIA_UPLOADS_UNAVAILABLE` → upload valid (else 400,
        `field "coverUploadId"`, `issue "invalid_value"`).
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetLiveRoomCoverRequest' }
            example: { coverUploadId: 0192f1e0-3333-7ccc-8ddd-0e0f10111213 }
      responses:
        '200':
          description: The room with its new cover (the host sees a PENDING cover; others see it once APPROVED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoom' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: LIVE_ROOM_ENDED — the room is no longer live.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/Error' }
        '503':
          description: LIVE_HOSTING_UNAVAILABLE, MEDIA_UPLOADS_UNAVAILABLE or SERVICE_UNAVAILABLE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/live/countries:
    get:
      tags: [live]
      operationId: listLiveCountries
      summary: "Countries that have listed live rooms right now, with real counts (bounded; v1.4)"
      description: |
        CONVENTIONS §11.9. One row per country with at least one room that `listLiveRooms` would
        list (status LIVE, fresh heartbeat, ACTIVE host) and a non-null room country. Rooms whose
        host chose no country are not counted anywhere. `liveRoomCount` is a real count over that
        predicate; it may be cached for at most `LIVE_HEARTBEAT_INTERVAL_SECONDS` (15 s), so it can
        briefly differ from the list. Ordered by `liveRoomCount` desc, then `code` asc. Bounded by
        the vendored country list (≤ 300), so unpaginated. `name` is localized like category names
        (§10.1). Empty while nobody is live (always, while `LIVE_HOSTING_ENABLED=false`).
      responses:
        '200':
          description: Countries with live rooms (possibly empty).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 300
                    items: { $ref: '#/components/schemas/LiveCountry' }
              examples:
                empty:
                  summary: Nobody is live (production today)
                  value: { data: [] }
                two:
                  summary: Two countries with live rooms (Accept-Language ar)
                  value:
                    data:
                      - { code: SA, name: المملكة العربية السعودية, liveRoomCount: 3 }
                      - { code: EG, name: مصر, liveRoomCount: 1 }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/countries:
    get:
      tags: [reference]
      operationId: listCountries
      summary: "All selectable countries with localized names (bounded; v1.4)"
      description: |
        CONVENTIONS §11.7. The vendored ISO 3166-1 alpha-2 list with names from the pinned CLDR
        release, localized like category names (§10.1) and sorted by the localized name with the
        locale's collation. Used by the profile country picker. Static per server release.
      responses:
        '200':
          description: Every selectable country.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 300
                    items: { $ref: '#/components/schemas/Country' }
              example:
                data:
                  - { code: AE, name: United Arab Emirates }
                  - { code: EG, name: Egypt }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/media/config:
    get:
      tags: [media]
      operationId: getMediaConfig
      summary: "Upload feature switch and limits (v1.4)"
      description: |
        Lets the client hide every upload control when `uploadsEnabled = false` and pre-check a
        file before asking for an upload (CONVENTIONS §11.2). The server re-checks everything;
        these values are informational for the client. Image hosts are **not** taken from here:
        the client allow-lists hosts from its own build configuration (§11.10).
      responses:
        '200':
          description: Current media configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaConfig' }
              example:
                uploadsEnabled: false
                allowedContentTypes: [image/jpeg, image/png, image/webp]
                maxPixels: 40000000
                maxSidePixels: 8192
                purposes:
                  avatar: { maxBytes: 5242880, minWidth: 128, minHeight: 128, aspectRatio: '1:1' }
                  room_cover: { maxBytes: 10485760, minWidth: 480, minHeight: 640, aspectRatio: '3:4' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/media/uploads:
    post:
      tags: [media]
      operationId: createMediaUpload
      summary: "Declare an image upload and get a short-lived presigned PUT URL (v1.4)"
      description: |
        CONVENTIONS §11.3. Step 1 of 3. Check order after body parsing: auth → rate limits
        (counted before the feature gate, like go-live) → `MEDIA_UPLOADS_ENABLED` (else 503
        `MEDIA_UPLOADS_UNAVAILABLE`, no `Retry-After`) → body schema (`byteSize` above the
        purpose limit → `too_big`) → for `room_cover`, `LIVE_HOSTING_ENABLED` (else 503
        `LIVE_HOSTING_UNAVAILABLE`) → the caller has fewer than `MEDIA_MAX_PENDING_PER_USER`
        uploads in `AWAITING_UPLOAD` (else 429 `RATE_LIMITED` with `Retry-After` = seconds until
        the oldest one expires).

        Step 2: the client sends the file bytes with `method` to `url`, with **exactly** the
        `headers` returned (they are part of the signature; `Content-Length` must equal
        `byteSize`). The URL is valid until `expiresAt` and only for that one object. The client
        sends no bearer token to storage. Step 3: `completeMediaUpload`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMediaUploadRequest' }
            example: { purpose: avatar, contentType: image/jpeg, byteSize: 734003 }
      responses:
        '201':
          description: Upload declared; send the bytes to the presigned URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaUploadTicket' }
              example:
                uploadId: 0192f1e0-2222-7bbb-8ccc-0d0e0f101112
                purpose: avatar
                method: PUT
                url: https://storage.example.invalid/incoming/0192f1e0-2222-7bbb-8ccc-0d0e0f101112?X-Amz-Signature=redacted
                headers: { Content-Type: image/jpeg, Content-Length: '734003' }
                expiresAt: '2026-10-16T19:10:00.000Z'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503':
          description: MEDIA_UPLOADS_UNAVAILABLE (uploads disabled or storage not configured), LIVE_HOSTING_UNAVAILABLE (`room_cover` while hosting is disabled) or SERVICE_UNAVAILABLE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/media/uploads/{uploadId}:
    get:
      tags: [media]
      operationId: getMediaUpload
      summary: "Get the state of one of the caller's uploads (v1.4)"
      description: |
        Owner only: another user's upload, an unknown id or a malformed id → 404 `NOT_FOUND`.
        Used to show "under review" and to learn a moderation result (§11.5). Works while
        uploads are disabled (read-only).
      parameters:
        - $ref: '#/components/parameters/UploadIdPath'
      responses:
        '200':
          description: The upload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaUpload' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/media/uploads/{uploadId}/complete:
    post:
      tags: [media]
      operationId: completeMediaUpload
      summary: "Verify and process an uploaded image (v1.4)"
      description: |
        CONVENTIONS §11.3. Step 3 of 3. No request body. Synchronous: the server reads the
        object it signed for (never a client-supplied URL), checks size, real type by magic
        bytes, dimensions and pixel count before decoding, decodes with only the JPEG/PNG/WebP
        decoders, applies EXIF orientation, converts to sRGB, strips all metadata, re-encodes the
        derivatives (§11.2) to the public store, deletes the original and returns `READY`.
        Moderation then runs asynchronously (`moderationStatus`).

        Check order: auth → rate limit → `MEDIA_UPLOADS_ENABLED` (503) → owner (else 404, also
        for unknown or malformed ids) → state:
        - `READY` (already completed) → 200 with the same body (idempotent);
        - `FAILED` → 422 `MEDIA_UPLOAD_REJECTED` again, with the original details;
        - `EXPIRED`, or `AWAITING_UPLOAD` past its expiry → 410 `MEDIA_UPLOAD_EXPIRED`;
        - `AWAITING_UPLOAD` and no object in storage yet → 409 `MEDIA_UPLOAD_NOT_RECEIVED`
          (retry after the PUT finishes; the upload stays usable until it expires);
        - verification fails → 422 `MEDIA_UPLOAD_REJECTED`, the upload becomes `FAILED` and
          the object is deleted;
        - image processing saturated → 503 `SERVICE_UNAVAILABLE` with `Retry-After`.
      parameters:
        - $ref: '#/components/parameters/UploadIdPath'
      responses:
        '200':
          description: The processed upload (status READY), ready to attach.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaUpload' }
              example:
                uploadId: 0192f1e0-2222-7bbb-8ccc-0d0e0f101112
                purpose: avatar
                status: READY
                moderationStatus: PENDING
                width: 512
                height: 512
                url: https://media.example.invalid/a/Yk3vQm9xT2sY8aE3k9Lzwq/512.webp
                thumbUrl: https://media.example.invalid/a/Yk3vQm9xT2sY8aE3k9Lzwq/128.webp
                attached: false
                expiresAt: '2026-10-17T19:02:00.000Z'
                failure: null
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: MEDIA_UPLOAD_NOT_RECEIVED — no object at the signed location yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '410':
          description: MEDIA_UPLOAD_EXPIRED — the upload window closed; declare a new upload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: |
            MEDIA_UPLOAD_REJECTED — the file failed verification. `details` has one entry with
            `field "file"` and `issue` one of `too_big` (bytes, or pixels/side over the limit),
            `too_small` (below the minimum dimensions), `invalid_format` (real type differs from
            the declared type, unsupported type, animated image, undecodable or truncated data).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/Error' }
        '503':
          description: MEDIA_UPLOADS_UNAVAILABLE or SERVICE_UNAVAILABLE (with `Retry-After` when image processing is saturated).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque `page.nextCursor` from the previous page (CONVENTIONS §5, §10.4). Omit for the first page.
      schema: { type: string, minLength: 1, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    UsernamePath:
      name: username
      in: path
      required: true
      description: Lowercase username. A malformed value is treated as not found (404), never 400.
      schema: { type: string, minLength: 1, maxLength: 64 }
    RoomIdPath:
      name: roomId
      in: path
      required: true
      description: A malformed id is treated as not found (404), never 400.
      schema: { type: string, format: uuid }
    UploadIdPath:
      name: uploadId
      in: path
      required: true
      description: The caller's own upload id (v1.4). Another user's, unknown or malformed → 404, never 400 or 403.
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Error envelope (see CONVENTIONS.md §4).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, down] }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, example: VALIDATION_FAILED }
            message: { type: string }
            requestId: { type: string }
            details:
              type: array
              items:
                type: object
                required: [field, issue]
                properties:
                  field: { type: string }
                  issue: { type: string }
    Username:
      type: string
      minLength: 3
      maxLength: 30
      pattern: '^[a-z0-9](?:[a-z0-9._]{1,28}[a-z0-9])?$'
    Password:
      type: string
      minLength: 8
      maxLength: 128
    Locale:
      type: string
      enum: [ar, en]
    DeviceInfo:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100, example: Pixel 9 }
        platform: { type: string, enum: [android, ios, web, other] }
        appVersion: { type: string, maxLength: 32 }
    RegisterRequest:
      type: object
      required: [email, password, username, displayName]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { $ref: '#/components/schemas/Password' }
        username: { $ref: '#/components/schemas/Username' }
        displayName: { $ref: '#/components/schemas/DisplayName' }
        locale: { $ref: '#/components/schemas/Locale' }
        device: { $ref: '#/components/schemas/DeviceInfo' }
    DisplayName:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        v1.2 (CONVENTIONS §6): NFC, trimmed, 1–50 grapheme clusters and ≤ 100 code points.
        ZWNJ/ZWJ allowed between non-joiner, non-space characters; bidi controls, U+200B, U+2060,
        U+FEFF, C0/C1 rejected (`invalid_format`); > 3 consecutive combining marks rejected;
        reserved terms rejected (`reserved_term`). v1.3.1 (SEC-036): text hygiene over vendored
        Unicode 17.0.0 data rejects default-ignorable, Cc/Cf/Zl/Zp/Co/Cs/Cn code points and blank
        look-alikes (Hangul fillers, U+2800, U+FFFC, U+1D159), except inside an RGI emoji, ZWNJ/ZWJ
        as above, and one variation selector after a base character (`invalid_format`). Checked on
        write; stored names are not rewritten. v1.4 (SEC-039): a variation selector is accepted
        only as part of a sequence listed in StandardizedVariants.txt, emoji-variation-sequences.txt
        or the IVD 2022-09-13; U+16FE4 is a blank look-alike; inside the name only the spaces
        U+0020, U+00A0, U+202F and U+3000 are allowed (CONVENTIONS §6).
    VerificationPending:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [verification_pending] }
    RegisterVerifyRequest:
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        code: { type: string, pattern: '^[0-9]{8}$' }
        device: { $ref: '#/components/schemas/DeviceInfo' }
    LoginRequest:
      type: object
      required: [identifier, password]
      additionalProperties: false
      properties:
        identifier:
          type: string
          minLength: 3
          maxLength: 254
          description: Email address or username.
        password: { type: string, minLength: 1, maxLength: 128 }
        device: { $ref: '#/components/schemas/DeviceInfo' }
    TokenPair:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        refreshTokenExpiresAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      required: [user, tokens]
      properties:
        user: { $ref: '#/components/schemas/Me' }
        tokens: { $ref: '#/components/schemas/TokenPair' }
    Me:
      type: object
      required: [id, email, emailVerified, username, displayName, locale, role, isPrivate, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        username: { $ref: '#/components/schemas/Username' }
        displayName: { type: string }
        bio: { type: [string, 'null'], maxLength: 300 }
        avatarUrl:
          type: [string, 'null']
          format: uri
          description: v1.4 — the caller's avatar (512 px), including while its moderation is PENDING (CONVENTIONS §11.5).
        avatarThumbUrl:
          type: [string, 'null']
          format: uri
          description: v1.4 — 128 px derivative of the same avatar; null exactly when `avatarUrl` is null.
        avatarModeration:
          description: v1.4 — moderation state of the caller's current avatar; null when there is no avatar.
          oneOf:
            - { $ref: '#/components/schemas/ModerationStatus' }
            - { type: 'null' }
        country:
          description: v1.4 — the country the user chose (CONVENTIONS §11.7); null unless set.
          oneOf:
            - { $ref: '#/components/schemas/CountryCode' }
            - { type: 'null' }
        locale: { $ref: '#/components/schemas/Locale' }
        role: { type: string, enum: [USER, ADMIN] }
        isPrivate: { type: boolean }
        createdAt: { type: string, format: date-time }
    UpdateMeRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: |
        v1.4: every property optional, at least one required, all-or-nothing (v1.2 required
        `locale`; a body with only `locale` is still valid). An empty object → 400
        `VALIDATION_FAILED` (`field ""`, `issue "required"`).
      properties:
        locale: { $ref: '#/components/schemas/Locale' }
        avatarUploadId:
          type: [string, 'null']
          format: uuid
          description: v1.4 — the caller's own unattached READY `avatar` upload; null removes the avatar (CONVENTIONS §11.4).
        country:
          description: v1.4 — ISO 3166-1 alpha-2 code from `listCountries`, or null to clear (CONVENTIONS §11.7).
          oneOf:
            - { $ref: '#/components/schemas/CountryCode' }
            - { type: 'null' }
    SessionInfo:
      type: object
      required: [id, current, createdAt, lastUsedAt]
      properties:
        id: { type: string, format: uuid }
        current: { type: boolean }
        deviceName: { type: [string, 'null'] }
        platform: { type: [string, 'null'], enum: [android, ios, web, other, null] }
        appVersion: { type: [string, 'null'] }
        ipCountry: { type: [string, 'null'], description: Reserved; null in Phase 1. }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
    PageInfo:
      type: object
      required: [nextCursor, hasMore]
      properties:
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    UserSummary:
      type: object
      description: Minimal public identity of a user (v1.3). Never contains an email.
      required: [id, username, displayName, avatarUrl, avatarThumbUrl]
      properties:
        id: { type: string, format: uuid }
        username: { $ref: '#/components/schemas/Username' }
        displayName: { type: string }
        avatarUrl:
          type: [string, 'null']
          format: uri
          description: v1.4 — 512 px avatar; null when none, or when it is not visible to the caller (moderation, CONVENTIONS §11.5).
        avatarThumbUrl:
          type: [string, 'null']
          format: uri
          description: v1.4 — 128 px derivative; null exactly when `avatarUrl` is null.
    PublicProfile:
      type: object
      required: [id, username, displayName, avatarUrl, avatarThumbUrl, bio, country, isPrivate, followerCount, followingCount, isFollowing, isSelf, liveRoomId]
      properties:
        id: { type: string, format: uuid }
        username: { $ref: '#/components/schemas/Username' }
        displayName: { type: string }
        avatarUrl:
          type: [string, 'null']
          format: uri
          description: v1.4 — as in `UserSummary` (a PENDING avatar is visible only when `isSelf`).
        avatarThumbUrl: { type: [string, 'null'], format: uri }
        bio: { type: [string, 'null'], maxLength: 300 }
        country:
          description: v1.4 — the country the user chose to show (CONVENTIONS §11.7); null unless set. Never inferred.
          oneOf:
            - { $ref: '#/components/schemas/CountryCode' }
            - { type: 'null' }
        isPrivate:
          type: boolean
          description: When true the user cannot be followed in v1.3 (no follow requests yet); the client hides Follow.
        followerCount: { type: integer, minimum: 0 }
        followingCount: { type: integer, minimum: 0 }
        isFollowing:
          type: boolean
          description: Whether the caller follows this user (always false when isSelf).
        isSelf: { type: boolean }
        liveRoomId:
          type: [string, 'null']
          format: uuid
          description: The user's LIVE room with a fresh heartbeat, else null.
    FollowState:
      type: object
      required: [isFollowing, followerCount]
      properties:
        isFollowing: { type: boolean }
        followerCount:
          type: integer
          minimum: 0
          description: The target's follower count after the operation.
    CategorySlug:
      type: string
      minLength: 2
      maxLength: 32
      pattern: '^[a-z0-9-]{2,32}$'
    LiveCategory:
      type: object
      required: [slug, name]
      properties:
        slug: { $ref: '#/components/schemas/CategorySlug' }
        name:
          type: string
          maxLength: 40
          description: Localized by `Accept-Language` (ar|en), else the caller's stored locale (CONVENTIONS §10.1).
    LiveConfig:
      type: object
      required: [hostingEnabled, heartbeatIntervalSeconds, heartbeatStaleAfterSeconds]
      properties:
        hostingEnabled:
          type: boolean
          description: Server config `LIVE_HOSTING_ENABLED` (default false until a media provider exists, B1).
        heartbeatIntervalSeconds: { type: integer, minimum: 1, example: 15 }
        heartbeatStaleAfterSeconds: { type: integer, minimum: 1, example: 45 }
    LiveRoomMode:
      type: string
      enum: [SOLO, PK, MULTI]
      description: Only SOLO rooms exist in v1.3. Clients render an unrecognised future value as SOLO.
    LiveRoomTitle:
      type: string
      minLength: 1
      maxLength: 160
      description: |
        v1.3 (CONVENTIONS §10.3): NFC, trimmed, 1–80 grapheme clusters and ≤ 160 code points.
        The displayName character-hygiene rules apply (control/bidi/zero-width bans, ZWNJ/ZWJ
        placement, zalgo cap, at least one letter/digit/emoji) → `invalid_format`, including the
        v1.3.1 text-hygiene rules (CONVENTIONS §6, SEC-036) as tightened in v1.4 (SEC-039: listed
        variation sequences only, U+16FE4, restricted inner spaces). The reserved-term/brand rule
        and the mixed-script rule do **not** apply.
    LiveRoomSummary:
      type: object
      required: [id, title, mode, viewerCount, startedAt, coverUrl, coverThumbUrl, category, country, host]
      properties:
        id: { type: string, format: uuid }
        title: { $ref: '#/components/schemas/LiveRoomTitle' }
        mode: { $ref: '#/components/schemas/LiveRoomMode' }
        viewerCount:
          type: integer
          minimum: 0
          description: Always 0 in v1.3 (no realtime presence yet); the card shows the "New" chip.
        startedAt: { type: string, format: date-time }
        coverUrl:
          type: [string, 'null']
          format: uri
          description: |
            Always null in v1.3 (no upload). v1.4: the 960×1280 cover; null when the room has no
            cover or the cover is not visible to the caller (moderation, CONVENTIONS §11.5). The
            card then falls back to the host avatar / the C2 tinted fallback.
        coverThumbUrl:
          type: [string, 'null']
          format: uri
          description: v1.4 — 480×640 derivative of the same cover; null exactly when `coverUrl` is null.
        category:
          description: Null when the room has no category.
          oneOf:
            - { $ref: '#/components/schemas/LiveCategory' }
            - { type: 'null' }
        country:
          description: v1.4 — the host's chosen country, copied at go-live and kept in sync while LIVE (CONVENTIONS §11.8); null when the host chose none.
          oneOf:
            - { $ref: '#/components/schemas/CountryCode' }
            - { type: 'null' }
        host: { $ref: '#/components/schemas/UserSummary' }
    LiveRoom:
      allOf:
        - { $ref: '#/components/schemas/LiveRoomSummary' }
        - type: object
          required: [status, endedAt, endReason, coverModeration]
          properties:
            status: { type: string, enum: [LIVE, ENDED] }
            endedAt: { type: [string, 'null'], format: date-time }
            endReason:
              type: [string, 'null']
              enum: [HOST_ENDED, HEARTBEAT_TIMEOUT, HOST_SUSPENDED, ADMIN, null]
            coverModeration:
              description: v1.4 — moderation state of the room's cover, sent **only to the host**; null for every other caller and when there is no cover.
              oneOf:
                - { $ref: '#/components/schemas/ModerationStatus' }
                - { type: 'null' }
    LiveRoomPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LiveRoomSummary' }
        page: { $ref: '#/components/schemas/PageInfo' }
    StartLiveRoomRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { $ref: '#/components/schemas/LiveRoomTitle' }
        categorySlug: { $ref: '#/components/schemas/CategorySlug' }
        coverUploadId:
          type: string
          format: uuid
          description: v1.4 — optional; the caller's own unattached READY `room_cover` upload (CONVENTIONS §11.4).
    SetLiveRoomCoverRequest:
      type: object
      required: [coverUploadId]
      additionalProperties: false
      properties:
        coverUploadId:
          type: [string, 'null']
          format: uuid
          description: The caller's own unattached READY `room_cover` upload, or null to remove the cover.
    CountryCode:
      type: string
      minLength: 2
      maxLength: 2
      pattern: '^[A-Z]{2}$'
      description: |
        v1.4. ISO 3166-1 alpha-2, uppercase, and on the vendored list (CONVENTIONS §11.7; the
        pattern alone is not enough). Clients never derive it from IP, SIM, phone number or
        device region.
    Country:
      type: object
      required: [code, name]
      properties:
        code: { $ref: '#/components/schemas/CountryCode' }
        name:
          type: string
          maxLength: 80
          description: Localized by `Accept-Language` (ar|en), else the caller's stored locale, else ar (as CONVENTIONS §10.1).
    LiveCountry:
      allOf:
        - { $ref: '#/components/schemas/Country' }
        - type: object
          required: [liveRoomCount]
          properties:
            liveRoomCount:
              type: integer
              minimum: 1
              description: Rooms with this country that `listLiveRooms` would list now (may lag up to 15 s).
    ModerationStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
      description: v1.4 (CONVENTIONS §11.5). Clients render an unrecognised future value as PENDING.
    MediaPurpose:
      type: string
      enum: [avatar, room_cover]
    MediaContentType:
      type: string
      enum: [image/jpeg, image/png, image/webp]
      description: v1.4. HEIC/HEIF, GIF, SVG, AVIF and every other type are refused (CONVENTIONS §11.2).
    MediaPurposeLimits:
      type: object
      required: [maxBytes, minWidth, minHeight, aspectRatio]
      properties:
        maxBytes: { type: integer, minimum: 1 }
        minWidth:
          type: integer
          minimum: 1
          description: Minimum width of the largest centred crop at `aspectRatio`.
        minHeight: { type: integer, minimum: 1 }
        aspectRatio:
          type: string
          enum: ['1:1', '3:4']
          description: The server centre-crops to this ratio; the client should let the user crop first.
    MediaConfig:
      type: object
      required: [uploadsEnabled, allowedContentTypes, maxPixels, maxSidePixels, purposes]
      properties:
        uploadsEnabled:
          type: boolean
          description: Server config `MEDIA_UPLOADS_ENABLED` (default false; true only with storage configured). When false the client hides every upload control.
        allowedContentTypes:
          type: array
          items: { $ref: '#/components/schemas/MediaContentType' }
        maxPixels: { type: integer, minimum: 1, description: 'Width × height limit, checked from the header before decoding.' }
        maxSidePixels: { type: integer, minimum: 1 }
        purposes:
          type: object
          required: [avatar, room_cover]
          properties:
            avatar: { $ref: '#/components/schemas/MediaPurposeLimits' }
            room_cover: { $ref: '#/components/schemas/MediaPurposeLimits' }
    CreateMediaUploadRequest:
      type: object
      required: [purpose, contentType, byteSize]
      additionalProperties: false
      properties:
        purpose: { $ref: '#/components/schemas/MediaPurpose' }
        contentType: { $ref: '#/components/schemas/MediaContentType' }
        byteSize:
          type: integer
          minimum: 1
          maximum: 10485760
          description: Exact size of the file in bytes. Above the purpose's `maxBytes` → 400 `too_big`.
    MediaUploadTicket:
      type: object
      required: [uploadId, purpose, method, url, headers, expiresAt]
      properties:
        uploadId: { type: string, format: uuid }
        purpose: { $ref: '#/components/schemas/MediaPurpose' }
        method:
          type: string
          enum: [PUT]
          description: Only presigned PUT in v1.4 (works on every S3-compatible store, CONVENTIONS §11.3).
        url:
          type: string
          format: uri
          description: Presigned storage URL, https in production. Secret-bearing; the client never logs it.
        headers:
          type: object
          additionalProperties: { type: string }
          description: Headers the client must send exactly (signed). Includes `Content-Type` and `Content-Length`.
        expiresAt: { type: string, format: date-time }
    MediaUploadFailure:
      type: object
      required: [field, issue]
      properties:
        field: { type: string, enum: [file] }
        issue: { type: string, enum: [too_big, too_small, invalid_format] }
    MediaUpload:
      type: object
      required: [uploadId, purpose, status, moderationStatus, width, height, url, thumbUrl, attached, expiresAt, failure]
      description: v1.4 — one of the caller's uploads (owner-only view).
      properties:
        uploadId: { type: string, format: uuid }
        purpose: { $ref: '#/components/schemas/MediaPurpose' }
        status:
          type: string
          enum: [AWAITING_UPLOAD, READY, FAILED, EXPIRED, DELETED]
          description: CONVENTIONS §11.3/§11.6. Clients treat an unrecognised future value as not usable.
        moderationStatus:
          description: Null until READY.
          oneOf:
            - { $ref: '#/components/schemas/ModerationStatus' }
            - { type: 'null' }
        width: { type: [integer, 'null'], minimum: 1, description: Width of the main derivative; null until READY. }
        height: { type: [integer, 'null'], minimum: 1 }
        url:
          type: [string, 'null']
          format: uri
          description: Main derivative (avatar 512 px, cover 960×1280) for the owner's preview; null unless READY. Allowed hosts only (§11.10).
        thumbUrl: { type: [string, 'null'], format: uri }
        attached:
          type: boolean
          description: True once used as an avatar or room cover (an upload is attached at most once).
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: AWAITING_UPLOAD — end of the upload window; READY and not attached — when it is deleted if never attached; otherwise null.
        failure:
          description: Set only when FAILED.
          oneOf:
            - { $ref: '#/components/schemas/MediaUploadFailure' }
            - { type: 'null' }
security:
  - bearerAuth: []

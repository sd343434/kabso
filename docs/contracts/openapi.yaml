        data:
          type: array
          items: { $ref: '#/components/schemas/FamilyJoinRequest' }
        page: { $ref: '#/components/schemas/PageInfo' }
    MyFamilyJoinRequest:
      type: object
      required: [request]
      properties:
        request:
          oneOf:
            - $ref: '#/components/schemas/FamilyJoinRequest'
            - type: 'null'
    SetFamilyRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { type: string, enum: [DEPUTY, MEMBER] }
    TransferFamilyRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
    ProfileFamily:
      type: object
      description: "(v1.21-live, CP-018) A user's family on their public profile."
      required: [id, number, name, level, emblemUrl, role]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, minimum: 10000000, maximum: 99999999 }
        name: { type: string }
        level: { type: integer, minimum: 1, maximum: 10 }
        emblemUrl: { type: [string, 'null'], format: uri }
        role: { $ref: '#/components/schemas/FamilyRole' }
    CpConfig:
      type: object
      required: [requestCost, requestTtlDays, giftAmounts, tiers]
      properties:
        requestCost: { type: integer, minimum: 1, description: "Coins a CP request costs (99), refunded unless accepted." }
        requestTtlDays: { type: integer, minimum: 1 }
        giftAmounts:
          type: array
          items: { type: integer, minimum: 1 }
        tiers:
          type: array
          description: The CP tiers, lowest first; `name` follows Accept-Language.
          items:
            type: object
            required: [level, minPoints, name]
            properties:
              level: { type: integer, minimum: 1 }
              minPoints: { type: integer, minimum: 0 }
              name: { type: string }
    CpRequestSendRequest:
      type: object
      additionalProperties: false
      required: [username, clientId]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        clientId: { type: string, format: uuid, description: "Unique per sender; a retry with the same id is never charged twice (§3)." }
    CpRequest:
      type: object
      required: [id, sender, receiver, status, cost, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        sender: { $ref: '#/components/schemas/UserSummary' }
        receiver: { $ref: '#/components/schemas/UserSummary' }
        status: { $ref: '#/components/schemas/BondRequestStatus' }
        cost: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    CpRequestResult:
      type: object
      required: [request, coins]
      properties:
        request: { $ref: '#/components/schemas/CpRequest' }
        coins: { type: integer, minimum: 0, maximum: 9007199254740991 }
    CpRequestPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CpRequest' }
        page: { $ref: '#/components/schemas/PageInfo' }
    CpCouple:
      type: object
      required: [id, partner, since, days, points, level, levelName, nextLevelName, pointsToNext]
      properties:
        id: { type: string, format: uuid }
        partner: { $ref: '#/components/schemas/UserSummary' }
        since: { type: string, format: date-time }
        days: { type: integer, minimum: 1, description: Days together; the day the couple was formed is day 1. }
        points: { type: integer, minimum: 0, description: CP points (the coins of every CP gift). }
        level: { type: integer, minimum: 1, maximum: 5 }
        levelName: { type: string }
        nextLevelName: { type: [string, 'null'] }
        pointsToNext: { type: [integer, 'null'], minimum: 0 }
    MyCp:
      type: object
      required: [cp]
      properties:
        cp:
          oneOf:
            - $ref: '#/components/schemas/CpCouple'
            - type: 'null'
    CpGiftSendRequest:
      type: object
      additionalProperties: false
      required: [amount, clientId]
      properties:
        amount: { type: integer, enum: [10, 52, 99, 520, 1314] }
        clientId: { type: string, format: uuid }
    CpGiftResult:
      type: object
      required: [gift, cp, coins]
      properties:
        gift:
          type: object
          required: [id, amount, createdAt]
          properties:
            id: { type: string, format: uuid }
            amount: { type: integer, minimum: 1 }
            createdAt: { type: string, format: date-time }
        cp: { $ref: '#/components/schemas/CpCouple' }
        coins: { type: integer, minimum: 0, maximum: 9007199254740991 }
    ProfileCp:
      type: object
      description: "(v1.21-live, CP-018) A user's CP couple on their public profile."
      required: [partner, since, level, levelName, points]
      properties:
        partner: { $ref: '#/components/schemas/UserSummary' }
        since: { type: string, format: date-time }
        level: { type: integer, minimum: 1, maximum: 5 }
        levelName: { type: string }
        points: { type: integer, minimum: 0 }
    Medal:
      type: object
      required: [code, name, description, iconKey, sortOrder, awardedAt]
      properties:
        code: { type: string, maxLength: 40 }
        name: { type: string }
        description: { type: string }
        iconKey: { type: string, description: The app's icon for the medal. }
        sortOrder: { type: integer }
        awardedAt: { type: [string, 'null'], format: date-time, description: "When the caller earned it, or null." }
    MedalCatalogue:
      type: object
      required: [data, total, owned]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Medal' }
        total: { type: integer, minimum: 0 }
        owned: { type: integer, minimum: 0, description: Medals the caller earned. }
    UserMedal:
      type: object
      required: [code, name, description, iconKey, awardedAt]
      properties:
        code: { type: string, maxLength: 40 }
        name: { type: string }
        description: { type: string }
        iconKey: { type: string }
        awardedAt: { type: string, format: date-time }
    UserMedalList:
      type: object
      required: [data, owned, total]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/UserMedal' }
        owned: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    ProfileMedal:
      type: object
      required: [code, name, iconKey]
      properties:
        code: { type: string, maxLength: 40 }
        name: { type: string }
        iconKey: { type: string }
    ProfileMedals:
      type: object
      description: "(v1.21-live, CP-018) Medals on the public profile: owned, the catalogue size, the newest three and the user's chosen showcase."
      required: [owned, total, latest, showcase]
      properties:
        owned: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        latest:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/ProfileMedal' }
        showcase:
          type: array
          maxItems: 6
          description: "The medals the user chose to show (PUT /me/medals/showcase), in their order; empty until they choose (no auto-fill)."
          items: { $ref: '#/components/schemas/ProfileMedal' }
    MedalShowcase:
      type: object
      required: [showcase]
      properties:
        showcase:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/ProfileMedal' }
    SetMedalShowcaseRequest:
      type: object
      additionalProperties: false
      required: [medalCodes]
      properties:
        medalCodes:
          type: array
          maxItems: 6
          uniqueItems: true
          description: Unlocked medal codes in display order; [] shows none.
          items: { type: string, minLength: 1, maxLength: 40 }
security:
  - bearerAuth: []

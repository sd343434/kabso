        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/search:
    get:
      tags: [search]
      operationId: search
      summary: "Prefix search for users, hashtags or posts (caption words)"
      description: CONVENTIONS §11.6. `q` is 1–64 characters after NFC and trim; a leading `@` or `#` is ignored.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [users, hashtags, posts] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page; `data` holds UserSummary, Hashtag or Post items by `type`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/search/trending:
    get:
      tags: [search]
      operationId: listTrendingSearches
      summary: "The terms people search most: up to 6, with a TRENDING or NEW tag (D147)"
      description: |
        v1.29-live (DRAFT, D147, CONVENTIONS §11.11). The same list for everyone (cached up to
        60 s): terms submitted with `recordSearchQuery` by at least `SEARCH_TRENDING_MIN_SEARCHERS`
        (default 5) different people in the last 7 days, most searchers first; never a term hidden
        by an admin or containing a blocked word. Empty when none qualifies (the app hides the
        section below 3 terms). Per-user default rate limit.
      responses:
        '200':
          description: Up to 6 terms, rank order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrendingSearchList' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/search/trending-hashtags:
    get:
      tags: [search]
      operationId: listTrendingHashtags
      summary: "The hashtags of the week the caller can see (D147)"
      description: |
        v1.29-live (DRAFT, D147, CONVENTIONS §11.11). Hashtags of posts published in the last 7
        days that the caller can see (the visibility of hashtag pages), with at least 3 such posts
        by at least 2 authors; most posts first, then the newest post, then the tag. `postCount`
        counts those 7 days only. Never a tag containing a blocked word. Per-user default rate limit.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: Up to `limit` hashtags.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HashtagList' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/search/queries:
    post:
      tags: [search]
      operationId: recordSearchQuery
      summary: "Count a search the caller submitted, for trends (D147)"
      description: |
        v1.29-live (DRAFT, D147, CONVENTIONS §11.11). The app sends it when the person submits a
        search or opens a result of one — not for every keystroke. `q` follows `search`'s rules.
        The server counts the normalized term once per person per 7 days; no user id is stored
        with it (the dedupe key is an expiring HMAC in Redis). Searches that are never counted
        (fewer than 2 characters, no letter, an `@`, a link or 5+ digits in a row) are accepted
        and dropped, so the answer never tells what was counted. 120 / hour per user
        (`RATE_LIMIT_SEARCH_RECORD_USER`, replacing the default).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordSearchQueryRequest' }
      responses:
        '204': { description: Accepted. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

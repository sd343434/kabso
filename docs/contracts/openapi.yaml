      tags: [admin-live]
      operationId: grantLiveHost
      summary: "Admin: grant the hosting permission (CP-010)"
      description: |
        Permission `LIVE_HOSTS` (else 403). Idempotent; audited. Source `ADMIN` (agencies and
        identity checks grant it in L1b). Unknown or not ACTIVE user → 404.
      parameters:
        - $ref: '#/components/parameters/UsernamePath'

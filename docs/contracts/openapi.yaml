      enum: [CHECK_IN, SEND_GIFT, CHAT_TOGETHER]
    CpTask:
      type: object
      required: [code, name, description, reward, progress, target, completed, claimed]
      properties:
        code: { $ref: '#/components/schemas/CpTaskCode' }
        name: { type: string }
        description: { type: string }
        reward: { type: integer, minimum: 1, description: CP points the claim adds. }
        progress: { type: integer, minimum: 0 }
        target: { type: integer, minimum: 1 }
        completed: { type: boolean }
        claimed: { type: boolean, description: Claimed today by either partner. }
    CpTasks:
      type: object
      required: [day, timeZone, startsAt, resetsAt, checkedIn, tasks]
      properties:
        day: { type: string, format: date, description: "The CP day in `timeZone`." }
        timeZone: { type: string, description: IANA time zone of the CP day. }
        startsAt: { type: string, format: date-time }
        resetsAt: { type: string, format: date-time, description: The next 00:00 in `timeZone`. }
        checkedIn:
          type: object
          required: [me, partner]
          properties:
            me: { type: boolean }
            partner: { type: boolean }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/CpTask' }
    CpTaskClaimResult:
      type: object
      required: [task, cp]
      properties:
        task: { $ref: '#/components/schemas/CpTask' }
        cp: { $ref: '#/components/schemas/CpCouple' }
    CpCouplePublic:
      type: object
      description: (v1.24-live, CP-021) A couple's CP space as anyone signed in may read it.
      required: [id, partners, since, days, points, level, levelName, nextLevelName, pointsToNext, privileges, mine]
      properties:
        id: { type: string, format: uuid }
        partners:
          type: array
          description: Both partners, ordered by user id.
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/UserSummary' }
        since: { type: string, format: date-time }
        days: { type: integer, minimum: 1 }
        points: { type: integer, minimum: 0, description: CP points (intimacy). }
        level: { type: integer, minimum: 1, maximum: 6 }
        levelName: { type: string }
        nextLevelName: { type: [string, 'null'] }
        pointsToNext: { type: [integer, 'null'], minimum: 0 }
        privileges:
          type: array
          items: { $ref: '#/components/schemas/CpPrivilegeCode' }
        mine: { type: boolean, description: The reader is one of the partners. }
    CpGiftWallEntry:
      type: object
      required: [id, amount, giftCode, sender, receiver, createdAt]
      properties:
        id: { type: string, format: uuid }
        amount: { type: integer, minimum: 1 }
        giftCode: { type: [string, 'null'], description: "The `CpConfig.gifts` code of the amount; null for an amount no longer offered." }
        sender: { $ref: '#/components/schemas/UserSummary' }
        receiver: { $ref: '#/components/schemas/UserSummary' }
        createdAt: { type: string, format: date-time }
    CpGiftWall:
      type: object
      required: [data, page, totals]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CpGiftWallEntry' }
        page: { $ref: '#/components/schemas/PageInfo' }
        totals:
          type: object
          required: [gifts, coins]
          properties:
            gifts: { type: integer, minimum: 0 }
            coins: { type: integer, minimum: 0 }
    CpRankingPeriod:
      type: string
      enum: [WEEK, ALL]
      default: WEEK
    CpRankingEntry:
      type: object
      required: [rank, coupleId, partners, level, levelName, points]
      properties:
        rank: { type: integer, minimum: 1 }
        coupleId: { type: string, format: uuid }
        partners:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/UserSummary' }
        level: { type: integer, minimum: 1, maximum: 6 }
        levelName: { type: string }
        points: { type: integer, minimum: 1, description: CP points gained in the period. }
    CpRankings:
      type: object
      required: [period, startsAt, endsAt, data, page, me]
      properties:
        period: { $ref: '#/components/schemas/CpRankingPeriod' }
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        data:
          type: array
          items: { $ref: '#/components/schemas/CpRankingEntry' }
        page: { $ref: '#/components/schemas/PageInfo' }
        me:
          oneOf:
            - type: object
              required: [coupleId, rank, points]
              properties:
                coupleId: { type: string, format: uuid }
                rank: { type: [integer, 'null'], minimum: 1 }
                points: { type: integer, minimum: 0 }
            - type: 'null'
    CpConfessionCreateRequest:
      type: object
      additionalProperties: false
      required: [text, clientId]
      properties:
        text: { type: string, minLength: 1, maxLength: 1600, description: "1–200 code points after the live chat text rules (§10.11)." }
        clientId: { type: string, format: uuid, description: Unique per author; a retry with the same id answers the first confession. }
    CpConfession:
      type: object
      required: [id, coupleId, author, recipient, text, createdAt]
      properties:
        id: { type: string, format: uuid }
        coupleId: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/UserSummary' }
        recipient: { $ref: '#/components/schemas/UserSummary' }
        text: { type: string, description: "Both partners' live blocked words are masked (each character → `*`)." }
        createdAt: { type: string, format: date-time }
    CpConfessionPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CpConfession' }
        page: { $ref: '#/components/schemas/PageInfo' }
    Medal:
      type: object
      required: [code, name, description, iconKey, sortOrder, awardedAt]
      properties:
        code: { type: string, maxLength: 40 }
        name: { type: string }
        description: { type: string }
        iconKey: { type: string, description: The app's icon for the medal. }
        sortOrder: { type: integer }
        awardedAt: { type: [string, 'null'], format: date-time, description: "When the caller earned it, or null." }
    MedalCatalogue:
      type: object
      required: [data, total, owned]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Medal' }
        total: { type: integer, minimum: 0 }
        owned: { type: integer, minimum: 0, description: Medals the caller earned. }
    UserMedal:
      type: object
      required: [code, name, description, iconKey, awardedAt]
      properties:
        code: { type: string, maxLength: 40 }
        name: { type: string }
        description: { type: string }
        iconKey: { type: string }
        awardedAt: { type: string, format: date-time }
    UserMedalList:
      type: object
      required: [data, owned, total]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/UserMedal' }
        owned: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    ProfileMedal:
      type: object
      required: [code, name, iconKey]
      properties:
        code: { type: string, maxLength: 40 }
        name: { type: string }
        iconKey: { type: string }
    ProfileMedals:
      type: object
      description: "(v1.21-live, CP-018) Medals on the public profile: owned, the catalogue size, the newest three and the user's chosen showcase."
      required: [owned, total, latest, showcase]
      properties:
        owned: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        latest:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/ProfileMedal' }
        showcase:
          type: array
          maxItems: 6
          description: "The medals the user chose to show (PUT /me/medals/showcase), in their order; empty until they choose (no auto-fill)."
          items: { $ref: '#/components/schemas/ProfileMedal' }
    MedalShowcase:
      type: object
      required: [showcase]
      properties:
        showcase:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/ProfileMedal' }
    SetMedalShowcaseRequest:
      type: object
      additionalProperties: false
      required: [medalCodes]
      properties:
        medalCodes:
          type: array
          maxItems: 6
          uniqueItems: true
          description: Unlocked medal codes in display order; [] shows none.
          items: { type: string, minLength: 1, maxLength: 40 }
    # ---- v1.22-live (DRAFT, CP-019) — the bag ---------------------------------------------------
    BagCategory:
      type: string
      enum: [PROFILE_CARD]
      description: "A bag category. PROFILE_CARD: the decoration on the profile card's header. More categories come later; clients ignore items of categories they do not know (§10.22)."
    BagItemSource:
      type: string
      enum: [FREE_SIGNUP, BACKFILL, ADMIN]
      description: "How the item was obtained: free at signup, free for accounts that existed before the bag, or granted by an admin. More values come later (store, rewards); clients treat unknown values as opaque."
    BagCatalogueItem:
      type: object
      required: [code, category, name, assetKey, sortOrder, free]
      properties:
        code: { type: string, maxLength: 40, example: bunny_royal }
        category: { $ref: '#/components/schemas/BagCategory' }
        name: { type: string, description: "Localized by `Accept-Language`, else the caller's locale." }
        assetKey: { type: string, maxLength: 60, description: "The app's asset for the item (for a profile card, the header animation `assets/profile_card/<assetKey>.svga`).", example: header_bunny_royal }
        sortOrder: { type: integer }
        free: { type: boolean, description: Every new account receives it. }
    BagCatalogue:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/BagCatalogueItem' }
    BagItem:
      type: object
      required: [code, category, name, assetKey, acquiredAt, source, equipped]
      properties:
        code: { type: string, maxLength: 40 }
        category: { $ref: '#/components/schemas/BagCategory' }
        name: { type: string }
        assetKey: { type: string, maxLength: 60 }
        acquiredAt: { type: string, format: date-time }
        source: { $ref: '#/components/schemas/BagItemSource' }
        equipped: { type: boolean, description: Worn now; at most one item per category. }
    Bag:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/BagItem' }
    BagEquippedItem:
      type: object
      required: [code, name, assetKey]
      properties:
        code: { type: string, maxLength: 40 }
        name: { type: string }
        assetKey: { type: string, maxLength: 60 }
    BagEquipped:
      type: object
      required: [category, equipped]
      properties:
        category: { $ref: '#/components/schemas/BagCategory' }
        equipped:
          description: The item worn in the category, or null (nothing worn).
          oneOf:
            - $ref: '#/components/schemas/BagEquippedItem'
            - type: 'null'
    SetBagEquippedRequest:
      type: object
      additionalProperties: false
      required: [category, code]
      properties:
        category: { $ref: '#/components/schemas/BagCategory' }
        code:
          type: [string, 'null']
          minLength: 1
          maxLength: 40
          description: An item the caller owns in `category`, or null to wear nothing.
    ProfileCard:
      type: object
      description: "(v1.22-live, CP-019) The profile card a user wears, on the public profile."
      required: [code, assetKey]
      properties:
        code: { type: string, maxLength: 40, example: bunny_royal }
        assetKey: { type: string, maxLength: 60, example: header_bunny_royal }
    # ---- v1.23-live (DRAFT, CP-020): live gifts -----------------------------------------------
    GiftCategory:
      type: string
      enum: [POPULAR, EVENT, FUN, LUCKY, QUIPS]
      description: "A gift panel tab: POPULAR (شائعة), EVENT (مناسبات), FUN (مرح); v1.27-live (D132) LUCKY (حظ): lucky gifts (CONVENTIONS §10.27), listed only while lucky gifts are on; v1.32-live (D154) QUIPS (إفيهات): a sound and its line played to the whole room (CONVENTIONS §10.33). The bag (الحقيبة) is `getMyGiftBag`. Clients ignore gifts of categories they do not know."
    GiftBadge:
      type: string
      enum: [NONE, NEW, EVENT]
      description: The corner badge of a gift in the panel; unknown values show as NONE.
    Gift:
      type: object
      required: [code, category, name, priceCoins, assetKey, animationKey, imageUrl, animationUrl, animationBytes, sortOrder, badge, tag, quip]
      properties:
        code: { type: string, pattern: '^[a-z0-9][a-z0-9_]{0,39}$', example: rose }
        category: { $ref: '#/components/schemas/GiftCategory' }
        name: { type: string, description: "Localized by `Accept-Language`, else the caller's locale." }
        priceCoins: { type: integer, minimum: 0, maximum: 1000000, description: "Coins for one gift; 0 only for a free QUIPS gift (v1.32-live, D154)." }
        assetKey: { type: string, maxLength: 80, description: "The app's static image of the gift.", example: gift_rose }
        animationKey:
          type: [string, 'null']
          maxLength: 80
          description: "The app's SVGA / full-screen effect, or null (the image only)."
        imageUrl:
          type: [string, 'null']
          format: uri
          description: |
            v1.26.2-live (D126): the gift's static image (PNG or WebP, about square, at most 1 MB) hosted
            under the media public URL (`…/media/gifts/<code>/<sha256 prefix>.png|webp`), or null. The URL
            is content-addressed and immutable (a new file gets a new URL), so the app caches it for good.
            Fallback order in the app: `imageUrl`, else the bundled `assetKey`, else Kabso's gift box.
            Always present in responses; older apps ignore it.
        animationUrl:
          type: [string, 'null']
          format: uri
          description: |
            v1.26.2-live (D126): the gift's SVGA 2.x effect (at most 25 MB) hosted like `imageUrl`, or null.
            The app downloads it on demand into a disk cache (prefetching only small ones) and plays it
            from the bytes, with the sound embedded in the SVGA; while it downloads the image pops instead.
            Takes precedence over the bundled `animationKey`.
        animationBytes:
          type: [integer, 'null']
          minimum: 1
          maximum: 26214400
          description: v1.26.2-live (D126). The size of `animationUrl`'s file in bytes (null exactly when `animationUrl` is), so the app can decide whether to prefetch it.
        sortOrder: { type: integer, minimum: 0 }
        badge: { $ref: '#/components/schemas/GiftBadge' }
        tag:
          description: |
            v1.24.3-live (CP-020, D117): the gift's optional sub-category, shown as a chip under the panel's
            tabs ("All" plus the distinct tags of the open tab), or null (none). Always present in
            responses; clients that do not know the field ignore it.
          oneOf:
            - $ref: '#/components/schemas/GiftTag'
            - type: 'null'
        quip:
          description: |
            v1.32-live (D154, CONVENTIONS §10.33): a QUIPS gift's sound and line of text; null for every
            other gift. Always present in responses; older apps ignore it (and the QUIPS category).
          oneOf:
            - $ref: '#/components/schemas/GiftQuip'
            - type: 'null'
    GiftQuip:
      type: object
      description: v1.32-live (D154). The sound of a QUIPS gift, bundled in the app.
      required: [soundKey, durationMs, text]
      properties:
        soundKey: { type: string, maxLength: 80, description: "The app's bundled sound, e.g. `kabi/ghazal_01`.", example: kabi/ghazal_01 }
        durationMs: { type: integer, minimum: 200, maximum: 15000, description: The sound's length. }
        text:
          type: [string, 'null']
          maxLength: 200
          description: The words of the line, shown as a chat bubble while it plays (Arabic, the voice's dialect), or null for a sound without words.
    GiftTag:
      type: object
      description: v1.24.3-live (CP-020, D117). A gift sub-category, managed with the `gift-admin` CLI.
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[a-z0-9][a-z0-9_]{0,39}$', example: treasure_box }
        name:
          type: string
          minLength: 1
          maxLength: 30
          description: "Localized by `Accept-Language`, else the caller's locale."
          example: Treasure Box
    GiftCatalogue:
      type: object
      required: [version, categories, quantities, maxRecipients, comboWindowSeconds, data]
      properties:
        version:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: Changes whenever anything in the response except the names' language changes.
        categories:
          type: array
          items: { $ref: '#/components/schemas/GiftCategory' }
          description: The tabs, in display order.
        quantities:
          type: array
          minItems: 1
          maxItems: 12
          items: { type: integer, minimum: 1, maximum: 9999 }
          description: The quantities a send may use, ascending (server config `LIVE_GIFT_QUANTITIES`).
        maxRecipients: { type: integer, minimum: 1, description: At most this many recipients per send (25). }
        comboWindowSeconds:
          type: integer
          minimum: 1
          description: A send within this many seconds of the same gift to the same recipients continues the combo (5).
        data:
          type: array
          items: { $ref: '#/components/schemas/Gift' }
    GiftBagItem:
      allOf:
        - $ref: '#/components/schemas/Gift'
        - type: object
          required: [quantity]
          properties:
            quantity: { type: integer, minimum: 1, maximum: 1000000000, description: How many of this gift the caller holds. }
    GiftBag:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/GiftBagItem' }
    LiveGiftSource:
      type: string
      enum: [COINS, BAG]
      description: "COINS: paid from the wallet. BAG: taken from the caller's gift bag."
    LiveGiftSendRequest:
      type: object
      required: [giftCode, quantity, recipients, source, clientId]
      additionalProperties: false
      properties:
        giftCode: { type: string, minLength: 1, maxLength: 40 }
        quantity:
          type: integer
          minimum: 1
          maximum: 9999
          description: One of `GiftCatalogue.quantities` (else 400 `invalid_value`); each recipient receives this many.
        recipients:
          type: array
          minItems: 1
          maxItems: 25
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
          description: Usernames of the host and/or people seated in the room now; the caller may be one of them when they are the host or seated (v1.26.3-live, D128).
        source: { $ref: '#/components/schemas/LiveGiftSource' }
        clientId:
          type: string
          format: uuid
          description: Chosen by the app for each send; a retry with the same id returns the first send and is never charged again.
    LiveGiftCombo:
      type: object
      required: [id, count, quantity]
      properties:
        id: { type: string, format: uuid, description: The first send of the combo (this send's id when it starts one). }
        count: { type: integer, minimum: 1, description: '1 for the first send of a combo, then 2, 3 …' }
        quantity: { type: integer, format: int64, minimum: 1, description: Gifts per recipient in the combo so far. }
    LiveGift:
      type: object
      description: One send, as the response and the `gift` data message carry it (no name; the app takes it from its catalogue).
      required: [id, roomId, giftCode, assetKey, animationKey, imageUrl, animationUrl, animationBytes, unitPrice, quantity, source, totalCoins, sender, recipients, combo, createdAt]
      properties:
        id: { type: string, format: uuid }
        roomId: { type: string, format: uuid }
        giftCode: { type: string, maxLength: 40 }
        assetKey: { type: string, maxLength: 80 }
        animationKey: { type: [string, 'null'], maxLength: 80 }
        imageUrl: { type: [string, 'null'], format: uri, description: "v1.26.2-live (D126): the gift's hosted image now, as `Gift.imageUrl`." }
        animationUrl: { type: [string, 'null'], format: uri, description: "v1.26.2-live (D126): the gift's hosted SVGA now, as `Gift.animationUrl` (viewers who never opened the panel download it from here)." }
        animationBytes: { type: [integer, 'null'], minimum: 1, maximum: 26214400, description: v1.26.2-live (D126). As `Gift.animationBytes`. }
        unitPrice: { type: integer, minimum: 0, description: "The gift's price in coins when it was sent (0: a free quip, v1.32-live)." }
        quantity: { type: integer, minimum: 1, description: Gifts each recipient received. }
        source: { $ref: '#/components/schemas/LiveGiftSource' }
        totalCoins:
          type: integer
          format: int64
          minimum: 0
          description: unitPrice × quantity × recipients (the value; charged only for COINS; 0 only for a free quip).
        sender: { $ref: '#/components/schemas/UserSummary' }
        recipients:
          type: array
          minItems: 1
          maxItems: 25
          items: { $ref: '#/components/schemas/UserSummary' }
          description: In the order the sender listed them.
        combo: { $ref: '#/components/schemas/LiveGiftCombo' }
        createdAt: { type: string, format: date-time }
    LiveGiftResult:
      type: object
      required: [gift, coins, bagQuantity]
      properties:
        gift: { $ref: '#/components/schemas/LiveGift' }
        coins:
          type: integer
          format: int64
          minimum: 0
          description: The caller's balance after the send (for a retry, the current balance).
        bagQuantity:
          type: integer
          minimum: 0
          description: What the caller's gift bag holds of this gift after the send (for a retry, now).
        luckyResult:
          description: v1.27-live (D132). Present only for a LUCKY gift (absent for every other send); the same for a retry.
          allOf:
            - $ref: '#/components/schemas/LuckyGiftResult'
        quip:
          description: v1.32-live (D154). Present only for a QUIPS gift (absent for a retry and every other send) — its slot in the room's quip queue, as the `quip` data message carries it.
          allOf:
            - $ref: '#/components/schemas/LiveQuip'
    LiveSoundRequest:
      type: object
      description: v1.32-live (D154). A free sound of the soundboard.
      required: [soundCode]
      additionalProperties: false
      properties:
        soundCode: { type: string, pattern: '^[a-z0-9][a-z0-9_]{0,39}$', description: "The code of an enabled free QUIPS gift.", example: quip_clap }
    LiveQuip:
      type: object
      description: |
        v1.32-live (D154, CONVENTIONS §10.33): one sound for the whole room, as the `quip` data message
        (topic `quip`) carries it. Every app plays it `delayMs` after it receives the message (the room's
        one queue: one quip at a time), with the line's `text` as a chat bubble while it plays.
      required: [id, roomId, kind, giftCode, soundKey, durationMs, text, free, sender, startsAt, delayMs, createdAt]
      properties:
        id: { type: string, format: uuid, description: "The gift send's id (GIFT), or a new id (SOUNDBOARD)." }
        roomId: { type: string, format: uuid }
        kind: { type: string, enum: [GIFT, SOUNDBOARD], description: "GIFT: sent from the gift panel; SOUNDBOARD: the host's or a moderator's free sound." }
        giftCode: { type: string, maxLength: 40, description: The QUIPS gift played (the app takes its name from its catalogue). }
        soundKey: { type: string, maxLength: 80 }
        durationMs: { type: integer, minimum: 200, maximum: 15000 }
        text: { type: [string, 'null'], maxLength: 200 }
        free: { type: boolean, description: A free quip or a soundboard sound. }
        sender: { $ref: '#/components/schemas/UserSummary' }
        startsAt: { type: string, format: date-time, description: When it starts in server time. }
        delayMs: { type: integer, minimum: 0, description: "How long after `createdAt` it starts (0: now)." }
        createdAt: { type: string, format: date-time }
    LuckyGiftWin:
      type: object
      description: v1.27-live (D132). The draws of one send that paid one multiplier.
      required: [multiplier, count, coins]
      properties:
        multiplier: { type: integer, minimum: 2, description: 'The multiplier paid (× the unit price).' }
        count: { type: integer, minimum: 1, description: "Draws that paid it." }
        coins: { type: integer, format: int64, minimum: 1, description: "multiplier × unitPrice × count." }
    LuckyGiftResult:
      type: object
      description: |
        v1.27-live (D132, CONVENTIONS §10.27): the draws of a lucky send. One draw per gift
        (`quantity × recipients`), each against the odds of `getLuckyGiftOdds` at the time of the send.
      required: [draws, wins, coinsWon, topMultiplier, downgraded, guaranteed]
      properties:
        draws: { type: integer, minimum: 1, description: "quantity × recipients." }
        wins:
          type: array
          maxItems: 32
          items: { $ref: '#/components/schemas/LuckyGiftWin' }
          description: The multipliers paid, ascending; empty when nothing was won.
        coinsWon: { type: integer, format: int64, minimum: 0, description: 'Coins credited to the caller (the sum of `wins[].coins`).' }
        topMultiplier: { type: [integer, 'null'], minimum: 2, description: "The largest multiplier paid, or null." }
        downgraded:
          type: integer
          minimum: 0
          description: Winning draws (and, v1.31-live, guaranteed draws) paid less, or nothing, because the day's protection budget was reached (CONVENTIONS §10.27).
        guaranteed:
          type: boolean
          description: |
            v1.31-live (D148). A draw of this send was paid by the guarantee (`LuckyGiftOdds.pity`):
            the caller had lost `pity.after` draws in a row and the draw paid `pity.multiplier`
            instead of nothing. The app shows the normal win with a small «ضمان» / "Guaranteed" label.
    LuckyGiftPity:
      type: object
      description: |
        v1.31-live (D148, CONVENTIONS §10.27). The per-sender guarantee: after `after` losing lucky
        draws in a row by one sender (any room, any session; a paid draw resets the count) that
        sender's next draw pays at least `multiplier` × the gift's unit price. The daily protection
        applies to it too: a guarantee that does not fit pays nothing and stays due on the next draw.
      required: [after, multiplier]
      properties:
        after: { type: integer, minimum: 1, maximum: 1000, description: "Losing draws in a row before the guarantee (owner: 15)." }
        multiplier: { type: integer, minimum: 2, description: "What the guaranteed draw pays at least (owner: ×5)." }
    LuckyGiftOutcome:
      type: object
      required: [multiplier, chancePerMillion, probability]
      properties:
        multiplier: { type: integer, minimum: 2, description: "The win is multiplier × the gift's unit price, in coins." }
        chancePerMillion: { type: integer, minimum: 1, maximum: 999999, description: "The exact chance of one draw, in draws per million." }
        probability: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1, description: "chancePerMillion / 1 000 000." }
    LuckyGiftEligibility:
      type: object
      required: [eligible, reason, ageConfirmed]
      properties:
        eligible: { type: boolean, description: "The caller may send lucky gifts now." }
        reason:
          type: [string, 'null']
          enum: [DISABLED, REGION_UNAVAILABLE, AGE_UNCONFIRMED, null]
          description: Why not (null when eligible). Unknown values mean "not eligible".
        ageConfirmed: { type: boolean, description: "The caller confirmed they are 18 or older (`confirmLuckyGiftAge`)." }
    LuckyGiftOdds:
      type: object
      description: v1.27-live (D132, CONVENTIONS §10.27). The published odds of lucky gifts (server configuration).
      required: [enabled, drawsPerGift, returnPercent, hostSharePercent, outcomes, noWinChancePerMillion, noWinProbability, bigWinMultiplier, pity, dailyProtection, dayTimeZone, minimumAge, caller]
      properties:
        enabled: { type: boolean, description: "Lucky gifts can be sent now (`LUCKY_GIFTS_ENABLED`)." }
        drawsPerGift: { type: integer, enum: [1], description: "Every gift of a send (quantity × recipients) is one draw." }
        returnPercent:
          type: number
          minimum: 0
          maximum: 100
          description: |
            The expected coins won per 100 coins of lucky gifts sent, before the daily protection
            (which can only lower it), four decimals. v1.31-live (D148): including the guarantee
            (`pity`) — exact, from the losing-streak chain (CONVENTIONS §10.27); without one it is
            Σ multiplier × probability × 100.
        hostSharePercent: { type: number, minimum: 0, maximum: 100, description: "The share of a lucky gift's value that counts for the recipients (charm), the live score, the boards and the Contribution list." }
        outcomes:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: '#/components/schemas/LuckyGiftOutcome' }
          description: The winning outcomes, by multiplier ascending.
        noWinChancePerMillion: { type: integer, minimum: 0, maximum: 1000000 }
        noWinProbability: { type: number, minimum: 0, maximum: 1 }
        bigWinMultiplier: { type: integer, minimum: 2, description: "Wins of at least this multiplier are announced to the room (`lucky-win`) and, v1.30-live, to every other live room (`lucky-ticker`)." }
        pity:
          description: v1.31-live (D148). The per-sender guarantee, or null when it is off.
          oneOf:
            - $ref: '#/components/schemas/LuckyGiftPity'
            - type: 'null'
        dailyProtection: { type: boolean, enum: [true], description: "The day's wins never exceed the configured return (85 %; v1.31-live: `returnPercent` is at most that) of the day's lucky-gift spend; a draw that would pass it pays a smaller multiplier that fits, or nothing (`LuckyGiftResult.downgraded`)." }
        dayTimeZone: { type: string, description: "The IANA time zone whose midnight starts the protection's day." }
        minimumAge: { type: integer, enum: [18] }
        caller:
          oneOf:
            - $ref: '#/components/schemas/LuckyGiftEligibility'
            - type: 'null'
          description: Null for a guest.
    LuckyGiftAgeConfirmationRequest:
      type: object
      required: [adult]
      additionalProperties: false
      properties:
        adult: { type: boolean, enum: [true], description: "The caller states they are 18 or older." }
    LuckyGiftAgeConfirmation:
      type: object
      required: [ageConfirmedAt]
      properties:
        ageConfirmedAt: { type: string, format: date-time, description: "When the caller first confirmed." }
security:
  - bearerAuth: []

      summary: "Find families by name or number (CP-018)"
      description: |
        CONVENTIONS §10.21. Families that are not disbanded, by points (highest first, then id).
        `q` filters by name (contains, case-insensitive after NFKC) and, when it is 1–8 digits,
        also by the exact family number. Without `q`: every family (the top families).
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 40 }
        - $ref: '#/components/parameters/Cursor'

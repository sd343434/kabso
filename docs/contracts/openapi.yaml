          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyCardPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      tags: [families]
      operationId: createFamily
      summary: "Create a family for 500 coins (CP-018)"
      description: |
        CONVENTIONS §10.21. The caller becomes its LEADER. Checks, in order: 400 for the body
        (`name`: the display-name text rules with 2–20 grapheme clusters and at most 40 code
        points, issues `too_short`, `too_long`, `invalid_format`, `reserved_term`); a retry with the
        same `clientId` → 200 with the family and the current balance (nothing charged again; 409
        `IDEMPOTENCY_CONFLICT` when that family was disbanded since); 503
        `MEDIA_UPLOADS_UNAVAILABLE` for an emblem while uploads are off; 409 `ALREADY_IN_FAMILY`;
        400 `emblemMediaId` / `invalid_value` (not the caller's unattached `FAMILY_EMBLEM` asset of
        the last 24 hours); 409 `FAMILY_NAME_TAKEN`; 409 `INSUFFICIENT_COINS` (nothing created or
        charged). The family, the membership and the charge (ledger `FAMILY_CREATE`) are one
        transaction; the 500 coins are the family's first points; the caller earns `FIRST_FAMILY`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFamilyRequest' }
            example: { name: عائلة النجوم, clientId: 0192f1d0-8888-7000-8000-000000000001 }
      responses:
        '201':
          description: Created and charged; the family and the balance after it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateFamilyResult' }
              example:
                family:
                  id: 0192f1d0-8888-7000-8000-000000000002
                  number: 48213907
                  name: عائلة النجوم
                  emblemUrl: null
                  level: 1
                  points: 500
                  memberCount: 1
                  capacity: 500
                  nextLevelPoints: 1000
                  leader: { id: 0192f1d0-5555-7000-8000-000000000006, username: sara, displayName: سارة, avatarUrl: null }
                  createdAt: '2026-10-26T18:30:00.000Z'
                  myRole: LEADER
                  myRequestId: null
                  coverUrl: null
                  tagline: null
                  pendingRequestCount: 0
                coins: 120
        '200':
          description: A retry (same `clientId`); the family and the current balance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateFamilyResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409':
          description: "`ALREADY_IN_FAMILY`, `FAMILY_NAME_TAKEN`, `INSUFFICIENT_COINS` or `IDEMPOTENCY_CONFLICT`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error:
                  code: FAMILY_NAME_TAKEN
                  message: That family name is taken.
                  requestId: 0192f1d0-7777-7000-8000-000000000008
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

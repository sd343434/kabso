                properties:
                  data:
                    type: array
                    minItems: 4
                    maxItems: 4
                    items: { $ref: '#/components/schemas/LevelSummary' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }


openapi: 3.1.0
info:
  title: Kabso Live API
  version: 1.2.0
  description: |
    Authoritative HTTP contract. Conventions (errors, pagination, auth, rate limits) are defined in
    CONVENTIONS.md and apply to every operation. Phase 1 scope: health, authentication, sessions,
    current user. Later phases append paths; existing shapes change only via contract proposal.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: health
    description: "Liveness and readiness probes (unversioned)."
  - name: auth
    description: "Registration, login, token refresh, email verification and password reset."
  - name: sessions
    description: "Management of the caller's device sessions."
  - name: me
    description: "The authenticated user."
  - name: users
    description: "Public user lookups."
paths:
  /health/live:
    get:
      tags: [health]
      operationId: healthLive
      summary: "Liveness probe"
      security: []
      responses:
        '200':
          description: Process is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /health/ready:
    get:
      tags: [health]
      operationId: healthReady
      summary: "Readiness probe (database, Redis)"
      security: []
      responses:
        '200':
          description: Dependencies (database, redis) reachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '503':
          description: A dependency is down.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: "Start a verify-first registration (never reveals whether the email exists)"
      description: |
        v1.2 (CONVENTIONS §6 "Verify-first registration"). Always 202 with a constant body when
        the request is valid and the username is free — whether or not the email is registered.
        No account and no tokens are created here; complete with `registerVerify`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '202':
          description: Verification code emailed if the address can register (constant body).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationPending' }
        '400': { $ref: '#/components/responses/Error' }
        '409':
          description: USERNAME_TAKEN only (taken by an account or a live pending registration).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/auth/register/verify:
    post:
      tags: [auth]
      operationId: registerVerify
      summary: "Complete registration with the emailed code; creates the account and a session"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterVerifyRequest' }
      responses:
        '201':
          description: Account created (email verified) and session started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '409':
          description: USERNAME_TAKEN (backstop race only).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: TOKEN_INVALID for every failure (unknown email, wrong/expired code, attempts exhausted, email registered meanwhile).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/auth/register/resend:
    post:
      tags: [auth]
      operationId: registerResend
      summary: "Re-send the registration code (always 202)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202':
          description: Always returned for a valid body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationPending' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: "Sign in with email or username"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: "Rotate the refresh token and issue a new token pair"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              additionalProperties: false
              properties:
                refreshToken: { type: string, minLength: 10, maxLength: 200 }
      responses:
        '200':
          description: New token pair (refresh token rotated).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: "Revoke the current session"
      description: Revokes the session identified by the access token.
      responses:
        '204': { description: Session revoked. }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/email/verify:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: "Confirm an email address with a single-use token"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 10, maxLength: 200 }
      responses:
        '204': { description: Email verified. }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/email/resend:
    post:
      tags: [auth]
      operationId: resendVerificationEmail
      summary: "Re-send the verification email"
      description: Re-sends the verification email for the authenticated user (no-op if verified).
      responses:
        '202': { description: Accepted. }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: "Request a password-reset email (non-enumerating)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202': { description: 'Always returned, whether or not the email exists.' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: "Set a new password with a reset token"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 10, maxLength: 200 }
                newPassword: { $ref: '#/components/schemas/Password' }
      responses:
        '204': { description: Password changed; all sessions revoked. }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: "List the caller's active sessions"
      responses:
        '200':
          description: Active sessions of the caller, newest first (bounded, max 50).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SessionInfo' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/sessions/{sessionId}:
    delete:
      tags: [sessions]
      operationId: revokeSession
      summary: "Revoke one of the caller's sessions"
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: A malformed id is treated as not found (404), never 400.
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: "Get the authenticated user"
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    patch:
      tags: [me]
      operationId: updateMe
      summary: "Update the caller's preferences (v1.2: locale)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              additionalProperties: false
              properties:
                locale: { $ref: '#/components/schemas/Locale' }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/users/username-availability:
    get:
      tags: [users]
      operationId: checkUsernameAvailability
      summary: "Check whether a username is available"
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Username' }
      responses:
        '200':
          description: Availability (reserved or invalid-but-well-formed names report false).
          content:
            application/json:
              schema:
                type: object
                required: [username, available]
                properties:
                  username: { type: string }
                  available: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error envelope (see CONVENTIONS.md §4).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, down] }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, example: VALIDATION_FAILED }
            message: { type: string }
            requestId: { type: string }
            details:
              type: array
              items:
                type: object
                required: [field, issue]
                properties:
                  field: { type: string }
                  issue: { type: string }
    Username:
      type: string
      minLength: 3
      maxLength: 30
      pattern: '^[a-z0-9](?:[a-z0-9._]{1,28}[a-z0-9])?$'
    Password:
      type: string
      minLength: 8
      maxLength: 128
    Locale:
      type: string
      enum: [ar, en]
    DeviceInfo:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100, example: Pixel 9 }
        platform: { type: string, enum: [android, ios, web, other] }
        appVersion: { type: string, maxLength: 32 }
    RegisterRequest:
      type: object
      required: [email, password, username, displayName]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { $ref: '#/components/schemas/Password' }
        username: { $ref: '#/components/schemas/Username' }
        displayName: { $ref: '#/components/schemas/DisplayName' }
        locale: { $ref: '#/components/schemas/Locale' }
        device: { $ref: '#/components/schemas/DeviceInfo' }
    DisplayName:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        v1.2 (CONVENTIONS §6): NFC, trimmed, 1–50 grapheme clusters and ≤ 100 code points.
        ZWNJ/ZWJ allowed between non-joiner, non-space characters; bidi controls, U+200B, U+2060,
        U+FEFF, C0/C1 rejected (`invalid_format`); > 3 consecutive combining marks rejected;
        reserved terms rejected (`reserved_term`).
    VerificationPending:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [verification_pending] }
    RegisterVerifyRequest:
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        code: { type: string, pattern: '^[0-9]{8}$' }
        device: { $ref: '#/components/schemas/DeviceInfo' }
    LoginRequest:
      type: object
      required: [identifier, password]
      additionalProperties: false
      properties:
        identifier:
          type: string
          minLength: 3
          maxLength: 254
          description: Email address or username.
        password: { type: string, minLength: 1, maxLength: 128 }
        device: { $ref: '#/components/schemas/DeviceInfo' }
    TokenPair:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        refreshTokenExpiresAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      required: [user, tokens]
      properties:
        user: { $ref: '#/components/schemas/Me' }
        tokens: { $ref: '#/components/schemas/TokenPair' }
    Me:
      type: object
      required: [id, email, emailVerified, username, displayName, locale, role, isPrivate, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        username: { $ref: '#/components/schemas/Username' }
        displayName: { type: string }
        bio: { type: [string, 'null'], maxLength: 300 }
        avatarUrl: { type: [string, 'null'], format: uri }
        locale: { $ref: '#/components/schemas/Locale' }
        role: { type: string, enum: [USER, ADMIN] }
        isPrivate: { type: boolean }
        createdAt: { type: string, format: date-time }
    SessionInfo:
      type: object
      required: [id, current, createdAt, lastUsedAt]
      properties:
        id: { type: string, format: uuid }
        current: { type: boolean }
        deviceName: { type: [string, 'null'] }
        platform: { type: [string, 'null'], enum: [android, ios, web, other, null] }
        appVersion: { type: [string, 'null'] }
        ipCountry: { type: [string, 'null'], description: Reserved; null in Phase 1. }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
security:
  - bearerAuth: []

        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: Not blocked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockState' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/me/blocks:
    get:
      tags: [safety]
      operationId: listBlocks
      summary: "Users the caller blocked, newest first"
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummaryPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/me/mutes:
    get:
      tags: [safety]
      operationId: listMutes
      summary: "Users the caller muted, newest first (CP-007)"
      description: Every muted account is listed, including one blocked either way, so it can be unmuted. Only the caller sees their own mutes.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummaryPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/users/{username}/mute:
    put:
      tags: [safety]
      operationId: muteUser
      summary: "Mute (idempotent): their posts and reposts leave the caller's feeds; they are not told"
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: Muted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MuteState' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [safety]
      operationId: unmuteUser
      summary: "Unmute (idempotent)"
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: Not muted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MuteState' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/posts/{postId}/hide:
    put:
      tags: [safety]
      operationId: hidePost
      summary: "Hide a post from the caller's feeds (idempotent)"
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '204': { description: Hidden. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [safety]
      operationId: unhidePost
      summary: "Undo hide (idempotent)"
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '204': { description: Not hidden. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/reports:
    post:
      tags: [safety]
      operationId: createReport
      summary: "Report a post, comment or user"
      description: One open report per reporter and target (a repeat returns the existing one with 200).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReportRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '200':
          description: Already reported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/me/privacy:
    get:
      tags: [safety]
      operationId: getPrivacy
      summary: "The caller's privacy settings"
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacySettings' }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      tags: [safety]
      operationId: updatePrivacy
      summary: "Change privacy settings (partial)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePrivacyRequest' }
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacySettings' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/admin/reports:
    get:
      tags: [admin-moderation]
      operationId: listAdminReports
      summary: "Open reports, oldest first (permission MODERATION)"
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [OPEN, ACTIONED, DISMISSED], default: OPEN }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/admin/reports/{reportId}/actions:
    post:
      tags: [admin-moderation]
      operationId: actOnReport
      summary: "Remove the target or dismiss the report (audited; every open report on the target closes)"
      parameters:
        - $ref: '#/components/parameters/ReportIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportActionRequest' }
      responses:
        '200':
          description: The report after the action.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque `page.nextCursor` from the previous page (CONVENTIONS §5, §10.4). Omit for the first page.
      schema: { type: string, minLength: 1, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    UsernamePath:
      name: username
      in: path
      required: true
      description: Lowercase username. A malformed value is treated as not found (404), never 400.
      schema: { type: string, minLength: 1, maxLength: 64 }
    RoomIdPath:
      name: roomId
      in: path
      required: true
      description: A malformed id is treated as not found (404), never 400.
      schema: { type: string, format: uuid }
    LevelCategoryPath:
      name: category
      in: path
      required: true
      description: "Category code in lower case (v1.4-levels draft). Anything else is 404."
      schema: { type: string, enum: [attractiveness, support, wizard, gaming] }
    LevelCategoryQuery:
      name: category
      in: query
      required: false
      description: Filter by category (lower case). Omit for all four.
      schema: { type: string, enum: [attractiveness, support, wizard, gaming] }
    LevelVersionIdPath:
      name: versionId
      in: path
      required: true
      description: A malformed id is treated as not found (404).
      schema: { type: string, format: uuid }
    UserIdPath:
      name: userId
      in: path
      required: true
      description: A malformed id is treated as not found (404).
      schema: { type: string, format: uuid }
    RunIdPath:
      name: runId
      in: path
      required: true
      description: A malformed id is treated as not found (404).
      schema: { type: string, format: uuid }
    EventIdPath:
      name: eventId
      in: path
      required: true
      description: A malformed id is treated as not found (404).
      schema: { type: string, format: uuid }
    PostIdPath:
      name: postId
      in: path
      required: true
      description: A malformed id is treated as not found (404).
      schema: { type: string, format: uuid }
    MediaIdPath:
      name: mediaId
      in: path
      required: true
      description: A malformed id is treated as not found (404).
      schema: { type: string, format: uuid }
    UploadIdPath:
      name: uploadId
      in: path
      required: true
      description: A malformed id is treated as not found (404).
      schema: { type: string, format: uuid }
    CommentIdPath:
      name: commentId
      in: path
      required: true
      description: A malformed id is treated as not found (404).
      schema: { type: string, format: uuid }
    ReportIdPath:
      name: reportId
      in: path
      required: true
      description: A malformed id is treated as not found (404).
      schema: { type: string, format: uuid }
    HashtagPath:
      name: tag
      in: path
      required: true
      description: Without `#`, any case (compared in NFC lower case). Malformed → 404.
      schema: { type: string, minLength: 1, maxLength: 100 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A UUID chosen by the client per logical operation (kept 24 hours).
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Error envelope (see CONVENTIONS.md §4).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, down] }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, example: VALIDATION_FAILED }
            message: { type: string }
            requestId: { type: string }
            details:
              type: array
              items:
                type: object
                required: [field, issue]
                properties:
                  field: { type: string }
                  issue: { type: string }
    Username:
      type: string
      minLength: 3
      maxLength: 30
      pattern: '^[a-z0-9](?:[a-z0-9._]{1,28}[a-z0-9])?$'
    Password:
      type: string
      minLength: 8
      maxLength: 128
    Locale:
      type: string
      enum: [ar, en]
    DeviceInfo:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100, example: Pixel 9 }
        platform: { type: string, enum: [android, ios, web, other] }
        appVersion: { type: string, maxLength: 32 }
    RegisterRequest:
      type: object
      required: [email, password, username, displayName]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { $ref: '#/components/schemas/Password' }
        username: { $ref: '#/components/schemas/Username' }
        displayName: { $ref: '#/components/schemas/DisplayName' }
        locale: { $ref: '#/components/schemas/Locale' }
        device: { $ref: '#/components/schemas/DeviceInfo' }
    DisplayName:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        v1.2 (CONVENTIONS §6): NFC, trimmed, 1–50 grapheme clusters and ≤ 100 code points.
        ZWNJ/ZWJ allowed between non-joiner, non-space characters; bidi controls, U+200B, U+2060,
        U+FEFF, C0/C1 rejected (`invalid_format`); > 3 consecutive combining marks rejected;
        reserved terms rejected (`reserved_term`). v1.3.1 (SEC-036): text hygiene over vendored
        Unicode 17.0.0 data rejects default-ignorable, Cc/Cf/Zl/Zp/Co/Cs/Cn code points and blank
        look-alikes (Hangul fillers, U+2800, U+FFFC, U+1D159), except inside an RGI emoji, ZWNJ/ZWJ
        as above, and one variation selector after a base character (`invalid_format`). Checked on
        write; stored names are not rewritten.
    VerificationPending:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [verification_pending] }
    RegisterVerifyRequest:
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        code: { type: string, pattern: '^[0-9]{8}$' }
        device: { $ref: '#/components/schemas/DeviceInfo' }
    LoginRequest:
      type: object
      required: [identifier, password]
      additionalProperties: false
      properties:
        identifier:
          type: string
          minLength: 3
          maxLength: 254
          description: Email address or username.
        password: { type: string, minLength: 1, maxLength: 128 }
        device: { $ref: '#/components/schemas/DeviceInfo' }
    TokenPair:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        refreshTokenExpiresAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      required: [user, tokens]
      properties:
        user: { $ref: '#/components/schemas/Me' }
        tokens: { $ref: '#/components/schemas/TokenPair' }
    Me:
      type: object
      required: [id, email, emailVerified, username, displayName, locale, role, isPrivate, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        username: { $ref: '#/components/schemas/Username' }
        displayName: { type: string }
        bio: { type: [string, 'null'], maxLength: 300 }
        avatarUrl: { type: [string, 'null'], format: uri }
        locale: { $ref: '#/components/schemas/Locale' }
        role: { type: string, enum: [USER, ADMIN] }
        isPrivate: { type: boolean }
        createdAt: { type: string, format: date-time }
    SessionInfo:
      type: object
      required: [id, current, createdAt, lastUsedAt]
      properties:
        id: { type: string, format: uuid }
        current: { type: boolean }
        deviceName: { type: [string, 'null'] }
        platform: { type: [string, 'null'], enum: [android, ios, web, other, null] }
        appVersion: { type: [string, 'null'] }
        ipCountry: { type: [string, 'null'], description: Reserved; null in Phase 1. }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
    PageInfo:
      type: object
      required: [nextCursor, hasMore]
      properties:
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    UserSummary:
      type: object
      description: Minimal public identity of a user (v1.3). Never contains an email.
      required: [id, username, displayName, avatarUrl]
      properties:
        id: { type: string, format: uuid }
        username: { $ref: '#/components/schemas/Username' }
        displayName: { type: string }
        avatarUrl: { type: [string, 'null'], format: uri }
    PublicProfile:
      type: object
      required: [id, username, displayName, avatarUrl, bio, isPrivate, followerCount, followingCount, isFollowing, isMuted, isSelf, liveRoomId]
      properties:
        id: { type: string, format: uuid }
        username: { $ref: '#/components/schemas/Username' }
        displayName: { type: string }
        avatarUrl: { type: [string, 'null'], format: uri }
        bio: { type: [string, 'null'], maxLength: 300 }
        isPrivate:
          type: boolean
          description: When true the user cannot be followed in v1.3 (no follow requests yet); the client hides Follow.
        followerCount: { type: integer, minimum: 0 }
        followingCount: { type: integer, minimum: 0 }
        isFollowing:
          type: boolean
          description: Whether the caller follows this user (always false when isSelf).
        isMuted:
          type: boolean
          description: "(v1.5-social, CP-007) Whether the caller muted this user (always false when isSelf). Only the caller sees their own mute; the muted user is never told."
        isSelf: { type: boolean }
        liveRoomId:
          type: [string, 'null']
          format: uuid
          description: The user's LIVE room with a fresh heartbeat, else null.
    FollowState:
      type: object
      required: [isFollowing, followerCount]
      properties:
        isFollowing: { type: boolean }
        followerCount:
          type: integer
          minimum: 0
          description: The target's follower count after the operation.
    CategorySlug:
      type: string
      minLength: 2
      maxLength: 32
      pattern: '^[a-z0-9-]{2,32}$'
    LiveCategory:
      type: object
      required: [slug, name]
      properties:
        slug: { $ref: '#/components/schemas/CategorySlug' }
        name:
          type: string
          maxLength: 40
          description: Localized by `Accept-Language` (ar|en), else the caller's stored locale (CONVENTIONS §10.1).
    LiveConfig:
      type: object
      required: [hostingEnabled, heartbeatIntervalSeconds, heartbeatStaleAfterSeconds]
      properties:
        hostingEnabled:
          type: boolean
          description: Server config `LIVE_HOSTING_ENABLED` (default false until a media provider exists, B1).
        heartbeatIntervalSeconds: { type: integer, minimum: 1, example: 15 }
        heartbeatStaleAfterSeconds: { type: integer, minimum: 1, example: 45 }
    LiveRoomMode:
      type: string
      enum: [SOLO, PK, MULTI]
      description: Only SOLO rooms exist in v1.3. Clients render an unrecognised future value as SOLO.
    LiveRoomTitle:
      type: string
      minLength: 1
      maxLength: 160
      description: |
        v1.3 (CONVENTIONS §10.3): NFC, trimmed, 1–80 grapheme clusters and ≤ 160 code points.
        The displayName character-hygiene rules apply (control/bidi/zero-width bans, ZWNJ/ZWJ
        placement, zalgo cap, at least one letter/digit/emoji) → `invalid_format`, including the
        v1.3.1 text-hygiene rules (CONVENTIONS §6, SEC-036). The reserved-term/brand rule and the
        mixed-script rule do **not** apply.
    LiveRoomSummary:
      type: object
      required: [id, title, mode, viewerCount, startedAt, coverUrl, category, host]
      properties:
        id: { type: string, format: uuid }
        title: { $ref: '#/components/schemas/LiveRoomTitle' }
        mode: { $ref: '#/components/schemas/LiveRoomMode' }
        viewerCount:
          type: integer
          minimum: 0
          description: Always 0 in v1.3 (no realtime presence yet); the card shows the "New" chip.
        startedAt: { type: string, format: date-time }
        coverUrl:
          type: [string, 'null']
          format: uri
          description: Always null in v1.3 (no upload yet); the card falls back to the host avatar.
        category:
          description: Null when the room has no category.
          oneOf:
            - { $ref: '#/components/schemas/LiveCategory' }
            - { type: 'null' }
        host: { $ref: '#/components/schemas/UserSummary' }
    LiveRoom:
      allOf:
        - { $ref: '#/components/schemas/LiveRoomSummary' }
        - type: object
          required: [status, endedAt, endReason]
          properties:
            status: { type: string, enum: [LIVE, ENDED] }
            endedAt: { type: [string, 'null'], format: date-time }
            endReason:
              type: [string, 'null']
              enum: [HOST_ENDED, HEARTBEAT_TIMEOUT, HOST_SUSPENDED, ADMIN, null]
    LiveRoomPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LiveRoomSummary' }
        page: { $ref: '#/components/schemas/PageInfo' }
    StartLiveRoomRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { $ref: '#/components/schemas/LiveRoomTitle' }
        categorySlug: { $ref: '#/components/schemas/CategorySlug' }
    # ---- v1.4-levels (DRAFT, CP-005) ------------------------------------------------------
    LevelCategoryCode:
      type: string
      enum: [ATTRACTIVENESS, SUPPORT, WIZARD, GAMING]
    PointsAmount:
      description: A whole number of points (or of source units) as a decimal string, so 64-bit values survive JSON.
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
    LevelMultiplier:
      description: Points per source unit, > 0, at most 6 decimals (e.g. "1", "0.5").
      type: string
      pattern: '^(0|[1-9][0-9]{0,6})(\.[0-9]{1,6})?$'
    LevelValueUnit:
      type: string
      enum: [COIN]
    LevelReversalPolicy:
      type: string
      enum: [REVERSE_POINTS, KEEP_LEVEL]
    LevelRecalculation:
      type: string
      enum: [PRESERVE_POINTS, RECOMPUTE_FROM_LEDGER]
    LevelIconKey:
      type: [string, 'null']
      maxLength: 64
      pattern: '^[a-z0-9_]{1,64}$'
    LevelBrief:
      type: object
      required: [levelNumber, name, requiredPoints, iconKey]
      properties:
        levelNumber: { type: integer, minimum: 1, maximum: 200 }
        name: { type: string, maxLength: 40 }
        requiredPoints: { $ref: '#/components/schemas/PointsAmount' }
        iconKey: { $ref: '#/components/schemas/LevelIconKey' }
    LevelSummary:
      type: object
      required:
        [category, status, name, description, points, level, nextLevel, pointsToNext, progressPercent, maxLevel, versionNumber]
      properties:
        category: { $ref: '#/components/schemas/LevelCategoryCode' }
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
          description: UNAVAILABLE = disabled or no published configuration; level fields are null.
        name: { type: string, maxLength: 40 }
        description: { type: string, maxLength: 200 }
        points: { $ref: '#/components/schemas/PointsAmount' }
        level:
          oneOf:
            - { $ref: '#/components/schemas/LevelBrief' }
            - { type: 'null' }
        nextLevel:
          oneOf:
            - { $ref: '#/components/schemas/LevelBrief' }
            - { type: 'null' }
        pointsToNext:
          oneOf:
            - { $ref: '#/components/schemas/PointsAmount' }
            - { type: 'null' }
        progressPercent:
          description: Progress from the current level's threshold to the next one, 0–100 with one decimal; 100 at the top level; null when UNAVAILABLE.
          type: [number, 'null']
          minimum: 0
          maximum: 100
        maxLevel: { type: boolean }
        versionNumber: { type: [integer, 'null'], minimum: 1 }
    PublicLevel:
      type: object
      required: [category, status, name, level]
      additionalProperties: false
      properties:
        category: { $ref: '#/components/schemas/LevelCategoryCode' }
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
        name: { type: string, maxLength: 40 }
        level:
          oneOf:
            - { $ref: '#/components/schemas/LevelBrief' }
            - { type: 'null' }
    LevelDetail:
      allOf:
        - { $ref: '#/components/schemas/LevelSummary' }
        - type: object
          required: [levels]
          properties:
            levels:
              type: array
              maxItems: 200
              items: { $ref: '#/components/schemas/LevelBrief' }
    LevelTransitionReason:
      type: string
      enum: [EARNED, REVERSED, ADJUSTED, CONFIG_PUBLISHED, RECALCULATED]
    LevelTransition:
      type: object
      required: [id, category, previousLevel, newLevel, points, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/LevelCategoryCode' }
        previousLevel: { type: [integer, 'null'], minimum: 1 }
        newLevel: { type: [integer, 'null'], minimum: 1 }
        points: { $ref: '#/components/schemas/PointsAmount' }
        reason: { $ref: '#/components/schemas/LevelTransitionReason' }
        createdAt: { type: string, format: date-time }
    LevelTransitionPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LevelTransition' }
        page: { $ref: '#/components/schemas/PageInfo' }
    PointsEntryType:
      type: string
      enum: [EARN, REVERSAL, ADJUSTMENT]
    PointsSourceType:
      description: GIFT_RECEIVED/GIFT_SENT/LUCKY_GIFT_SENT/GAME_SPEND for activity; ADMIN for manual adjustments; CONFIG for recalculations.
      type: string
      enum: [GIFT_RECEIVED, GIFT_SENT, LUCKY_GIFT_SENT, GAME_SPEND, ADMIN, CONFIG]
    PointsEntry:
      type: object
      required: [id, category, entryType, sourceType, pointsDelta, createdAt]
      properties:
        id: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/LevelCategoryCode' }
        entryType: { $ref: '#/components/schemas/PointsEntryType' }
        sourceType: { $ref: '#/components/schemas/PointsSourceType' }
        pointsDelta: { $ref: '#/components/schemas/PointsAmount' }
        createdAt: { type: string, format: date-time }
    PointsEntryPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PointsEntry' }
        page: { $ref: '#/components/schemas/PageInfo' }
    AdminLevelDefinition:
      type: object
      required: [levelNumber, nameAr, nameEn, requiredPoints, iconKey]
      additionalProperties: false
      properties:
        levelNumber: { type: integer, minimum: 1, maximum: 200 }
        nameAr: { type: string, minLength: 1, maxLength: 40 }
        nameEn: { type: string, minLength: 1, maxLength: 40 }
        requiredPoints: { $ref: '#/components/schemas/PointsAmount' }
        iconKey: { $ref: '#/components/schemas/LevelIconKey' }
    AdminLevelVersion:
      type: object
      required:
        [id, category, versionNumber, status, multiplier, valueUnit, reversalPolicy, luckyGiftsCountAsSupport, levels, createdAt, createdBy, publishedAt, publishedBy]
      properties:
        id: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/LevelCategoryCode' }
        versionNumber: { type: integer, minimum: 1 }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        multiplier:
          oneOf:
            - { $ref: '#/components/schemas/LevelMultiplier' }
            - { type: 'null' }
        valueUnit:
          oneOf:
            - { $ref: '#/components/schemas/LevelValueUnit' }
            - { type: 'null' }
        reversalPolicy: { $ref: '#/components/schemas/LevelReversalPolicy' }
        luckyGiftsCountAsSupport: { type: boolean }
        levels:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/AdminLevelDefinition' }
        createdAt: { type: string, format: date-time }
        createdBy: { type: [string, 'null'], format: uuid }
        publishedAt: { type: [string, 'null'], format: date-time }
        publishedBy: { type: [string, 'null'], format: uuid }
    AdminLevelCategory:
      type: object
      required: [category, nameAr, nameEn, descriptionAr, descriptionEn, enabled, published, draftCount, updatedAt]
      properties:
        category: { $ref: '#/components/schemas/LevelCategoryCode' }
        nameAr: { type: string, maxLength: 40 }
        nameEn: { type: string, maxLength: 40 }
        descriptionAr: { type: string, maxLength: 200 }
        descriptionEn: { type: string, maxLength: 200 }
        enabled: { type: boolean }
        published:
          oneOf:
            - { $ref: '#/components/schemas/AdminLevelVersion' }
            - { type: 'null' }
        draftCount: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    UpdateLevelCategoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled: { type: boolean }
        nameAr: { type: string, minLength: 1, maxLength: 40 }
        nameEn: { type: string, minLength: 1, maxLength: 40 }
        descriptionAr: { type: string, minLength: 1, maxLength: 200 }
        descriptionEn: { type: string, minLength: 1, maxLength: 200 }
    CreateLevelVersionRequest:
      type: object
      additionalProperties: false
      properties:
        copyFromVersionId: { type: [string, 'null'], format: uuid }
    LevelVersionInput:
      type: object
      required: [multiplier, valueUnit, reversalPolicy, levels]
      additionalProperties: false
      properties:
        multiplier: { $ref: '#/components/schemas/LevelMultiplier' }
        valueUnit: { $ref: '#/components/schemas/LevelValueUnit' }
        reversalPolicy: { $ref: '#/components/schemas/LevelReversalPolicy' }
        luckyGiftsCountAsSupport: { type: boolean, default: false }
        levels:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/AdminLevelDefinition' }
    LevelValidationResult:
      type: object
      required: [valid, issues]
      properties:
        valid: { type: boolean }
        issues:
          type: array
          items:
            type: object
            required: [field, issue]
            properties:
              field: { type: string }
              issue: { type: string }
    LevelPreview:
      type: object
      required: [versionId, recalculation, totalUsers, usersChangingLevel, distribution]
      properties:
        versionId: { type: string, format: uuid }
        recalculation: { $ref: '#/components/schemas/LevelRecalculation' }
        totalUsers: { type: integer, minimum: 0 }
        usersChangingLevel: { type: integer, minimum: 0 }
        distribution:
          type: array
          maxItems: 200
          items:
            type: object
            required: [levelNumber, users]
            properties:
              levelNumber: { type: integer, minimum: 1 }
              users: { type: integer, minimum: 0 }
    PublishLevelVersionRequest:
      type: object
      required: [recalculation]
      additionalProperties: false
      properties:
        recalculation: { $ref: '#/components/schemas/LevelRecalculation' }
    AdminPointsEntry:
      allOf:
        - { $ref: '#/components/schemas/PointsEntry' }
        - type: object
          required: [sourceTransactionId, sourceValue, multiplierUsed, versionNumber, reason, createdBy]
          properties:
            sourceTransactionId: { type: [string, 'null'], maxLength: 128 }
            sourceValue:
              oneOf:
                - { $ref: '#/components/schemas/PointsAmount' }
                - { type: 'null' }
            multiplierUsed:
              oneOf:
                - { $ref: '#/components/schemas/LevelMultiplier' }
                - { type: 'null' }
            versionNumber: { type: [integer, 'null'], minimum: 1 }
            reason: { type: [string, 'null'], maxLength: 500 }
            createdBy: { type: [string, 'null'], format: uuid }
    AdminUserLevelState:
      allOf:
        - { $ref: '#/components/schemas/LevelSummary' }
        - type: object
          required: [lifetimeEarnedPoints, recentEntries, recentTransitions]
          properties:
            lifetimeEarnedPoints: { $ref: '#/components/schemas/PointsAmount' }
            recentEntries:
              type: array
              maxItems: 20
              items: { $ref: '#/components/schemas/AdminPointsEntry' }
            recentTransitions:
              type: array
              maxItems: 20
              items: { $ref: '#/components/schemas/LevelTransition' }
    AdminUserLevels:
      type: object
      required: [userId, data]
      properties:
        userId: { type: string, format: uuid }
        data:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/AdminUserLevelState' }
    RecalculateLevelRequest:
      type: object
      required: [category]
      additionalProperties: false
      properties:
        category: { $ref: '#/components/schemas/LevelCategoryCode' }
    LevelAdjustmentRequest:
      type: object
      required: [category, pointsDelta, reason]
      additionalProperties: false
      properties:
        category: { $ref: '#/components/schemas/LevelCategoryCode' }
        pointsDelta:
          description: Non-zero whole number of points (negative removes points).
          type: string
          pattern: '^-?[1-9][0-9]{0,18}$'
        reason: { type: string, minLength: 3, maxLength: 500 }
    AdminLevelAdjustmentResult:
      type: object
      required: [entry, levels]
      properties:
        entry: { $ref: '#/components/schemas/AdminPointsEntry' }
        levels: { $ref: '#/components/schemas/AdminUserLevels' }
    StartLevelReconciliationRequest:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [DRY_RUN, REPAIR] }
        category:
          oneOf:
            - { $ref: '#/components/schemas/LevelCategoryCode' }
            - { type: 'null' }
    LevelReconciliationRun:
      type: object
      required:
        [id, category, mode, status, startedAt, completedAt, eventsInspected, statesInspected, failedEvents, unprocessedEvents, stateMismatches, corrected, errors, initiatedBy]
      properties:
        id: { type: string, format: uuid }
        category:
          oneOf:
            - { $ref: '#/components/schemas/LevelCategoryCode' }
            - { type: 'null' }
        mode: { type: string, enum: [DRY_RUN, REPAIR] }
        status: { type: string, enum: [RUNNING, COMPLETED, FAILED] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        eventsInspected: { type: integer, minimum: 0 }
        statesInspected: { type: integer, minimum: 0 }
        failedEvents: { type: integer, minimum: 0 }
        unprocessedEvents: { type: integer, minimum: 0 }
        stateMismatches: { type: integer, minimum: 0 }
        corrected: { type: integer, minimum: 0 }
        errors:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 300 }
        initiatedBy: { type: [string, 'null'], format: uuid }
    LevelReconciliationPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LevelReconciliationRun' }
        page: { $ref: '#/components/schemas/PageInfo' }
    LevelEventStatus:
      type: string
      enum: [PENDING, PROCESSED, SKIPPED, FAILED]
    LevelSourceEvent:
      type: object
      required: [id, type, sourceTransactionId, status, attempts, lastError, receivedAt, processedAt]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [GIFT_COMMITTED, GAME_SPEND_COMMITTED, GIFT_REVERSED, GAME_SPEND_REVERSED]
        sourceTransactionId: { type: string, maxLength: 128 }
        status: { $ref: '#/components/schemas/LevelEventStatus' }
        attempts: { type: integer, minimum: 0 }
        lastError: { type: [string, 'null'], maxLength: 300 }
        receivedAt: { type: string, format: date-time }
        processedAt: { type: [string, 'null'], format: date-time }
    LevelSourceEventPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LevelSourceEvent' }
        page: { $ref: '#/components/schemas/PageInfo' }
    LevelCategoryReport:
      type: object
      required: [category, enabled, publishedVersionNumber, levelCount, multiplier, valueUnit, usersPerLevel, recentLevelUps, lastReconciliation]
      properties:
        category: { $ref: '#/components/schemas/LevelCategoryCode' }
        enabled: { type: boolean }
        publishedVersionNumber: { type: [integer, 'null'], minimum: 1 }
        levelCount: { type: [integer, 'null'], minimum: 1 }
        multiplier:
          oneOf:
            - { $ref: '#/components/schemas/LevelMultiplier' }
            - { type: 'null' }
        valueUnit:
          oneOf:
            - { $ref: '#/components/schemas/LevelValueUnit' }
            - { type: 'null' }
        usersPerLevel:
          type: array
          maxItems: 200
          items:
            type: object
            required: [levelNumber, users]
            properties:
              levelNumber: { type: integer, minimum: 1 }
              users: { type: integer, minimum: 0 }
        recentLevelUps:
          type: array
          maxItems: 10
          items:
            allOf:
              - { $ref: '#/components/schemas/LevelTransition' }
              - type: object
                required: [userId]
                properties:
                  userId: { type: string, format: uuid }
        lastReconciliation:
          oneOf:
            - { $ref: '#/components/schemas/LevelReconciliationRun' }
            - { type: 'null' }
    LevelAuditLog:
      type: object
      required: [id, action, actorUserId, targetType, targetId, metadata, createdAt]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, maxLength: 64 }
        actorUserId: { type: [string, 'null'], format: uuid }
        targetType: { type: [string, 'null'], maxLength: 32 }
        targetId: { type: [string, 'null'], maxLength: 64 }
        metadata: { type: [object, 'null'] }
        createdAt: { type: string, format: date-time }
    LevelAuditLogPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LevelAuditLog' }
        page: { $ref: '#/components/schemas/PageInfo' }
    MediaKind:
      type: string
      enum: [POST_IMAGE]
      description: M1 has images for posts only; video kinds arrive with M2 (CP-006 §2).
    CreateMediaUploadRequest:
      type: object
      additionalProperties: false
      required: [kind, contentType, byteSize]
      properties:
        kind: { $ref: '#/components/schemas/MediaKind' }
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
          description: HEIC/HEIF is not accepted; the app converts such photos to JPEG on the device.
        byteSize: { type: integer, minimum: 1, maximum: 15728640 }
    MediaUpload:
      type: object
      required: [uploadId, uploadUrl, method, headers, expiresAt]
      properties:
        uploadId: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        method: { type: string, enum: [PUT] }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Send exactly these headers with the bytes (Content-Type, Content-Length).
        expiresAt: { type: string, format: date-time }
    MediaAsset:
      type: object
      required: [id, type, status, width, height, blurhash, url, thumbUrl]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [IMAGE] }
        status: { type: string, enum: [READY] }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        blurhash: { type: [string, 'null'] }
        url:
          type: string
          format: uri
          description: WebP, at most 1 080 px on the long side.
        thumbUrl:
          type: string
          format: uri
          description: WebP, at most 320 px on the long side.
    PostText:
      type: string
      maxLength: 2200
      description: After NFC and trim; control, bidi-override and zero-width characters are refused (§11.2).
    PostSettings:
      type: object
      additionalProperties: false
      required: [commentsEnabled, whoCanComment, hideLikeCount]
      properties:
        commentsEnabled: { type: boolean }
        whoCanComment: { type: string, enum: [EVERYONE, FOLLOWERS, NOBODY] }
        hideLikeCount:
          type: boolean
          description: "Others see `likeCount: null` and cannot list likes."
    PostSettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        commentsEnabled: { type: boolean }
        whoCanComment: { type: string, enum: [EVERYONE, FOLLOWERS, NOBODY] }
        hideLikeCount: { type: boolean }
    PostStatus:
      type: string
      enum: [DRAFT, SCHEDULED, PUBLISHED]
    CreatePostRequest:
      type: object
      additionalProperties: false
      properties:
        text: { $ref: '#/components/schemas/PostText' }
        mediaIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uuid }
        location: { type: [string, 'null'], maxLength: 80 }
        status: { allOf: [{ $ref: '#/components/schemas/PostStatus' }], default: PUBLISHED }
        publishAt: { type: string, format: date-time, description: Required for SCHEDULED; forbidden otherwise. }
        settings: { $ref: '#/components/schemas/PostSettingsPatch' }
    UpdatePostRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        text: { $ref: '#/components/schemas/PostText' }
        location: { type: [string, 'null'], maxLength: 80 }
        status: { $ref: '#/components/schemas/PostStatus' }
        publishAt: { type: string, format: date-time }
        settings: { $ref: '#/components/schemas/PostSettingsPatch' }
    Post:
      type: object
      required: [id, format, author, text, media, location, hashtags, mentions, status, createdAt, publishAt, publishedAt, editedAt, pinned, likeCount, commentCount, shareCount, repostCount, viewCount, viewerHasLiked, viewerHasSaved, viewerHasReposted, isSelf, settings, moderation, repostedBy]
      properties:
        id: { type: string, format: uuid }
        format: { type: string, enum: [POST], description: REEL arrives with M2. }
        author: { $ref: '#/components/schemas/UserSummary' }
        text: { type: string }
        media:
          type: array
          items: { $ref: '#/components/schemas/MediaAsset' }
        location: { type: [string, 'null'] }
        hashtags:
          type: array
          items: { type: string }
        mentions:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
        status: { $ref: '#/components/schemas/PostStatus' }
        createdAt: { type: string, format: date-time }
        publishAt: { type: [string, 'null'], format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
        editedAt: { type: [string, 'null'], format: date-time }
        pinned: { type: boolean }
        likeCount:
          type: [integer, 'null']
          minimum: 0
          description: null for others when the author hides it.
        commentCount: { type: integer, minimum: 0 }
        shareCount: { type: integer, minimum: 0 }
        repostCount: { type: integer, minimum: 0 }
        viewCount: { type: integer, minimum: 0 }
        viewerHasLiked: { type: boolean }
        viewerHasSaved: { type: boolean }
        viewerHasReposted: { type: boolean }
        isSelf: { type: boolean }
        settings: { $ref: '#/components/schemas/PostSettings' }
        moderation:
          type: string
          enum: [VISIBLE, PENDING]
          description: PENDING (author only) while its images wait for moderation (CP-006 Q2).
        repostedBy:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
          description: In the following feed, the followed account that reposted it.
    PostPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Post' }
        page: { $ref: '#/components/schemas/PageInfo' }
    UserSummaryPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
        page: { $ref: '#/components/schemas/PageInfo' }
    LikeState:
      type: object
      required: [liked, likeCount]
      properties:
        liked: { type: boolean }
        likeCount: { type: [integer, 'null'], minimum: 0 }
    SaveState:
      type: object
      required: [saved]
      properties:
        saved: { type: boolean }
    RepostState:
      type: object
      required: [reposted, repostCount]
      properties:
        reposted: { type: boolean }
        repostCount: { type: integer, minimum: 0 }
    ShareState:
      type: object
      required: [shareCount]
      properties:
        shareCount: { type: integer, minimum: 0 }
    RecordViewsRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [postId, watchedMs]
            properties:
              postId: { type: string, format: uuid }
              watchedMs: { type: integer, minimum: 0, maximum: 3600000 }
    Comment:
      type: object
      required: [id, postId, author, text, createdAt, likeCount, viewerHasLiked, replyCount, parentId, mentions, pinned, canDelete]
      properties:
        id: { type: string, format: uuid }
        postId: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/UserSummary' }
        text: { type: string, minLength: 1, maxLength: 500 }
        createdAt: { type: string, format: date-time }
        likeCount: { type: integer, minimum: 0 }
        viewerHasLiked: { type: boolean }
        replyCount: { type: integer, minimum: 0 }
        parentId: { type: [string, 'null'], format: uuid }
        mentions:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
        pinned: { type: boolean }
        canDelete:
          type: boolean
          description: The caller wrote it or owns the post.
    CommentPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
        page: { $ref: '#/components/schemas/PageInfo' }
    CreateCommentRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }
        parentId: { type: string, format: uuid }
    Hashtag:
      type: object
      required: [tag, postCount]
      properties:
        tag: { type: string }
        postCount: { type: integer, minimum: 0 }
    SearchPage:
      type: object
      required: [type, data, page]
      properties:
        type: { type: string, enum: [users, hashtags, posts] }
        data:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/UserSummary'
              - $ref: '#/components/schemas/Hashtag'
              - $ref: '#/components/schemas/Post'
        page: { $ref: '#/components/schemas/PageInfo' }
    BlockState:
      type: object
      required: [blocked]
      properties:
        blocked: { type: boolean }
    MuteState:
      type: object
      required: [muted]
      properties:
        muted: { type: boolean }
    ReportReason:
      type: string
      enum: [SPAM, NUDITY, VIOLENCE, HATE, HARASSMENT, ILLEGAL, OTHER]
    CreateReportRequest:
      type: object
      additionalProperties: false
      required: [targetType, targetId, reason]
      properties:
        targetType: { type: string, enum: [POST, COMMENT, USER] }
        targetId:
          type: string
          minLength: 1
          maxLength: 64
          description: A post or comment id, or a username for USER.
        reason: { $ref: '#/components/schemas/ReportReason' }
        note: { type: string, maxLength: 500 }
    Report:
      type: object
      required: [id, targetType, targetId, reason, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        targetType: { type: string, enum: [POST, COMMENT, USER] }
        targetId: { type: string }
        reason: { $ref: '#/components/schemas/ReportReason' }
        note: { type: [string, 'null'] }
        status: { type: string, enum: [OPEN, ACTIONED, DISMISSED] }
        createdAt: { type: string, format: date-time }
        reporter:
          description: Admin views only.
          $ref: '#/components/schemas/UserSummary'
        resolvedAt: { type: [string, 'null'], format: date-time }
    ReportPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Report' }
        page: { $ref: '#/components/schemas/PageInfo' }
    ReportActionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [REMOVE_TARGET, DISMISS] }
        note: { type: string, maxLength: 500 }
    PrivacySettings:
      type: object
      required: [whoCanMention, defaultWhoCanComment]
      properties:
        whoCanMention: { type: string, enum: [EVERYONE, FOLLOWING, NOBODY] }
        defaultWhoCanComment: { type: string, enum: [EVERYONE, FOLLOWERS, NOBODY] }
    UpdatePrivacyRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        whoCanMention: { type: string, enum: [EVERYONE, FOLLOWING, NOBODY] }
        defaultWhoCanComment: { type: string, enum: [EVERYONE, FOLLOWERS, NOBODY] }
security:
  - bearerAuth: []

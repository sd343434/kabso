openapi: 3.1.0
info:
  title: Kabso Live API
  version: 1.3.1
  description: |
    Authoritative HTTP contract. Conventions (errors, pagination, auth, rate limits) are defined in
    CONVENTIONS.md and apply to every operation. Phase 1 scope: health, authentication, sessions,
    current user. v1.3 (Phase 2 slice 1, KL-036) adds live discovery, the host lifecycle of live
    rooms (behind `LIVE_HOSTING_ENABLED`), public profiles and follow (CONVENTIONS §10; data design
    in DB_PHASE2_DISCOVERY.md). Later phases append paths; existing shapes change only via
    contract proposal. **v1.4-levels (DRAFT, CP-005)** adds the four level systems (user and
    admin paths tagged `levels` / `admin-levels`); it is additive and awaits formal approval.
    **v1.5-social (DRAFT, CP-006 M1)** adds media upload, posts, feeds, likes, saves, reposts,
    views, comments, hashtags, search, block / mute / hide, reports and privacy settings
    (CONVENTIONS §11); additive, owner-approved scope (D87). **CP-008 (D91, M3)** adds photo
    stories: tray, viewer, seen, viewers and archive (tag `stories`, CONVENTIONS §11.9).
    **CP-009 (D92, M4)** adds in-app notifications: inbox, unread count, mark read and per-type
    settings (tag `notifications`, CONVENTIONS §11.10).
    **CP-010 (D93, Live L1, DRAFT v1.6-live)** adds live video: media access tokens for hosts,
    viewers and guests without an account, the real viewer count, the host's viewer list and
    guests switch, the hosting permission (admin-granted until agencies and identity checks,
    L1b) and `LIVE_ROOM` reports (CONVENTIONS §10.7).
    **CP-011 (D94, DRAFT v1.7-live)** adds multi-guest video and audio rooms with seats: asking
    for a seat, invitations, the host's and moderators' controls (mute, take off, lock, seat
    count), room moderators and room themes (CONVENTIONS §10.9).
    **CP-012 (D95, DRAFT v1.8-live)** adds taps and the room score (CONVENTIONS §10.10).
    **CP-013 (D96, DRAFT v1.9-live)** adds the room chat: sending and reading messages, live
    delivery as media data messages, the host's and moderators' delete and chat mute, turning
    the chat off, and `LIVE_CHAT_MESSAGE` reports (CONVENTIONS §10.11).
    **CP-014 (D97, DRAFT v1.10-live)** lets the host edit a live's title, category and topic
    while live, adds the topic to rooms and hub cards, and a public Contribution list of a live
    (CONVENTIONS §10.12).
    **CP-015 (D98, DRAFT v1.11-live)** adds the host's live cover: one square picture, reused by
    every live, set from a `LIVE_COVER` upload and shown on hub cards and in the room
    (CONVENTIONS §10.13). It stays behind `MEDIA_UPLOADS_ENABLED` like every upload.
    **CP-016 part B (D99, DRAFT v1.12-live)** adds the host's blocked words, masked in the chat of
    every live of that host (CONVENTIONS §10.14).
    **CP-016 part A (D99, DRAFT v1.13-live)** adds the popularity board: hosts ranked by the
    points their lives received this hour, today or this week, one region for everyone
    (CONVENTIONS §10.15).
    **CP-016 part C (D99, DRAFT v1.14-live)** adds the live schedule: a host announces upcoming
    lives and their followers get a `LIVE_SCHEDULED_SOON` notification 15 minutes before
    (CONVENTIONS §10.16).
    **CP-016 part G (D99, DRAFT v1.15-live)** adds the host's public room number
    (`LiveRoom.roomNumber`, CONVENTIONS §10.17).
    **v1.16-live (DRAFT, owner D100)** changes the `AUDIO` seat counts to 6, 9, 15, 20 or 25 (host
    included) and seat indexes to 1 … 24 (CONVENTIONS §10.9).
    **CP-016 part D (D101, DRAFT v1.17-live)** adds the room level (`LiveRoom.roomLevel`, the
    host's charm level); taps give the host charm points (`LIVE_TAPS`, CONVENTIONS §10.18).
    **v1.18-live (DRAFT, owner D103)** changes the `AUDIO` seat counts to 5, 10, 15, 20 or 25
    (host included; seat indexes stay 1 … 24, CONVENTIONS §10.9).
    **CP-017 (D104, DRAFT v1.19-live)** adds coins (`GET /wallet/me`; granted only by an admin on
    the server, purchases still B5), bullet messages (15 coins, shown in every live as data
    message `bullet`, code `INSUFFICIENT_COINS`) and voice clips (≤ 30 s) and images in the live
    chat that vanish 60 s after sending (CONVENTIONS §10.19, §10.11, §11.1).
    **v1.20-live (DRAFT, owner D105)** lets the host and the room's moderators kick a person out
    of a live (audio and video) until it ends: `POST`/`GET /live/rooms/{roomId}/kicks`,
    `DELETE /live/rooms/{roomId}/kicks/{username}`, `LiveRoom.kicked`, data message `kick` on
    topic `kick`, code `LIVE_KICKED` (CONVENTIONS §10.20); and one person's points and rank in a
    live (`GET /live/rooms/{roomId}/contributors/{username}`, CONVENTIONS §10.12).
    **CP-018 (D106, DRAFT v1.21-live)** adds families (500 coins to create, up to 500 members,
    join requests, leader / deputies / members, a family number and a level from the coins its
    members spend; tag `families`), CP couples (a 99-coin request refunded unless accepted, CP
    gifts, five tiers — six since v1.24.1-live, D113; tag `cp`) and automatic medals (tag `medals`); `PublicProfile.family`,
    `cp` and `medals`; notification types `CP_REQUEST`, `CP_ACCEPTED`, `FAMILY_JOIN_ACCEPTED`,
    `FAMILY_JOIN_DECLINED`, `MEDAL_AWARDED`; a profile medal showcase (`PUT /me/medals/showcase`, code
    `MEDAL_NOT_UNLOCKED`); media kind `FAMILY_EMBLEM` (CONVENTIONS §10.21).
    **CP-019 (D107, DRAFT v1.22-live)** adds the bag (tag `bag`): a catalogue of items by
    category (first category `PROFILE_CARD`, the decoration on the profile card's header), the
    items the caller owns and the one they wear per category (`PUT /me/bag/equipped`, code
    `BAG_ITEM_NOT_OWNED`); every new account gets `bunny_royal` and wears it;
    `PublicProfile.profileCard` (CONVENTIONS §10.22).
    **CP-020 (D108, DRAFT v1.23-live)** adds live gifts: the gift catalogue managed by an admin
    on the server (tag `gifts`, `GET /gifts/catalogue`, empty until the art arrives), the caller's
    gift bag (`GET /me/gifts/bag`), and sending gifts in a live to the host and/or seated people,
    paid with coins (ledger `LIVE_GIFT`) or from the bag (`POST /live/rooms/{roomId}/gifts`, data
    message `gift` on topic `gift`, combos); gifts feed the live score, the Contribution list,
    the popularity board, charm and support levels; codes `GIFT_UNAVAILABLE`,
    `GIFT_BAG_INSUFFICIENT`, `LIVE_GIFT_RECIPIENT_UNAVAILABLE` (CONVENTIONS §10.23).
    **D109 (DRAFT v1.23.2-live)** opens `listLiveRoomViewers` to everyone who may watch the room
    (guests included), not only the host (CONVENTIONS §10.8).
    **D111 (DRAFT v1.23.3-live)** adds `LiveSeats.couples`: the CP couples (CP-018) whose
    partners both sit in the room now, the host included, so apps can show the pair joined
    (CONVENTIONS §10.9).
    **CP-021 (D112, DRAFT v1.24-live)** adds the CP space (tag `cp`): daily CP tasks with a
    check-in and once-a-day claims that add CP points, five CP privileges unlocked by CP level
    (`PublicProfile.cp.privileges`, `LiveChatMessage.cpBubble`, the `cp` field of the live `join`
    data message), a couple's public page, its CP gift wall and confession wall, the couples
    ranking (this CP week or all time), named CP gift cards in `CpConfig.gifts`, report target
    `CP_CONFESSION`, codes `CP_TASK_NOT_COMPLETED` and `CP_PRIVILEGE_LOCKED` (CONVENTIONS §10.24).
    **D113 (DRAFT v1.24.1-live)** adds a sixth CP tier, ثنائي أبدي / Eternal couple at 52 000 CP
    points: every CP `level` is 1–6 (privileges still unlock at 1–5; CONVENTIONS §10.21).
    **D115 (DRAFT v1.24.2-live)** adds `LiveSeatCouple.privileges`, so apps play the Couple Mic
    Effect (`MIC_EFFECT`, CP level 3) on a speaking partner's seat (CONVENTIONS §10.9).
    **D117 (DRAFT v1.24.3-live)** adds `Gift.tag` (`GiftTag` `{code, name}` or null): a gift's
    optional sub-category, shown as chips under the gift panel's tabs (CONVENTIONS §10.23).
    **D119 (DRAFT v1.24.4-live)** adds `LiveChatMessage.authorBadges` (`LiveChatAuthorBadges`:
    the author's charm and support level numbers and family `{name, level}`, each null when there
    is none), so the live chat shows them under the author's name (CONVENTIONS §10.11).
    **CP-022 (D116, DRAFT v1.25-live)** adds the family boards (`PRESTIGE`: family points this
    month; `ACTIVE`: members active this week) and a family's standing on them, each member's
    points this month, the month's contributions, members sorted by points with a search, presence
    (online now / last active, with `PrivacySettings.showActivityStatus`), a family cover
    (`FAMILY_COVER`) and tagline, `Family.pendingRequestCount`, and the family chat (members
    only, polled; delete, mute, report target `FAMILY_CHAT_MESSAGE`, code `FAMILY_CHAT_MUTED`)
    (CONVENTIONS §10.25).
    **D120 (DRAFT v1.25.1-live)** counts the host's own taps on their live like a viewer's (the
    score, the popularity board and the host's charm points, under the same per-person limits);
    no shape changes (CONVENTIONS §10.10, §10.18).
    **D121 (DRAFT v1.25.2-live)** adds the follower and following lists of a user
    (`listUserFollowers`, `listUserFollowing`; `FollowListItem`, `FollowListPage`) and counts
    only ACTIVE accounts in `PublicProfile` / `FollowState` counts (CONVENTIONS §10.5, §10.6).
    **D123 (DRAFT v1.25.4-live)** changes the `AUDIO` seat counts to 5, 10, 15 or 20 (25 removed:
    a start or change to 25 → 400; a room already LIVE with 25 keeps it until it ends, CONVENTIONS
    §10.9).
    **D124 (DRAFT v1.26-live)** adds the live hub's promo banners (`listHomeBanners`,
    `GET /home/banners`; `HomeBanner`, `HomeBannerList`) and the media kind `HOME_BANNER`
    (1 500 × 500 WebP, cover-cropped to 3:1); banners are managed only by the `banner-admin` CLI
    (CONVENTIONS §10.26, §11.1).
    **D125 (DRAFT v1.26.1-live)** adds a search (`q`, a case-insensitive prefix of the username or
    display name) and an order (`order=newest|oldest`) to both follow lists, and
    `removeMyFollower` (`DELETE /me/followers/{username}`, `FollowerRemoval`): the caller removes
    one of their followers (CONVENTIONS §10.6, §7).
    **D126 (DRAFT v1.26.2-live)** hosts gift art on the server: `Gift`, `GiftBagItem` and `LiveGift`
    gain `imageUrl` (PNG/WebP), `animationUrl` (SVGA 2.x) and `animationBytes`, public immutable URLs
    the app downloads on demand and caches (the bundled `assetKey` / `animationKey` stay the
    fallback), uploaded by `gift-admin --image` / `--animation-file` (CONVENTIONS §10.23).
    **D128 (DRAFT v1.26.3-live)** lets the host, or someone seated, send a gift to themself in that
    live (`sendLiveGift`; before: 400); it counts like any gift, charm and support included; no
    shape change (CONVENTIONS §10.23).
    **D129 (DRAFT v1.26.4-live)** adds `kind=audio|video` to `listLiveRooms` (the hub's voice rooms
    apart from its video lives; the cursor is bound to it) and states that a live's score, which
    orders `popular`, belongs to that one live: it starts at 0 and leaves the ranking when the live
    ends (CONVENTIONS §10.4, §10.10).
    **D132 (DRAFT v1.27-live)** adds lucky gifts: the gift category `LUCKY` (listed only while
    lucky gifts are on), `LiveGiftResult.luckyResult` (the draws of a lucky send and the coins won),
    the data message `lucky-win` on topic `lucky` for big wins, the public odds
    (`getLuckyGiftOdds`, `GET /live/gifts/lucky/odds`), a one-time 18+ confirmation
    (`confirmLuckyGiftAge`, `PUT /me/lucky-gifts/age-confirmation`) and the codes
    `LUCKY_GIFT_AGE_UNCONFIRMED` and `LUCKY_GIFT_REGION_UNAVAILABLE` (CONVENTIONS §10.27).
    **D133 (DRAFT v1.27.1-live)** adds to `listLiveRooms`: `scope=nearby` (rooms whose host's
    country is the caller's; `LiveRoomPage.emptyReason` `COUNTRY_NOT_SET` when the caller has none),
    `featured=true` (rooms of featured hosts, ordered by feature rank then like `popular`; featured
    hosts are managed by the `feature-admin` CLI) and the kinds `solo` (`SOLO`, `PK`), `multi`
    (`MULTI`) and `party` (`AUDIO`, `MULTI`); and the caller's own country (`Me.country`, set
    with `updateMe`) (CONVENTIONS §10.4, §10.28).
    **D138 (DRAFT v1.27.5-live)** adds `sendLiveSeatEmoji` (`POST /live/rooms/{roomId}/seat-emoji`,
    `LiveSeatEmojiRequest`, `LiveSeatEmoji`): in a room with seats the host or someone seated plays
    one of the owner's animated emojis once on their own tile, for the whole room, as the data
    message `seat-emoji` on topic `seat-emoji` (CONVENTIONS §10.30).
    **D140 (DRAFT v1.27.6-live)** adds `getLiveRoomStats` (`GET /live/rooms/{roomId}/stats`,
    `LiveRoomStats`, `LiveRoomViewerStats`, `LiveViewerCountry`): the host's statistics of one of
    their lives — cherries with the host's own share, supporters and the top three, gifts, chat
    messages, new followers, unique and peak viewers, average watch time and the viewers'
    countries with their shares (aggregates only) (CONVENTIONS §10.31).
    **D146 (DRAFT v1.28-live)** adds premium usernames (tag `premium-usernames`): the store, a name's
    status, monthly rental and renewal with coins (`Idempotency-Key`), giving it back, the caller's
    premium username, `PUT /me/username` with the stricter rule for new regular usernames
    (existing names are kept), the four tiers `LEGEND`/`RUBY`/`GOLD`/`SILVER` and the optional
    `premiumTier` badge on `UserSummary`, `PublicProfile` and `Me` (CONVENTIONS §6, §10.32).
    **D147 (DRAFT v1.29-live)** adds search trends (tag `search`): `recordSearchQuery`
    (`POST /search/queries`, a submitted search counted once per person per 7 days, no user id
    stored), `listTrendingSearches` (`GET /search/trending`, up to 6 terms with a `TRENDING` /
    `NEW` tag, at least 5 different searchers) and `listTrendingHashtags`
    (`GET /search/trending-hashtags`, the hashtags of the week) (CONVENTIONS §11.11).
    **D152 (DRAFT v1.30-live)** adds push notifications on Android (Firebase Cloud Messaging):
    `registerPushToken` / `unregisterPushToken` (`PUT` / `DELETE /me/push-token`, one token per
    signed-in session, removed with the session at logout) and the `messages` switch of
    `NotificationSettings` (family chat pushes). Pushes follow the in-app rules of §11.10
    (CONVENTIONS §11.12).
    **D148 (DRAFT v1.31-live)** changes lucky gifts: eight multipliers (×5 ×10 ×25 ×50 ×100 ×250
    ×500 ×1000) with configured chances per million; a per-sender guarantee (after 15 losing draws
    in a row the next draw pays at least ×5; `LuckyGiftOdds.pity`, `LuckyGiftResult.guaranteed`);
    and the data message `lucky-ticker` on topic `lucky`, sent to every other live room for a big
    win, at most one every 10 s (CONVENTIONS §10.27).
    **D154 (DRAFT v1.32-live)** adds «إفيهات» quips: the gift category `QUIPS` (`Gift.quip`: a bundled
    sound, its length and its line of text; price 0 = free, one per viewer per live), the room's one
    queue of quips (`LiveGiftResult.quip`, data message `quip` on topic `quip` with its `delayMs`), the
    host's and moderators' soundboard (`playLiveSound`, `POST /live/rooms/{roomId}/sounds`, one every
    2 s), the per-category host share (server config `GIFT_HOST_SHARE_PERCENTS`, quips 50 %) and the
    codes `QUIP_FREE_USED` and `QUIP_QUEUE_FULL` (CONVENTIONS §10.33).
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: health
    description: "Liveness and readiness probes (unversioned)."
  - name: auth
    description: "Registration, login, token refresh, email verification and password reset."
  - name: sessions
    description: "Management of the caller's device sessions."
  - name: me
    description: "The authenticated user."
  - name: users
    description: "Public user lookups, public profiles and follow."
  - name: live
    description: "Live discovery (categories, room lists, room detail) and the host lifecycle of live rooms (v1.3)."
  - name: levels
    description: "The caller's four independent level systems (v1.4-levels DRAFT, CP-005)."
  - name: admin-live
    description: "Admin: the hosting permission (v1.6-live DRAFT, CP-010)."
  - name: media
    description: "Presigned image uploads (v1.5-social DRAFT, CP-006)."
  - name: wallet
    description: "The caller's coins (v1.19-live DRAFT, CP-017)."
  - name: premium-usernames
    description: "Premium usernames rented monthly with coins, and the username change (v1.28-live DRAFT, D146). Prices, the reserved list and grants are managed by the premium-admin CLI."
  - name: families
    description: "Families: create, join requests, members and roles, level (v1.21-live DRAFT, CP-018)."
  - name: cp
    description: "CP couples: requests, the couple, CP gifts and tiers (v1.21-live DRAFT, CP-018); the CP space: daily tasks, privileges, the couple page, gift wall, confessions and the couples ranking (v1.24-live DRAFT, CP-021)."
  - name: medals
    description: "Medals: the catalogue and a user's medals (v1.21-live DRAFT, CP-018)."
  - name: bag
    description: "The bag: owned items by category and the one worn per category, starting with profile cards (v1.22-live DRAFT, CP-019)."
  - name: gifts
    description: "Live gifts: the catalogue and the caller's gift bag (v1.23-live DRAFT, CP-020). Sending is `sendLiveGift` (tag `live`)."
  - name: home
    description: "The live hub's promo banners (v1.26-live DRAFT, D124). Managed by the banner-admin CLI; read-only here."
  - name: posts
    description: "Posts, drafts, scheduling, pins, likes, saves, reposts, shares and views (v1.5-social DRAFT)."
  - name: feed
    description: "Following and Trending feeds (v1.5-social DRAFT)."
  - name: comments
    description: "Comments with one level of replies (v1.5-social DRAFT)."
  - name: search
    description: "Hashtags and prefix search (v1.5-social DRAFT)."
  - name: stories
    description: "Photo stories that last 24 hours: tray, seen, viewers and archive (v1.5-social DRAFT, CP-008)."
  - name: notifications
    description: "In-app notifications: inbox, unread count, mark read and settings (v1.5-social DRAFT, CP-009); the device's push token (v1.30-live DRAFT, D152)."
  - name: safety
    description: "Block, mute, hide, reports and privacy settings (v1.5-social DRAFT)."
  - name: admin-moderation
    description: "The report queue (admin permission MODERATION; v1.5-social DRAFT)."
  - name: admin-levels
    description: "Level configuration, user progression, reconciliation and audit for admins (role ADMIN; v1.4-levels DRAFT, CP-005)."
paths:
  /health/live:
    get:
      tags: [health]
      operationId: healthLive
      summary: "Liveness probe"
      security: []
      responses:
        '200':
          description: Process is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /health/ready:
    get:
      tags: [health]
      operationId: healthReady
      summary: "Readiness probe (database, Redis)"
      security: []
      responses:
        '200':
          description: Dependencies (database, redis) reachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '503':
          description: A dependency is down.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: "Start a verify-first registration (never reveals whether the email exists)"
      description: |
        v1.2 (CONVENTIONS §6 "Verify-first registration"). Always 202 with a constant body when
        the request is valid and the username is free — whether or not the email is registered.
        No account and no tokens are created here; complete with `registerVerify`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '202':
          description: Verification code emailed if the address can register (constant body).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationPending' }
        '400': { $ref: '#/components/responses/Error' }
        '409':
          description: USERNAME_TAKEN only (taken by an account or a live pending registration).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/auth/register/verify:
    post:
      tags: [auth]
      operationId: registerVerify
      summary: "Complete registration with the emailed code; creates the account and a session"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterVerifyRequest' }
      responses:
        '201':
          description: Account created (email verified) and session started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '409':
          description: USERNAME_TAKEN (backstop race only).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: TOKEN_INVALID for every failure (unknown email, wrong/expired code, attempts exhausted, email registered meanwhile).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/auth/register/resend:
    post:
      tags: [auth]
      operationId: registerResend
      summary: "Re-send the registration code (always 202)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202':
          description: Always returned for a valid body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationPending' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: "Sign in with email or username"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: "Rotate the refresh token and issue a new token pair"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              additionalProperties: false
              properties:
                refreshToken: { type: string, minLength: 10, maxLength: 200 }
      responses:
        '200':
          description: New token pair (refresh token rotated).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: "Revoke the current session"
      description: Revokes the session identified by the access token.
      responses:
        '204': { description: Session revoked. }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/email/verify:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: "Confirm an email address with a single-use token"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 10, maxLength: 200 }
      responses:
        '204': { description: Email verified. }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/email/resend:
    post:
      tags: [auth]
      operationId: resendVerificationEmail
      summary: "Re-send the verification email"
      description: Re-sends the verification email for the authenticated user (no-op if verified).
      responses:
        '202': { description: Accepted. }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: "Request a password-reset email (non-enumerating)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202': { description: 'Always returned, whether or not the email exists.' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: "Set a new password with a reset token"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 10, maxLength: 200 }
                newPassword: { $ref: '#/components/schemas/Password' }
      responses:
        '204': { description: Password changed; all sessions revoked. }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: "List the caller's active sessions"
      responses:
        '200':
          description: Active sessions of the caller, newest first (bounded, max 50).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SessionInfo' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/sessions/{sessionId}:
    delete:
      tags: [sessions]
      operationId: revokeSession
      summary: "Revoke one of the caller's sessions"
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: A malformed id is treated as not found (404), never 400.
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: "Get the authenticated user"
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    patch:
      tags: [me]
      operationId: updateMe
      summary: "Update the caller's preferences (v1.2: locale; v1.27.1-live: country)"
      description: |
        v1.27.1-live (D133): `locale` is no longer required and `country` is added; at least one of
        them must be sent (an empty object → 400 `body` / `required`). `country` is an ISO 3166-1
        alpha-2 code (two letters; lower case is accepted and stored upper case; `XK` and groupings
        such as `EU` are not countries here), or null to clear it;
        another value → 400 (`field "country"`, `issue "invalid_value"`). It is the caller's own
        statement (no check by IP) and only decides `scope=nearby` of `listLiveRooms`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                locale: { $ref: '#/components/schemas/Locale' }
                country:
                  type: [string, 'null']
                  pattern: '^[A-Za-z]{2}$'
                  description: v1.27.1-live (D133). ISO 3166-1 alpha-2; null clears it.
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/me/username:
    put:
      tags: [premium-usernames]
      operationId: changeUsername
      summary: "Change the caller's regular username (D146 rule)"
      description: |
        v1.28-live (D146, CONVENTIONS §6, §10.32). The new name must follow the regular rule
        (`RegularUsername`: 6–30 of a–z, 0–9 and `_`, at least one letter and one digit, `_` never
        first or last, and not a premium username). It is sent canonical (lower case, trimmed);
        nothing is normalized. Order after auth and the rate limit (5 / day / user, replacing the
        default): 400 `VALIDATION_FAILED` on `username` (`too_short`, `too_long`, `invalid_format`,
        `letters_and_digits`, or `premium` — a premium username can only be rented: the app offers
        the store) → 409 `PREMIUM_USERNAME_ACTIVE` while a premium username is the caller's (give it
        back first) → 409 `USERNAME_TAKEN` (reserved, another account's, held by a pending
        registration or kept for a renter). The same name as now → 200, nothing changed. The old name
        is free at once. Existing usernames that break the rule keep working (grandfathered).
        Audited `user.username.change`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeUsernameRequest' }
            example: { username: sara_2026 }
      responses:
        '200':
          description: The caller with the new username.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/premium-usernames:
    get:
      tags: [premium-usernames]
      operationId: getPremiumUsernameStore
      summary: "The premium usernames store: tier prices and suggested names (D146)"
      description: |
        CONVENTIONS §10.32. `tiers` lists the four tiers with the owner's monthly price, or null
        while a tier is not on sale (prices are set only with `premium-admin price`; there are no
        default prices). `suggestions` holds up to 30 names that are AVAILABLE to the caller now (free,
        not reserved, on sale), generated from patterns (repeated and running digits, palindromes,
        short letters) plus names with their own price; empty while nothing is on sale. Server-bounded,
        no cursor (§5). Per-user default rate limit.
      parameters:
        - name: tier
          in: query
          required: false
          schema: { $ref: '#/components/schemas/PremiumUsernameTier' }
      responses:
        '200':
          description: The store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremiumUsernameStore' }
              example:
                periodDays: 30
                graceDays: 7
                tiers:
                  - { tier: LEGEND, priceCoins: 50000 }
                  - { tier: RUBY, priceCoins: 20000 }
                  - { tier: GOLD, priceCoins: 12000 }
                  - { tier: SILVER, priceCoins: null }
                suggestions:
                  - { username: '777', tier: LEGEND, status: AVAILABLE, priceCoins: 50000, periodDays: 30, heldUntil: null }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/premium-usernames/{username}:
    get:
      tags: [premium-usernames]
      operationId: getPremiumUsernameStatus
      summary: "What one name is for the caller: tier, state and price (D146)"
      description: |
        CONVENTIONS §10.32. Never 404: the path is trimmed, lower-cased and a leading `@` dropped,
        then judged — `INVALID` (not a username), `REGULAR` (not premium: change to it for free with
        `changeUsername` when free), `RESERVED`, `TAKEN` (rented by or the username of another account,
        or held for a pending registration or a renter), `HELD` (in its 7-day grace for the last renter;
        `heldUntil`), `YOURS` / `YOURS_GRACE` (the caller's: renew), `NOT_FOR_SALE` (premium and free
        but its tier has no price), `AVAILABLE`. `priceCoins` is the monthly price for AVAILABLE, YOURS
        and YOURS_GRACE, else null. The store calls it as the person types (per-user default limit).
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: The name's status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremiumUsernameStatus' }
              example: { username: '7777', tier: RUBY, status: AVAILABLE, priceCoins: 20000, periodDays: 30, heldUntil: null }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/me/premium-username:
    get:
      tags: [premium-usernames]
      operationId: getMyPremiumUsername
      summary: "The caller's premium username, or null (D146)"
      description: |
        The ACTIVE one; else the newest one in its grace period (`status: GRACE`, the caller is back on
        `regularUsername` and may renew until `graceUntil`); else `{"premium": null}`.
      responses:
        '200':
          description: The caller's premium username.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyPremiumUsernameResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [premium-usernames]
      operationId: releaseMyPremiumUsername
      summary: "Give the premium username back now (D146)"
      description: |
        Ends the caller's ACTIVE premium username at once: the caller goes back to `regularUsername`,
        the name returns to the pool (no grace, **no refund**). Idempotent (none → 204). Audited
        `premium_username.release`. Counts against the rent bucket.
      responses:
        '204': { description: Given back (or there was none). }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/me/premium-username/rentals:
    post:
      tags: [premium-usernames]
      operationId: rentPremiumUsername
      summary: "Rent a premium username for one period, or renew your own (D146)"
      description: |
        CONVENTIONS §10.32. Paid with coins (wallet ledger `PREMIUM_USERNAME_RENT` /
        `PREMIUM_USERNAME_RENEW`, reference = the payment). `priceCoins` is the price the person was
        shown; it must equal the current monthly price. Order after auth: 400 `Idempotency-Key`
        (`required` / `invalid_format`) → 400 body → 429 (20 / hour / user, replacing the default) →
        a retry (the same key within 24 h and the same body → **200** with the first result, nothing
        charged again; another body → 409 `IDEMPOTENCY_CONFLICT`) → 409 `PREMIUM_USERNAME_UNAVAILABLE`
        (the name is not AVAILABLE, YOURS or YOURS_GRACE for the caller — read `getPremiumUsernameStatus`
        for why; also a renewal past the 365-day prepaid limit or of a grant without an end) → 409
        `PREMIUM_USERNAME_ACTIVE` (renting another name, or taking back one in grace, while a premium
        username is the caller's) → 409 `PREMIUM_USERNAME_PRICE_CHANGED` → 409 `INSUFFICIENT_COINS`.
        A refused request charges and changes nothing. **Rent:** the name becomes the caller's
        username for `periodDays` (30) at once; the caller's username before is kept for them
        (`regularUsername`) and comes back at the end. **Renew (YOURS):** the end moves by one period.
        **Renew in grace (YOURS_GRACE):** a new period from now and the name is the caller's username
        again. Two people renting one name at the same time: exactly one wins, the other gets
        `PREMIUM_USERNAME_UNAVAILABLE` and is not charged. Audited `premium_username.rent` / `.renew`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RentPremiumUsernameRequest' }
            example: { username: '7777', priceCoins: 12000 }
      responses:
        '201':
          description: Rented or renewed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremiumUsernameRental' }
        '200':
          description: A retry with the same `Idempotency-Key`; the first result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremiumUsernameRental' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/me/live-blocked-words:
    get:
      tags: [live]
      operationId: getLiveBlockedWords
      summary: "Host: the words masked in the chat of my lives (CP-016 B)"
      description: In the order saved. No hosting permission → 403 `LIVE_HOSTING_NOT_ALLOWED`.
      responses:
        '200':
          description: The list (possibly empty).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveBlockedWords' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    put:
      tags: [live]
      operationId: setLiveBlockedWords
      summary: "Host: replace my blocked words (CP-016 B)"
      description: |
        CONVENTIONS §10.14. Order after auth and the rate limit (30 / hour / user): the hosting
        permission (403 `LIVE_HOSTING_NOT_ALLOWED`) → body. Each word is normalized like chat
        text (NFC, trimmed, one line, §6 hygiene; 1–30 code points, else 400 `words.n`);
        duplicates by matching form are dropped, the first spelling kept; more than 100 → 400
        `words` / `too_long`. Applies to messages sent from now on.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetLiveBlockedWordsRequest' }
      responses:
        '200':
          description: The list as saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveBlockedWords' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/me/live-schedule:
    get:
      tags: [live]
      operationId: listMyLiveSchedule
      summary: "Host: my upcoming scheduled lives (CP-016 C)"
      description: |
        CONVENTIONS §10.16. Slots whose start is still ahead, soonest first (at most 10). No
        hosting permission → 403 `LIVE_HOSTING_NOT_ALLOWED`.
      responses:
        '200':
          description: The upcoming slots (possibly none).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveScheduleList' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      tags: [live]
      operationId: createLiveScheduleSlot
      summary: "Host: announce an upcoming live (CP-016 C)"
      description: |
        CONVENTIONS §10.16. Order after auth and the rate limit (30 / hour / user, shared with
        `DELETE`): the hosting permission (403 `LIVE_HOSTING_NOT_ALLOWED`) → body (`title` 1–60
        code points after normalization; `startsAt` 15 minutes to 30 days ahead, else 400
        `startsAt` / `too_small` or `too_big`) → at most 10 upcoming slots (409 `LIVE_SCHEDULE_FULL`).
        The host's followers get `LIVE_SCHEDULED_SOON` 15 minutes before `startsAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLiveScheduleSlotRequest' }
      responses:
        '201':
          description: The slot as saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveScheduleSlot' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/me/live-schedule/{slotId}:
    delete:
      tags: [live]
      operationId: deleteLiveScheduleSlot
      summary: "Host: cancel a scheduled live (CP-016 C)"
      description: |
        Removes the slot and the reminders already sent for it. A slot that is not the caller's
        (or a malformed id) → 404 `NOT_FOUND`. Works without the hosting permission, so a host
        whose permission was removed can still clean up. Shares the `POST` rate limit.
      parameters:
        - name: slotId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: A malformed id is treated as not found (404), never 400.
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/me/live-cover:
    put:
      tags: [live]
      operationId: setLiveCover
      summary: "Host: set the live cover, reused by every live (CP-015)"
      description: |
        CONVENTIONS §10.13. Order after auth and the rate limit (30 / hour / user):
        `MEDIA_UPLOADS_ENABLED` (503 `MEDIA_UPLOADS_UNAVAILABLE`) → the hosting permission
        (403 `LIVE_HOSTING_NOT_ALLOWED`) → body → the asset: a READY, unattached `LIVE_COVER`
        asset of the caller from the last 24 hours, else 400 `mediaId` / `invalid_value`.
        The previous cover's asset is deleted. If the caller is live, the room's `coverUrl`
        changes too and its `roomInfoVersion` increases (§10.12), so viewers re-read the room.
        Setting the current cover again changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetLiveCoverRequest' }
      responses:
        '200':
          description: The cover now in use.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveCover' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      tags: [live]
      operationId: removeLiveCover
      summary: "Host: remove the live cover; cards show the avatar again (CP-015, idempotent)"
      description: |
        The cover's asset is deleted; a live in progress loses its `coverUrl` (and its
        `roomInfoVersion` increases). Works while uploads are off. No hosting permission → 403
        `LIVE_HOSTING_NOT_ALLOWED`.
      responses:
        '204': { description: Removed (or there was none). }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/users/username-availability:
    get:
      tags: [users]
      operationId: checkUsernameAvailability
      summary: "Check whether a username is available"
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Username' }
      responses:
        '200':
          description: |
            Availability (reserved or invalid-but-well-formed names report false). v1.28-live (D146): a
            name that is not a valid new regular username (`RegularUsername`, e.g. a premium name) is
            not available either; the regular name a renter will go back to is held for them.
          content:
            application/json:
              schema:
                type: object
                required: [username, available]
                properties:
                  username: { type: string }
                  available: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/users/{username}:
    get:
      tags: [users]
      operationId: getPublicProfile
      summary: "Get a user's public profile (v1.3)"
      description: |
        CONVENTIONS §10.5. Never contains an email address. A malformed, unknown, reserved,
        pending-registration-only, SUSPENDED or DELETED username returns the same 404
        `NOT_FOUND` (no distinction, and no 400 for a malformed name). `liveRoomId` is set only
        while the user has a LIVE room with a fresh heartbeat (§10.2). The static route
        `/users/username-availability` cannot collide: `-` is not allowed in usernames.
        v1.21-live (CP-018, §10.21): `family`, `cp` and `medals` for the person card; CP tier and
        medal names follow `Accept-Language`, else the caller's locale. v1.22-live (CP-019,
        §10.22): `profileCard`, the profile card the user wears (null when none).
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: The public profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicProfile' }
              examples:
                otherUserLive:
                  summary: Another user who is live now and is followed by the caller
                  value:
                    id: 0192f1c2-7a10-7c3e-9d2a-3b4c5d6e7f80
                    username: layla.k
                    displayName: ليلى
                    avatarUrl: null
                    bio: null
                    isPrivate: false
                    followerCount: 12
                    followingCount: 40
                    isFollowing: true
                    isMuted: false
                    isSelf: false
                    liveRoomId: 0192f1d0-1111-7aaa-8bbb-0c0d0e0f1011
                    family: { id: 0192f1d0-8888-7000-8000-000000000002, number: 48213907, name: عائلة النجوم, level: 3, emblemUrl: null, role: DEPUTY }
                    cp:
                      id: 0192f1d0-9999-7000-8000-000000000003
                      partner: { id: 0192f1d0-5555-7000-8000-000000000006, username: sara, displayName: سارة, avatarUrl: null }
                      since: '2026-10-20T18:30:00.000Z'
                      level: 2
                      levelName: ثنائي فضّي
                      points: 620
                      privileges: [SPECIAL_FRAME, CHAT_BUBBLE]
                    medals:
                      owned: 2
                      total: 9
                      latest:
                        - { code: FIRST_CP, name: أول ثنائي, iconKey: medal_first_cp }
                        - { code: FIRST_LIVE, name: أول لايف, iconKey: medal_first_live }
                      showcase:
                        - { code: FIRST_LIVE, name: أول لايف, iconKey: medal_first_live }
                    profileCard: { code: bunny_royal, assetKey: header_bunny_royal }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/users/{username}/follow:
    put:
      tags: [users]
      operationId: followUser
      summary: "Follow a user (idempotent, v1.3)"
      description: |
        CONVENTIONS §10.6. Following someone already followed is a no-op that returns 200 with
        the same body. Target unknown / suspended / deleted / malformed → 404 `NOT_FOUND`. The
        caller's own username → 400 `VALIDATION_FAILED` (`field: "username"`,
        `issue: "invalid_value"`). Target with `isPrivate = true` → 403 `AUTH_FORBIDDEN` for a
        **new** follow (follow requests are deferred). v1.3.1 (QA-002): a caller who already
        follows a private target gets the idempotent 200 `{isFollowing: true, …}`; no edge is
        created.
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: The caller now follows the user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowState' }
              example: { isFollowing: true, followerCount: 13 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

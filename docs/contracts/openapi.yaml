        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/levels/me/{category}:
    get:
      tags: [levels]
      operationId: getMyLevel
      summary: "One category: summary and the level ladder (draft, CP-005)"
      parameters:

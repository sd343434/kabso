        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/media/uploads/{uploadId}/complete:
    post:
      tags: [media]
      operationId: completeMediaUpload
      summary: "Finish an upload: verify, strip metadata, make the sizes"
      description: |
        CONVENTIONS §11.1. Only the uploader may complete (anyone else: 404). The object must
        exist, match the declared type and size, and decode as an image of at most 8 000 px per
        side; else 422 `MEDIA_INVALID` and the object is deleted. Completing again returns the
        same asset (idempotent).
      parameters:
        - $ref: '#/components/parameters/UploadIdPath'
      responses:
        '200':
          description: The asset, READY.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/media/{mediaId}:
    get:
      tags: [media]
      operationId: getMedia
      summary: "One of the caller's media assets"
      parameters:
        - $ref: '#/components/parameters/MediaIdPath'
      responses:
        '200':
          description: The asset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/posts:
    post:
      tags: [posts]
      operationId: createPost
      summary: "Create a post, a draft or a scheduled post"
      description: |
        CONVENTIONS §11.2. Text and/or 1–10 of the caller's READY, unattached images. At least
        one of `text` and `mediaIds`. `status: SCHEDULED` needs `publishAt` 5 minutes to 30 days
        ahead. Hashtags and mentions are parsed from `text` (§11.6). An `Idempotency-Key` (UUID)
        header is required: a retry with the same key and body returns the first result; the same
        key with another body is 409 `IDEMPOTENCY_CONFLICT`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePostRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/posts/{postId}:
    get:
      tags: [posts]
      operationId: getPost
      summary: "One post the caller may see"
      description: Not visible (private author not followed, blocked either way, removed, pending media of someone else, another user's draft) → 404.
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: The post.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [posts]
      operationId: updatePost
      summary: "Edit the caption, location or settings; publish or reschedule a draft"
      description: |
        Author only (others: 404). Images never change. Editing the text of a published post
        sets `editedAt` and re-parses hashtags and mentions (new mentions only are notified, M4).
        `status` may move DRAFT → PUBLISHED | SCHEDULED and SCHEDULED → DRAFT | PUBLISHED;
        a published post cannot go back.
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePostRequest' }
      responses:
        '200':
          description: The updated post.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [posts]
      operationId: deletePost
      summary: "Delete a post (author)"
      description: Soft delete; the post leaves every list at once. Deleting again → 404.
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/me/posts:
    get:
      tags: [posts]
      operationId: listMyPosts
      summary: "The caller's drafts or scheduled posts"
      parameters:
        - name: status
          in: query
          required: true
          schema: { type: string, enum: [DRAFT, SCHEDULED] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: "Drafts newest first; scheduled soonest first."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/posts/{postId}/pin:
    put:
      tags: [posts]
      operationId: pinPost
      summary: "Pin a published post on the caller's profile (max 3, idempotent)"
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: Pinned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [posts]
      operationId: unpinPost
      summary: "Unpin (idempotent)"
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: Not pinned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/users/{username}/posts:
    get:
      tags: [posts]
      operationId: listUserPosts
      summary: "A user's published posts (profile grid): pinned first, then newest"
      description: Private author not followed, or blocked either way → 404 (the profile itself stays visible).
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/users/{username}/reposts:
    get:
      tags: [posts]
      operationId: listUserReposts
      summary: "Posts a user reposted (profile Reposts tab), newest repost first"
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/feed/posts:
    get:
      tags: [feed]
      operationId: listFeedPosts
      summary: "Posts feed: following (newest) or trending (ranked)"
      description: |
        CONVENTIONS §11.3. `following`: published posts and reposts of followed accounts, newest
        first (a reposted post carries `repostedBy`). `trending`: visible public posts of the last
        7 days ranked by the global score; the first page freezes a snapshot for 10 minutes, so
        later pages never repeat or skip (an expired cursor → 400 `cursor` / `invalid_value`).
      parameters:
        - name: tab
          in: query
          required: true
          schema: { type: string, enum: [following, trending] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/posts/{postId}/like:
    put:
      tags: [posts]
      operationId: likePost
      summary: "Like (idempotent)"
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: Liked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeState' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [posts]
      operationId: unlikePost
      summary: "Unlike (idempotent)"
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: Not liked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeState' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/posts/{postId}/likes:
    get:
      tags: [posts]
      operationId: listPostLikes
      summary: "Who liked a post, newest first"
      description: When the author hides the like count, only the author may list (others → 403 `AUTH_FORBIDDEN`).
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummaryPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/posts/{postId}/save:
    put:
      tags: [posts]
      operationId: savePost
      summary: "Save (idempotent; private to the caller)"
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveState' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [posts]
      operationId: unsavePost
      summary: "Unsave (idempotent)"
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: Not saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveState' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/me/saved:
    get:
      tags: [posts]
      operationId: listSavedPosts
      summary: "The caller's saved posts, newest save first (posts no longer visible are skipped)"
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/posts/{postId}/repost:
    put:
      tags: [posts]
      operationId: repostPost
      summary: "Repost (idempotent): appears in the caller's followers' Following feed"
      description: Own posts and posts of private accounts cannot be reposted (400 `postId` / `invalid_value`).
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: Reposted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepostState' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [posts]
      operationId: unrepostPost
      summary: "Undo a repost (idempotent)"
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: Not reposted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepostState' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/posts/{postId}/shares:
    post:
      tags: [posts]
      operationId: countPostShare
      summary: "Count an outside share (once per user, post and UTC day)"
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: The share count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareState' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/views:
    post:
      tags: [posts]
      operationId: recordViews
      summary: "Record post views in a batch (best effort)"
      description: |
        CONVENTIONS §11.4. Up to 50 items. A view counts once per user, post and 24 hours, never
        for the author, and only for posts the caller may see; other items are ignored silently.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordViewsRequest' }
      responses:
        '204': { description: Accepted. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/posts/{postId}/comments:
    get:
      tags: [comments]
      operationId: listComments
      summary: "Top-level comments: the pinned one, then by likes, then newest"
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [comments]
      operationId: createComment
      summary: "Comment, or reply with parentId (one level)"
      description: |
        CONVENTIONS §11.5. The post's `whoCanComment` applies (403 `AUTH_FORBIDDEN` when the
        caller may not comment; `commentsEnabled: false` → 403 too). A reply to a reply attaches
        to the top-level comment.
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommentRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/comments/{commentId}/replies:
    get:
      tags: [comments]
      operationId: listReplies
      summary: "Replies of a top-level comment, oldest first"
      parameters:
        - $ref: '#/components/parameters/CommentIdPath'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/comments/{commentId}:
    delete:
      tags: [comments]
      operationId: deleteComment
      summary: "Delete a comment (its author or the post's author); replies go with it"
      parameters:
        - $ref: '#/components/parameters/CommentIdPath'
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/comments/{commentId}/like:
    put:
      tags: [comments]
      operationId: likeComment
      summary: "Like a comment (idempotent)"
      parameters:
        - $ref: '#/components/parameters/CommentIdPath'
      responses:
        '200':
          description: Liked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeState' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [comments]
      operationId: unlikeComment
      summary: "Unlike a comment (idempotent)"
      parameters:
        - $ref: '#/components/parameters/CommentIdPath'
      responses:
        '200':
          description: Not liked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeState' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/comments/{commentId}/pin:
    put:
      tags: [comments]
      operationId: pinComment
      summary: "Pin a top-level comment (post author; replaces the previous pin)"
      parameters:
        - $ref: '#/components/parameters/CommentIdPath'
      responses:
        '200':
          description: Pinned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [comments]
      operationId: unpinComment
      summary: "Unpin (idempotent)"
      parameters:
        - $ref: '#/components/parameters/CommentIdPath'
      responses:
        '200':
          description: Not pinned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/hashtags/{tag}:
    get:
      tags: [search]
      operationId: getHashtag
      summary: "A hashtag and its visible post count"
      parameters:
        - $ref: '#/components/parameters/HashtagPath'
      responses:
        '200':
          description: The hashtag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hashtag' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/hashtags/{tag}/posts:
    get:
      tags: [search]
      operationId: listHashtagPosts
      summary: "Posts with a hashtag: top (trending score, 30 days) or recent"
      parameters:
        - $ref: '#/components/parameters/HashtagPath'

      summary: "Admin: a manual, audited points adjustment (draft, CP-005)"
      description: |
        Appends an ADJUSTMENT entry; history is never rewritten. `Idempotency-Key` (UUID) is
        required: the same key with the same body returns the first result (200), with a
        different body 409 `IDEMPOTENCY_CONFLICT`. A total may not go below 0 (422).
      parameters:
        - { $ref: '#/components/parameters/UserIdPath' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LevelAdjustmentRequest' }
      responses:
        '200':
          description: The entry (new or replayed) and the user's states.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLevelAdjustmentResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/moderators/{username}:
    put:
      tags: [live]
      operationId: addLiveModerator
      summary: "Host: make a viewer a moderator of this room (CP-011)"
      description: |
        Host only (else 403). The user must be signed in, ACTIVE and not blocked either way with
        the host (else 404). Up to 5 per room (else 422 `VALIDATION_FAILED`, field `moderators`). Moderators last for the room only.
        Idempotent. v1.20-live (D105): someone kicked out of this live → 422 `VALIDATION_FAILED`
        (field `username`, `invalid_value`).
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: The seats (with the moderator list) after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeats' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [live]
      operationId: removeLiveModerator
      summary: "Host: remove a moderator (CP-011, idempotent)"
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: The seats after the change.
          content:

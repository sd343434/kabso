openapi: 3.1.0
info:
  title: Kabso Live API
  version: 1.3.1
  description: |
    Authoritative HTTP contract. Conventions (errors, pagination, auth, rate limits) are defined in
    CONVENTIONS.md and apply to every operation. Phase 1 scope: health, authentication, sessions,
    current user. v1.3 (Phase 2 slice 1, KL-036) adds live discovery, the host lifecycle of live
    rooms (behind `LIVE_HOSTING_ENABLED`), public profiles and follow (CONVENTIONS §10; data design
    in DB_PHASE2_DISCOVERY.md). Later phases append paths; existing shapes change only via
    contract proposal. **v1.4-levels (DRAFT, CP-005)** adds the four level systems (user and
    admin paths tagged `levels` / `admin-levels`); it is additive and awaits formal approval.
    **v1.5-social (DRAFT, CP-006 M1)** adds media upload, posts, feeds, likes, saves, reposts,
    views, comments, hashtags, search, block / mute / hide, reports and privacy settings
    (CONVENTIONS §11); additive, owner-approved scope (D87). **CP-008 (D91, M3)** adds photo
    stories: tray, viewer, seen, viewers and archive (tag `stories`, CONVENTIONS §11.9).
    **CP-009 (D92, M4)** adds in-app notifications: inbox, unread count, mark read and per-type
    settings (tag `notifications`, CONVENTIONS §11.10).
    **CP-010 (D93, Live L1, DRAFT v1.6-live)** adds live video: media access tokens for hosts,
    viewers and guests without an account, the real viewer count, the host's viewer list and
    guests switch, the hosting permission (admin-granted until agencies and identity checks,
    L1b) and `LIVE_ROOM` reports (CONVENTIONS §10.7).
    **CP-011 (D94, DRAFT v1.7-live)** adds multi-guest video and audio rooms with seats: asking
    for a seat, invitations, the host's and moderators' controls (mute, take off, lock, seat
    count), room moderators and room themes (CONVENTIONS §10.9).
    **CP-012 (D95, DRAFT v1.8-live)** adds taps and the room score (CONVENTIONS §10.10).
    **CP-013 (D96, DRAFT v1.9-live)** adds the room chat: sending and reading messages, live
    delivery as media data messages, the host's and moderators' delete and chat mute, turning
    the chat off, and `LIVE_CHAT_MESSAGE` reports (CONVENTIONS §10.11).
    **CP-014 (D97, DRAFT v1.10-live)** lets the host edit a live's title, category and topic
    while live, adds the topic to rooms and hub cards, and a public Contribution list of a live
    (CONVENTIONS §10.12).
    **CP-015 (D98, DRAFT v1.11-live)** adds the host's live cover: one square picture, reused by
    every live, set from a `LIVE_COVER` upload and shown on hub cards and in the room
    (CONVENTIONS §10.13). It stays behind `MEDIA_UPLOADS_ENABLED` like every upload.
    **CP-016 part B (D99, DRAFT v1.12-live)** adds the host's blocked words, masked in the chat of
    every live of that host (CONVENTIONS §10.14).
    **CP-016 part A (D99, DRAFT v1.13-live)** adds the popularity board: hosts ranked by the
    points their lives received this hour, today or this week, one region for everyone
    (CONVENTIONS §10.15).
    **CP-016 part C (D99, DRAFT v1.14-live)** adds the live schedule: a host announces upcoming
    lives and their followers get a `LIVE_SCHEDULED_SOON` notification 15 minutes before
    (CONVENTIONS §10.16).
    **CP-016 part G (D99, DRAFT v1.15-live)** adds the host's public room number
    (`LiveRoom.roomNumber`, CONVENTIONS §10.17).
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: health
    description: "Liveness and readiness probes (unversioned)."
  - name: auth
    description: "Registration, login, token refresh, email verification and password reset."
  - name: sessions
    description: "Management of the caller's device sessions."
  - name: me
    description: "The authenticated user."
  - name: users
    description: "Public user lookups, public profiles and follow."
  - name: live
    description: "Live discovery (categories, room lists, room detail) and the host lifecycle of live rooms (v1.3)."
  - name: levels
    description: "The caller's four independent level systems (v1.4-levels DRAFT, CP-005)."
  - name: admin-live
    description: "Admin: the hosting permission (v1.6-live DRAFT, CP-010)."
  - name: media
    description: "Presigned image uploads (v1.5-social DRAFT, CP-006)."
  - name: posts
    description: "Posts, drafts, scheduling, pins, likes, saves, reposts, shares and views (v1.5-social DRAFT)."
  - name: feed
    description: "Following and Trending feeds (v1.5-social DRAFT)."
  - name: comments
    description: "Comments with one level of replies (v1.5-social DRAFT)."
  - name: search
    description: "Hashtags and prefix search (v1.5-social DRAFT)."
  - name: stories
    description: "Photo stories that last 24 hours: tray, seen, viewers and archive (v1.5-social DRAFT, CP-008)."
  - name: notifications
    description: "In-app notifications: inbox, unread count, mark read and settings (v1.5-social DRAFT, CP-009)."
  - name: safety
    description: "Block, mute, hide, reports and privacy settings (v1.5-social DRAFT)."
  - name: admin-moderation
    description: "The report queue (admin permission MODERATION; v1.5-social DRAFT)."
  - name: admin-levels
    description: "Level configuration, user progression, reconciliation and audit for admins (role ADMIN; v1.4-levels DRAFT, CP-005)."
paths:
  /health/live:
    get:
      tags: [health]
      operationId: healthLive
      summary: "Liveness probe"
      security: []
      responses:
        '200':
          description: Process is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /health/ready:
    get:
      tags: [health]
      operationId: healthReady
      summary: "Readiness probe (database, Redis)"
      security: []
      responses:
        '200':
          description: Dependencies (database, redis) reachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '503':
          description: A dependency is down.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: "Start a verify-first registration (never reveals whether the email exists)"
      description: |
        v1.2 (CONVENTIONS §6 "Verify-first registration"). Always 202 with a constant body when
        the request is valid and the username is free — whether or not the email is registered.
        No account and no tokens are created here; complete with `registerVerify`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '202':
          description: Verification code emailed if the address can register (constant body).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationPending' }
        '400': { $ref: '#/components/responses/Error' }
        '409':
          description: USERNAME_TAKEN only (taken by an account or a live pending registration).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/auth/register/verify:
    post:
      tags: [auth]
      operationId: registerVerify
      summary: "Complete registration with the emailed code; creates the account and a session"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterVerifyRequest' }
      responses:
        '201':
          description: Account created (email verified) and session started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '409':
          description: USERNAME_TAKEN (backstop race only).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: TOKEN_INVALID for every failure (unknown email, wrong/expired code, attempts exhausted, email registered meanwhile).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/auth/register/resend:
    post:
      tags: [auth]
      operationId: registerResend
      summary: "Re-send the registration code (always 202)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202':
          description: Always returned for a valid body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationPending' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: "Sign in with email or username"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: "Rotate the refresh token and issue a new token pair"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              additionalProperties: false
              properties:
                refreshToken: { type: string, minLength: 10, maxLength: 200 }
      responses:
        '200':
          description: New token pair (refresh token rotated).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: "Revoke the current session"
      description: Revokes the session identified by the access token.
      responses:
        '204': { description: Session revoked. }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/email/verify:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: "Confirm an email address with a single-use token"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 10, maxLength: 200 }
      responses:
        '204': { description: Email verified. }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/email/resend:
    post:
      tags: [auth]
      operationId: resendVerificationEmail
      summary: "Re-send the verification email"
      description: Re-sends the verification email for the authenticated user (no-op if verified).
      responses:
        '202': { description: Accepted. }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: "Request a password-reset email (non-enumerating)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202': { description: 'Always returned, whether or not the email exists.' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: "Set a new password with a reset token"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 10, maxLength: 200 }
                newPassword: { $ref: '#/components/schemas/Password' }
      responses:
        '204': { description: Password changed; all sessions revoked. }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: "List the caller's active sessions"
      responses:
        '200':
          description: Active sessions of the caller, newest first (bounded, max 50).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SessionInfo' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/sessions/{sessionId}:
    delete:
      tags: [sessions]
      operationId: revokeSession
      summary: "Revoke one of the caller's sessions"
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: A malformed id is treated as not found (404), never 400.
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: "Get the authenticated user"
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    patch:
      tags: [me]
      operationId: updateMe
      summary: "Update the caller's preferences (v1.2: locale)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              additionalProperties: false
              properties:
                locale: { $ref: '#/components/schemas/Locale' }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/me/live-blocked-words:
    get:
      tags: [live]
      operationId: getLiveBlockedWords
      summary: "Host: the words masked in the chat of my lives (CP-016 B)"
      description: In the order saved. No hosting permission → 403 `LIVE_HOSTING_NOT_ALLOWED`.
      responses:
        '200':
          description: The list (possibly empty).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveBlockedWords' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    put:
      tags: [live]
      operationId: setLiveBlockedWords
      summary: "Host: replace my blocked words (CP-016 B)"
      description: |
        CONVENTIONS §10.14. Order after auth and the rate limit (30 / hour / user): the hosting
        permission (403 `LIVE_HOSTING_NOT_ALLOWED`) → body. Each word is normalized like chat
        text (NFC, trimmed, one line, §6 hygiene; 1–30 code points, else 400 `words.n`);
        duplicates by matching form are dropped, the first spelling kept; more than 100 → 400
        `words` / `too_long`. Applies to messages sent from now on.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetLiveBlockedWordsRequest' }
      responses:
        '200':
          description: The list as saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveBlockedWords' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/me/live-schedule:
    get:
      tags: [live]
      operationId: listMyLiveSchedule
      summary: "Host: my upcoming scheduled lives (CP-016 C)"
      description: |
        CONVENTIONS §10.16. Slots whose start is still ahead, soonest first (at most 10). No
        hosting permission → 403 `LIVE_HOSTING_NOT_ALLOWED`.
      responses:
        '200':
          description: The upcoming slots (possibly none).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveScheduleList' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      tags: [live]
      operationId: createLiveScheduleSlot
      summary: "Host: announce an upcoming live (CP-016 C)"
      description: |
        CONVENTIONS §10.16. Order after auth and the rate limit (30 / hour / user, shared with
        `DELETE`): the hosting permission (403 `LIVE_HOSTING_NOT_ALLOWED`) → body (`title` 1–60
        code points after normalization; `startsAt` 15 minutes to 30 days ahead, else 400
        `startsAt` / `too_small` or `too_big`) → at most 10 upcoming slots (409 `LIVE_SCHEDULE_FULL`).
        The host's followers get `LIVE_SCHEDULED_SOON` 15 minutes before `startsAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLiveScheduleSlotRequest' }
      responses:
        '201':
          description: The slot as saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveScheduleSlot' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/me/live-schedule/{slotId}:
    delete:
      tags: [live]
      operationId: deleteLiveScheduleSlot
      summary: "Host: cancel a scheduled live (CP-016 C)"
      description: |
        Removes the slot and the reminders already sent for it. A slot that is not the caller's
        (or a malformed id) → 404 `NOT_FOUND`. Works without the hosting permission, so a host
        whose permission was removed can still clean up. Shares the `POST` rate limit.
      parameters:
        - name: slotId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: A malformed id is treated as not found (404), never 400.
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/me/live-cover:
    put:
      tags: [live]
      operationId: setLiveCover
      summary: "Host: set the live cover, reused by every live (CP-015)"
      description: |
        CONVENTIONS §10.13. Order after auth and the rate limit (30 / hour / user):
        `MEDIA_UPLOADS_ENABLED` (503 `MEDIA_UPLOADS_UNAVAILABLE`) → the hosting permission
        (403 `LIVE_HOSTING_NOT_ALLOWED`) → body → the asset: a READY, unattached `LIVE_COVER`
        asset of the caller from the last 24 hours, else 400 `mediaId` / `invalid_value`.
        The previous cover's asset is deleted. If the caller is live, the room's `coverUrl`
        changes too and its `roomInfoVersion` increases (§10.12), so viewers re-read the room.
        Setting the current cover again changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetLiveCoverRequest' }
      responses:
        '200':
          description: The cover now in use.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveCover' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      tags: [live]
      operationId: removeLiveCover
      summary: "Host: remove the live cover; cards show the avatar again (CP-015, idempotent)"
      description: |
        The cover's asset is deleted; a live in progress loses its `coverUrl` (and its
        `roomInfoVersion` increases). Works while uploads are off. No hosting permission → 403
        `LIVE_HOSTING_NOT_ALLOWED`.
      responses:
        '204': { description: Removed (or there was none). }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/users/username-availability:
    get:
      tags: [users]
      operationId: checkUsernameAvailability
      summary: "Check whether a username is available"
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Username' }
      responses:
        '200':
          description: Availability (reserved or invalid-but-well-formed names report false).
          content:
            application/json:
              schema:
                type: object
                required: [username, available]
                properties:
                  username: { type: string }
                  available: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/users/{username}:
    get:
      tags: [users]
      operationId: getPublicProfile
      summary: "Get a user's public profile (v1.3)"
      description: |
        CONVENTIONS §10.5. Never contains an email address. A malformed, unknown, reserved,
        pending-registration-only, SUSPENDED or DELETED username returns the same 404
        `NOT_FOUND` (no distinction, and no 400 for a malformed name). `liveRoomId` is set only
        while the user has a LIVE room with a fresh heartbeat (§10.2). The static route
        `/users/username-availability` cannot collide: `-` is not allowed in usernames.
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: The public profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicProfile' }
              examples:
                otherUserLive:
                  summary: Another user who is live now and is followed by the caller
                  value:
                    id: 0192f1c2-7a10-7c3e-9d2a-3b4c5d6e7f80
                    username: layla.k
                    displayName: ليلى
                    avatarUrl: null
                    bio: null
                    isPrivate: false
                    followerCount: 12
                    followingCount: 40
                    isFollowing: true
                    isSelf: false
                    liveRoomId: 0192f1d0-1111-7aaa-8bbb-0c0d0e0f1011
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/users/{username}/follow:
    put:
      tags: [users]
      operationId: followUser
      summary: "Follow a user (idempotent, v1.3)"
      description: |
        CONVENTIONS §10.6. Following someone already followed is a no-op that returns 200 with
        the same body. Target unknown / suspended / deleted / malformed → 404 `NOT_FOUND`. The
        caller's own username → 400 `VALIDATION_FAILED` (`field: "username"`,
        `issue: "invalid_value"`). Target with `isPrivate = true` → 403 `AUTH_FORBIDDEN` for a
        **new** follow (follow requests are deferred). v1.3.1 (QA-002): a caller who already
        follows a private target gets the idempotent 200 `{isFollowing: true, …}`; no edge is
        created.
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: The caller now follows the user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowState' }
              example: { isFollowing: true, followerCount: 13 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [users]
      operationId: unfollowUser
      summary: "Unfollow a user (idempotent, v1.3)"
      description: |
        CONVENTIONS §10.6. Unfollowing someone not followed is a no-op that returns 200. Errors
        as for `followUser`, except that a private target can always be unfollowed (no 403).
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: The caller does not follow the user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowState' }
              example: { isFollowing: false, followerCount: 12 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/config:
    get:
      tags: [live]
      operationId: getLiveConfig
      security: [{}, {bearerAuth: []}]
      summary: "Live feature switch and server-driven timings (v1.3)"
      description: |
        Lets the client render honest states (`hostingEnabled = false` → "Going live is not
        available yet"; HL-H6 "Unavailable") and take the heartbeat cadence from the server
        instead of hard-coding it (CONVENTIONS §10.3).
      responses:
        '200':
          description: Current live configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveConfig' }
              example:
                hostingEnabled: false
                heartbeatIntervalSeconds: 15
                heartbeatStaleAfterSeconds: 45
                themes: [classic, ice-palace, desert-night, rose-garden, sunset-sky, moon-palace, ocean-depths, golden-hall, game-arena, heart-garden, galaxy]
                seatCounts: { MULTI: [4, 6, 9, 12], AUDIO: [5, 9, 13] }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/categories:
    get:
      tags: [live]
      operationId: listLiveCategories
      summary: "List active live categories (bounded, not paginated; v1.3)"
      description: |
        Active categories ordered by `sortOrder` ascending, then `slug` ascending. The list is
        server-curated and capped at 100 active rows (CONVENTIONS §10.1), so it is returned
        whole with no `page` object. It is **empty** until categories are created (none are
        seeded, D37). `name` is localized (§10.1).
      responses:
        '200':
          description: Active categories (possibly empty).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/LiveCategory' }
              examples:
                empty:
                  summary: Production today (no categories created)
                  value: { data: [] }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms:
    get:
      tags: [live]
      operationId: listLiveRooms
      security: [{}, {bearerAuth: []}]
      summary: "List live rooms for a discovery tab (cursor-paginated; v1.3)"
      description: |
        CONVENTIONS §10.2 and §10.4. Only rooms with `status = LIVE`, a fresh heartbeat and an
        `ACTIVE` host. Stale rooms are filtered out; this read never writes (v1.3.1, SEC-035). Orderings: `popular` = score desc, startedAt desc, id desc (v1.8-live, CP-012; was viewerCount); `new` =
        startedAt desc, id desc; `following` = rooms of hosts the caller follows, startedAt desc,
        id desc. `category` filters every tab. CP-010: guests (no token) may call `popular` and
        `new`; `following` without a token → 401. A well-formed slug that is unknown or inactive
        returns an empty list (200). Rankings can change between pages; **clients dedupe by
        `id`** (HL-H5). CP-012: the room score changes while people tap, so rooms move between
        pages more often; v1.8-live cursors carry the score (cursors of an older format, any tab → 400).
      parameters:
        - name: tab
          in: query
          required: true
          schema: { type: string, enum: [popular, new, following] }
        - name: category
          in: query
          required: false
          description: 'Category slug. Malformed → 400 `VALIDATION_FAILED` (`field "category"`).'
          schema: { $ref: '#/components/schemas/CategorySlug' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of live rooms.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoomPage' }
              examples:
                empty:
                  summary: Nobody is live
                  value:
                    data: []
                    page: { nextCursor: null, hasMore: false }
                onePage:
                  summary: One room, more pages follow
                  value:
                    data:
                      - id: 0192f1d0-1111-7aaa-8bbb-0c0d0e0f1011
                        title: سهرة طرب
                        mode: SOLO
                        viewerCount: 0
                        startedAt: '2026-10-16T19:00:00.000Z'
                        coverUrl: null
                        category: null
                        host:
                          id: 0192f1c2-7a10-7c3e-9d2a-3b4c5d6e7f80
                          username: layla.k
                          displayName: ليلى
                          avatarUrl: null
                        seatCount: null
                        occupiedSeats: 0
                        theme: classic
                        score: 1240
                        topic: null
                    page: { nextCursor: eyJ2IjoxLCJ0IjoibmV3In0.q2Fm0b7xT1sYg8aE3k9Lzw, hasMore: true }
        '400':
          description: VALIDATION_FAILED — bad `tab`, malformed `category`, `limit` out of range, or a malformed, tampered or mismatched `cursor` (`field "cursor"`, `issue "invalid_value"`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      tags: [live]
      operationId: startLiveRoom
      summary: "Go live: create the caller's LIVE room (v1.3, behind LIVE_HOSTING_ENABLED)"
      description: |
        CONVENTIONS §10.3. Body parsing comes first on every route (CONVENTIONS §4, v1.3.1
        QA-001): malformed JSON or an oversized body → 400 `VALIDATION_FAILED` before every
        check below, even without a token or while hosting is disabled. Then, in order: auth →
        rate limit → `LIVE_HOSTING_ENABLED` (else
        503 `LIVE_HOSTING_UNAVAILABLE`, no `Retry-After`) → body → `categorySlug` resolves to an
        **active** category (else 400, `field "categorySlug"`, `issue "invalid_value"`) → the
        caller has no LIVE room with a fresh heartbeat (else 409 `LIVE_ROOM_ALREADY_ACTIVE`; a
        LIVE room with a stale heartbeat is ended with `HEARTBEAT_TIMEOUT` in the same
        transaction and the new room is created). Only `SOLO` rooms can be created; the request
        has no `mode`. No `Idempotency-Key`: a retry after a lost response gets 409 and the
        client resumes the room found via `getPublicProfile` (own username → `liveRoomId`).
        Requires a verified email (every v1.2+ account is verified at creation; a legacy
        unverified account gets 403 `AUTH_FORBIDDEN`). CP-010: also requires the **hosting
        permission** (`Me.canHost`), else 403 `LIVE_HOSTING_NOT_ALLOWED` (checked after
        `LIVE_HOSTING_ENABLED`). `allowGuests` defaults to true.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartLiveRoomRequest' }
            example: { title: سهرة طرب, categorySlug: music, allowGuests: true }
      responses:
        '201':
          description: Room created; the caller starts heartbeats at the cadence from `getLiveConfig`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoom' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409':
          description: LIVE_ROOM_ALREADY_ACTIVE — the caller already has a LIVE room with a fresh heartbeat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/Error' }
        '503':
          description: LIVE_HOSTING_UNAVAILABLE (hosting disabled by config) or SERVICE_UNAVAILABLE (dependency down).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/live/rooms/{roomId}:
    get:
      tags: [live]
      operationId: getLiveRoom
      security: [{}, {bearerAuth: []}]
      summary: "Get a live room, including ended rooms (v1.3)"
      description: |
        A LIVE room whose heartbeat is stale is never reported as LIVE: it is returned as
        `ENDED` with `endReason = HEARTBEAT_TIMEOUT` and `endedAt = lastHeartbeatAt` (§10.2;
        v1.3.1: computed, or by ending that single room). Nonexistent rooms, malformed ids
        and rooms whose host is not `ACTIVE` all return 404 `NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '200':
          description: The room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoom' }
              examples:
                ended:
                  summary: A room the host ended
                  value:
                    id: 0192f1d0-1111-7aaa-8bbb-0c0d0e0f1011
                    title: سهرة طرب
                    mode: SOLO
                    viewerCount: 0
                    startedAt: '2026-10-16T19:00:00.000Z'
                    coverUrl: null
                    category: { slug: music, name: موسيقى }
                    host:
                      id: 0192f1c2-7a10-7c3e-9d2a-3b4c5d6e7f80
                      username: layla.k
                      displayName: ليلى
                      avatarUrl: null
                    status: ENDED
                    endedAt: '2026-10-16T20:12:45.120Z'
                    endReason: HOST_ENDED
                    allowGuests: true
                    seatCount: null
                    occupiedSeats: 0
                    theme: classic
                    score: 1240
                    topic: null
                    scoreParts: { total: 1240, tapPoints: 1240, supportPoints: 0 }
                    chatEnabled: true
                    chatMuted: false
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

    patch:
      tags: [live]
      operationId: updateLiveRoom
      summary: "Host: change a LIVE room's settings (CP-010)"
      description: |
        Host only (else 404). `allowGuests: false` removes every connected guest at once and
        refuses new guest tokens (403 `LIVE_GUESTS_NOT_ALLOWED`); `true` lets them in again.
        `chatEnabled` (CP-013) turns the room chat off or on and sends a `chat-state` data
        message (§10.11). `title`, `categorySlug` and `topic` (CP-014) edit the live while it is
        on; everyone in the room re-reads it when `roomInfoVersion` moves in the media room's
        metadata (§10.12). An unknown or inactive category → 400 (`categorySlug`,
        `invalid_value`). Ended room → 409 `LIVE_ROOM_ENDED`. Idempotent.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLiveRoomRequest' }
      responses:
        '200':
          description: The room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoom' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/media-token:
    post:
      tags: [live]
      operationId: createLiveMediaToken
      summary: "Access to a LIVE room's video: publish (host) or watch (viewer, guest) (CP-010)"
      description: |
        CONVENTIONS §10.7. Optional token: a signed-in caller gets `role` HOST (their own room,
        publish camera and microphone only) or VIEWER (watch only); a caller without a token is
        a **guest** and must send `guestId` (a random UUID the app keeps for the session), else
        400. The token is valid for 10 minutes **to join**; a joined session stays open, and the
        app asks again to rejoin. Order: rate limit (120/h per user, per IP for guests) →
        `LIVE_HOSTING_ENABLED` (else 503 `LIVE_HOSTING_UNAVAILABLE`) → room visible (else 404:
        nonexistent, host not ACTIVE, or a block either way) → room LIVE (else 409
        `LIVE_ROOM_ENDED`) → a guest needs `allowGuests` (else 403 `LIVE_GUESTS_NOT_ALLOWED`).
      security: [{}, {bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveMediaTokenRequest' }
      responses:
        '200':
          description: Media access for this room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveMediaAccess' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/viewers:
    get:
      tags: [live]
      operationId: listLiveRoomViewers
      summary: "Host: who is watching now, newest first (CP-010)"
      description: |
        Host only (else 404). Users and guests connected now, newest first, paged by the shared
        cursor. A guest is shown as "Guest" with `guestNumber`. Ended room → an empty list.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of viewers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveViewerPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/taps:
    post:
      tags: [live]
      operationId: tapLiveRoom
      summary: "Tap a live to cheer the host: 1 point a counted tap (CP-012)"
      description: |
        CONVENTIONS §10.10. Signed-in callers only (a guest → 401). The app batches taps and
        sends at most one request a second. Counted per caller and room: at most 10 a second
        (a batch adds at most 10 × the seconds since the caller's last counted batch, and at
        most 10 for the first one) and at most 10 000 in the live. The host's own taps count 0;
        seated guests and moderators count like any viewer. Taps past a limit are dropped and
        the answer is still 200, with `accepted` below `count`. Ended room → 409
        `LIVE_ROOM_ENDED`; a room the caller may not see → 404.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveTapsRequest' }
      responses:
        '200':
          description: The taps counted from this batch and the room's score after it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveTapsResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/chat:
    get:
      tags: [live]
      operationId: listLiveChatMessages
      summary: "The last 50 chat messages of a live, oldest first (CP-013)"
      description: |
        CONVENTIONS §10.11. Anyone who may watch the room reads it; a guest without an account
        needs the room's `allowGuests` (else 403 `LIVE_GUESTS_NOT_ALLOWED`). Server-bounded and
        unpaginated (§5): the last 50 messages, without deleted ones. A signed-in reader never
        gets messages from someone they blocked or who blocked them. Works on an ended room too.
        A room the caller may not see → 404.
      security: [{}, {bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '200':
          description: The messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveChatMessageList' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      tags: [live]
      operationId: sendLiveChatMessage
      summary: "Send a chat message in a live (CP-013)"
      description: |
        CONVENTIONS §10.11. Signed-in callers who are in the room now: the host, or someone in
        the room's media session (seated guests and moderators included). Checks, in order:
        401 without an account; 404 for a room the caller may not see; 409 `LIVE_ROOM_ENDED`;
        400 for the text (NFC, trimmed, 1–200 code points, §6 hygiene, no line breaks);
        403 `LIVE_CHAT_NOT_IN_ROOM`; 403 `LIVE_CHAT_MUTED`; 409 `LIVE_CHAT_CLOSED` (the host may
        still send); 429. The stored message is sent to everyone in the room as a `chat` data
        message. A retry with the same `clientId` by the same sender returns 200 with the first
        message and sends nothing again.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveChatSendRequest' }
      responses:
        '201':
          description: The stored message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveChatMessage' }
        '200':
          description: A retry (same `clientId`); the first message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveChatMessage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/chat/{messageId}:
    delete:
      tags: [live]
      operationId: deleteLiveChatMessage
      summary: "Delete a chat message: its author, the host or a moderator (CP-013)"
      description: |
        Soft delete; a `chat-delete` data message is sent. A moderator cannot delete the host's
        or another moderator's message (403 `AUTH_FORBIDDEN`); anyone else who is not the author
        → 403. Already deleted → 204. Unknown message or room the caller may not see → 404.
        Works while the room is live only (else 409 `LIVE_ROOM_ENDED`).
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - name: messageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/chat/mutes:
    get:
      tags: [live]
      operationId: listLiveChatMutes
      summary: "Host or moderator: who is muted in this live's chat (CP-013)"
      description: Newest first, every muted user of the room (at most the room's viewers). Not host or moderator → 403.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '200':
          description: The muted users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveChatMuteList' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/chat/mutes/{username}:
    put:
      tags: [live]
      operationId: muteLiveChatUser
      summary: "Host or moderator: mute someone in this live's chat (CP-013, idempotent)"
      description: |
        The user can no longer send in this live (403 `LIVE_CHAT_MUTED`); their earlier
        messages stay. Lasts for this live only; it is not a block. A moderator cannot mute the
        host or another moderator, and nobody mutes the host (403 `AUTH_FORBIDDEN`). Unknown
        user → 404. Ended room → 409 `LIVE_ROOM_ENDED`.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '204': { description: Muted. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [live]
      operationId: unmuteLiveChatUser
      summary: "Host or moderator: unmute someone in this live's chat (CP-013, idempotent)"
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '204': { description: Unmuted (or was not muted). }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rankings:
    get:
      tags: [live]
      operationId: listLiveRankings
      summary: "The popularity board: hosts by points this hour, today or this week (CP-016 A)"
      description: |
        CONVENTIONS §10.15. Up to 50 hosts with points in the current window, highest first (ties
        by user id), ACTIVE only; a signed-in reader never sees people they blocked or who blocked
        them. Guests may read it (rate limited per IP). `me` is present for a signed-in host: the
        caller's exact rank (null with 0 points) and points.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: period
          in: query
          required: false
          schema: { $ref: '#/components/schemas/LiveRankingPeriod' }
      responses:
        '200':
          description: The board.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRankings' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/contributors:
    get:
      tags: [live]
      operationId: listLiveContributors
      summary: "The top 50 people who gave this live the most points (CP-014)"
      description: |
        CONVENTIONS §10.12. Public (owner D97): anyone who may watch the room reads it; a guest
        without an account needs the room's `allowGuests` (else 403 `LIVE_GUESTS_NOT_ALLOWED`).
        Highest `points` first; ties by who reached them first. Points are counted taps today
        (1 each, CP-012) and, with L3, support (100 a coin). The host is never listed. A
        signed-in reader never gets people they blocked or who blocked them. Server-bounded,
        unpaginated (§5). Works on an ended room too. A room the caller may not see → 404.
      security: [{}, {bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '200':
          description: The contributors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveContributorList' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/heartbeat:
    post:
      tags: [live]
      operationId: heartbeatLiveRoom
      summary: "Host keep-alive for a LIVE room (v1.3)"
      description: |
        Host only. Send every `heartbeatIntervalSeconds` (15 s); a room without a heartbeat for
        `heartbeatStaleAfterSeconds` (45 s) disappears from lists and is ended with
        `HEARTBEAT_TIMEOUT`. Not the host / nonexistent / malformed id → 404 `NOT_FOUND`. Room
        already ended (host, timeout, suspension, admin) → 409 `LIVE_ROOM_ENDED`: the client
        stops heartbeats and shows the ended state; it must go live again for a new room.
        Hosting disabled by config → 503 `LIVE_HOSTING_UNAVAILABLE` (the room then times out).
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '204': { description: Heartbeat recorded. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: LIVE_ROOM_ENDED — the room is no longer live.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/Error' }
        '503':
          description: |
            LIVE_HOSTING_UNAVAILABLE — hosting is disabled by config (`LIVE_HOSTING_ENABLED=false`).
            Returned to every caller before the ownership check; the client stops heartbeats and
            re-checks `getLiveConfig`. SERVICE_UNAVAILABLE — a dependency is down.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/live/rooms/{roomId}/end:
    post:
      tags: [live]
      operationId: endLiveRoom
      summary: "End the caller's live room (idempotent, v1.3)"
      description: |
        Host only. Ends a LIVE room with `endReason = HOST_ENDED` and returns it. Ending a room
        that is already `ENDED` returns 200 with the room unchanged (its original `endReason`
        and `endedAt` are kept). Allowed even when hosting is disabled. Not the host /
        nonexistent / malformed id → 404 `NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '200':
          description: The ended room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoom' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seats:
    get:
      tags: [live]
      operationId: getLiveRoomSeats
      security: [{}, {bearerAuth: []}]
      summary: "Who is on which seat in a MULTI or AUDIO room (CP-011)"
      description: |
        CONVENTIONS §10.9. Open to everyone who may see the room, guests included (rate-limited
        by IP). `version` increases on every seat change; the API also writes it into the media
        room's metadata so connected apps refetch only when it moves. `pendingRequests` is
        present for the host and moderators only; `mine` for a signed-in caller only. A SOLO
        room → 409 `LIVE_SEAT_UNAVAILABLE`. Ended room → 409 `LIVE_ROOM_ENDED`. Not visible → 404.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '200':
          description: The seats.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeats' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seat-requests:
    post:
      tags: [live]
      operationId: requestLiveSeat
      summary: "A viewer asks for a seat (CP-011)"
      description: |
        Signed-in viewers only (a guest → 401). One pending request per user and room: asking
        again returns the pending one (200; 201 when created). Refused with 409
        `LIVE_SEAT_UNAVAILABLE` when the room has no seats (SOLO), the caller is the host or
        already seated, the asked seat is taken, locked or out of range, or no seat is free.
        The request ends when the caller leaves the media session or the room ends.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveSeatRequestBody' }
      responses:
        '200':
          description: The pending request (already asked).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeatRequest' }
        '201':
          description: The new request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeatRequest' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    get:
      tags: [live]
      operationId: listLiveSeatRequests
      summary: "Host or moderator: pending seat requests, oldest first (CP-011)"
      description: Host and moderators only (else 403 `AUTH_FORBIDDEN`). Cursor-paged.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of requests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeatRequestPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seat-requests/me:
    delete:
      tags: [live]
      operationId: cancelLiveSeatRequest
      summary: "Cancel my pending seat request (CP-011, idempotent)"
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '204': { description: No pending request now. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seat-requests/{requestId}/accept:
    post:
      tags: [live]
      operationId: acceptLiveSeatRequest
      summary: "Host or moderator: seat the requester (CP-011)"
      description: |
        Seats the user on `seatIndex`, else the seat they asked for, else the first free seat.
        Already handled, cancelled or the requester left → 409 `LIVE_REQUEST_NOT_PENDING`; no
        usable seat → 409 `LIVE_SEAT_UNAVAILABLE`. Not host or moderator → 403.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/SeatRequestIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveSeatRequestBody' }
      responses:
        '200':
          description: The seats after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeats' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seat-requests/{requestId}/decline:
    post:
      tags: [live]
      operationId: declineLiveSeatRequest
      summary: "Host or moderator: decline a seat request (CP-011)"
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/SeatRequestIdPath'
      responses:
        '204': { description: Declined (or already handled). }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seat-invites:
    post:
      tags: [live]
      operationId: inviteToLiveSeat
      summary: "Host or moderator: invite a viewer onto a seat (CP-011)"
      description: |
        The user must be signed in and watching now (else 409 `LIVE_SEAT_UNAVAILABLE`), not
        seated, and not blocked either way with the host (else 404). One pending invitation per
        user: inviting again replaces it. Expires after 60 seconds. The invitee is told through a
        media data message and sees it in `mine.invite`.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveSeatInviteBody' }
      responses:
        '201':
          description: The invitation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeatInvite' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seat-invites/me/accept:
    post:
      tags: [live]
      operationId: acceptLiveSeatInvite
      summary: "Accept my seat invitation (CP-011)"
      description: |
        Seats the caller on the invited seat if still usable, else the first free seat. None,
        expired or replaced → 409 `LIVE_REQUEST_NOT_PENDING`; no usable seat → 409
        `LIVE_SEAT_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '200':
          description: The seats after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeats' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seat-invites/me/decline:
    post:
      tags: [live]
      operationId: declineLiveSeatInvite
      summary: "Decline my seat invitation (CP-011, idempotent)"
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '204': { description: No pending invitation now. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seats/me/leave:
    post:
      tags: [live]
      operationId: leaveLiveSeat
      summary: "Leave my seat (CP-011, idempotent)"
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '204': { description: Not seated now. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seats/{seatIndex}/mute:
    post:
      tags: [live]
      operationId: muteLiveSeat
      summary: "Host or moderator: mute or unmute a seated guest (CP-011)"
      description: |
        While `mutedByHost`, the media server withdraws the guest's microphone, so they cannot
        unmute themselves. An empty seat → 409 `LIVE_SEAT_UNAVAILABLE`. A moderator cannot mute
        another moderator (403). Idempotent.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/SeatIndexPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [muted]
              additionalProperties: false
              properties:
                muted: { type: boolean }
      responses:
        '200':
          description: The seats after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeats' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seats/{seatIndex}/remove:
    post:
      tags: [live]
      operationId: removeFromLiveSeat
      summary: "Host or moderator: take a guest off their seat (CP-011)"
      description: |
        The guest keeps watching. An empty seat → 200 unchanged. A moderator cannot remove another
        moderator (403).
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/SeatIndexPath'
      responses:
        '200':
          description: The seats after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeats' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seats/{seatIndex}/lock:
    post:
      tags: [live]
      operationId: lockLiveSeat
      summary: "Host: lock or unlock an empty seat (CP-011)"
      description: |
        Host only (moderators → 403). An occupied seat cannot be locked → 409
        `LIVE_SEAT_UNAVAILABLE`. A locked seat cannot be asked for or given. Idempotent.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/SeatIndexPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locked]
              additionalProperties: false
              properties:
                locked: { type: boolean }
      responses:
        '200':
          description: The seats after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeats' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/moderators/{username}:
    put:
      tags: [live]
      operationId: addLiveModerator
      summary: "Host: make a viewer a moderator of this room (CP-011)"
      description: |
        Host only (else 403). The user must be signed in, ACTIVE and not blocked either way with
        the host (else 404). Up to 5 per room (else 422 `VALIDATION_FAILED`, field `moderators`). Moderators last for the room only.
        Idempotent.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: The seats (with the moderator list) after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeats' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [live]
      operationId: removeLiveModerator
      summary: "Host: remove a moderator (CP-011, idempotent)"
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: The seats after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeats' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/admin/live/hosts/{username}:
    put:
      tags: [admin-live]
      operationId: grantLiveHost
      summary: "Admin: grant the hosting permission (CP-010)"
      description: |
        Permission `LIVE_HOSTS` (else 403). Idempotent; audited. Source `ADMIN` (agencies and
        identity checks grant it in L1b). Unknown or not ACTIVE user → 404.
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '204': { description: The user may go live. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [admin-live]
      operationId: revokeLiveHost
      summary: "Admin: revoke the hosting permission (CP-010)"
      description: |
        Permission `LIVE_HOSTS`. Idempotent; audited. Ends the user's LIVE room, if any, with
        `endReason: ADMIN`.
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '204': { description: The user may no longer go live. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------------------------------
  # v1.4-levels (DRAFT, CP-005, D72): four independent level systems. Additive.
  # ------------------------------------------------------------------------------------------
  /api/v1/levels/me:
    get:
      tags: [levels]
      operationId: getMyLevels
      summary: "The caller's four level summaries (draft, CP-005)"
      description: |
        Always four items, in the order ATTRACTIVENESS, SUPPORT, WIZARD, GAMING. A category that is
        disabled or has no published configuration is `UNAVAILABLE` with no level. Names are

  /api/v1/me/followers/{username}:
    delete:
      tags: [me]
      operationId: removeMyFollower
      summary: "Remove one of the caller's followers (D125)"
      description: |
        CONVENTIONS §10.6 (v1.26.1-live, D125). Removes the follow `username` → caller. Idempotent:
        when `username` does not follow the caller → 200 with nothing changed. The follow
        notification it sent the caller is withdrawn (as on an unfollow). They are not told and
        may follow again, unless the caller's account is private (no follow requests, §10.6).
        `username` malformed, unknown, suspended or deleted → 404 `NOT_FOUND`; the caller's own
        username → 400 `VALIDATION_FAILED` (`username` / `invalid_value`). Shares the follow /
        unfollow rate-limit buckets (§7).
      parameters:
        - $ref: '#/components/parameters/UsernamePath'

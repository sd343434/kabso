        rate limit (§7).
        *(v1.26.1-live, D125)* `q` keeps the accounts whose username or display name starts with
        it (case-insensitive); `order=oldest` lists the oldest follow first (the follow's time, then
        the user id, ascending). The cursor is bound to `q` and `order` too (another `q` or

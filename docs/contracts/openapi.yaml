          content:
            application/json:
              schema: { $ref: '#/components/schemas/LevelDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/users/{username}/levels:
    get:
      tags: [levels]
      operationId: getUserLevels
      summary: "Another user's four levels, for their profile (draft, CP-005)"
      description: |
        Owner decision (CP-005 §9.1, 7): levels are public on the profile. Levels only — never
        points, ledger entries or history. Shown for private accounts too (a level is a badge,
        not content). The same 404 as `GET /users/{username}` for a malformed, unknown,

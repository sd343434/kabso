        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    get:
      tags: [families]
      operationId: listFamilyJoinRequests
      summary: "Pending join requests (leader and deputies, CP-018)"
      description: Oldest first, not expired, ACTIVE requesters. Anyone else → 403 `AUTH_FORBIDDEN`.
      parameters:
        - $ref: '#/components/parameters/FamilyIdPath'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of requests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyJoinRequestPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/families/{familyId}/join-requests/{requestId}/accept:
    post:
      tags: [families]
      operationId: acceptFamilyJoinRequest
      summary: "Accept a join request (leader or deputy, CP-018)"
      description: |
        Checks, in order: 404 family; 403 not the leader or a deputy; 404 request; 409
        `FAMILY_REQUEST_NOT_PENDING` (handled, cancelled or expired); 409 `ALREADY_IN_FAMILY` (the
        requester joined another family meanwhile; the request is closed); 409 `FAMILY_FULL`. The
        requester becomes a MEMBER, earns `FIRST_FAMILY` and gets a `FAMILY_JOIN_ACCEPTED`
        notification.
      parameters:
        - $ref: '#/components/parameters/FamilyIdPath'
        - $ref: '#/components/parameters/BondRequestIdPath'
      responses:
        '200':
          description: The new member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyMember' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/families/{familyId}/join-requests/{requestId}/decline:
    post:
      tags: [families]
      operationId: declineFamilyJoinRequest
      summary: "Decline a join request (leader or deputy, CP-018)"
      description: Same checks as accepting (without the capacity); the requester gets a `FAMILY_JOIN_DECLINED` notification.
      parameters:
        - $ref: '#/components/parameters/FamilyIdPath'
        - $ref: '#/components/parameters/BondRequestIdPath'
      responses:
        '204': { description: Declined. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/home/banners:
    get:
      tags: [home]
      operationId: listHomeBanners
      summary: "The promo banners shown on the live hub now (bounded, not paginated; v1.26-live, D124)"
      description: |
        CONVENTIONS §10.26. The banners that are enabled and inside their window now
        (`startsAt <= now < endsAt`, no end = open), ordered by `sortOrder` ascending, then the
        latest `startsAt`, then `id`; at most 10. **Empty** when none is active (the app then shows
        no banner). `title` is the overlay text in the language of `Accept-Language`, else the
        caller's locale (§10.1), or null when the banner has none in that language (no fallback to
        the other language). *(v1.27.4-live, D137)* `placement=room` lists the banners of the promo
        box inside a live instead (3:4 pictures, 600 × 800); the default `home` is the live hub's
        (3:1). `link` is one of the in-app routes `/cp/space`, `/families`,
        `/live?tab=trending|new|following`, `/home/room/{roomId}`, `/users/{username}` or an
        `https://` URL; a stored link that no longer passes these rules is left out. Signed-in
        callers only; the default per-user rate limit. The response carries
        `Cache-Control: private, max-age=60` and `Vary: Authorization, Accept-Language`.
      parameters:
        - name: placement
          in: query
          required: false
          description: "v1.27.4-live (D137): `home` (default, the live hub) or `room` (the promo box in a live). Anything else → 400 `placement` / `invalid_value`."
          schema: { type: string, enum: [home, room], default: home }
      responses:
        '200':
          description: The active banners (possibly empty).
          headers:
            Cache-Control:
              description: "`private, max-age=60`."
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeBannerList' }
              examples:
                none:
                  summary: No active banner
                  value: { data: [] }
                one:
                  summary: The CP space banner with Arabic text on its right half
                  value:
                    data:
                      - id: 0193a4b2-7c1d-7e2f-8a3b-4c5d6e7f8091
                        imageUrl: https://media.kabso.app/media/0193a4b2-7c1d-7e2f-8a3b-4c5d6e7f8092/1500.webp
                        width: 1500
                        height: 500
                        blurhash: LEHV6nWB2yk8pyo0adR*.7kCMdnj
                        title: فضاء الثنائيات
                        titleSide: RIGHT
                        link: /cp/space
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/cp/config:
    get:
      tags: [cp]
      operationId: getCpConfig
      summary: "CP request price, gift amounts and tiers (CP-018)"
      description: Tier names follow `Accept-Language`, else the caller's locale.
      responses:
        '200':
          description: The CP settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CpConfig' }
              example:
                requestCost: 99
                requestTtlDays: 7
                giftAmounts: [10, 52, 99, 520, 1314]
                gifts:
                  - { code: rose_love, amount: 10, name: وردة الحب, assetKey: cp_gift_rose_love }
                  - { code: angel_heart, amount: 52, name: قلب الملاك, assetKey: cp_gift_angel_heart }
                  - { code: love_carriage, amount: 99, name: عربة الحب, assetKey: cp_gift_love_carriage }
                  - { code: swan_love, amount: 520, name: بجعتا الحب, assetKey: cp_gift_swan_love }
                  - { code: eternal_heart, amount: 1314, name: القلب الأبدي, assetKey: cp_gift_eternal_heart }
                tiers:
                  - { level: 1, minPoints: 0, name: ثنائي متحمّس }
                  - { level: 2, minPoints: 520, name: ثنائي فضّي }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/cp/requests:
    post:
      tags: [cp]
      operationId: sendCpRequest
      summary: "Send a CP request for 99 coins (CP-018)"
      description: |
        CONVENTIONS §10.21. Checks, in order: 400 body; a retry with the same `clientId` → 200 (the
        first request and the current balance; nothing charged again); 404 (unknown or inactive
        user, or a block either way); 400 `username` / `invalid_value` (oneself); 409
        `CP_ALREADY_PAIRED` (the caller or the other person has a partner); 409
        `CP_REQUEST_PENDING` (the caller already has a pending request); 409 `INSUFFICIENT_COINS`.
        99 coins are charged (ledger `CP_REQUEST`) and come back (`CP_REFUND`) if the request is
        declined, cancelled or expires after 7 days. The receiver gets a `CP_REQUEST`
        notification.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CpRequestSendRequest' }
            example: { username: layla.k, clientId: 0192f1d0-9999-7000-8000-000000000001 }
      responses:
        '201':
          description: Sent and charged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CpRequestResult' }
              example:
                request:
                  id: 0192f1d0-9999-7000-8000-000000000002
                  sender: { id: 0192f1d0-5555-7000-8000-000000000006, username: sara, displayName: سارة, avatarUrl: null }
                  receiver: { id: 0192f1c2-7a10-7c3e-9d2a-3b4c5d6e7f80, username: layla.k, displayName: ليلى, avatarUrl: null }
                  status: PENDING
                  cost: 99
                  createdAt: '2026-10-26T18:30:00.000Z'
                  expiresAt: '2026-11-02T18:30:00.000Z'
                coins: 401
        '200':
          description: A retry (same `clientId`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CpRequestResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    get:
      tags: [cp]
      operationId: listCpRequests
      summary: "The caller's pending CP requests (CP-018)"
      description: Newest first, not expired. `incoming` hides senders who are not ACTIVE or are blocked either way.
      parameters:
        - name: direction
          in: query
          required: true
          schema: { type: string, enum: [incoming, outgoing] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of requests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CpRequestPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/cp/requests/{requestId}:
    delete:
      tags: [cp]
      operationId: cancelCpRequest
      summary: "The sender cancels a CP request; the 99 coins come back (CP-018)"
      description: Not the caller's sent request → 404; not pending → 409 `CP_REQUEST_NOT_PENDING`.
      parameters:
        - $ref: '#/components/parameters/BondRequestIdPath'
      responses:
        '204': { description: Cancelled and refunded. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/cp/requests/{requestId}/accept:
    post:
      tags: [cp]
      operationId: acceptCpRequest
      summary: "The receiver accepts; the couple is formed (CP-018)"
      description: |
        Checks, in order: 404 (not a request to the caller); 409 `CP_REQUEST_NOT_PENDING` (also
        when it expired, or the sender is no longer active or a block exists either way — then it
        is closed and refunded); 409 `CP_ALREADY_PAIRED`. Every other pending request of either
        partner is cancelled and refunded; both earn `FIRST_CP`; the sender gets a `CP_ACCEPTED`
        notification; the request's 99 coins now count for the sender's family.
      parameters:
        - $ref: '#/components/parameters/BondRequestIdPath'
      responses:
        '200':
          description: The caller's new couple.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CpCouple' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/cp/requests/{requestId}/decline:
    post:
      tags: [cp]
      operationId: declineCpRequest
      summary: "The receiver declines; the sender's 99 coins come back (CP-018)"
      parameters:
        - $ref: '#/components/parameters/BondRequestIdPath'
      responses:
        '204': { description: Declined and refunded. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/cp/me:
    get:
      tags: [cp]
      operationId: getMyCp
      summary: "The caller's CP couple (CP-018)"
      responses:
        '200':
          description: The couple, or null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyCp' }
              example:
                cp:
                  id: 0192f1d0-9999-7000-8000-000000000003
                  partner: { id: 0192f1c2-7a10-7c3e-9d2a-3b4c5d6e7f80, username: layla.k, displayName: ليلى, avatarUrl: null }
                  since: '2026-10-20T18:30:00.000Z'
                  days: 7
                  points: 620
                  level: 2
                  levelName: ثنائي فضّي
                  nextLevelName: ثنائي ذهبي
                  pointsToNext: 694
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [cp]
      operationId: endCp
      summary: "End the couple (CP-018)"
      description: Either partner ends it; nothing is refunded. No partner → 204 too.
      responses:
        '204': { description: Ended. }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/cp/me/gifts:
    post:
      tags: [cp]
      operationId: sendCpGift
      summary: "Spend coins on the partner as a CP gift (CP-018)"
      description: |
        Checks, in order: 400 body (`amount` one of `CpConfig.giftAmounts`); a retry with the same
        `clientId` → 200 (the first gift, the couple and the current balance); 409
        `CP_NOT_PAIRED`; 409 `INSUFFICIENT_COINS`. The charge (ledger `CP_GIFT`; it counts for the
        sender's family) and the couple's CP points (+ `amount`) and tier are one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CpGiftSendRequest' }
            example: { amount: 520, clientId: 0192f1d0-9999-7000-8000-000000000004 }
      responses:
        '201':
          description: Sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CpGiftResult' }
        '200':
          description: A retry (same `clientId`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CpGiftResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/cp/me/tasks:
    get:
      tags: [cp]
      operationId: getMyCpTasks
      summary: "Today's daily CP tasks of the caller's couple (CP-021)"
      description: |
        CONVENTIONS §10.24. The CP day starts at 00:00 in `timeZone` (the server's
        `LIVE_RANKINGS_TIME_ZONE`, default UTC); `resetsAt` is the next 00:00. Each task's reward is
        claimed once per couple and CP day (`POST /cp/me/tasks/{code}/claim`). Names follow
        `Accept-Language`, else the caller's locale. Not paired → 409 `CP_NOT_PAIRED`.
      responses:
        '200':
          description: Today's tasks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CpTasks' }
              example:
                day: '2026-10-26'
                timeZone: UTC
                startsAt: '2026-10-26T00:00:00.000Z'
                resetsAt: '2026-10-27T00:00:00.000Z'
                checkedIn: { me: true, partner: false }
                tasks:
                  - { code: CHECK_IN, name: Check in together, description: Both of you open the CP space today., reward: 10, progress: 1, target: 2, completed: false, claimed: false }
                  - { code: SEND_GIFT, name: Send a CP gift, description: Either of you sends a CP gift today., reward: 20, progress: 1, target: 1, completed: true, claimed: true }
                  - { code: CHAT_TOGETHER, name: Chat in the same live, description: Both of you write in the chat of the same live today., reward: 30, progress: 0, target: 1, completed: false, claimed: false }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/cp/me/check-in:
    post:
      tags: [cp]
      operationId: checkInCp
      summary: "Check in on the CP space today (CP-021)"
      description: |
        Counts for the `CHECK_IN` task (both partners → completed). Once per partner and CP day:
        201 when this call checked in, 200 when the caller already did today (nothing changes).
        Not paired → 409 `CP_NOT_PAIRED`. Answers today's tasks.
      responses:
        '201':
          description: Checked in now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CpTasks' }
        '200':
          description: Already checked in today.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CpTasks' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/cp/me/tasks/{code}/claim:
    post:
      tags: [cp]
      operationId: claimCpTask
      summary: "Claim a completed daily CP task's reward (CP-021)"
      description: |
        Checks, in order: 404 (unknown `code`); 409 `CP_NOT_PAIRED`; already claimed today by either
        partner → 200 (nothing added again); 409 `CP_TASK_NOT_COMPLETED`; 201. The reward is added to
        the couple's CP points (and tier) in the same transaction as the claim, once per couple, task
        and CP day; it counts for the couples ranking.
      parameters:
        - name: code
          in: path
          required: true
          schema: { $ref: '#/components/schemas/CpTaskCode' }
      responses:
        '201':
          description: Claimed now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CpTaskClaimResult' }
        '200':
          description: Already claimed today.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CpTaskClaimResult' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/cp/me/privileges:
    get:
      tags: [cp]
      operationId: getMyCpPrivileges
      summary: "The five CP privileges and which the caller's couple unlocked (CP-021)"
      description: Not paired → `level` null and nothing unlocked. Names follow `Accept-Language`.
      responses:
        '200':
          description: The privileges.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CpPrivileges' }
              example:
                level: 2
                privileges:
                  - { code: SPECIAL_FRAME, name: Special Frame, unlockLevel: 1, unlocked: true, iconKey: cp_priv_frame }
                  - { code: CHAT_BUBBLE, name: Exclusive Chat Bubble, unlockLevel: 2, unlocked: true, iconKey: cp_priv_bubble }
                  - { code: MIC_EFFECT, name: Couple Mic Effect, unlockLevel: 3, unlocked: false, iconKey: cp_priv_mic }
                  - { code: ENTRANCE_EFFECT, name: Entrance Effect, unlockLevel: 4, unlocked: false, iconKey: cp_priv_entrance }
                  - { code: GIFT_WALL, name: CP Gift Wall, unlockLevel: 5, unlocked: false, iconKey: cp_priv_gift_wall }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/cp/me/confessions:
    get:
      tags: [cp]
      operationId: listMyCpConfessions
      summary: "The confessions on the caller's couple page (CP-021)"
      description: Newest first, deleted ones left out. Not paired → 409 `CP_NOT_PAIRED`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of confessions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CpConfessionPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      tags: [cp]
      operationId: createCpConfession
      summary: "Leave a confession for one's CP partner (CP-021)"
      description: |
        Only a partner writes, to the other partner. Checks, in order: 400 body (`text`: the live
        chat text rules, 1–200 code points; `clientId`); a retry with the same `clientId` → 200 (the
        first confession); 409 `CP_NOT_PAIRED`; 403 `AUTH_FORBIDDEN` (the partner is not ACTIVE, or a
        block either way between the partners). Both partners' live blocked words are masked
        (§10.14) before it is stored. 10 an hour per user (§7).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CpConfessionCreateRequest' }
            example: { text: أحبك أكثر كل يوم, clientId: 0192f1d0-9999-7000-8000-000000000011 }
      responses:
        '201':
          description: Written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CpConfession' }
        '200':
          description: A retry (same `clientId`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CpConfession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/cp/me/confessions/{confessionId}:
    delete:
      tags: [cp]
      operationId: deleteCpConfession
      summary: "Remove a confession from the caller's couple page (CP-021)"
      description: Either partner (the author or the one it was written to). Not on the caller's current couple page → 404; already removed → 204.
      parameters:
        - name: confessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/cp/rankings:
    get:
      tags: [cp]
      operationId: listCpRankings
      summary: "The couples ranking by CP points gained this CP week or in all (CP-021)"
      description: |
        `WEEK` (default): CP points gained since Monday 00:00 in the CP time zone (`startsAt` /
        `endsAt`); `ALL`: the couple's CP points. Ongoing couples with points, both partners ACTIVE;
        couples with a partner the reader blocked, or who blocked the reader, are left out. Highest
        first, ties by couple id; at most 100 couples, paged. `me`: the caller's couple (`rank` null
        with no points), null when not paired. Level names follow `Accept-Language`.
      parameters:
        - name: period
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CpRankingPeriod' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of the ranking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CpRankings' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/cp/couples/{coupleId}:
    get:
      tags: [cp]
      operationId: getCpCouple
      summary: "A couple's CP space, read-only (CP-021)"
      description: |
        Anyone signed in opens a couple from `PublicProfile.cp.id` or the ranking. 404 when the couple
        ended, a partner is not ACTIVE, or (for a reader who is not a partner) a block either way
        between the reader and a partner.
      parameters:
        - $ref: '#/components/parameters/CpCoupleIdPath'
      responses:
        '200':
          description: The couple.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CpCouplePublic' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

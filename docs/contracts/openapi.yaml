        user id), paged with the signed cursor of §5 bound to the list, the user and the caller
        (a cursor of another list, user or caller → 400 `cursor` / `invalid_value`). Rows: only
        ACTIVE accounts, never one with a block either way with the caller; the caller's own row
        has `isSelf: true`. The user unknown / malformed / suspended / deleted, or with a block
        either way with the caller → 404 `NOT_FOUND`. A private user (`isPrivate`) whom the
        caller neither is nor follows → 403 `AUTH_FORBIDDEN`. Shares the `getPublicProfile`
        rate limit (§7).
        *(v1.26.1-live, D125)* `q` keeps the accounts whose username or display name starts with
        it (case-insensitive); `order=oldest` lists the oldest follow first (the follow's time, then

  /api/v1/live/rooms:
    get:
      tags: [live]
      operationId: listLiveRooms
      security: [{}, {bearerAuth: []}]
      summary: "List live rooms for a discovery tab (cursor-paginated; v1.3)"
      description: |
        CONVENTIONS §10.2 and §10.4. Only rooms with `status = LIVE`, a fresh heartbeat and an
        `ACTIVE` host. Stale rooms are filtered out; this read never writes (v1.3.1, SEC-035). Orderings: `popular` = score desc, startedAt desc, id desc (v1.8-live, CP-012; was viewerCount); `new` =
        startedAt desc, id desc; `following` = rooms of hosts the caller follows, startedAt desc,
        id desc. `category` filters every tab. CP-010: guests (no token) may call `popular` and
        `new`; `following` without a token → 401. A well-formed slug that is unknown or inactive
        returns an empty list (200). Rankings can change between pages; **clients dedupe by
        `id`** (HL-H5). CP-012: the room score changes while people tap, so rooms move between
        pages more often; v1.8-live cursors carry the score (cursors of an older format, any tab → 400).
        *(v1.26.4-live, D129)* `kind` filters every tab like `category`: `audio` = `AUDIO` rooms
        (voice rooms, podcasts included), `video` = `SOLO`, `PK` and `MULTI`; absent = all rooms. The
        cursor is bound to it (a cursor of another kind → 400). The score that orders `popular`
        belongs to one live: every go-live is a new room starting at 0, and an ended room is never
        listed, so a host who ends a live loses that ranking (§10.10).
        *(v1.27.1-live, D133)* `kind` also takes `solo` (`SOLO` and `PK`: the hub's lives), `multi`
        (`MULTI`) and `party` (`AUDIO` and `MULTI`: the party page). `scope=nearby` keeps the rooms
        whose host's country (`Me.country`, set by the host) is the caller's; it needs a token
        (guest → 401, like `following`); a caller with no country gets 200 with an empty page and
        `emptyReason` `COUNTRY_NOT_SET` (no country is ever guessed, e.g. from the IP). `featured=true`
        keeps the rooms of currently featured hosts (admin `feature-admin` CLI) and **orders them by
        feature rank ascending, then score desc, startedAt desc, id desc on every tab** (`tab` still
        filters `following`). `scope`, `featured`, `kind` and `category` combine freely and filter every
        tab; the cursor is bound to all of them (and, for `nearby`, to the caller and their country:
        a cursor issued before the caller's country changed → 400). Explore is `tab=new` (unchanged).
      parameters:
        - name: tab
          in: query
          required: true
          schema: { type: string, enum: [popular, new, following] }
        - name: category
          in: query
          required: false
          description: 'Category slug. Malformed → 400 `VALIDATION_FAILED` (`field "category"`).'
          schema: { $ref: '#/components/schemas/CategorySlug' }
        - name: kind
          in: query
          required: false
          description: '(v1.26.4-live, D129) `audio`: voice rooms (`mode` `AUDIO`); `video`: `SOLO`, `PK` and `MULTI`. (v1.27.1-live, D133) `solo`: `SOLO` and `PK`; `multi`: `MULTI`; `party`: `AUDIO` and `MULTI`. Absent: every room. Another value → 400 `VALIDATION_FAILED` (`field "kind"`).'
          schema: { type: string, enum: [audio, video, solo, multi, party] }
        - name: scope
          in: query
          required: false
          description: '(v1.27.1-live, D133) `nearby`: only rooms whose host has the same country as the caller (`Me.country`). Needs a token (else 401). A caller without a country → 200, empty page, `emptyReason` `COUNTRY_NOT_SET`. Absent: every country. Another value → 400 (`field "scope"`).'
          schema: { type: string, enum: [nearby] }
        - name: featured
          in: query
          required: false
          description: '(v1.27.1-live, D133) `true`: only rooms of hosts featured now, ordered by feature rank ascending, then score desc, startedAt desc, id desc (on every tab). `false` or absent: no filter, the tab''s order. Another value → 400 (`field "featured"`).'
          schema: { type: string, enum: ['true', 'false'] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of live rooms.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoomPage' }
              examples:
                empty:
                  summary: Nobody is live
                  value:
                    data: []
                    page: { nextCursor: null, hasMore: false }
                onePage:
                  summary: One room, more pages follow
                  value:
                    data:
                      - id: 0192f1d0-1111-7aaa-8bbb-0c0d0e0f1011
                        title: سهرة طرب
                        mode: SOLO
                        viewerCount: 0
                        startedAt: '2026-10-16T19:00:00.000Z'
                        coverUrl: null
                        category: null
                        host:
                          id: 0192f1c2-7a10-7c3e-9d2a-3b4c5d6e7f80
                          username: layla.k
                          displayName: ليلى
                          avatarUrl: null
                        seatCount: null
                        occupiedSeats: 0
                        theme: classic
                        score: 1240
                        topic: null
                    page: { nextCursor: eyJ2IjoxLCJ0IjoibmV3In0.q2Fm0b7xT1sYg8aE3k9Lzw, hasMore: true }
        '400':
          description: VALIDATION_FAILED — bad `tab`, malformed `category`, bad `kind`, `scope` or `featured` (v1.27.1-live), `limit` out of range, or a malformed, tampered or mismatched `cursor` (`field "cursor"`, `issue "invalid_value"`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      tags: [live]
      operationId: startLiveRoom
      summary: "Go live: create the caller's LIVE room (v1.3, behind LIVE_HOSTING_ENABLED)"
      description: |
        CONVENTIONS §10.3. Body parsing comes first on every route (CONVENTIONS §4, v1.3.1
        QA-001): malformed JSON or an oversized body → 400 `VALIDATION_FAILED` before every
        check below, even without a token or while hosting is disabled. Then, in order: auth →
        rate limit → `LIVE_HOSTING_ENABLED` (else
        503 `LIVE_HOSTING_UNAVAILABLE`, no `Retry-After`) → body → `categorySlug` resolves to an
        **active** category (else 400, `field "categorySlug"`, `issue "invalid_value"`) → the
        caller has no LIVE room with a fresh heartbeat (else 409 `LIVE_ROOM_ALREADY_ACTIVE`; a
        LIVE room with a stale heartbeat is ended with `HEARTBEAT_TIMEOUT` in the same
        transaction and the new room is created). Only `SOLO` rooms can be created; the request
        has no `mode`. No `Idempotency-Key`: a retry after a lost response gets 409 and the
        client resumes the room found via `getPublicProfile` (own username → `liveRoomId`).
        Requires a verified email (every v1.2+ account is verified at creation; a legacy
        unverified account gets 403 `AUTH_FORBIDDEN`). CP-010: also requires the **hosting
        permission** (`Me.canHost`), else 403 `LIVE_HOSTING_NOT_ALLOWED` (checked after
        `LIVE_HOSTING_ENABLED`). `allowGuests` defaults to true.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartLiveRoomRequest' }
            example: { title: سهرة طرب, categorySlug: music, allowGuests: true }
      responses:
        '201':
          description: Room created; the caller starts heartbeats at the cadence from `getLiveConfig`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoom' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409':
          description: LIVE_ROOM_ALREADY_ACTIVE — the caller already has a LIVE room with a fresh heartbeat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/Error' }
        '503':
          description: LIVE_HOSTING_UNAVAILABLE (hosting disabled by config) or SERVICE_UNAVAILABLE (dependency down).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/live/rooms/{roomId}:
    get:
      tags: [live]
      operationId: getLiveRoom
      security: [{}, {bearerAuth: []}]
      summary: "Get a live room, including ended rooms (v1.3)"
      description: |
        A LIVE room whose heartbeat is stale is never reported as LIVE: it is returned as
        `ENDED` with `endReason = HEARTBEAT_TIMEOUT` and `endedAt = lastHeartbeatAt` (§10.2;
        v1.3.1: computed, or by ending that single room). Nonexistent rooms, malformed ids
        and rooms whose host is not `ACTIVE` all return 404 `NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '200':
          description: The room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoom' }
              examples:
                ended:
                  summary: A room the host ended
                  value:
                    id: 0192f1d0-1111-7aaa-8bbb-0c0d0e0f1011
                    title: سهرة طرب
                    mode: SOLO
                    viewerCount: 0
                    startedAt: '2026-10-16T19:00:00.000Z'
                    coverUrl: null
                    category: { slug: music, name: موسيقى }
                    host:
                      id: 0192f1c2-7a10-7c3e-9d2a-3b4c5d6e7f80
                      username: layla.k
                      displayName: ليلى
                      avatarUrl: null
                    status: ENDED
                    endedAt: '2026-10-16T20:12:45.120Z'
                    endReason: HOST_ENDED
                    allowGuests: true
                    seatCount: null
                    occupiedSeats: 0
                    theme: classic
                    score: 1240
                    topic: null
                    scoreParts: { total: 1240, tapPoints: 1240, supportPoints: 0 }
                    chatEnabled: true
                    chatMuted: false
                    kicked: false
                    wishGifts: []
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

    patch:
      tags: [live]
      operationId: updateLiveRoom
      summary: "Host: change a LIVE room's settings (CP-010)"
      description: |
        Host only (else 404). `allowGuests: false` removes every connected guest at once and
        refuses new guest tokens (403 `LIVE_GUESTS_NOT_ALLOWED`); `true` lets them in again.
        `chatEnabled` (CP-013) turns the room chat off or on and sends a `chat-state` data
        message (§10.11). `title`, `categorySlug` and `topic` (CP-014) edit the live while it is
        on; everyone in the room re-reads it when `roomInfoVersion` moves in the media room's
        metadata (§10.12). An unknown or inactive category → 400 (`categorySlug`,
        `invalid_value`). Ended room → 409 `LIVE_ROOM_ENDED`. Idempotent.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLiveRoomRequest' }
      responses:
        '200':
          description: The room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoom' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/media-token:
    post:
      tags: [live]
      operationId: createLiveMediaToken
      summary: "Access to a LIVE room's video: publish (host) or watch (viewer, guest) (CP-010)"
      description: |
        CONVENTIONS §10.7. Optional token: a signed-in caller gets `role` HOST (their own room,
        publish camera and microphone only) or VIEWER (watch only); a caller without a token is
        a **guest** and must send `guestId` (a random UUID the app keeps for the session), else
        400. The token is valid for 10 minutes **to join**; a joined session stays open, and the
        app asks again to rejoin. Order: rate limit (120/h per user, per IP for guests) →
        `LIVE_HOSTING_ENABLED` (else 503 `LIVE_HOSTING_UNAVAILABLE`) → room visible (else 404:
        nonexistent, host not ACTIVE, or a block either way) → room LIVE (else 409
        `LIVE_ROOM_ENDED`) → a guest needs `allowGuests` (else 403 `LIVE_GUESTS_NOT_ALLOWED`).
        v1.20-live (D105): a signed-in caller kicked out of this live → 403 `LIVE_KICKED` (after
        the 409); a later live of the same host is not affected.
      security: [{}, {bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveMediaTokenRequest' }
      responses:
        '200':
          description: Media access for this room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveMediaAccess' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/viewers:
    get:
      tags: [live]
      operationId: listLiveRoomViewers
      summary: "Who is watching now, newest first (CP-010; everyone in the room since v1.23.2-live)"
      description: |
        CONVENTIONS §10.8. Users and guests connected now, newest first, paged by the shared
        cursor. A guest is shown as "Guest" with `guestNumber`. Ended room → an empty list.
        The host of the room: as in v1.6-live, everyone connected. v1.23.2-live (D109): anyone
        else who may watch the room reads it too, in the same shape — a room the caller may not
        see → 404; a guest without an account needs the room's `allowGuests` (else 403
        `LIVE_GUESTS_NOT_ALLOWED`); a caller kicked out of this live → 403 `LIVE_KICKED`. A
        signed-in caller other than the host never sees a user they blocked or who blocked them.
        Before v1.23.2-live it was host only (anyone else → 404).
      security: [{}, {bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of viewers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveViewerPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/taps:
    post:
      tags: [live]
      operationId: tapLiveRoom
      summary: "Tap a live to cheer the host: 1 point a counted tap (CP-012)"
      description: |
        CONVENTIONS §10.10. Signed-in callers only (a guest → 401). The app batches taps and
        sends at most one request a second. Counted per caller and room: at most 10 a second
        (a batch adds at most 10 × the seconds since the caller's last counted batch, and at
        most 10 for the first one) and at most 10 000 in the live. *(v1.25.1-live, D120)* The
        host's own taps count like a viewer's, under the same limits (before: 0); seated guests
        and moderators count like any viewer. Taps past a limit are dropped and
        the answer is still 200, with `accepted` below `count`. Ended room → 409
        `LIVE_ROOM_ENDED`; a room the caller may not see → 404. v1.20-live (D105): a caller
        kicked out of this live → 403 `LIVE_KICKED` (after the 409).
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveTapsRequest' }
      responses:
        '200':
          description: The taps counted from this batch and the room's score after it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveTapsResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/chat:
    get:
      tags: [live]
      operationId: listLiveChatMessages
      summary: "The last 50 chat messages of a live, oldest first (CP-013)"
      description: |
        CONVENTIONS §10.11. Anyone who may watch the room reads it; a guest without an account
        needs the room's `allowGuests` (else 403 `LIVE_GUESTS_NOT_ALLOWED`). Server-bounded and
        unpaginated (§5): the last 50 messages, without deleted ones and (CP-017) without voice
        clips and images past their `expiresAt`. A signed-in reader never gets messages from
        someone they blocked or who blocked them. Works on an ended room too.
        A room the caller may not see → 404.
      security: [{}, {bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '200':
          description: The messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveChatMessageList' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      tags: [live]
      operationId: sendLiveChatMessage
      summary: "Send a chat message in a live (CP-013)"
      description: |
        CONVENTIONS §10.11. Signed-in callers who are in the room now: the host, or someone in
        the room's media session (seated guests and moderators included). Checks, in order:
        401 without an account; 404 for a room the caller may not see; 409 `LIVE_ROOM_ENDED`;
        400 for the text (NFC, trimmed, 1–200 code points, §6 hygiene, no line breaks);
        403 `LIVE_CHAT_NOT_IN_ROOM`; 403 `LIVE_CHAT_MUTED`; 409 `LIVE_CHAT_CLOSED` (the host may
        still send); 429. v1.20-live (D105): a caller kicked out of this live → 403
        `LIVE_KICKED`, checked just before `LIVE_CHAT_NOT_IN_ROOM`. The stored message is sent to everyone in the room as a `chat` data
        message. A retry with the same `clientId` by the same sender returns 200 with the first
        message and sends nothing again.

        CP-017 (CONVENTIONS §10.19): `kind` `VOICE` or `IMAGE` sends the caller's completed
        `LIVE_CHAT_VOICE` / `LIVE_CHAT_IMAGE` upload (`mediaId`, no `text`); the same checks
        apply, then an asset that is not the caller's unattached asset of that kind → 400
        `mediaId` / `invalid_value`. Such a message has `expiresAt` = sent + 60 s and is not
        returned after that.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveChatSendRequest' }
            examples:
              text:
                value: { text: أهلاً بالجميع, clientId: 0192f1d0-1111-7000-8000-000000000001 }
              voice:
                value: { kind: VOICE, mediaId: 0192f1d0-2222-7000-8000-000000000002, clientId: 0192f1d0-1111-7000-8000-000000000003 }
      responses:
        '201':
          description: The stored message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveChatMessage' }
        '200':
          description: A retry (same `clientId`); the first message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveChatMessage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/chat/{messageId}:
    delete:
      tags: [live]
      operationId: deleteLiveChatMessage
      summary: "Delete a chat message: its author, the host or a moderator (CP-013)"
      description: |
        Soft delete; a `chat-delete` data message is sent. A moderator cannot delete the host's
        or another moderator's message (403 `AUTH_FORBIDDEN`); anyone else who is not the author
        → 403. Already deleted → 204. Unknown message or room the caller may not see → 404.
        Works while the room is live only (else 409 `LIVE_ROOM_ENDED`).
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - name: messageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/chat/mutes:
    get:
      tags: [live]
      operationId: listLiveChatMutes
      summary: "Host or moderator: who is muted in this live's chat (CP-013)"
      description: Newest first, every muted user of the room (at most the room's viewers). Not host or moderator → 403.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '200':
          description: The muted users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveChatMuteList' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/chat/mutes/{username}:
    put:
      tags: [live]
      operationId: muteLiveChatUser
      summary: "Host or moderator: mute someone in this live's chat (CP-013, idempotent)"
      description: |
        The user can no longer send in this live (403 `LIVE_CHAT_MUTED`); their earlier
        messages stay. Lasts for this live only; it is not a block. A moderator cannot mute the
        host or another moderator, and nobody mutes the host (403 `AUTH_FORBIDDEN`). Unknown
        user → 404. Ended room → 409 `LIVE_ROOM_ENDED`.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '204': { description: Muted. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [live]
      operationId: unmuteLiveChatUser
      summary: "Host or moderator: unmute someone in this live's chat (CP-013, idempotent)"
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '204': { description: Unmuted (or was not muted). }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/kicks:
    post:
      tags: [live]
      operationId: kickFromLive
      summary: "Host or moderator: kick someone out of this live (v1.20-live, D105)"
      description: |
        CONVENTIONS §10.20. Audio and video lives. The person is removed from the media session
        at once, loses their seat, pending seat request, invitation and moderator role, and
        cannot come back to **this live** (media token, chat, bullets, taps and seat requests →
        403 `LIVE_KICKED`) until it ends; a later live of the same host is not affected. The
        room gets a `kick` data message on topic `kick`. Checks, in order: 401; 404 for a room
        the caller may not see; 409 `LIVE_ROOM_ENDED`; 400 for the body; 403 `AUTH_FORBIDDEN`
        when the caller is not the host or a moderator; 404 for an unknown or inactive user;
        403 `AUTH_FORBIDDEN` when the target is the caller, the host, or (for a moderator)
        another moderator. Kicking someone already kicked → 200 with the first kick (nothing
        sent or audited again). Audited (`live.kick`).
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveKickRequest' }
            example: { username: sara }
      responses:
        '201':
          description: Kicked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveKick' }
              example:
                user: { id: 0192f1d0-5555-7000-8000-000000000006, username: sara, displayName: سارة, avatarUrl: null }
                kickedAt: '2026-10-26T18:30:00.000Z'
        '200':
          description: Already kicked from this live; the first kick.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveKick' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    get:
      tags: [live]
      operationId: listLiveKicks
      summary: "Host or moderator: who was kicked out of this live (v1.20-live, D105)"
      description: |
        Newest first, every kicked user of the room who is still ACTIVE. Not host or moderator →
        403 `AUTH_FORBIDDEN`; a room the caller may not see → 404. Also on an ended room.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '200':
          description: The kicked users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveKickList' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/kicks/{username}:
    delete:
      tags: [live]
      operationId: unkickFromLive
      summary: "Host or moderator: let a kicked person back into this live (v1.20-live, idempotent)"
      description: |
        CONVENTIONS §10.20. The person may get a media token and watch again (their seat and
        roles are not given back). Not kicked → 204 too. Checks: 401; 404 room; 409
        `LIVE_ROOM_ENDED`; 403 `AUTH_FORBIDDEN` (not host or moderator); 404 unknown user.
        Audited (`live.kick.undo`) when a kick was removed.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '204': { description: Not kicked any more (or never was). }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/bullets:
    post:
      tags: [live]
      operationId: sendLiveBullet
      summary: "Send a bullet message to every live, for 15 coins (CP-017)"
      description: |
        CONVENTIONS §10.19. A signed-in caller who is in this LIVE room now (the host, or in its
        media session). Checks, in order: 401 without an account; 404 for a room the caller may
        not see; 409 `LIVE_ROOM_ENDED`; 400 for the body (`text`: the chat rules with 1–60 code
        points); a retry with the same `clientId` → 200 (the first bullet and the current
        balance; nothing charged or sent again); 403 `LIVE_KICKED` (v1.20-live, D105: kicked out
        of this live); 403 `LIVE_CHAT_NOT_IN_ROOM`; 403
        `LIVE_CHAT_MUTED` (muted in this live's chat); 429 (one bullet every 5 s per user); 409
        `INSUFFICIENT_COINS` (a balance under 15; nothing stored, charged or sent). On success 15
        coins are charged in the same transaction and, after the response, the bullet is sent to
        every LIVE room as a `bullet` data message on topic `bullet`
        (`{"type":"bullet","bullet":LiveBullet}`).
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveBulletSendRequest' }
            example: { text: مساء الخير يا أحلى لايف, clientId: 0192f1d0-3333-7000-8000-000000000004 }
      responses:
        '201':
          description: Sent and charged; the bullet and the balance after it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveBulletResult' }
              example:
                bullet:
                  id: 0192f1d0-4444-7000-8000-000000000005
                  text: مساء الخير يا أحلى لايف
                  sender: { id: 0192f1d0-5555-7000-8000-000000000006, username: sara, displayName: سارة, avatarUrl: null }
                  roomId: 0192f1d0-6666-7000-8000-000000000007
                  createdAt: '2026-10-26T18:30:00.000Z'
                coins: 85
        '200':
          description: A retry (same `clientId`); the first bullet and the current balance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveBulletResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: "`LIVE_ROOM_ENDED`, or `INSUFFICIENT_COINS` (nothing charged)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error:
                  code: INSUFFICIENT_COINS
                  message: Not enough coins.
                  requestId: 0192f1d0-7777-7000-8000-000000000008
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seat-emoji:
    post:
      tags: [live]
      operationId: sendLiveSeatEmoji
      summary: "Play an emoji once on one's own seat (D138)"
      description: |
        v1.27.5-live, CONVENTIONS §10.30. A signed-in caller in a LIVE room with seats (`AUDIO` or
        `MULTI`) who is the host (tile 0) or seated now. Checks, in order: 401 without an account;
        404 for a room the caller may not see; 409 `LIVE_ROOM_ENDED`; 400 for the body (`token`:
        `required`, or `invalid_value` when it is not one of the owner's pack emojis); 403
        `LIVE_KICKED`; 409 `LIVE_SEAT_UNAVAILABLE` (a room without seats, or the caller is neither
        the host nor seated); 429 (one every 2 s per user, with `Retry-After`). Nothing is stored. On
        success the room gets a reliable data message on topic `seat-emoji`:
        `{"type":"seat-emoji", …LiveSeatEmoji}` (best effort, like every data message).
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveSeatEmojiRequest' }
            example: { token: ':kabi_love:' }
      responses:
        '200':
          description: Sent to the room; what the room was sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeatEmoji' }
              example:
                id: 0192f1d0-4444-7000-8000-000000000009
                seat: 2
                user: { id: 0192f1d0-5555-7000-8000-000000000006, username: sara, displayName: سارة, avatarUrl: null }
                token: ':kabi_love:'
                createdAt: '2026-10-27T18:30:00.000Z'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: "`LIVE_ROOM_ENDED`, or `LIVE_SEAT_UNAVAILABLE` (no seats in this room, or the caller is not on one)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error:
                  code: LIVE_SEAT_UNAVAILABLE
                  message: That seat is not available.
                  requestId: 0192f1d0-7777-7000-8000-000000000008
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/sounds:
    post:
      tags: [live]
      operationId: playLiveSound
      summary: "Play a free sound of the soundboard for the whole room (host and moderators, D154)"
      description: |
        v1.32-live, CONVENTIONS §10.33. The host or a moderator of a LIVE room plays one of the free
        quips (`Gift.category` `QUIPS` with `priceCoins` 0) for everyone; it takes the next slot of the
        room's quip queue, like a quip sent from the gift panel, and costs nothing. Checks, in order:
        401 without an account; 429 from the route's bucket (120 / min per user); 404 for a room the
        caller may not see; 409 `LIVE_ROOM_ENDED`; 400 for the body (`soundCode`: `required` or
        `invalid_format`); 403 `AUTH_FORBIDDEN` (not the host or a moderator of this live); 409
        `GIFT_UNAVAILABLE` (not an enabled free quip); 429 (one sound every 2 s per user, with
        `Retry-After`); 409 `QUIP_QUEUE_FULL` (it would start more than `QUIP_QUEUE_MAX_WAIT_SECONDS`
        from now). On success the room gets a reliable data message on topic `quip`:
        `{"type":"quip","quip":LiveQuip}` (best effort, like every data message).
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveSoundRequest' }
            example: { soundCode: quip_clap }
      responses:
        '201':
          description: Queued and sent to the room; what the room was sent.
          content:
            application/json:
              schema:
                type: object
                required: [quip]
                properties:
                  quip: { $ref: '#/components/schemas/LiveQuip' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: "`LIVE_ROOM_ENDED`, `GIFT_UNAVAILABLE` or `QUIP_QUEUE_FULL`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error:
                  code: QUIP_QUEUE_FULL
                  message: Too many quips are waiting in this live; try again in a moment.
                  requestId: 7b0f6f0e-1c2d-4e5f-8a9b-0c1d2e3f4a5b
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/live/rooms/{roomId}/gifts:
    post:
      tags: [live]
      operationId: sendLiveGift
      summary: "Send a gift to the host and/or seated people, with coins or from the bag (CP-020)"
      description: |
        CONVENTIONS §10.23. A signed-in caller in this LIVE room now (the host, or in its media
        session), not kicked out of it. Each recipient (the host and/or people seated in the room
        now; 1 … 25; v1.26.3-live, D128: the caller too when they are the host or seated)
        receives `quantity` of the gift. `source: COINS` charges
        `priceCoins × quantity × recipients` coins (ledger `LIVE_GIFT`, it counts for the sender's
        family); `source: BAG` takes `quantity × recipients` of that gift from the caller's gift bag.
        Checks, in order: 401; 429 (6000 / min per user for every send; once the gift is known, a
        normal gift 120 / min and a LUCKY gift 100 / s — D145c, v1.29.2-live D145d, CONVENTIONS §7;
        nothing charged); 404
        for a room the caller may not see; 409
        `LIVE_ROOM_ENDED`; 400 for the body (`quantity` not one of `GiftCatalogue.quantities` →
        `quantity` / `invalid_value`; recipients missing, more than 25 or repeated); a retry with
        the same `clientId` → 200 (the first send, the current balance and bag quantity; nothing
        charged, taken, credited or sent again); 403 `LIVE_KICKED`; 403 `LIVE_CHAT_NOT_IN_ROOM`;
        409 `GIFT_UNAVAILABLE`; 409
        `LIVE_GIFT_RECIPIENT_UNAVAILABLE`; 409 `INSUFFICIENT_COINS` or `GIFT_BAG_INSUFFICIENT`.
        In the same transaction: the live score (`supportPoints`, 100 a coin), the host's
        popularity points, the caller's Contribution points in this live (100 a coin), the
        recipients' charm and the caller's support levels (a gift to oneself gives that person
        both, D128). After the response every viewer gets a
        `gift` data message on topic `gift` (`{"type":"gift","gift":LiveGift}`).
        **v1.27-live (D132), lucky gifts** (`Gift.category` `LUCKY`, CONVENTIONS §10.27): after 409
        `GIFT_UNAVAILABLE` (also for a LUCKY gift while lucky gifts are off) come 400 `source` /
        `invalid_value` (a LUCKY gift is sent with `COINS` only), 403 `LUCKY_GIFT_REGION_UNAVAILABLE`
        (lucky gifts are off in the caller's country, or it is unknown while a country list is
        configured) and 403 `LUCKY_GIFT_AGE_UNCONFIRMED` (the caller has not confirmed they are 18 or
        older, `confirmLuckyGiftAge`), then the checks above. Every gift of the send (`quantity ×
        recipients`) is one draw against the published odds (`getLuckyGiftOdds`); the coins won are
        credited to the caller in the same transaction (ledger `LUCKY_GIFT_WIN`), capped by the daily
        protection, and reported in `luckyResult`; `coins` is the balance after the charge and the
        wins. The recipients' charm, the live score, the popularity board, the Contribution points
        and family points count **10 %** of the gift value (`hostSharePercent`); the caller's Wizard
        level counts the full value (CP-005). A retry returns the first send with the same
        `luckyResult` and never draws again. A send whose best win is at least `bigWinMultiplier`
        also goes to the room as a `lucky-win` data message on topic `lucky`, and (v1.31-live,
        D148) to every other live room as a `lucky-ticker` data message (at most one every 10 s).
        v1.31-live (D148): after 15 losing lucky draws in a row by the caller (any room) the next
        draw pays at least ×5 (`luckyResult.guaranteed`).
        **v1.32-live (D154), quips** (`Gift.category` `QUIPS`, CONVENTIONS §10.33): after 409
        `GIFT_UNAVAILABLE` come 400 `source` / `invalid_value` (`COINS` only) and 400 `quantity` /
        `invalid_value` (quantity 1 only); in the transaction 409 `QUIP_QUEUE_FULL` (it would start
        more than `QUIP_QUEUE_MAX_WAIT_SECONDS` from now) and, for a free quip (`priceCoins` 0), 409
        `QUIP_FREE_USED` (the caller's one free quip of this live was sent). A free quip charges and
        counts nothing. A quip goes to the room as a `quip` data message on topic `quip`
        (`{"type":"quip","quip":LiveQuip}`) instead of the `gift` message, and the response carries
        `quip` (its slot in the room's queue). The recipients' earnings share of every send is fixed
        at the time of the send (`GIFT_HOST_SHARE_PERCENTS`: quips 50 %, other gifts 65 %).
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveGiftSendRequest' }
            example:
              giftCode: rose
              quantity: 10
              recipients: [sara, omar]
              source: COINS
              clientId: 0192f1d0-3333-7000-8000-000000000014
      responses:
        '201':
          description: Sent; the send, the balance and the bag quantity after it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveGiftResult' }
              example:
                gift:
                  id: 0192f1d0-4444-7000-8000-000000000015
                  roomId: 0192f1d0-6666-7000-8000-000000000007
                  giftCode: rose
                  assetKey: gift_rose
                  animationKey: null
                  imageUrl: null
                  animationUrl: null
                  animationBytes: null
                  unitPrice: 1
                  quantity: 10
                  source: COINS
                  totalCoins: 20
                  sender: { id: 0192f1d0-5555-7000-8000-000000000006, username: lina, displayName: لينا, avatarUrl: null }
                  recipients:
                    - { id: 0192f1d0-5555-7000-8000-000000000016, username: sara, displayName: سارة, avatarUrl: null }
                    - { id: 0192f1d0-5555-7000-8000-000000000017, username: omar, displayName: عمر, avatarUrl: null }
                  combo: { id: 0192f1d0-4444-7000-8000-000000000015, count: 1, quantity: 10 }
                  createdAt: '2026-10-26T18:30:00.000Z'
                coins: 80
                bagQuantity: 0
        '200':
          description: A retry (same `clientId`); the first send, the current balance and bag quantity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveGiftResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: "`LIVE_KICKED`, `LIVE_CHAT_NOT_IN_ROOM`; v1.27-live (D132) `LUCKY_GIFT_REGION_UNAVAILABLE` or `LUCKY_GIFT_AGE_UNCONFIRMED` (nothing charged, drawn or sent)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: "`LIVE_ROOM_ENDED`, `GIFT_UNAVAILABLE`, `LIVE_GIFT_RECIPIENT_UNAVAILABLE`, `INSUFFICIENT_COINS` or `GIFT_BAG_INSUFFICIENT`; v1.32-live (D154) `QUIP_QUEUE_FULL` or `QUIP_FREE_USED` (nothing charged or sent)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error:
                  code: GIFT_BAG_INSUFFICIENT
                  message: Not enough of that gift in your bag.
                  requestId: 0192f1d0-7777-7000-8000-000000000018
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/gifts/lucky/odds:
    get:
      tags: [gifts]
      operationId: getLuckyGiftOdds
      summary: "The published odds of lucky gifts (v1.27-live, D132)"
      description: |
        CONVENTIONS §10.27. Public (store disclosure): guests may read it (rate limited per IP). The
        multiplier table the server draws from **now**, each outcome's chance, the chance of no win,
        the target return, the host share, the daily protection and the age limit. `caller` is null
        for a guest; for a signed-in caller it says whether they may send lucky gifts now and, if
        not, why. Served also while lucky gifts are off (`enabled` false). Never cached by clients
        for longer than the response says (`Cache-Control: no-store`, §1).
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: The odds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LuckyGiftOdds' }
              example:
                enabled: true
                drawsPerGift: 1
                returnPercent: 84.9999
                hostSharePercent: 10
                outcomes:
                  - { multiplier: 5, chancePerMillion: 48918, probability: 0.048918 }
                  - { multiplier: 10, chancePerMillion: 15451, probability: 0.015451 }
                  - { multiplier: 25, chancePerMillion: 3903, probability: 0.003903 }
                  - { multiplier: 50, chancePerMillion: 1464, probability: 0.001464 }
                  - { multiplier: 100, chancePerMillion: 569, probability: 0.000569 }
                  - { multiplier: 250, chancePerMillion: 130, probability: 0.00013 }
                  - { multiplier: 500, chancePerMillion: 40, probability: 0.00004 }
                  - { multiplier: 1000, chancePerMillion: 12, probability: 0.000012 }
                noWinChancePerMillion: 929513
                noWinProbability: 0.929513
                bigWinMultiplier: 100
                pity: { after: 15, multiplier: 5 }
                dailyProtection: true
                dayTimeZone: UTC
                minimumAge: 18
                caller: { eligible: false, reason: AGE_UNCONFIRMED, ageConfirmed: false }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rankings:
    get:
      tags: [live]
      operationId: listLiveRankings
      summary: "The popularity board: hosts by points this hour, today or this week (CP-016 A)"
      description: |
        CONVENTIONS §10.15. Up to 50 hosts with points in the current window, highest first (ties
        by user id), ACTIVE only; a signed-in reader never sees people they blocked or who blocked
        them. Guests may read it (rate limited per IP). `me` is present for a signed-in host: the
        caller's exact rank (null with 0 points) and points.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: period
          in: query
          required: false
          schema: { $ref: '#/components/schemas/LiveRankingPeriod' }
      responses:
        '200':
          description: The board.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRankings' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/contributors:
    get:
      tags: [live]
      operationId: listLiveContributors
      summary: "The top 50 people who gave this live the most points (CP-014)"
      description: |
        CONVENTIONS §10.12. Public (owner D97): anyone who may watch the room reads it; a guest
        without an account needs the room's `allowGuests` (else 403 `LIVE_GUESTS_NOT_ALLOWED`).
        Highest `points` first; ties by who reached them first. Points are counted taps (1 each,
        CP-012) and, v1.23-live (CP-020), 100 for every coin of value of the gifts the person sent
        in this live (from coins or the bag). The host is never listed. A
        signed-in reader never gets people they blocked or who blocked them. Server-bounded,
        unpaginated (§5). Works on an ended room too. A room the caller may not see → 404.
      security: [{}, {bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '200':
          description: The contributors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveContributorList' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/contributors/{username}:
    get:
      tags: [live]
      operationId: getLiveContributor
      summary: "One person's points in this live and their place in the Contribution list (v1.20-live, D105)"
      description: |
        CONVENTIONS §10.12. For the "points" button on a person's card. The same points and order
        as `listLiveContributors`, for anyone, not only the top 50: `points` is what this person
        gave the live (0 when nothing, and always 0 for the host), `rank` their place among the
        people with points (1 = first; ties as the list orders them), null when `points` is 0.
        The rank is counted in the list as the reader sees it (a signed-in reader's blocks
        either way are left out, as in the list), so the first 50 ranks match the list exactly.
        Same access as the list: anyone who may watch the room (a guest needs `allowGuests`,
        else 403 `LIVE_GUESTS_NOT_ALLOWED`); also on an ended room. A room the caller may not
        see → 404; an unknown or inactive user, or one blocked either way with a signed-in
        reader → 404.
      security: [{}, {bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: The person's points and rank in this live.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveContributorStanding' }
              example:
                user: { id: 0192f1d0-5555-7000-8000-000000000006, username: sara, displayName: سارة, avatarUrl: null }
                points: 340
                rank: 7
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/stats:
    get:
      tags: [live]
      operationId: getLiveRoomStats
      summary: "Host: the statistics of one of my lives (v1.27.6-live, D140)"
      description: |
        CONVENTIONS §10.31. The host's own summary of a live, while it is LIVE or after it ended
        (the end-of-live screen). Aggregates only: no endpoint says who watched or from where.
        Checks, in order: 401; 404 for a room the caller may not see; 403 `AUTH_FORBIDDEN` when
        the caller is not the room's host. Per-user default rate limit (§7).

        - `score` is the live score (`LiveRoom.scoreParts`); `hostOwnPoints` is the part of it
          from the host's own taps and gifts (D120, D128) — the host is never their own supporter.
        - `supporters`: everyone else with points in the Contribution list (as the host reads it,
          no 50 cap); `topSupporters`: its first three.
        - `giftCount`: the sum of `quantity` of every gift sent in this live (to anyone in it, the
          host's own sends included). `chatMessages`: messages of this live not deleted (the chat
          is removed 30 days after the end). `newFollowers`: people who started following the host
          between the start and the end (now while LIVE) and still do.
        - `viewers` and `viewerCountries` come from the audience record (D140): `null` and `[]`
          for a live started before it. Shares are of `viewers.unique`.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '200':
          description: The live's statistics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoomStats' }
              example:
                roomId: 0192f1d0-1111-7000-8000-000000000001
                status: ENDED
                startedAt: '2026-10-27T18:00:00.000Z'
                endedAt: '2026-10-27T18:03:18.000Z'
                durationSeconds: 198
                score: { total: 2411, tapPoints: 11, supportPoints: 2400 }
                hostOwnPoints: 801
                supporters: 4
                topSupporters:
                  - user: { id: 0192f1d0-5555-7000-8000-000000000006, username: sara, displayName: سارة, avatarUrl: null }
                    points: 1200
                giftCount: 6
                chatMessages: 3
                newFollowers: 2
                viewers: { unique: 11, guests: 1, peak: 11, atEnd: 0, averageWatchSeconds: 74 }
                viewerCountries:
                  - { country: SA, viewers: 3, percent: 27.3 }
                  - { country: EG, viewers: 2, percent: 18.2 }
                  - { country: OTHER, viewers: 4, percent: 36.4 }
                  - { country: UNKNOWN, viewers: 2, percent: 18.2 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/heartbeat:
    post:
      tags: [live]
      operationId: heartbeatLiveRoom
      summary: "Host keep-alive for a LIVE room (v1.3)"
      description: |
        Host only. Send every `heartbeatIntervalSeconds` (15 s); a room without a heartbeat for
        `heartbeatStaleAfterSeconds` (45 s) disappears from lists and is ended with
        `HEARTBEAT_TIMEOUT`. Not the host / nonexistent / malformed id → 404 `NOT_FOUND`. Room
        already ended (host, timeout, suspension, admin) → 409 `LIVE_ROOM_ENDED`: the client
        stops heartbeats and shows the ended state; it must go live again for a new room.
        Hosting disabled by config → 503 `LIVE_HOSTING_UNAVAILABLE` (the room then times out).
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '204': { description: Heartbeat recorded. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: LIVE_ROOM_ENDED — the room is no longer live.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/Error' }
        '503':
          description: |
            LIVE_HOSTING_UNAVAILABLE — hosting is disabled by config (`LIVE_HOSTING_ENABLED=false`).
            Returned to every caller before the ownership check; the client stops heartbeats and
            re-checks `getLiveConfig`. SERVICE_UNAVAILABLE — a dependency is down.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/live/rooms/{roomId}/end:
    post:
      tags: [live]
      operationId: endLiveRoom
      summary: "End the caller's live room (idempotent, v1.3)"
      description: |
        Host only. Ends a LIVE room with `endReason = HOST_ENDED` and returns it. Ending a room
        that is already `ENDED` returns 200 with the room unchanged (its original `endReason`
        and `endedAt` are kept). Allowed even when hosting is disabled. Not the host /
        nonexistent / malformed id → 404 `NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '200':
          description: The ended room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoom' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seats:
    get:
      tags: [live]
      operationId: getLiveRoomSeats
      security: [{}, {bearerAuth: []}]
      summary: "Who is on which seat in a MULTI or AUDIO room (CP-011)"
      description: |
        CONVENTIONS §10.9. Open to everyone who may see the room, guests included (rate-limited
        by IP). `version` increases on every seat change; the API also writes it into the media
        room's metadata so connected apps refetch only when it moves. `pendingRequests` is
        present for the host and moderators only; `mine` for a signed-in caller only.
        v1.23.3-live (D111): `couples` lists the CP couples whose partners both sit now. A SOLO
        room → 409 `LIVE_SEAT_UNAVAILABLE`. Ended room → 409 `LIVE_ROOM_ENDED`. Not visible → 404.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '200':
          description: The seats.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeats' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seat-requests:
    post:
      tags: [live]
      operationId: requestLiveSeat
      summary: "A viewer asks for a seat (CP-011)"
      description: |
        Signed-in viewers only (a guest → 401). One pending request per user and room: asking
        again returns the pending one (200; 201 when created). Refused with 409
        `LIVE_SEAT_UNAVAILABLE` when the room has no seats (SOLO), the caller is the host or
        already seated, the asked seat is taken, locked or out of range, or no seat is free.
        The request ends when the caller leaves the media session or the room ends.
        v1.20-live (D105): a caller kicked out of this live → 403 `LIVE_KICKED`.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveSeatRequestBody' }
      responses:
        '200':
          description: The pending request (already asked).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeatRequest' }
        '201':
          description: The new request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeatRequest' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    get:
      tags: [live]
      operationId: listLiveSeatRequests
      summary: "Host or moderator: pending seat requests, oldest first (CP-011)"
      description: Host and moderators only (else 403 `AUTH_FORBIDDEN`). Cursor-paged.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of requests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeatRequestPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seat-requests/me:
    delete:
      tags: [live]
      operationId: cancelLiveSeatRequest
      summary: "Cancel my pending seat request (CP-011, idempotent)"
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '204': { description: No pending request now. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seat-requests/{requestId}/accept:
    post:
      tags: [live]
      operationId: acceptLiveSeatRequest
      summary: "Host or moderator: seat the requester (CP-011)"
      description: |
        Seats the user on `seatIndex`, else the seat they asked for, else the first free seat.
        Already handled, cancelled or the requester left → 409 `LIVE_REQUEST_NOT_PENDING`; no
        usable seat → 409 `LIVE_SEAT_UNAVAILABLE`. Not host or moderator → 403.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/SeatRequestIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveSeatRequestBody' }
      responses:
        '200':
          description: The seats after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeats' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seat-requests/{requestId}/decline:
    post:
      tags: [live]
      operationId: declineLiveSeatRequest
      summary: "Host or moderator: decline a seat request (CP-011)"
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/SeatRequestIdPath'
      responses:
        '204': { description: Declined (or already handled). }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seat-invites:
    post:
      tags: [live]
      operationId: inviteToLiveSeat
      summary: "Host or moderator: invite a viewer onto a seat (CP-011)"
      description: |
        The user must be signed in and watching now (else 409 `LIVE_SEAT_UNAVAILABLE`), not
        seated, and not blocked either way with the host (else 404). One pending invitation per
        user: inviting again replaces it. Expires after 60 seconds. The invitee is told through a
        media data message and sees it in `mine.invite`.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveSeatInviteBody' }
      responses:
        '201':
          description: The invitation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeatInvite' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seat-invites/me/accept:
    post:
      tags: [live]
      operationId: acceptLiveSeatInvite
      summary: "Accept my seat invitation (CP-011)"
      description: |
        Seats the caller on the invited seat if still usable, else the first free seat. None,
        expired or replaced → 409 `LIVE_REQUEST_NOT_PENDING`; no usable seat → 409
        `LIVE_SEAT_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '200':
          description: The seats after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeats' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seat-invites/me/decline:
    post:
      tags: [live]
      operationId: declineLiveSeatInvite
      summary: "Decline my seat invitation (CP-011, idempotent)"
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '204': { description: No pending invitation now. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seats/me/leave:
    post:
      tags: [live]
      operationId: leaveLiveSeat
      summary: "Leave my seat (CP-011, idempotent)"
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '204': { description: Not seated now. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seats/{seatIndex}/mute:
    post:
      tags: [live]
      operationId: muteLiveSeat
      summary: "Host or moderator: mute or unmute a seated guest (CP-011)"
      description: |
        While `mutedByHost`, the media server withdraws the guest's microphone, so they cannot
        unmute themselves. An empty seat → 409 `LIVE_SEAT_UNAVAILABLE`. A moderator cannot mute
        another moderator (403). Idempotent.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/SeatIndexPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [muted]
              additionalProperties: false
              properties:
                muted: { type: boolean }
      responses:
        '200':
          description: The seats after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeats' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seats/{seatIndex}/remove:
    post:
      tags: [live]
      operationId: removeFromLiveSeat
      summary: "Host or moderator: take a guest off their seat (CP-011)"
      description: |
        The guest keeps watching. An empty seat → 200 unchanged. A moderator cannot remove another
        moderator (403).
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/SeatIndexPath'
      responses:
        '200':
          description: The seats after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveSeats' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/seats/{seatIndex}/lock:
    post:
      tags: [live]
      operationId: lockLiveSeat
      summary: "Host: lock or unlock an empty seat (CP-011)"
      description: |
        Host only (moderators → 403). An occupied seat cannot be locked → 409
        `LIVE_SEAT_UNAVAILABLE`. A locked seat cannot be asked for or given. Idempotent.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - $ref: '#/components/parameters/SeatIndexPath'

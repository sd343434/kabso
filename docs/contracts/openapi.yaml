  # ---- v1.22-live (DRAFT, CP-019, D107) — the bag ---------------------------------------------
  /api/v1/bag/catalogue:
    get:
      tags: [bag]
      operationId: listBagCatalogue
      summary: "The bag catalogue (CP-019)"
      description: |
        CONVENTIONS §10.22. Every item, by category then `sortOrder` (whole, not paged: the
        catalogue is small). `free` items are given to every new account. Names follow
        `Accept-Language`, else the caller's locale. An unknown `category` → 400
        `VALIDATION_FAILED` (`category` / `invalid_value`).
      parameters:
        - $ref: '#/components/parameters/BagCategoryQuery'
      responses:
        '200':
          description: The catalogue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BagCatalogue' }
              example:
                data:
                  - { code: bunny_royal, category: PROFILE_CARD, name: الأرنب الملكي, assetKey: header_bunny_royal, sortOrder: 10, free: true }
                  - { code: kabi_royal, category: PROFILE_CARD, name: كابي الملكي, assetKey: header_kabi_royal, sortOrder: 20, free: false }
                  - { code: golden_stags, category: PROFILE_CARD, name: الغزلان الذهبية, assetKey: header_golden_stags, sortOrder: 30, free: false }
                  - { code: emerald_wings, category: PROFILE_CARD, name: الأجنحة الزمردية, assetKey: header_emerald_wings, sortOrder: 40, free: false }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/me/bag:
    get:
      tags: [bag]
      operationId: getMyBag
      summary: "The items the caller owns, and which one they wear (CP-019)"
      description: |
        CONVENTIONS §10.22. The caller's items in catalogue order; `equipped` is true for at most
        one item per category. Names follow `Accept-Language`, else the caller's locale. An
        unknown `category` → 400 `VALIDATION_FAILED` (`category` / `invalid_value`).
      parameters:
        - $ref: '#/components/parameters/BagCategoryQuery'
      responses:
        '200':
          description: The caller's bag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bag' }
              example:
                data:
                  - { code: bunny_royal, category: PROFILE_CARD, name: الأرنب الملكي, assetKey: header_bunny_royal, acquiredAt: '2026-10-26T18:30:00.000Z', source: FREE_SIGNUP, equipped: true }
                  - { code: emerald_wings, category: PROFILE_CARD, name: الأجنحة الزمردية, assetKey: header_emerald_wings, acquiredAt: '2026-10-27T09:00:00.000Z', source: ADMIN, equipped: false }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/me/bag/equipped:
    put:
      tags: [bag]
      operationId: setMyBagEquipped
      summary: "Wear an owned item, or nothing, in one category (CP-019)"
      description: |
        CONVENTIONS §10.22. `code` wears that item and takes off the one worn before in the
        category; `code: null` takes it off (wears nothing). Idempotent: wearing what is already
        worn, or nothing when nothing is worn, is 200 with the same body. Wearing nothing stays
        so: the server never puts an item back on by itself. 400 `VALIDATION_FAILED`: `code`
        missing (`required`), `category` missing or unknown (`invalid_value`), an empty or too long
        `code`, or an unknown field; 409
        `BAG_ITEM_NOT_OWNED`: the caller does not own `code` in that category (an unknown code
        too); nothing changes then. Names follow `Accept-Language`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetBagEquippedRequest' }
            examples:
              wear:
                summary: Wear the emerald wings
                value: { category: PROFILE_CARD, code: emerald_wings }
              takeOff:
                summary: Wear nothing
                value: { category: PROFILE_CARD, code: null }
      responses:
        '200':
          description: What the caller wears in the category now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BagEquipped' }
              examples:
                worn:
                  value: { category: PROFILE_CARD, equipped: { code: emerald_wings, name: الأجنحة الزمردية, assetKey: header_emerald_wings } }
                nothing:
                  value: { category: PROFILE_CARD, equipped: null }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/gifts/catalogue:
    get:
      tags: [gifts]
      operationId: getGiftCatalogue
      summary: "The gift catalogue: enabled gifts by tab, quantities and combo window (CP-020)"
      description: |
        CONVENTIONS §10.23. The enabled gifts, by tab (`categories` order: POPULAR, EVENT, FUN),
        then `sortOrder`, then `code`; whole (not paged). Empty until an admin adds gifts. Names
        follow `Accept-Language`, else the caller's locale. `version` changes whenever anything but
        the names' language changes: the app caches per language and version.
      responses:
        '200':
          description: The catalogue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GiftCatalogue' }
              example:
                version: 3f2a9c0d81b4e6a7
                categories: [POPULAR, EVENT, FUN]
                quantities: [1, 10, 66, 99, 188, 520, 1314]
                maxRecipients: 25
                comboWindowSeconds: 5
                data:
                  - { code: rose, category: POPULAR, name: وردة, priceCoins: 1, assetKey: gift_rose, animationKey: null, imageUrl: null, animationUrl: null, animationBytes: null, sortOrder: 10, badge: NONE, tag: { code: love, name: حب }, quip: null }
                  - { code: sports_car, category: POPULAR, name: سيارة رياضية, priceCoins: 5000, assetKey: gift_sports_car, animationKey: fx_sports_car, imageUrl: null, animationUrl: null, animationBytes: null, sortOrder: 20, badge: NEW, tag: null, quip: null }
                  - { code: angel_warrior, category: FUN, name: الملاك المحارب, priceCoins: 50, assetKey: gift_angel_warrior, animationKey: null, imageUrl: 'https://media.kabso.example/media/gifts/angel_warrior/1eaf9644281e113f96c7cb40293572e6.png', animationUrl: 'https://media.kabso.example/media/gifts/angel_warrior/d1c23c640419becb8269caa182e98891.svga', animationBytes: 16830815, sortOrder: 10, badge: NEW, tag: { code: luxury, name: فخامة }, quip: null }
                  - { code: quip_ghazal_01, category: QUIPS, name: غزل ١, priceCoins: 99, assetKey: quips/ghazal, animationKey: null, imageUrl: null, animationUrl: null, animationBytes: null, sortOrder: 101, badge: NONE, tag: { code: ghazal, name: غزل }, quip: { soundKey: kabi/ghazal_01, durationMs: 4362, text: 'إيه الجمال ده! تحفة بجد!' } }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/me/lucky-gifts/age-confirmation:
    put:
      tags: [gifts]
      operationId: confirmLuckyGiftAge
      summary: "Confirm once that the caller is 18 or older, to send lucky gifts (v1.27-live, D132)"
      description: |
        CONVENTIONS §10.27. Accounts carry no birth date, so the 18+ gate of lucky gifts is the
        caller's own statement, made once and stored on the server with its time (audited
        `lucky.age_confirm`). Idempotent: confirming again keeps the first time (200 both times).
        `adult` must be `true` (else 400 `adult` / `invalid_value`); there is no way to withdraw it
        from the app. **Pending owner / legal review** (a self-declaration may not be enough in every
        store or country).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LuckyGiftAgeConfirmationRequest' }
            example: { adult: true }
      responses:
        '200':
          description: Confirmed (now or before).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LuckyGiftAgeConfirmation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/me/gifts/bag:
    get:
      tags: [gifts]
      operationId: getMyGiftBag
      summary: "The caller's gift bag (الحقيبة): gifts they hold and may send without coins (CP-020)"
      description: |
        CONVENTIONS §10.23. The enabled gifts the caller holds at least one of, in catalogue
        order, with `quantity`. Gifts reach the bag from an admin (`gift-admin grant`) for now.
        Names follow `Accept-Language`, else the caller's locale.
      responses:
        '200':
          description: The caller's gift bag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GiftBag' }
              example:
                data:
                  - { code: rose, category: POPULAR, name: وردة, priceCoins: 1, assetKey: gift_rose, animationKey: null, imageUrl: null, animationUrl: null, animationBytes: null, sortOrder: 10, badge: NONE, tag: { code: love, name: حب }, quip: null, quantity: 99 }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/media/uploads:
    post:
      tags: [media]
      operationId: createMediaUpload
      summary: "Start an image upload (presigned PUT, v1.5-social draft)"
      description: |
        CONVENTIONS §11.1. Check order: auth → rate limit (counted before the switch, like
        go-live) → `MEDIA_UPLOADS_ENABLED` (503 `MEDIA_UPLOADS_UNAVAILABLE`) → body. Only `POST_IMAGE` exists in M1 (video
        and stories arrive with M2/M3). The URL is valid for 10 minutes; the client sends the bytes
        with exactly `method` and `headers`, then calls `completeMediaUpload`. CP-017: a
        `LIVE_CHAT_VOICE` upload is `audio/mp4` of at most 1 MiB (CONVENTIONS §11.1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMediaUploadRequest' }
      responses:
        '201':
          description: Upload slot created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaUpload' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/media/uploads/{uploadId}/complete:
    post:
      tags: [media]
      operationId: completeMediaUpload
      summary: "Finish an upload: verify, strip metadata, make the sizes"
      description: |
        CONVENTIONS §11.1. Only the uploader may complete (anyone else: 404). The object must
        exist, match the declared type and size, and decode as an image of at most 8 000 px per
        side; else 422 `MEDIA_INVALID` and the object is deleted. Completing again returns the
        same asset (idempotent). CP-017: a `LIVE_CHAT_VOICE` upload must be an MPEG-4 audio file
        whose tracks are all sound and whose length is at most 30 s (else 422 `MEDIA_INVALID`);
        the asset is `type: AUDIO` with `durationMs`.
      parameters:
        - $ref: '#/components/parameters/UploadIdPath'
      responses:
        '200':
          description: The asset, READY.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/media/{mediaId}:
    get:
      tags: [media]
      operationId: getMedia
      summary: "One of the caller's media assets"
      parameters:
        - $ref: '#/components/parameters/MediaIdPath'
      responses:
        '200':
          description: The asset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/posts:
    post:
      tags: [posts]
      operationId: createPost
      summary: "Create a post, a draft or a scheduled post"
      description: |
        CONVENTIONS §11.2. Text and/or 1–10 of the caller's READY, unattached images. At least
        one of `text` and `mediaIds`. `status: SCHEDULED` needs `publishAt` 5 minutes to 30 days
        ahead. Hashtags and mentions are parsed from `text` (§11.6). An `Idempotency-Key` (UUID)
        header is required: a retry with the same key and body returns the first result; the same
        key with another body is 409 `IDEMPOTENCY_CONFLICT`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePostRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/posts/{postId}:
    get:
      tags: [posts]
      operationId: getPost
      summary: "One post the caller may see"
      description: Not visible (private author not followed, blocked either way, removed, pending media of someone else, another user's draft) → 404.
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: The post.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [posts]
      operationId: updatePost
      summary: "Edit the caption, location or settings; publish or reschedule a draft"
      description: |
        Author only (others: 404). Images never change. Editing the text of a published post
        sets `editedAt` and re-parses hashtags and mentions (new mentions only are notified, M4).
        `status` may move DRAFT → PUBLISHED | SCHEDULED and SCHEDULED → DRAFT | PUBLISHED;
        a published post cannot go back.
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePostRequest' }
      responses:
        '200':
          description: The updated post.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [posts]
      operationId: deletePost
      summary: "Delete a post (author)"
      description: Soft delete; the post leaves every list at once. Deleting again → 404.
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/me/posts:
    get:
      tags: [posts]
      operationId: listMyPosts
      summary: "The caller's drafts or scheduled posts"
      parameters:
        - name: status
          in: query
          required: true
          schema: { type: string, enum: [DRAFT, SCHEDULED] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: "Drafts newest first; scheduled soonest first."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/posts/{postId}/pin:
    put:
      tags: [posts]
      operationId: pinPost
      summary: "Pin a published post on the caller's profile (max 3, idempotent)"
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: Pinned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [posts]
      operationId: unpinPost
      summary: "Unpin (idempotent)"
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: Not pinned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/users/{username}/posts:
    get:
      tags: [posts]
      operationId: listUserPosts
      summary: "A user's published posts (profile grid): pinned first, then newest"
      description: Private author not followed, or blocked either way → 404 (the profile itself stays visible).
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/users/{username}/reposts:
    get:
      tags: [posts]
      operationId: listUserReposts
      summary: "Posts a user reposted (profile Reposts tab), newest repost first"
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/feed/posts:
    get:
      tags: [feed]
      operationId: listFeedPosts
      summary: "Posts feed: following (newest) or trending (ranked)"
      description: |
        CONVENTIONS §11.3. `following`: published posts and reposts of followed accounts, newest
        first (a reposted post carries `repostedBy`). `trending`: visible public posts of the last
        7 days ranked by the global score; the first page freezes a snapshot for 10 minutes, so
        later pages never repeat or skip (an expired cursor → 400 `cursor` / `invalid_value`).
      parameters:
        - name: tab
          in: query
          required: true
          schema: { type: string, enum: [following, trending] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.

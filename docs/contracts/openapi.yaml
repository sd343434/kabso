        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/feed/posts:
    get:
      tags: [feed]
      operationId: listFeedPosts
      summary: "Posts feed: following (newest) or trending (ranked)"
      description: |
        CONVENTIONS §11.3. `following`: published posts and reposts of followed accounts, newest
        first (a reposted post carries `repostedBy`). `trending`: visible public posts of the last
        7 days ranked by the global score; the first page freezes a snapshot for 10 minutes, so
        later pages never repeat or skip (an expired cursor → 400 `cursor` / `invalid_value`).
      parameters:
        - name: tab
          in: query
          required: true
          schema: { type: string, enum: [following, trending] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

openapi: 3.1.0
info:
  title: Kabso Live API
  version: 1.3.1
  description: |
    Authoritative HTTP contract. Conventions (errors, pagination, auth, rate limits) are defined in
    CONVENTIONS.md and apply to every operation. Phase 1 scope: health, authentication, sessions,
    current user. v1.3 (Phase 2 slice 1, KL-036) adds live discovery, the host lifecycle of live
    rooms (behind `LIVE_HOSTING_ENABLED`), public profiles and follow (CONVENTIONS §10; data design
    in DB_PHASE2_DISCOVERY.md). Later phases append paths; existing shapes change only via
    contract proposal. **v1.4-levels (DRAFT, CP-005)** adds the four level systems (user and
    admin paths tagged `levels` / `admin-levels`); it is additive and awaits formal approval.
    **v1.5-social (DRAFT, CP-006 M1)** adds media upload, posts, feeds, likes, saves, reposts,
    views, comments, hashtags, search, block / mute / hide, reports and privacy settings
    (CONVENTIONS §11); additive, owner-approved scope (D87).
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: health
    description: "Liveness and readiness probes (unversioned)."
  - name: auth
    description: "Registration, login, token refresh, email verification and password reset."
  - name: sessions
    description: "Management of the caller's device sessions."
  - name: me
    description: "The authenticated user."
  - name: users
    description: "Public user lookups, public profiles and follow."
  - name: live
    description: "Live discovery (categories, room lists, room detail) and the host lifecycle of live rooms (v1.3)."
  - name: levels
    description: "The caller's four independent level systems (v1.4-levels DRAFT, CP-005)."
  - name: media
    description: "Presigned image uploads (v1.5-social DRAFT, CP-006)."
  - name: posts
    description: "Posts, drafts, scheduling, pins, likes, saves, reposts, shares and views (v1.5-social DRAFT)."
  - name: feed
    description: "Following and Trending feeds (v1.5-social DRAFT)."
  - name: comments
    description: "Comments with one level of replies (v1.5-social DRAFT)."
  - name: search
    description: "Hashtags and prefix search (v1.5-social DRAFT)."
  - name: safety
    description: "Block, mute, hide, reports and privacy settings (v1.5-social DRAFT)."
  - name: admin-moderation
    description: "The report queue (admin permission MODERATION; v1.5-social DRAFT)."
  - name: admin-levels
    description: "Level configuration, user progression, reconciliation and audit for admins (role ADMIN; v1.4-levels DRAFT, CP-005)."
paths:
  /health/live:
    get:
      tags: [health]
      operationId: healthLive
      summary: "Liveness probe"
      security: []
      responses:
        '200':
          description: Process is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /health/ready:
    get:
      tags: [health]
      operationId: healthReady
      summary: "Readiness probe (database, Redis)"
      security: []
      responses:
        '200':
          description: Dependencies (database, redis) reachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '503':
          description: A dependency is down.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: "Start a verify-first registration (never reveals whether the email exists)"
      description: |
        v1.2 (CONVENTIONS §6 "Verify-first registration"). Always 202 with a constant body when
        the request is valid and the username is free — whether or not the email is registered.
        No account and no tokens are created here; complete with `registerVerify`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '202':
          description: Verification code emailed if the address can register (constant body).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationPending' }
        '400': { $ref: '#/components/responses/Error' }
        '409':
          description: USERNAME_TAKEN only (taken by an account or a live pending registration).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/auth/register/verify:
    post:
      tags: [auth]
      operationId: registerVerify
      summary: "Complete registration with the emailed code; creates the account and a session"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterVerifyRequest' }
      responses:
        '201':
          description: Account created (email verified) and session started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '409':
          description: USERNAME_TAKEN (backstop race only).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: TOKEN_INVALID for every failure (unknown email, wrong/expired code, attempts exhausted, email registered meanwhile).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/auth/register/resend:
    post:
      tags: [auth]
      operationId: registerResend
      summary: "Re-send the registration code (always 202)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202':
          description: Always returned for a valid body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationPending' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: "Sign in with email or username"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: "Rotate the refresh token and issue a new token pair"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              additionalProperties: false
              properties:
                refreshToken: { type: string, minLength: 10, maxLength: 200 }
      responses:
        '200':
          description: New token pair (refresh token rotated).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: "Revoke the current session"
      description: Revokes the session identified by the access token.
      responses:
        '204': { description: Session revoked. }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/email/verify:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: "Confirm an email address with a single-use token"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 10, maxLength: 200 }
      responses:
        '204': { description: Email verified. }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/email/resend:
    post:
      tags: [auth]
      operationId: resendVerificationEmail
      summary: "Re-send the verification email"
      description: Re-sends the verification email for the authenticated user (no-op if verified).
      responses:
        '202': { description: Accepted. }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: "Request a password-reset email (non-enumerating)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202': { description: 'Always returned, whether or not the email exists.' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: "Set a new password with a reset token"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 10, maxLength: 200 }
                newPassword: { $ref: '#/components/schemas/Password' }
      responses:
        '204': { description: Password changed; all sessions revoked. }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: "List the caller's active sessions"
      responses:
        '200':
          description: Active sessions of the caller, newest first (bounded, max 50).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SessionInfo' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/sessions/{sessionId}:
    delete:
      tags: [sessions]
      operationId: revokeSession
      summary: "Revoke one of the caller's sessions"
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: A malformed id is treated as not found (404), never 400.
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: "Get the authenticated user"
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    patch:
      tags: [me]
      operationId: updateMe
      summary: "Update the caller's preferences (v1.2: locale)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              additionalProperties: false
              properties:
                locale: { $ref: '#/components/schemas/Locale' }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/users/username-availability:
    get:
      tags: [users]
      operationId: checkUsernameAvailability
      summary: "Check whether a username is available"
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Username' }
      responses:
        '200':
          description: Availability (reserved or invalid-but-well-formed names report false).
          content:
            application/json:
              schema:
                type: object
                required: [username, available]
                properties:
                  username: { type: string }
                  available: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/users/{username}:
    get:
      tags: [users]
      operationId: getPublicProfile
      summary: "Get a user's public profile (v1.3)"
      description: |
        CONVENTIONS §10.5. Never contains an email address. A malformed, unknown, reserved,
        pending-registration-only, SUSPENDED or DELETED username returns the same 404
        `NOT_FOUND` (no distinction, and no 400 for a malformed name). `liveRoomId` is set only
        while the user has a LIVE room with a fresh heartbeat (§10.2). The static route
        `/users/username-availability` cannot collide: `-` is not allowed in usernames.
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: The public profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicProfile' }
              examples:
                otherUserLive:
                  summary: Another user who is live now and is followed by the caller
                  value:
                    id: 0192f1c2-7a10-7c3e-9d2a-3b4c5d6e7f80
                    username: layla.k
                    displayName: ليلى
                    avatarUrl: null
                    bio: null
                    isPrivate: false
                    followerCount: 12
                    followingCount: 40
                    isFollowing: true
                    isSelf: false
                    liveRoomId: 0192f1d0-1111-7aaa-8bbb-0c0d0e0f1011
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/users/{username}/follow:
    put:
      tags: [users]
      operationId: followUser
      summary: "Follow a user (idempotent, v1.3)"
      description: |
        CONVENTIONS §10.6. Following someone already followed is a no-op that returns 200 with
        the same body. Target unknown / suspended / deleted / malformed → 404 `NOT_FOUND`. The
        caller's own username → 400 `VALIDATION_FAILED` (`field: "username"`,
        `issue: "invalid_value"`). Target with `isPrivate = true` → 403 `AUTH_FORBIDDEN` for a
        **new** follow (follow requests are deferred). v1.3.1 (QA-002): a caller who already
        follows a private target gets the idempotent 200 `{isFollowing: true, …}`; no edge is
        created.
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: The caller now follows the user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowState' }
              example: { isFollowing: true, followerCount: 13 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [users]
      operationId: unfollowUser
      summary: "Unfollow a user (idempotent, v1.3)"
      description: |
        CONVENTIONS §10.6. Unfollowing someone not followed is a no-op that returns 200. Errors
        as for `followUser`, except that a private target can always be unfollowed (no 403).
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: The caller does not follow the user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowState' }
              example: { isFollowing: false, followerCount: 12 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/config:
    get:
      tags: [live]
      operationId: getLiveConfig
      summary: "Live feature switch and server-driven timings (v1.3)"
      description: |
        Lets the client render honest states (`hostingEnabled = false` → "Going live is not
        available yet"; HL-H6 "Unavailable") and take the heartbeat cadence from the server
        instead of hard-coding it (CONVENTIONS §10.3).
      responses:
        '200':
          description: Current live configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveConfig' }
              example:
                hostingEnabled: false
                heartbeatIntervalSeconds: 15
                heartbeatStaleAfterSeconds: 45
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/categories:
    get:
      tags: [live]
      operationId: listLiveCategories
      summary: "List active live categories (bounded, not paginated; v1.3)"
      description: |
        Active categories ordered by `sortOrder` ascending, then `slug` ascending. The list is
        server-curated and capped at 100 active rows (CONVENTIONS §10.1), so it is returned
        whole with no `page` object. It is **empty** until categories are created (none are
        seeded, D37). `name` is localized (§10.1).
      responses:
        '200':
          description: Active categories (possibly empty).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/LiveCategory' }
              examples:
                empty:
                  summary: Production today (no categories created)
                  value: { data: [] }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms:
    get:
      tags: [live]
      operationId: listLiveRooms
      summary: "List live rooms for a discovery tab (cursor-paginated; v1.3)"
      description: |
        CONVENTIONS §10.2 and §10.4. Only rooms with `status = LIVE`, a fresh heartbeat and an
        `ACTIVE` host. Stale rooms are filtered out; this read never writes (v1.3.1, SEC-035). Orderings: `popular` = viewerCount desc, startedAt desc, id desc; `new` =
        startedAt desc, id desc; `following` = rooms of hosts the caller follows, startedAt desc,
        id desc. `category` filters every tab. A well-formed slug that is unknown or inactive
        returns an empty list (200). Rankings can change between pages; **clients dedupe by
        `id`** (HL-H5). While `viewerCount` is always 0 (no presence yet), `popular` orders like
        `new`.
      parameters:
        - name: tab
          in: query
          required: true
          schema: { type: string, enum: [popular, new, following] }
        - name: category
          in: query
          required: false
          description: 'Category slug. Malformed → 400 `VALIDATION_FAILED` (`field "category"`).'
          schema: { $ref: '#/components/schemas/CategorySlug' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of live rooms.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoomPage' }
              examples:
                empty:
                  summary: Nobody is live
                  value:
                    data: []
                    page: { nextCursor: null, hasMore: false }
                onePage:
                  summary: One room, more pages follow
                  value:
                    data:
                      - id: 0192f1d0-1111-7aaa-8bbb-0c0d0e0f1011
                        title: سهرة طرب
                        mode: SOLO
                        viewerCount: 0
                        startedAt: '2026-10-16T19:00:00.000Z'
                        coverUrl: null
                        category: null
                        host:
                          id: 0192f1c2-7a10-7c3e-9d2a-3b4c5d6e7f80
                          username: layla.k
                          displayName: ليلى
                          avatarUrl: null
                    page: { nextCursor: eyJ2IjoxLCJ0IjoibmV3In0.q2Fm0b7xT1sYg8aE3k9Lzw, hasMore: true }
        '400':
          description: VALIDATION_FAILED — bad `tab`, malformed `category`, `limit` out of range, or a malformed, tampered or mismatched `cursor` (`field "cursor"`, `issue "invalid_value"`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      tags: [live]
      operationId: startLiveRoom
      summary: "Go live: create the caller's LIVE room (v1.3, behind LIVE_HOSTING_ENABLED)"
      description: |
        CONVENTIONS §10.3. Body parsing comes first on every route (CONVENTIONS §4, v1.3.1
        QA-001): malformed JSON or an oversized body → 400 `VALIDATION_FAILED` before every
        check below, even without a token or while hosting is disabled. Then, in order: auth →
        rate limit → `LIVE_HOSTING_ENABLED` (else
        503 `LIVE_HOSTING_UNAVAILABLE`, no `Retry-After`) → body → `categorySlug` resolves to an
        **active** category (else 400, `field "categorySlug"`, `issue "invalid_value"`) → the
        caller has no LIVE room with a fresh heartbeat (else 409 `LIVE_ROOM_ALREADY_ACTIVE`; a
        LIVE room with a stale heartbeat is ended with `HEARTBEAT_TIMEOUT` in the same
        transaction and the new room is created). Only `SOLO` rooms can be created; the request
        has no `mode`. No `Idempotency-Key`: a retry after a lost response gets 409 and the
        client resumes the room found via `getPublicProfile` (own username → `liveRoomId`).
        Requires a verified email (every v1.2+ account is verified at creation; a legacy
        unverified account gets 403 `AUTH_FORBIDDEN`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartLiveRoomRequest' }
            example: { title: سهرة طرب, categorySlug: music }
      responses:
        '201':
          description: Room created; the caller starts heartbeats at the cadence from `getLiveConfig`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoom' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409':
          description: LIVE_ROOM_ALREADY_ACTIVE — the caller already has a LIVE room with a fresh heartbeat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/Error' }
        '503':
          description: LIVE_HOSTING_UNAVAILABLE (hosting disabled by config) or SERVICE_UNAVAILABLE (dependency down).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/live/rooms/{roomId}:
    get:
      tags: [live]
      operationId: getLiveRoom
      summary: "Get a live room, including ended rooms (v1.3)"
      description: |
        A LIVE room whose heartbeat is stale is never reported as LIVE: it is returned as
        `ENDED` with `endReason = HEARTBEAT_TIMEOUT` and `endedAt = lastHeartbeatAt` (§10.2;
        v1.3.1: computed, or by ending that single room). Nonexistent rooms, malformed ids
        and rooms whose host is not `ACTIVE` all return 404 `NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '200':
          description: The room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoom' }
              examples:
                ended:
                  summary: A room the host ended
                  value:
                    id: 0192f1d0-1111-7aaa-8bbb-0c0d0e0f1011
                    title: سهرة طرب
                    mode: SOLO
                    viewerCount: 0
                    startedAt: '2026-10-16T19:00:00.000Z'
                    coverUrl: null
                    category: { slug: music, name: موسيقى }
                    host:
                      id: 0192f1c2-7a10-7c3e-9d2a-3b4c5d6e7f80
                      username: layla.k
                      displayName: ليلى
                      avatarUrl: null
                    status: ENDED
                    endedAt: '2026-10-16T20:12:45.120Z'
                    endReason: HOST_ENDED
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/live/rooms/{roomId}/heartbeat:
    post:
      tags: [live]
      operationId: heartbeatLiveRoom
      summary: "Host keep-alive for a LIVE room (v1.3)"
      description: |
        Host only. Send every `heartbeatIntervalSeconds` (15 s); a room without a heartbeat for
        `heartbeatStaleAfterSeconds` (45 s) disappears from lists and is ended with
        `HEARTBEAT_TIMEOUT`. Not the host / nonexistent / malformed id → 404 `NOT_FOUND`. Room
        already ended (host, timeout, suspension, admin) → 409 `LIVE_ROOM_ENDED`: the client
        stops heartbeats and shows the ended state; it must go live again for a new room.
        Hosting disabled by config → 503 `LIVE_HOSTING_UNAVAILABLE` (the room then times out).
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '204': { description: Heartbeat recorded. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: LIVE_ROOM_ENDED — the room is no longer live.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/Error' }
        '503':
          description: |
            LIVE_HOSTING_UNAVAILABLE — hosting is disabled by config (`LIVE_HOSTING_ENABLED=false`).
            Returned to every caller before the ownership check; the client stops heartbeats and
            re-checks `getLiveConfig`. SERVICE_UNAVAILABLE — a dependency is down.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/live/rooms/{roomId}/end:
    post:
      tags: [live]
      operationId: endLiveRoom
      summary: "End the caller's live room (idempotent, v1.3)"
      description: |
        Host only. Ends a LIVE room with `endReason = HOST_ENDED` and returns it. Ending a room
        that is already `ENDED` returns 200 with the room unchanged (its original `endReason`
        and `endedAt` are kept). Allowed even when hosting is disabled. Not the host /
        nonexistent / malformed id → 404 `NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      responses:
        '200':
          description: The ended room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoom' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }


          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      tags: [notifications]
      operationId: updateNotificationSettings
      summary: "Switch notification types on or off"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNotificationSettingsRequest' }
      responses:
        '200':
          description: The new settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/me/push-token:
    put:
      tags: [notifications]
      operationId: registerPushToken
      summary: "Register or refresh this device's push token (D152)"
      description: |
        v1.30-live (D152, CONVENTIONS §11.12). The token belongs to the **calling session** (one
        per session): a new token replaces the session's previous one, and a token registered by
        another session (the same phone, another account) moves to this one. The app sends it
        after sign-in, on every token refresh and at launch (which also refreshes `lastSeenAt`).
        The session's logout, revocation or expiry removes it; so does Firebase reporting it
        invalid. Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterPushTokenRequest' }
      responses:
        '204': { description: Registered. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [notifications]
      operationId: unregisterPushToken
      summary: "Stop pushes to this device (D152)"
      description: |
        v1.30-live (D152). Removes the calling session's push token (none: nothing to do).
        Idempotent. `POST /auth/logout` removes it too.
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/me/mutes:
    get:
      tags: [safety]
      operationId: listMutes
      summary: "Users the caller muted, newest first (CP-007)"
      description: Every muted account is listed, including one blocked either way, so it can be unmuted. Only the caller sees their own mutes.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummaryPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/users/{username}/mute:
    put:
      tags: [safety]
      operationId: muteUser
      summary: "Mute (idempotent): their posts, reposts and stories leave the caller's feeds; they are not told"
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: Muted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MuteState' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [safety]
      operationId: unmuteUser
      summary: "Unmute (idempotent)"
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: Not muted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MuteState' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/posts/{postId}/hide:
    put:
      tags: [safety]
      operationId: hidePost
      summary: "Hide a post from the caller's feeds (idempotent)"
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '204': { description: Hidden. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [safety]
      operationId: unhidePost
      summary: "Undo hide (idempotent)"
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '204': { description: Not hidden. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/reports:
    post:
      tags: [safety]
      operationId: createReport
      summary: "Report a post, comment, story or user"
      description: One open report per reporter and target (a repeat returns the existing one with 200).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReportRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '200':
          description: Already reported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/me/privacy:
    get:
      tags: [safety]
      operationId: getPrivacy
      summary: "The caller's privacy settings"
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacySettings' }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      tags: [safety]
      operationId: updatePrivacy
      summary: "Change privacy settings (partial)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePrivacyRequest' }
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacySettings' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/admin/reports:
    get:
      tags: [admin-moderation]
      operationId: listAdminReports
      summary: "Open reports, oldest first (permission MODERATION)"
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [OPEN, ACTIONED, DISMISSED], default: OPEN }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/admin/reports/{reportId}/actions:
    post:
      tags: [admin-moderation]
      operationId: actOnReport
      summary: "Remove the target or dismiss the report (audited; every open report on the target closes)"
      parameters:
        - $ref: '#/components/parameters/ReportIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportActionRequest' }
      responses:
        '200':
          description: The report after the action.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque `page.nextCursor` from the previous page (CONVENTIONS §5, §10.4). Omit for the first page.
      schema: { type: string, minLength: 1, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    FollowListSearch:
      name: q
      in: query
      required: false
      description: "(v1.26.1-live, D125) Only the accounts whose username or display name starts with this text (case-insensitive; trimmed, then 1–30 characters)."
      schema: { type: string, minLength: 1, maxLength: 30 }
    FollowListOrder:
      name: order
      in: query
      required: false
      description: "(v1.26.1-live, D125) `newest` (default): the newest follow first; `oldest`: the oldest first."
      schema: { type: string, enum: [newest, oldest], default: newest }
    BagCategoryQuery:
      name: category
      in: query
      required: false
      description: "(v1.22-live, CP-019) Only this category; all categories when absent."
      schema: { $ref: '#/components/schemas/BagCategory' }
    UsernamePath:
      name: username
      in: path
      required: true
      description: Lowercase username. A malformed value is treated as not found (404), never 400.
      schema: { type: string, minLength: 1, maxLength: 64 }
    SeatIndexPath:
      name: seatIndex
      in: path
      required: true
      description: CP-011 — 1 … seatCount-1 (the host is 0). Out of range → 409 `LIVE_SEAT_UNAVAILABLE`.
      schema: { type: integer, minimum: 1, maximum: 24 }
    SeatRequestIdPath:
      name: requestId
      in: path
      required: true
      description: CP-011 — a malformed or unknown id → 404.
      schema: { type: string, format: uuid }
    RoomIdPath:
      name: roomId
      in: path
      required: true
      description: A malformed id is treated as not found (404), never 400.
      schema: { type: string, format: uuid }
    LevelCategoryPath:
      name: category
      in: path
      required: true
      description: "Category code in lower case (v1.4-levels draft). Anything else is 404."
      schema: { type: string, enum: [attractiveness, support, wizard, gaming] }
    LevelCategoryQuery:
      name: category
      in: query
      required: false
      description: Filter by category (lower case). Omit for all four.
      schema: { type: string, enum: [attractiveness, support, wizard, gaming] }
    LevelVersionIdPath:
      name: versionId
      in: path
      required: true
      description: A malformed id is treated as not found (404).
      schema: { type: string, format: uuid }
    UserIdPath:
      name: userId
      in: path
      required: true
      description: A malformed id is treated as not found (404).
      schema: { type: string, format: uuid }
    RunIdPath:
      name: runId
      in: path
      required: true
      description: A malformed id is treated as not found (404).
      schema: { type: string, format: uuid }
    EventIdPath:
      name: eventId
      in: path
      required: true
      description: A malformed id is treated as not found (404).
      schema: { type: string, format: uuid }
    PostIdPath:
      name: postId
      in: path
      required: true
      description: A malformed id is treated as not found (404).
      schema: { type: string, format: uuid }
    MediaIdPath:
      name: mediaId
      in: path
      required: true
      description: A malformed id is treated as not found (404).
      schema: { type: string, format: uuid }
    UploadIdPath:
      name: uploadId
      in: path
      required: true
      description: A malformed id is treated as not found (404).
      schema: { type: string, format: uuid }
    CommentIdPath:
      name: commentId
      in: path
      required: true
      description: A malformed id is treated as not found (404).
      schema: { type: string, format: uuid }
    ReportIdPath:
      name: reportId
      in: path
      required: true
      description: A malformed id is treated as not found (404).
      schema: { type: string, format: uuid }
    HashtagPath:
      name: tag
      in: path
      required: true
      description: Without `#`, any case (compared in NFC lower case). Malformed → 404.
      schema: { type: string, minLength: 1, maxLength: 100 }
    StoryIdPath:
      name: storyId
      in: path
      required: true
      description: A malformed id is treated as not found (404).
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A UUID chosen by the client per logical operation (kept 24 hours).
      schema: { type: string, format: uuid }
    FamilyIdPath:
      name: familyId
      in: path
      required: true
      description: CP-018 — a malformed, unknown or disbanded id → 404.
      schema: { type: string, format: uuid }
    BondRequestIdPath:
      name: requestId
      in: path
      required: true
      description: CP-018 — a family join request or CP request id; malformed or unknown → 404.
      schema: { type: string, format: uuid }
    CpCoupleIdPath:
      name: coupleId
      in: path
      required: true
      description: CP-021 — a CP couple id (`CpCouple.id`, `PublicProfile.cp.id`); malformed or unknown → 404.
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Error envelope (see CONVENTIONS.md §4).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, down] }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, example: VALIDATION_FAILED }
            message: { type: string }
            requestId: { type: string }
            details:
              type: array
              items:
                type: object
                required: [field, issue]
                properties:
                  field: { type: string }
                  issue: { type: string }
    Username:
      type: string
      minLength: 1
      maxLength: 30
      pattern: '^[a-z0-9](?:[a-z0-9._]{0,28}[a-z0-9])?$'
      description: |
        The stored username shape (lookups, paths, responses). v1.28-live (D146): 1–30 (was 3–30) so
        1–2 character premium usernames work everywhere; existing names keep passing. New regular
        usernames follow `RegularUsername`.
    RegularUsername:
      type: string
      minLength: 6
      maxLength: 30
      pattern: '^(?=[a-z0-9_]*[a-z])(?=[a-z0-9_]*[0-9])[a-z0-9](?:[a-z0-9_]{4,28})[a-z0-9]$'
      description: |
        v1.28-live (D146): a new regular username (registration and `changeUsername`): 6–30 of a–z,
        0–9 and `_`, at least one letter and one digit, `_` never first or last, and **not** a premium
        username (`premium`; e.g. `ali777`, CONVENTIONS §10.32). The pattern does not express the
        premium exclusion; the server checks it.
    ChangeUsernameRequest:
      type: object
      required: [username]
      additionalProperties: false
      properties:
        username: { $ref: '#/components/schemas/RegularUsername' }
    PremiumUsernameTier:
      type: string
      enum: [LEGEND, RUBY, GOLD, SILVER]
      description: |
        v1.28-live (D146, the owner's four medals): LEGEND 1–3 characters; RUBY one character
        repeated, 4 or more (`7777`, `aaaaaa`); GOLD 4–5 characters, or a palindrome (`1221`), doubled
        halves (`1212`), a sequence (`123456`, `abcdef`) or a run of three (`ali777`); SILVER 6+
        letters only or digits only. Decided by the server only. Clients show no badge for values
        they do not know.
    PremiumUsernameState:
      type: string
      enum: [AVAILABLE, NOT_FOR_SALE, TAKEN, HELD, YOURS, YOURS_GRACE, RESERVED, REGULAR, INVALID]
      description: CONVENTIONS §10.32. Clients treat values they do not know as not available.
    PremiumUsernameStatus:
      type: object
      required: [username, tier, status, priceCoins, periodDays, heldUntil]
      properties:
        username: { type: string, maxLength: 64, description: "The name as judged (trimmed, lower case, without `@`)." }
        tier:
          oneOf:
            - $ref: '#/components/schemas/PremiumUsernameTier'
            - type: 'null'
        status: { $ref: '#/components/schemas/PremiumUsernameState' }
        priceCoins: { type: [integer, 'null'], minimum: 1, description: "The monthly price now (AVAILABLE, YOURS, YOURS_GRACE), else null." }
        periodDays: { type: integer, minimum: 1, description: Days one rent or renewal adds (30). }
        heldUntil: { type: [string, 'null'], format: date-time, description: HELD and YOURS_GRACE — the end of the grace period. }
    PremiumUsernameTierPrice:
      type: object
      required: [tier, priceCoins]
      properties:
        tier: { $ref: '#/components/schemas/PremiumUsernameTier' }
        priceCoins: { type: [integer, 'null'], minimum: 1, description: "The owner's monthly price, or null (not on sale)." }
    PremiumUsernameStore:
      type: object
      required: [periodDays, graceDays, tiers, suggestions]
      properties:
        periodDays: { type: integer, minimum: 1 }
        graceDays: { type: integer, minimum: 0 }
        tiers:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/PremiumUsernameTierPrice' }
        suggestions:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/PremiumUsernameStatus' }
    MyPremiumUsername:
      type: object
      required: [username, tier, status, source, startedAt, expiresAt, graceUntil, regularUsername, renewPriceCoins, canRenew, periodDays]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        tier: { $ref: '#/components/schemas/PremiumUsernameTier' }
        status: { type: string, enum: [ACTIVE, GRACE] }
        source: { type: string, enum: [RENT, GRANT], description: GRANT — given by the team (`premium-admin grant`). }
        startedAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time, description: The end of the paid period; null for a grant without an end. }
        graceUntil: { type: [string, 'null'], format: date-time, description: GRACE only. }
        regularUsername: { $ref: '#/components/schemas/Username' }
        renewPriceCoins: { type: [integer, 'null'], minimum: 1, description: "The monthly price of a renewal now, or null (not on sale)." }
        canRenew: { type: boolean, description: "A renewal would be accepted now (priced, within 365 days ahead, not an endless grant)." }
        periodDays: { type: integer, minimum: 1 }
    MyPremiumUsernameResponse:
      type: object
      required: [premium]
      properties:
        premium:
          oneOf:
            - $ref: '#/components/schemas/MyPremiumUsername'
            - type: 'null'
    RentPremiumUsernameRequest:
      type: object
      required: [username, priceCoins]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        priceCoins: { type: integer, minimum: 1, maximum: 9007199254740991, description: The monthly price the person was shown. }
    PremiumUsernameRental:
      type: object
      required: [premium, coins]
      properties:
        premium: { $ref: '#/components/schemas/MyPremiumUsername' }
        coins: { type: integer, minimum: 0, description: The balance after the charge. }
    Password:
      type: string
      minLength: 8
      maxLength: 128
    Locale:
      type: string
      enum: [ar, en]
    DeviceInfo:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100, example: Pixel 9 }
        platform: { type: string, enum: [android, ios, web, other] }
        appVersion: { type: string, maxLength: 32 }
    RegisterRequest:
      type: object
      required: [email, password, username, displayName]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { $ref: '#/components/schemas/Password' }
        username: { $ref: '#/components/schemas/RegularUsername' }
        displayName: { $ref: '#/components/schemas/DisplayName' }
        locale: { $ref: '#/components/schemas/Locale' }
        device: { $ref: '#/components/schemas/DeviceInfo' }
    DisplayName:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        v1.2 (CONVENTIONS §6): NFC, trimmed, 1–50 grapheme clusters and ≤ 100 code points.
        ZWNJ/ZWJ allowed between non-joiner, non-space characters; bidi controls, U+200B, U+2060,
        U+FEFF, C0/C1 rejected (`invalid_format`); > 3 consecutive combining marks rejected;
        reserved terms rejected (`reserved_term`). v1.3.1 (SEC-036): text hygiene over vendored
        Unicode 17.0.0 data rejects default-ignorable, Cc/Cf/Zl/Zp/Co/Cs/Cn code points and blank
        look-alikes (Hangul fillers, U+2800, U+FFFC, U+1D159), except inside an RGI emoji, ZWNJ/ZWJ
        as above, and one variation selector after a base character (`invalid_format`). Checked on
        write; stored names are not rewritten.
    VerificationPending:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [verification_pending] }
    RegisterVerifyRequest:
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        code: { type: string, pattern: '^[0-9]{8}$' }
        device: { $ref: '#/components/schemas/DeviceInfo' }
    LoginRequest:
      type: object
      required: [identifier, password]
      additionalProperties: false
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
          description: Email address or username.
        password: { type: string, minLength: 1, maxLength: 128 }
        device: { $ref: '#/components/schemas/DeviceInfo' }
    TokenPair:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        refreshTokenExpiresAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      required: [user, tokens]
      properties:
        user: { $ref: '#/components/schemas/Me' }
        tokens: { $ref: '#/components/schemas/TokenPair' }
    Me:
      type: object
      required: [id, email, emailVerified, username, displayName, locale, role, isPrivate, createdAt, canHost, liveCoverUrl, country]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        username: { $ref: '#/components/schemas/Username' }
        displayName: { type: string }
        bio: { type: [string, 'null'], maxLength: 300 }
        avatarUrl: { type: [string, 'null'], format: uri }
        locale: { $ref: '#/components/schemas/Locale' }
        role: { type: string, enum: [USER, ADMIN] }
        isPrivate: { type: boolean }
        createdAt: { type: string, format: date-time }
        canHost: { type: boolean, description: "CP-010: the caller holds the hosting permission (may go live)." }
        liveCoverUrl:
          type: [string, 'null']
          format: uri
          description: "CP-015: the host's live cover (WebP, 640 px square), or null (the avatar is used)."
        country:
          type: [string, 'null']
          pattern: '^[A-Z]{2}$'
          description: |
            v1.27.1-live (D133): the caller's country (ISO 3166-1 alpha-2, upper case), chosen by the caller
            with `updateMe`, or null (not set; every account starts with none). It decides `scope=nearby` of
            `listLiveRooms` (a host's rooms are nearby for callers of the same country). Never inferred from
            the IP (owner D45: the user chooses their country, location is never inferred; XK is not offered).
            Not shown on public profiles. Always present; older apps ignore it.
        premiumTier:
          $ref: '#/components/schemas/PremiumUsernameTier'
          description: v1.28-live (D146) — present only while the caller's username is their premium username.
    SessionInfo:
      type: object
      required: [id, current, createdAt, lastUsedAt]
      properties:
        id: { type: string, format: uuid }
        current: { type: boolean }
        deviceName: { type: [string, 'null'] }
        platform: { type: [string, 'null'], enum: [android, ios, web, other, null] }
        appVersion: { type: [string, 'null'] }
        ipCountry: { type: [string, 'null'], description: Reserved; null in Phase 1. }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
    PageInfo:
      type: object
      required: [nextCursor, hasMore]
      properties:
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    UserSummary:
      type: object
      description: Minimal public identity of a user (v1.3). Never contains an email.
      required: [id, username, displayName, avatarUrl]
      properties:
        id: { type: string, format: uuid }
        username: { $ref: '#/components/schemas/Username' }
        displayName: { type: string }
        avatarUrl: { type: [string, 'null'], format: uri }
        premiumTier:
          $ref: '#/components/schemas/PremiumUsernameTier'
          description: v1.28-live (D146) — present only while the username is the user's premium username (the badge); absent otherwise.
    PublicProfile:
      type: object
      required: [id, username, displayName, avatarUrl, bio, isPrivate, followerCount, followingCount, isFollowing, isMuted, isSelf, liveRoomId, family, cp, medals, profileCard]
      properties:
        id: { type: string, format: uuid }
        username: { $ref: '#/components/schemas/Username' }
        displayName: { type: string }
        avatarUrl: { type: [string, 'null'], format: uri }
        bio: { type: [string, 'null'], maxLength: 300 }
        premiumTier:
          $ref: '#/components/schemas/PremiumUsernameTier'
          description: v1.28-live (D146) — present only while the username is the user's premium username (the badge); absent otherwise.
        isPrivate:
          type: boolean
          description: When true the user cannot be followed in v1.3 (no follow requests yet); the client hides Follow.
        followerCount:
          type: integer
          minimum: 0
          description: "Accounts following this user (v1.25.2-live, D121: ACTIVE accounts only, the rows of `listUserFollowers`)."
        followingCount:
          type: integer
          minimum: 0
          description: "Accounts this user follows (v1.25.2-live, D121: ACTIVE accounts only, the rows of `listUserFollowing`)."
        isFollowing:
          type: boolean
          description: Whether the caller follows this user (always false when isSelf).
        isMuted:
          type: boolean
          description: "(v1.5-social, CP-007) Whether the caller muted this user (always false when isSelf). Only the caller sees their own mute; the muted user is never told."
        isSelf: { type: boolean }
        liveRoomId:
          type: [string, 'null']
          format: uuid
          description: The user's LIVE room with a fresh heartbeat, else null.
        family:
          description: "(v1.21-live, CP-018) The user's family and role, or null."
          oneOf:
            - $ref: '#/components/schemas/ProfileFamily'
            - type: 'null'
        cp:
          description: "(v1.21-live, CP-018) The user's CP couple (partner, since, tier), or null. The tier name follows Accept-Language."
          oneOf:
            - $ref: '#/components/schemas/ProfileCp'
            - type: 'null'
        medals: { $ref: '#/components/schemas/ProfileMedals' }
        profileCard:
          description: "(v1.22-live, CP-019) The profile card the user wears (the header decoration of their profile card), or null when they wear none."
          oneOf:
            - $ref: '#/components/schemas/ProfileCard'
            - type: 'null'
    FollowState:
      type: object
      required: [isFollowing, followerCount]
      properties:
        isFollowing: { type: boolean }
        followerCount:
          type: integer
          minimum: 0
          description: The target's follower count after the operation (v1.25.2-live, D121, ACTIVE followers only, like `PublicProfile.followerCount`).
    FollowListItem:
      description: "(v1.25.2-live, D121) A row of `listUserFollowers` / `listUserFollowing`: the account and the caller's relation to it."
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required: [isSelf, isPrivate, followedByMe, followsMe]
          properties:
            isSelf:
              type: boolean
              description: The row is the caller (no Follow control).
            isPrivate:
              type: boolean
              description: The account is private; a new follow → 403 (§10.5), so the client offers Follow only when `followedByMe`.
            followedByMe:
              type: boolean
              description: The caller follows this account (false when `isSelf`).
            followsMe:
              type: boolean
              description: This account follows the caller (false when `isSelf`); the client shows "Follow back".
    FollowerRemoval:
      description: "(v1.26.1-live, D125) The answer of `removeMyFollower`."
      type: object
      required: [followsMe, followerCount]
      properties:
        followsMe:
          type: boolean
          enum: [false]
          description: Always false after the operation.
        followerCount:
          type: integer
          minimum: 0
          description: The caller's follower count after the operation (ACTIVE followers only, like `PublicProfile.followerCount`).
    FollowListPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/FollowListItem' }
        page: { $ref: '#/components/schemas/PageInfo' }
    CategorySlug:
      type: string
      minLength: 2
      maxLength: 32
      pattern: '^[a-z0-9-]{2,32}$'
    HomeBanner:
      type: object
      additionalProperties: false
      required: [id, imageUrl, width, height, blurhash, title, titleSide, link]
      description: A promo banner of the live hub (v1.26-live, D124, CONVENTIONS §10.26).
      properties:
        id: { type: string, format: uuid }
        imageUrl:
          type: string
          format: uri
          description: The 1 500 × 500 WebP (3:1); show it cover-fitted at the full content width.
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        blurhash: { type: [string, 'null'] }
        title:
          type: [string, 'null']
          maxLength: 80
          description: Overlay text (1–40 code points) in the requested language, or null.
        titleSide:
          type: string
          enum: [LEFT, RIGHT]
          description: The physical side of the picture left empty for the text (same in both languages).
        link:
          type: string
          maxLength: 512
          description: |
            `/cp/space`, `/families`, `/live?tab=trending|new|following`, `/home/room/{roomId}`,
            `/users/{username}` or an `https://` URL. Apps ignore a link they cannot open.
    HomeBannerList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/HomeBanner' }
    LiveCategory:
      type: object
      required: [slug, name]
      properties:
        slug: { $ref: '#/components/schemas/CategorySlug' }
        name:
          type: string
          maxLength: 40
          description: Localized by `Accept-Language` (ar|en), else the caller's stored locale (CONVENTIONS §10.1).
    LiveConfig:
      type: object
      required: [hostingEnabled, heartbeatIntervalSeconds, heartbeatStaleAfterSeconds, themes, seatCounts]
      properties:
        hostingEnabled:
          type: boolean
          description: Server config `LIVE_HOSTING_ENABLED` (default false until a media provider exists, B1).
        heartbeatIntervalSeconds: { type: integer, minimum: 1, example: 15 }
        heartbeatStaleAfterSeconds: { type: integer, minimum: 1, example: 45 }
        themes:
          type: array
          items: { $ref: '#/components/schemas/LiveThemeSlug' }
          description: CP-011 — room themes the server accepts, in display order (the first is the default).
        seatCounts:
          type: object
          description: CP-011 — the seat counts allowed per mode (host tile included).
          required: [MULTI, AUDIO]
          properties:
            MULTI: { type: array, items: { type: integer }, example: [4, 6, 9, 12] }
            AUDIO: { type: array, items: { type: integer }, example: [5, 10, 15, 20] }
    LiveRoomMode:
      type: string
      enum: [SOLO, PK, MULTI, AUDIO]
      description: |
        SOLO (one host on camera), MULTI (CP-011: multi-guest video with seats), AUDIO (CP-011:
        voice only with seats). PK is reserved for L5. Clients render an unrecognised future
        value as SOLO.
    LiveRoomTitle:
      type: string
      minLength: 1
      maxLength: 160
      description: |
        v1.3 (CONVENTIONS §10.3): NFC, trimmed, 1–80 grapheme clusters and ≤ 160 code points.
        The displayName character-hygiene rules apply (control/bidi/zero-width bans, ZWNJ/ZWJ
        placement, zalgo cap, at least one letter/digit/emoji) → `invalid_format`, including the
        v1.3.1 text-hygiene rules (CONVENTIONS §6, SEC-036). The reserved-term/brand rule and the
        mixed-script rule do **not** apply.
    LiveRoomSummary:
      type: object
      required: [id, title, mode, viewerCount, startedAt, coverUrl, category, host, seatCount, occupiedSeats, theme, score, topic]
      properties:
        id: { type: string, format: uuid }
        title: { $ref: '#/components/schemas/LiveRoomTitle' }
        topic:
          description: CP-014 — the live's topic, or null. Shown in the room and on hub cards (owner D97).
          oneOf:
            - $ref: '#/components/schemas/LiveRoomTopic'
            - type: 'null'
        mode: { $ref: '#/components/schemas/LiveRoomMode' }
        viewerCount:
          type: integer
          minimum: 0
          description: People watching now, guests included, the host excluded (CP-010; 0 before v1.6-live). At 0 the card shows the "New" chip.
        startedAt: { type: string, format: date-time }
        coverUrl:
          type: [string, 'null']
          format: uri
          description: |
            CP-015: the host's live cover when the live started (WebP, 640 px square); a change
            while live updates it. Null → the card falls back to the host avatar.
        category:
          description: Null when the room has no category.
          oneOf:
            - { $ref: '#/components/schemas/LiveCategory' }
            - { type: 'null' }
        host: { $ref: '#/components/schemas/UserSummary' }
        seatCount:
          description: CP-011 — tiles (host included) in a MULTI or AUDIO room; null for SOLO.
          oneOf:
            - { $ref: '#/components/schemas/LiveSeatCount' }
            - { type: 'null' }
        occupiedSeats: { type: integer, minimum: 0, description: "CP-011 — guests seated now (0 for SOLO)." }
        theme: { $ref: '#/components/schemas/LiveThemeSlug' }
        score:
          type: integer
          format: int64
          minimum: 0
          description: CP-012 — the live's points (taps + support); `popular` orders by it.
    LiveRoom:
      allOf:
        - { $ref: '#/components/schemas/LiveRoomSummary' }
        - type: object
          required: [status, endedAt, endReason, allowGuests, scoreParts, chatEnabled, chatMuted, kicked, wishGifts]
          properties:
            wishGifts:
              type: array
              maxItems: 4
              description: |
                v1.27.3-live (D136, CONVENTIONS §10.29): the host's wish list in display order — each
                gift as shown (name by `Accept-Language`) with how many of it the host received in this
                live. A gift that can no longer be sent is left out. Empty when the host wished nothing.
                Changes move `roomInfoVersion`. Clients that do not know the field ignore it.
              items: { $ref: '#/components/schemas/LiveWishGift' }
            scoreParts: { $ref: '#/components/schemas/LiveScore' }
            chatEnabled: { type: boolean, description: "CP-013: false when the host turned the chat off." }
            chatMuted: { type: boolean, description: "CP-013: the caller is muted in this live's chat (false for guests)." }
            kicked: { type: boolean, description: "v1.20-live (D105, CONVENTIONS §10.20): the caller was kicked out of this live (false for guests). The app shows the room as closed to them." }
            roomNumber:
              type: [integer, 'null']
              minimum: 100000000
              maximum: 999999999
              description: "CP-016 G (v1.15-live): the host's public room number (9 digits, the same in every live of that host; the room bar shows \"ID: …\"). Null when the host no longer has the hosting permission."
            roomLevel:
              type: [integer, 'null']
              minimum: 1
              description: "CP-016 D (v1.17-live, CONVENTIONS §10.18): the host's charm (ATTRACTIVENESS) level, the same in every live of that host. Null while the charm category is unavailable."
            status: { type: string, enum: [LIVE, ENDED] }
            allowGuests: { type: boolean, description: "CP-010: people without an account may watch." }
            endedAt: { type: [string, 'null'], format: date-time }
            endReason:
              type: [string, 'null']
              enum: [HOST_ENDED, HEARTBEAT_TIMEOUT, HOST_SUSPENDED, ADMIN, null]
    LiveWishGift:
      type: object
      description: v1.27.3-live (D136). One gift of the host's wish list.
      required: [giftCode, name, priceCoins, assetKey, imageUrl, received]
      properties:
        giftCode: { $ref: '#/components/schemas/GiftCode' }
        name: { type: string }
        priceCoins: { type: integer, minimum: 1 }
        assetKey: { type: string, description: "The bundled image key (fallback)." }
        imageUrl: { type: [string, 'null'], format: uri, description: "The hosted image, or null." }
        received: { type: integer, minimum: 0, description: "How many of this gift the host received in this live (every send that named the host, whoever sent it)." }
    GiftCode:
      type: string
      pattern: '^[a-z0-9][a-z0-9_]{0,39}$'
      description: A catalogue gift's code (v1.27.3-live, D136).
      example: rose
    WishGiftCodes:
      type: array
      maxItems: 4
      uniqueItems: true
      description: |
        v1.27.3-live (D136, §10.29): up to 4 distinct gift codes in display order (`[]` empties the
        list). Each must be a gift that can be sent now (enabled; `LUCKY` only while lucky gifts are
        on), else 400 `wishGifts` / `invalid_value`; more than 4 → `too_many`; a repeated code →
        `invalid_value`.
      items: { $ref: '#/components/schemas/GiftCode' }
    LiveRoomPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LiveRoomSummary' }
        page: { $ref: '#/components/schemas/PageInfo' }
        emptyReason:
          type: [string, 'null']
          enum: [COUNTRY_NOT_SET, null]
          description: |
            v1.27.1-live (D133): present only on `scope=nearby` responses. `COUNTRY_NOT_SET`: the caller has
            no country (`Me.country` null), so the page is empty and the app asks them to set it; null
            otherwise. Clients that do not know the field ignore it; unknown values are treated as null.
    StartLiveRoomRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { $ref: '#/components/schemas/LiveRoomTitle' }
        categorySlug: { $ref: '#/components/schemas/CategorySlug' }
        allowGuests: { type: boolean, default: true }
        mode:
          type: string
          enum: [SOLO, MULTI, AUDIO]
          default: SOLO
          description: CP-011. PK cannot be started here (L5).
        seatCount:
          description: CP-011 — required for MULTI and AUDIO, forbidden for SOLO (else 400).
          allOf:
            - $ref: '#/components/schemas/LiveSeatCount'
        theme: { $ref: '#/components/schemas/LiveThemeSlug' }
        wishGifts:
          allOf: [{ $ref: '#/components/schemas/WishGiftCodes' }]
          description: "v1.27.3-live (D136): the wish list; absent → the host's last live's list (gifts that can no longer be sent are left out when shown)."
    UpdateLiveRoomRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: At least one field. `seatCount` and `theme` are CP-011 (MULTI and AUDIO rooms only for `seatCount`); `chatEnabled` is CP-013; `title`, `categorySlug` and `topic` are CP-014. A real change of `title`, `categorySlug`, `topic` or *(v1.27.2-live, D135)* `theme` increases the room's `roomInfoVersion` in the media room's metadata, so everyone in the room re-reads it (§10.12).
      properties:
        title: { $ref: '#/components/schemas/LiveRoomTitle' }
        categorySlug:
          description: CP-014 — an active category, or null for none.
          oneOf:
            - $ref: '#/components/schemas/CategorySlug'
            - type: 'null'
        topic:
          description: CP-014 — the topic; null or an empty string removes it.
          type: [string, 'null']
          maxLength: 200
        allowGuests: { type: boolean }
        chatEnabled: { type: boolean, description: "CP-013: turn the room chat off (false) or on (true)." }
        seatCount:
          description: An allowed count for the room's mode; below an occupied seat → 409 `LIVE_SEAT_UNAVAILABLE`.
          allOf:
            - $ref: '#/components/schemas/LiveSeatCount'
        theme: { $ref: '#/components/schemas/LiveThemeSlug' }
        wishGifts:
          allOf: [{ $ref: '#/components/schemas/WishGiftCodes' }]
          description: "v1.27.3-live (D136): the host's wish list (`[]` empties it). A real change moves `roomInfoVersion` (audited `live.room.edit`)."
    LiveMediaTokenRequest:
      type: object
      additionalProperties: false
      properties:
        guestId:
          type: string
          format: uuid
          description: Required without a bearer token (a guest); ignored with one.
    LiveMediaAccess:
      type: object
      required: [url, token, expiresAt, role, identity, guestNumber]
      properties:
        url: { type: string, format: uri, description: The media server (wss://). }
        token: { type: string, description: "Access token for this room only; valid 10 minutes to join." }
        expiresAt: { type: string, format: date-time }
        role:
          type: string
          enum: [HOST, VIEWER, SPEAKER]
          description: SPEAKER (CP-011) is a seated guest; seating and removing also change a joined session's permission at once.
        identity: { type: string, maxLength: 64, description: "The caller's identity in the session (a user id, or guest:<guestId>)." }
        guestNumber: { type: [integer, 'null'], minimum: 1000, maximum: 9999, description: Guests only. }
    LiveViewer:
      type: object
      required: [kind, user, guestNumber, joinedAt]
      properties:
        kind: { type: string, enum: [USER, GUEST] }
        user:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        guestNumber: { type: [integer, 'null'], minimum: 1000, maximum: 9999 }
        joinedAt: { type: string, format: date-time }
    LiveViewerPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LiveViewer' }
        page: { $ref: '#/components/schemas/PageInfo' }
    # ---- v1.7-live (DRAFT, CP-011) --------------------------------------------------------
    LiveSeatCount:
      type: integer
      enum: [4, 5, 6, 9, 10, 12, 15, 20, 25]
      description: |
        CP-011: tiles in a MULTI or AUDIO room, the host's included. MULTI: 4, 6, 9 or 12;
        AUDIO: 5, 10, 15 or 20 (v1.25.4-live, owner D123; 5, 10, 15, 20 or 25 since v1.18-live,
        D103; 6, 9, 15, 20 or 25 since v1.16-live, D100; 5, 9 or 13 before) (`LiveConfig.seatCounts`).
        Any other mode/count pair → 400. **25** stays in the enum only for responses: an AUDIO room
        started with 25 before v1.25.4-live keeps it until it ends; a request with 25 → 400.
    LiveThemeSlug:
      type: string
      pattern: '^[a-z0-9-]{2,32}$'
      description: CP-011 room theme; one of `LiveConfig.themes` (else 400). The app shows an unknown slug as the default theme.
    LiveSeatRequestBody:
      type: object
      additionalProperties: false
      properties:
        seatIndex: { type: integer, minimum: 1, maximum: 24 }
    LiveSeatInviteBody:
      type: object
      required: [username]
      additionalProperties: false
      properties:
        username: { type: string }
        seatIndex: { type: integer, minimum: 1, maximum: 24 }
    LiveSeat:
      type: object
      required: [index, state, user, mutedByHost, points]
      properties:
        index: { type: integer, minimum: 1, maximum: 24, description: "1 … seatCount-1; the host is tile 0 and not listed." }
        points:
          type: integer
          minimum: 0
          description: |
            v1.27.2-live (D135, CONVENTIONS §10.9): TAKEN only — the points the seated person received
            from gifts in this live (every send that named them, whoever sent it, while seated or not):
            100 for every counted coin of their share, exactly as the live score counts gifts (a LUCKY
            gift counts its host share). 0 for EMPTY and LOCKED seats. A gift to someone seated raises
            `LiveSeats.version`, so every app re-reads the seats. Clients that do not know the field
            ignore it.
        state: { type: string, enum: [EMPTY, LOCKED, TAKEN] }
        user:
          description: TAKEN only.
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        mutedByHost: { type: boolean, description: "TAKEN only; false otherwise." }
    LiveSeatRequest:
      type: object
      required: [id, user, seatIndex, createdAt]
      properties:
        id: { type: string, format: uuid }
        user: { $ref: '#/components/schemas/UserSummary' }
        seatIndex: { type: [integer, 'null'], minimum: 1, maximum: 24 }
        createdAt: { type: string, format: date-time }
    LiveSeatRequestPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LiveSeatRequest' }
        page: { $ref: '#/components/schemas/PageInfo' }
    LiveSeatInvite:
      type: object
      required: [id, user, seatIndex, invitedBy, expiresAt]
      properties:
        id: { type: string, format: uuid }
        user: { $ref: '#/components/schemas/UserSummary' }
        seatIndex: { type: [integer, 'null'], minimum: 1, maximum: 24 }
        invitedBy: { $ref: '#/components/schemas/UserSummary' }
        expiresAt: { type: string, format: date-time }
    LiveSeatsMine:
      type: object
      required: [role, seatIndex, request, invite]
      properties:
        role: { type: string, enum: [HOST, MODERATOR, SEATED, VIEWER], description: "A seated moderator is MODERATOR with a seatIndex." }
        seatIndex: { type: [integer, 'null'] }
        request:
          oneOf:
            - $ref: '#/components/schemas/LiveSeatRequest'
            - type: 'null'
        invite:
          oneOf:
            - $ref: '#/components/schemas/LiveSeatInvite'
            - type: 'null'
    LiveSeatCouple:
      type: object
      description: v1.23.3-live (D111). Two seated CP partners. (v1.24.2-live, D115) `privileges` are the ones their CP level unlocked; the app plays the Couple Mic Effect on a partner's seat while they speak when it lists `MIC_EFFECT`.
      required: [userIds, level, levelName, privileges]
      properties:
        userIds:
          type: array
          minItems: 2
          maxItems: 2
          description: The two partners' user ids, in seat order (the host first, then by seat index).
          items: { type: string, format: uuid }
        level: { type: integer, minimum: 1, maximum: 6, description: The couple's CP level (`CpCouple.level`). }
        levelName:
          type: string
          description: The level's tier name, localized by `Accept-Language`, else the caller's locale.
        privileges:
          type: array
          description: (v1.24.2-live, D115) The CP privileges the couple's level unlocked, in catalogue order (as `ProfileCp.privileges`).
          items: { $ref: '#/components/schemas/CpPrivilegeCode' }
    LiveSeats:
      type: object
      required: [roomId, mode, version, seatCount, seats, moderators, couples]
      properties:
        roomId: { type: string, format: uuid }
        mode: { type: string, enum: [MULTI, AUDIO] }
        version: { type: integer, minimum: 0 }
        seatCount: { $ref: '#/components/schemas/LiveSeatCount' }
        seats:
          type: array
          items: { $ref: '#/components/schemas/LiveSeat' }
        moderators:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/UserSummary' }
        couples:
          type: array
          maxItems: 12
          description: |
            v1.23.3-live (D111, CONVENTIONS §10.9): the CP couples (CP-018) whose partners BOTH sit in
            the room now — the host (seat 0) and the TAKEN seats — ordered by the first partner's
            seat (the host first). Shown only while both accounts are ACTIVE and neither blocked the
            other; an ended couple is never listed. Empty when there is none. A change of the list
            (a couple formed or ended, its level moved, a block between the partners) raises
            `version` in every LIVE room where both sit. Every caller, guests included, reads the
            same list. Clients that do not know the field ignore it.
          items: { $ref: '#/components/schemas/LiveSeatCouple' }
        pendingRequests: { type: integer, minimum: 0, description: Host and moderators only; absent for others. }
        mine:
          description: Signed-in callers only; absent for guests.
          allOf:
            - $ref: '#/components/schemas/LiveSeatsMine'
    LiveScore:
      type: object
      description: CP-012 — a live's points. A new live starts at 0; an ended room keeps them.
      required: [total, tapPoints, supportPoints]
      properties:
        total: { type: integer, format: int64, minimum: 0, description: tapPoints + supportPoints. }
        tapPoints: { type: integer, format: int64, minimum: 0, description: 1 per counted tap. }
        supportPoints:
          type: integer
          format: int64
          minimum: 0
          description: 100 per coin of value of the gifts sent in this live (v1.23-live, CP-020, CONVENTIONS §10.23).
    LiveTapsRequest:
      type: object
      required: [count]
      additionalProperties: false
      properties:
        count: { type: integer, minimum: 1, maximum: 50, description: Taps since the last batch. }
    LiveTapsResult:
      type: object
      required: [accepted, score]
      properties:
        accepted: { type: integer, minimum: 0, maximum: 50, description: Taps counted from this batch. }
        score: { $ref: '#/components/schemas/LiveScore' }
    # ---- v1.10-live (DRAFT, CP-014) — room edit and contributors ---------------------------
    LiveRoomTopic:
      type: string
      minLength: 1
      maxLength: 200
      description: |
        CP-014 (CONVENTIONS §10.12): NFC, trimmed, 1–100 code points (maxLength counts UTF-16
        units), one line, §6 text hygiene → `invalid_format`; over 100 → `too_long`.
    LiveContributor:
      type: object
      required: [user, points]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        points: { type: integer, format: int64, minimum: 1, description: Points this person gave the live. }
    LiveContributorList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/LiveContributor' }
    LiveContributorStanding:
      type: object
      description: "v1.20-live (D105, CONVENTIONS §10.12): one person's points in a live and their place in the Contribution list."
      required: [user, points, rank]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        points: { type: integer, format: int64, minimum: 0, description: Points this person gave the live (0 when none; always 0 for the host). }
        rank:
          type: [integer, 'null']
          minimum: 1
          description: Place among the people with points, as the Contribution list orders them (1 = first); null when `points` is 0.
    # ---- v1.13-live (DRAFT, CP-016 A) — popularity board --------------------------------------
    LiveRankingPeriod:
      type: string
      enum: [HOUR, DAY, WEEK]
      default: HOUR
      description: The current hour, day (from midnight) or week (from Monday) in the server's ranking time zone.
    LiveRankingEntry:
      type: object
      required: [rank, host, points, liveRoom]
      properties:
        rank: { type: integer, minimum: 1 }
        host: { $ref: '#/components/schemas/UserSummary' }
        points: { type: integer, minimum: 1 }
        liveRoom:
          description: The host's live now, or null.
          oneOf:
            - type: 'null'
            - type: object
              required: [id, title, coverUrl]
              properties:
                id: { type: string, format: uuid }
                title: { type: string }
                coverUrl: { type: [string, 'null'], format: uri }
    LiveRankings:
      type: object
      required: [period, startsAt, endsAt, data]
      properties:
        period: { $ref: '#/components/schemas/LiveRankingPeriod' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: The countdown ends here; a new board starts. }
        data:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/LiveRankingEntry' }
        me:
          type: object
          description: Only for a signed-in host.
          required: [rank, points]
          properties:
            rank: { type: [integer, 'null'], minimum: 1 }
            points: { type: integer, minimum: 0 }
    # ---- v1.9-live (DRAFT, CP-013) — room chat ----------------------------------------------
    LiveChatText:
      type: string
      minLength: 1
      maxLength: 200
      description: NFC, trimmed, 1–200 code points, §6 text hygiene, no line breaks (CONVENTIONS §10.11).
    LiveChatMessageKind:
      type: string
      enum: [TEXT, VOICE, IMAGE]
      description: |
        CP-017 (CONVENTIONS §10.19): `TEXT` a text line; `VOICE` a voice clip of at most 30 s;
        `IMAGE` a picture. VOICE and IMAGE vanish 60 s after sending. Apps show an unknown kind
        as nothing.
    LiveChatSendRequest:
      type: object
      required: [clientId]
      additionalProperties: false
      description: |
        `kind` defaults to `TEXT`, which needs `text` and takes no `mediaId`. `VOICE` and `IMAGE`
        need `mediaId` and take no `text`. A missing field → `required`; a field the kind does not
        take → `invalid_value`.
      properties:
        kind: { $ref: '#/components/schemas/LiveChatMessageKind' }
        text: { $ref: '#/components/schemas/LiveChatText' }
        mediaId:
          type: string
          format: uuid
          description: CP-017 — the caller's completed `LIVE_CHAT_VOICE` (VOICE) or `LIVE_CHAT_IMAGE` (IMAGE) upload, not used before.
        clientId:
          type: string
          format: uuid
          description: Chosen by the app for each message; a retry with the same id returns the first message.
    LiveChatMessage:
      type: object
      required: [id, roomId, author, authorRole, kind, text, media, expiresAt, createdAt, cpBubble, authorBadges]
      properties:
        id: { type: string, format: uuid }
        roomId: { type: string, format: uuid }
        authorBadges: { $ref: '#/components/schemas/LiveChatAuthorBadges' }
        cpBubble:
          type: boolean
          description: |
            (v1.24-live, CP-021) The author's CP couple had the Exclusive Chat Bubble (`CHAT_BUBBLE`,
            CP level 2+) when it was sent — the app draws the line in the CP bubble. False for
            messages sent before v1.24-live.
        author: { $ref: '#/components/schemas/UserSummary' }
        authorRole:
          type: string
          enum: [HOST, MODERATOR, SPEAKER, VIEWER]
          description: The author's role in the room when they sent it.
        kind: { $ref: '#/components/schemas/LiveChatMessageKind' }
        text:
          type: string
          description: CP-016 B — the host's blocked words are already masked (each character → `*`). Empty for `VOICE` and `IMAGE`.
        media:
          description: |
            CP-017 — the voice clip (`type: AUDIO`, with `durationMs`) or picture (`type: IMAGE`)
            of a `VOICE` or `IMAGE` message. Null for `TEXT`, and once the media expired and was
            deleted.
          oneOf:
            - $ref: '#/components/schemas/MediaAsset'
            - type: 'null'
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: CP-017 — `VOICE` and `IMAGE`, sent + 60 s; apps hide the message then. Null for `TEXT`.
        createdAt: { type: string, format: date-time }
      example:
        id: 0192f1d0-8888-7000-8000-000000000009
        roomId: 0192f1d0-6666-7000-8000-000000000007
        author: { id: 0192f1d0-5555-7000-8000-000000000006, username: sara, displayName: سارة, avatarUrl: null }
        authorRole: VIEWER
        kind: VOICE
        text: ''
        media:
          id: 0192f1d0-2222-7000-8000-000000000002
          type: AUDIO
          status: READY
          width: 0
          height: 0
          blurhash: null
          url: https://media.example.com/media/0192f1d0-2222-7000-8000-000000000002/voice.m4a
          thumbUrl: https://media.example.com/media/0192f1d0-2222-7000-8000-000000000002/voice.m4a
          durationMs: 12500
        expiresAt: '2026-10-26T18:31:00.000Z'
        createdAt: '2026-10-26T18:30:00.000Z'
        cpBubble: false
        authorBadges: { charmLevel: 12, supportLevel: 3, family: { name: نجوم كابسو, level: 2 } }
    LiveChatAuthorBadges:
      type: object
      description: |
        (v1.24.4-live, D119) The small badges a live chat line shows under the author's name, as
        they are now (read when the message is sent or listed; the server may cache them up to
        30 s). Messages from before v1.24.4-live get them too (they are not stored).
      required: [charmLevel, supportLevel, family]
      properties:
        charmLevel:
          type: [integer, 'null']
          minimum: 1
          maximum: 200
          description: The author's charm (`ATTRACTIVENESS`) level number; null while that category is unavailable (CP-005).
        supportLevel:
          type: [integer, 'null']
          minimum: 1
          maximum: 200
          description: The author's `SUPPORT` level number; null while that category is unavailable (CP-005).
        family:
          description: The author's family (CP-018), or null.
          oneOf:
            - $ref: '#/components/schemas/LiveChatAuthorFamily'
            - type: 'null'
    LiveChatAuthorFamily:
      type: object
      description: (v1.24.4-live, D119) The family of a live chat message's author.
      required: [name, level]
      properties:
        name: { type: string }
        level: { type: integer, minimum: 1, maximum: 10 }
    LiveChatMessageList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/LiveChatMessage' }
    LiveChatMute:
      type: object
      required: [user, mutedAt]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        mutedAt: { type: string, format: date-time }
    LiveChatMuteList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LiveChatMute' }
    # ---- v1.20-live (DRAFT, owner D105) — kicking out of a live ---------------------------------
    LiveKickRequest:
      type: object
      required: [username]
      additionalProperties: false
      properties:
        username: { type: string, description: "The person to kick (lowercase username; a malformed one → 404)." }
    LiveKick:
      type: object
      required: [user, kickedAt]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        kickedAt: { type: string, format: date-time }
    LiveKickList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LiveKick' }
    # ---- v1.19-live (DRAFT, CP-017) — coins and bullet messages -------------------------------
    Wallet:
      type: object
      required: [coins]
      properties:
        coins:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: The caller's coin balance (CONVENTIONS §3, §10.19).
    LiveBulletSendRequest:
      type: object
      required: [text, clientId]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 60
          description: NFC, trimmed, 1–60 code points, §6 text hygiene, no line breaks (the chat rules, CONVENTIONS §10.11, §10.19).
        clientId:
          type: string
          format: uuid
          description: Chosen by the app for each bullet; a retry with the same id returns the first bullet and is never charged again.
    LiveBullet:
      type: object
      required: [id, text, sender, roomId, createdAt]
      properties:
        id: { type: string, format: uuid }
        text:
          type: string
          description: The origin host's blocked words are already masked (CP-016 B).
        sender: { $ref: '#/components/schemas/UserSummary' }
        roomId:
          type: string
          format: uuid
          description: The live it was sent from.
        createdAt: { type: string, format: date-time }
    # ---- v1.27.6-live (DRAFT, D140) — the host's statistics of a live ----------------------
    LiveRoomStats:
      type: object
      required: [roomId, status, startedAt, endedAt, durationSeconds, score, hostOwnPoints, supporters, topSupporters, giftCount, chatMessages, newFollowers, viewers, viewerCountries]
      properties:
        roomId: { type: string, format: uuid }
        status: { type: string, enum: [LIVE, ENDED] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        durationSeconds: { type: integer, minimum: 0, description: "From the start to the end (to now while LIVE), whole seconds." }
        score: { $ref: '#/components/schemas/LiveScore' }
        hostOwnPoints:
          type: integer
          format: int64
          minimum: 0
          description: "The part of `score.total` from the host's own taps and gifts (D120, D128)."
        supporters: { type: integer, minimum: 0, description: "People other than the host who gave this live points (the Contribution list as the host reads it, no 50 cap)." }
        topSupporters:
          type: array
          maxItems: 3
          description: The first three of the Contribution list.
          items: { $ref: '#/components/schemas/LiveContributor' }
        giftCount: { type: integer, format: int64, minimum: 0, description: "Gifts sent in this live (the sum of quantities; to anyone in it, the host's own included)." }
        chatMessages: { type: integer, minimum: 0, description: "Chat messages of this live that were not deleted." }
        newFollowers: { type: integer, minimum: 0, description: "People who started following the host during the live and still do (ACTIVE accounts)." }
        viewers:
          oneOf:
            - { $ref: '#/components/schemas/LiveRoomViewerStats' }
            - { type: 'null' }
          description: "`null` for a live started before the audience record (D140)."
        viewerCountries:
          type: array
          maxItems: 7
          description: |
            Shares of `viewers.unique`: the five countries with the most viewers (ties: the code,
            A → Z), then `OTHER` (every further country) and `UNKNOWN` (guests and people without a
            country), each only when it has viewers. Empty without viewers.
          items: { $ref: '#/components/schemas/LiveViewerCountry' }
    LiveRoomViewerStats:
      type: object
      required: [unique, guests, peak, atEnd, averageWatchSeconds]
      properties:
        unique: { type: integer, minimum: 0, description: "Different people and guests who watched (the host left out); one person counts once however often they came back." }
        guests: { type: integer, minimum: 0, description: "Of `unique`, viewers without an account." }
        peak: { type: integer, minimum: 0, description: The most viewers connected at once. }
        atEnd: { type: integer, minimum: 0, description: "Viewers connected when the live ended (now while LIVE)." }
        averageWatchSeconds: { type: integer, minimum: 0, description: "The total time viewers were connected, divided by `unique`, rounded; 0 without viewers." }
    LiveViewerCountry:
      type: object
      required: [country, viewers, percent]
      properties:
        country:
          type: string
          pattern: '^([A-Z]{2}|OTHER|UNKNOWN)$'
          description: "ISO 3166-1 alpha-2 (the viewer's own `Me.country`), `OTHER` or `UNKNOWN`."
        viewers: { type: integer, minimum: 1 }
        percent:
          type: number
          minimum: 0
          maximum: 100
          description: "`viewers` / `LiveRoomViewerStats.unique` × 100, one decimal, half up; each bucket rounded on its own, so the shares may add up to 99.9–100.1 (shown as they are)."
    # ---- v1.27.5-live (DRAFT, D138) — an emoji on one's own seat ---------------------------
    LiveSeatEmojiRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          pattern: '^:[a-z]+_[a-z]+:$'
          description: "`:<pack>_<id>:` (CP-003 shape) of one of the owner's nine packs (D102); anything else → 400 `token` / `invalid_value`."
    LiveSeatEmoji:
      type: object
      required: [id, seat, user, token, createdAt]
      properties:
        id: { type: string, format: uuid, description: "Names this emoji (apps drop a data message they have already shown)." }
        seat: { type: integer, minimum: 0, maximum: 24, description: "The tile it plays on: 0 = the host, else `LiveSeat.index`." }
        user: { $ref: '#/components/schemas/UserSummary' }
        token: { type: string, description: "`:<pack>_<id>:`." }
        createdAt: { type: string, format: date-time }
    LiveBulletResult:
      type: object
      required: [bullet, coins]
      properties:
        bullet: { $ref: '#/components/schemas/LiveBullet' }
        coins:
          type: integer
          format: int64
          minimum: 0
          description: The caller's balance after the bullet (for a retry, the current balance).
    # ---- v1.4-levels (DRAFT, CP-005) ------------------------------------------------------
    LevelCategoryCode:
      type: string
      enum: [ATTRACTIVENESS, SUPPORT, WIZARD, GAMING]
    PointsAmount:
      description: A whole number of points (or of source units) as a decimal string, so 64-bit values survive JSON.
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
    LevelMultiplier:
      description: Points per source unit, > 0, at most 6 decimals (e.g. "1", "0.5").
      type: string
      pattern: '^(0|[1-9][0-9]{0,6})(\.[0-9]{1,6})?$'
    LevelValueUnit:
      type: string
      enum: [COIN]
    LevelReversalPolicy:
      type: string
      enum: [REVERSE_POINTS, KEEP_LEVEL]
    LevelRecalculation:
      type: string
      enum: [PRESERVE_POINTS, RECOMPUTE_FROM_LEDGER]
    LevelIconKey:
      type: [string, 'null']
      maxLength: 64
      pattern: '^[a-z0-9_]{1,64}$'
    LevelBrief:
      type: object
      required: [levelNumber, name, requiredPoints, iconKey]
      properties:
        levelNumber: { type: integer, minimum: 1, maximum: 200 }
        name: { type: string, maxLength: 40 }
        requiredPoints: { $ref: '#/components/schemas/PointsAmount' }
        iconKey: { $ref: '#/components/schemas/LevelIconKey' }
    LevelSummary:
      type: object
      required:
        [category, status, name, description, points, level, nextLevel, pointsToNext, progressPercent, maxLevel, versionNumber]
      properties:
        category: { $ref: '#/components/schemas/LevelCategoryCode' }
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
          description: UNAVAILABLE = disabled or no published configuration; level fields are null.
        name: { type: string, maxLength: 40 }
        description: { type: string, maxLength: 200 }
        points: { $ref: '#/components/schemas/PointsAmount' }
        level:
          oneOf:
            - { $ref: '#/components/schemas/LevelBrief' }
            - { type: 'null' }
        nextLevel:
          oneOf:
            - { $ref: '#/components/schemas/LevelBrief' }
            - { type: 'null' }
        pointsToNext:
          oneOf:
            - { $ref: '#/components/schemas/PointsAmount' }
            - { type: 'null' }
        progressPercent:
          description: Progress from the current level's threshold to the next one, 0–100 with one decimal; 100 at the top level; null when UNAVAILABLE.
          type: [number, 'null']
          minimum: 0
          maximum: 100
        maxLevel: { type: boolean }
        versionNumber: { type: [integer, 'null'], minimum: 1 }
    PublicLevel:
      type: object
      required: [category, status, name, level]
      additionalProperties: false
      properties:
        category: { $ref: '#/components/schemas/LevelCategoryCode' }
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
        name: { type: string, maxLength: 40 }
        level:
          oneOf:
            - { $ref: '#/components/schemas/LevelBrief' }
            - { type: 'null' }
    LevelDetail:
      allOf:
        - { $ref: '#/components/schemas/LevelSummary' }
        - type: object
          required: [levels]
          properties:
            levels:
              type: array
              maxItems: 200
              items: { $ref: '#/components/schemas/LevelBrief' }
    LevelTransitionReason:
      type: string
      enum: [EARNED, REVERSED, ADJUSTED, CONFIG_PUBLISHED, RECALCULATED]
    LevelTransition:
      type: object
      required: [id, category, previousLevel, newLevel, points, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/LevelCategoryCode' }
        previousLevel: { type: [integer, 'null'], minimum: 1 }
        newLevel: { type: [integer, 'null'], minimum: 1 }
        points: { $ref: '#/components/schemas/PointsAmount' }
        reason: { $ref: '#/components/schemas/LevelTransitionReason' }
        createdAt: { type: string, format: date-time }
    LevelTransitionPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LevelTransition' }
        page: { $ref: '#/components/schemas/PageInfo' }
    PointsEntryType:
      type: string
      enum: [EARN, REVERSAL, ADJUSTMENT]
    PointsSourceType:
      description: GIFT_RECEIVED/GIFT_SENT/LUCKY_GIFT_SENT/GAME_SPEND for activity; LIVE_TAPS for a viewer's taps in a live (v1.17-live; v1.25.1-live, D120, the host's own taps too; CONVENTIONS §10.18); ADMIN for manual adjustments; CONFIG for recalculations.
      type: string
      enum: [GIFT_RECEIVED, GIFT_SENT, LUCKY_GIFT_SENT, GAME_SPEND, LIVE_TAPS, ADMIN, CONFIG]
    PointsEntry:
      type: object
      required: [id, category, entryType, sourceType, pointsDelta, createdAt]
      properties:
        id: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/LevelCategoryCode' }
        entryType: { $ref: '#/components/schemas/PointsEntryType' }
        sourceType: { $ref: '#/components/schemas/PointsSourceType' }
        pointsDelta: { $ref: '#/components/schemas/PointsAmount' }
        createdAt: { type: string, format: date-time }
    PointsEntryPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PointsEntry' }
        page: { $ref: '#/components/schemas/PageInfo' }
    AdminLevelDefinition:
      type: object
      required: [levelNumber, nameAr, nameEn, requiredPoints, iconKey]
      additionalProperties: false
      properties:
        levelNumber: { type: integer, minimum: 1, maximum: 200 }
        nameAr: { type: string, minLength: 1, maxLength: 40 }
        nameEn: { type: string, minLength: 1, maxLength: 40 }
        requiredPoints: { $ref: '#/components/schemas/PointsAmount' }
        iconKey: { $ref: '#/components/schemas/LevelIconKey' }
    AdminLevelVersion:
      type: object
      required:
        [id, category, versionNumber, status, multiplier, valueUnit, reversalPolicy, luckyGiftsCountAsSupport, levels, createdAt, createdBy, publishedAt, publishedBy]
      properties:
        id: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/LevelCategoryCode' }
        versionNumber: { type: integer, minimum: 1 }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        multiplier:
          oneOf:
            - { $ref: '#/components/schemas/LevelMultiplier' }
            - { type: 'null' }
        valueUnit:
          oneOf:
            - { $ref: '#/components/schemas/LevelValueUnit' }
            - { type: 'null' }
        reversalPolicy: { $ref: '#/components/schemas/LevelReversalPolicy' }
        luckyGiftsCountAsSupport: { type: boolean }
        levels:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/AdminLevelDefinition' }
        createdAt: { type: string, format: date-time }
        createdBy: { type: [string, 'null'], format: uuid }
        publishedAt: { type: [string, 'null'], format: date-time }
        publishedBy: { type: [string, 'null'], format: uuid }
    AdminLevelCategory:
      type: object
      required: [category, nameAr, nameEn, descriptionAr, descriptionEn, enabled, published, draftCount, updatedAt]
      properties:
        category: { $ref: '#/components/schemas/LevelCategoryCode' }
        nameAr: { type: string, maxLength: 40 }
        nameEn: { type: string, maxLength: 40 }
        descriptionAr: { type: string, maxLength: 200 }
        descriptionEn: { type: string, maxLength: 200 }
        enabled: { type: boolean }
        published:
          oneOf:
            - { $ref: '#/components/schemas/AdminLevelVersion' }
            - { type: 'null' }
        draftCount: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    UpdateLevelCategoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled: { type: boolean }
        nameAr: { type: string, minLength: 1, maxLength: 40 }
        nameEn: { type: string, minLength: 1, maxLength: 40 }
        descriptionAr: { type: string, minLength: 1, maxLength: 200 }
        descriptionEn: { type: string, minLength: 1, maxLength: 200 }
    CreateLevelVersionRequest:
      type: object
      additionalProperties: false
      properties:
        copyFromVersionId: { type: [string, 'null'], format: uuid }
    LevelVersionInput:
      type: object
      required: [multiplier, valueUnit, reversalPolicy, levels]
      additionalProperties: false
      properties:
        multiplier: { $ref: '#/components/schemas/LevelMultiplier' }
        valueUnit: { $ref: '#/components/schemas/LevelValueUnit' }
        reversalPolicy: { $ref: '#/components/schemas/LevelReversalPolicy' }
        luckyGiftsCountAsSupport: { type: boolean, default: false }
        levels:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/AdminLevelDefinition' }
    LevelValidationResult:
      type: object
      required: [valid, issues]
      properties:
        valid: { type: boolean }
        issues:
          type: array
          items:
            type: object
            required: [field, issue]
            properties:
              field: { type: string }
              issue: { type: string }
    LevelPreview:
      type: object
      required: [versionId, recalculation, totalUsers, usersChangingLevel, distribution]
      properties:
        versionId: { type: string, format: uuid }
        recalculation: { $ref: '#/components/schemas/LevelRecalculation' }
        totalUsers: { type: integer, minimum: 0 }
        usersChangingLevel: { type: integer, minimum: 0 }
        distribution:
          type: array
          maxItems: 200
          items:
            type: object
            required: [levelNumber, users]
            properties:
              levelNumber: { type: integer, minimum: 1 }
              users: { type: integer, minimum: 0 }
    PublishLevelVersionRequest:
      type: object
      required: [recalculation]
      additionalProperties: false
      properties:
        recalculation: { $ref: '#/components/schemas/LevelRecalculation' }
    AdminPointsEntry:
      allOf:
        - { $ref: '#/components/schemas/PointsEntry' }
        - type: object
          required: [sourceTransactionId, sourceValue, multiplierUsed, versionNumber, reason, createdBy]
          properties:
            sourceTransactionId: { type: [string, 'null'], maxLength: 128 }
            sourceValue:
              oneOf:
                - { $ref: '#/components/schemas/PointsAmount' }
                - { type: 'null' }
            multiplierUsed:
              oneOf:
                - { $ref: '#/components/schemas/LevelMultiplier' }
                - { type: 'null' }
            versionNumber: { type: [integer, 'null'], minimum: 1 }
            reason: { type: [string, 'null'], maxLength: 500 }
            createdBy: { type: [string, 'null'], format: uuid }
    AdminUserLevelState:
      allOf:
        - { $ref: '#/components/schemas/LevelSummary' }
        - type: object
          required: [lifetimeEarnedPoints, recentEntries, recentTransitions]
          properties:
            lifetimeEarnedPoints: { $ref: '#/components/schemas/PointsAmount' }
            recentEntries:
              type: array
              maxItems: 20
              items: { $ref: '#/components/schemas/AdminPointsEntry' }
            recentTransitions:
              type: array
              maxItems: 20
              items: { $ref: '#/components/schemas/LevelTransition' }
    AdminUserLevels:
      type: object
      required: [userId, data]
      properties:
        userId: { type: string, format: uuid }
        data:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/AdminUserLevelState' }
    RecalculateLevelRequest:
      type: object
      required: [category]
      additionalProperties: false
      properties:
        category: { $ref: '#/components/schemas/LevelCategoryCode' }
    LevelAdjustmentRequest:
      type: object
      required: [category, pointsDelta, reason]
      additionalProperties: false
      properties:
        category: { $ref: '#/components/schemas/LevelCategoryCode' }
        pointsDelta:
          description: Non-zero whole number of points (negative removes points).
          type: string
          pattern: '^-?[1-9][0-9]{0,18}$'
        reason: { type: string, minLength: 3, maxLength: 500 }
    AdminLevelAdjustmentResult:
      type: object
      required: [entry, levels]
      properties:
        entry: { $ref: '#/components/schemas/AdminPointsEntry' }
        levels: { $ref: '#/components/schemas/AdminUserLevels' }
    StartLevelReconciliationRequest:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [DRY_RUN, REPAIR] }
        category:
          oneOf:
            - { $ref: '#/components/schemas/LevelCategoryCode' }
            - { type: 'null' }
    LevelReconciliationRun:
      type: object
      required:
        [id, category, mode, status, startedAt, completedAt, eventsInspected, statesInspected, failedEvents, unprocessedEvents, stateMismatches, corrected, errors, initiatedBy]
      properties:
        id: { type: string, format: uuid }
        category:
          oneOf:
            - { $ref: '#/components/schemas/LevelCategoryCode' }
            - { type: 'null' }
        mode: { type: string, enum: [DRY_RUN, REPAIR] }
        status: { type: string, enum: [RUNNING, COMPLETED, FAILED] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        eventsInspected: { type: integer, minimum: 0 }
        statesInspected: { type: integer, minimum: 0 }
        failedEvents: { type: integer, minimum: 0 }
        unprocessedEvents: { type: integer, minimum: 0 }
        stateMismatches: { type: integer, minimum: 0 }
        corrected: { type: integer, minimum: 0 }
        errors:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 300 }
        initiatedBy: { type: [string, 'null'], format: uuid }
    LevelReconciliationPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LevelReconciliationRun' }
        page: { $ref: '#/components/schemas/PageInfo' }
    LevelEventStatus:
      type: string
      enum: [PENDING, PROCESSED, SKIPPED, FAILED]
    LevelSourceEvent:
      type: object
      required: [id, type, sourceTransactionId, status, attempts, lastError, receivedAt, processedAt]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [GIFT_COMMITTED, GAME_SPEND_COMMITTED, GIFT_REVERSED, GAME_SPEND_REVERSED]
        sourceTransactionId: { type: string, maxLength: 128 }
        status: { $ref: '#/components/schemas/LevelEventStatus' }
        attempts: { type: integer, minimum: 0 }
        lastError: { type: [string, 'null'], maxLength: 300 }
        receivedAt: { type: string, format: date-time }
        processedAt: { type: [string, 'null'], format: date-time }
    LevelSourceEventPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LevelSourceEvent' }
        page: { $ref: '#/components/schemas/PageInfo' }
    LevelCategoryReport:
      type: object
      required: [category, enabled, publishedVersionNumber, levelCount, multiplier, valueUnit, usersPerLevel, recentLevelUps, lastReconciliation]
      properties:
        category: { $ref: '#/components/schemas/LevelCategoryCode' }
        enabled: { type: boolean }
        publishedVersionNumber: { type: [integer, 'null'], minimum: 1 }
        levelCount: { type: [integer, 'null'], minimum: 1 }
        multiplier:
          oneOf:
            - { $ref: '#/components/schemas/LevelMultiplier' }
            - { type: 'null' }
        valueUnit:
          oneOf:
            - { $ref: '#/components/schemas/LevelValueUnit' }
            - { type: 'null' }
        usersPerLevel:
          type: array
          maxItems: 200
          items:
            type: object
            required: [levelNumber, users]
            properties:
              levelNumber: { type: integer, minimum: 1 }
              users: { type: integer, minimum: 0 }
        recentLevelUps:
          type: array
          maxItems: 10
          items:
            allOf:
              - { $ref: '#/components/schemas/LevelTransition' }
              - type: object
                required: [userId]
                properties:
                  userId: { type: string, format: uuid }
        lastReconciliation:
          oneOf:
            - { $ref: '#/components/schemas/LevelReconciliationRun' }
            - { type: 'null' }
    LevelAuditLog:
      type: object
      required: [id, action, actorUserId, targetType, targetId, metadata, createdAt]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, maxLength: 64 }
        actorUserId: { type: [string, 'null'], format: uuid }
        targetType: { type: [string, 'null'], maxLength: 32 }
        targetId: { type: [string, 'null'], maxLength: 64 }
        metadata: { type: [object, 'null'] }
        createdAt: { type: string, format: date-time }
    LevelAuditLogPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LevelAuditLog' }
        page: { $ref: '#/components/schemas/PageInfo' }
    MediaKind:
      type: string
      enum: [POST_IMAGE, STORY_IMAGE, LIVE_COVER, LIVE_CHAT_IMAGE, LIVE_CHAT_VOICE, FAMILY_EMBLEM, FAMILY_COVER, HOME_BANNER]
      description: |
        Images for posts, (CP-008) for stories and (CP-015) for the host's live cover; (CP-017)
        a picture or a voice clip (`audio/mp4`, ≤ 30 s, ≤ 1 MiB) for a live chat message;
        (CP-018) a family's emblem (a centre-cropped square like the live cover); (CP-022) a
        family's cover (processed like a post image, at most 1 080 px on the long side);
        (D124) a home banner (cover-cropped to 3:1 around the centre: 1 500 × 500 and 320 × 107,
        attached only by the banner-admin CLI); video
        kinds arrive with M2 (CP-006 §2). An asset is attachable only to its kind's target (a
        post, a story, the live cover, a live chat message or a family).
    CreateMediaUploadRequest:
      type: object
      additionalProperties: false
      required: [kind, contentType, byteSize]
      properties:
        kind: { $ref: '#/components/schemas/MediaKind' }
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, audio/mp4]
          description: |
            HEIC/HEIF is not accepted; the app converts such photos to JPEG on the device.
            `audio/mp4` (AAC in MPEG-4, `.m4a`) is for `LIVE_CHAT_VOICE` only, and that kind takes
            nothing else (CP-017; else `invalid_value`).
        byteSize:
          type: integer
          minimum: 1
          maximum: 15728640
          description: At most 1 048 576 for `LIVE_CHAT_VOICE` (else `too_big`).
    MediaUpload:
      type: object
      required: [uploadId, uploadUrl, method, headers, expiresAt]
      properties:
        uploadId: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        method: { type: string, enum: [PUT] }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Send exactly these headers with the bytes (Content-Type, Content-Length).
        expiresAt: { type: string, format: date-time }
    MediaAsset:
      type: object
      required: [id, type, status, width, height, blurhash, url, thumbUrl]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [IMAGE, AUDIO]
          description: CP-017 — `AUDIO` is a `LIVE_CHAT_VOICE` clip.
        status: { type: string, enum: [READY] }
        width:
          type: integer
          minimum: 0
          description: At least 1 for an image; 0 for `AUDIO`.
        height:
          type: integer
          minimum: 0
          description: At least 1 for an image; 0 for `AUDIO`.
        blurhash: { type: [string, 'null'] }
        url:
          type: string
          format: uri
          description: |
            WebP, at most 1 080 px on the long side (1 920 px for a `STORY_IMAGE`, CP-008; a
            `LIVE_COVER` is centre-cropped to a square of at most 640 px, CP-015). `AUDIO`: the
            clip as uploaded (`audio/mp4`).
        thumbUrl:
          type: string
          format: uri
          description: "WebP, at most 320 px on the long side (a square for a `LIVE_COVER`). `AUDIO`: the same as `url`."
        durationMs:
          type: integer
          minimum: 1
          maximum: 30000
          description: CP-017 — `AUDIO` only (absent for images); the clip's length.
    SetLiveBlockedWordsRequest:
      type: object
      additionalProperties: false
      required: [words]
      properties:
        words:
          type: array
          maxItems: 200
          description: The whole list (replaces the old one); at most 100 after duplicates are dropped.
          items: { type: string, minLength: 1, maxLength: 240 }
    LiveBlockedWords:
      type: object
      required: [words]
      properties:
        words:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 30 }
    CreateLiveScheduleSlotRequest:
      type: object
      additionalProperties: false
      required: [title, startsAt]
      properties:
        title: { type: string, minLength: 1, maxLength: 240, description: "1–60 code points after normalization (CONVENTIONS §10.16)." }
        startsAt: { type: string, format: date-time, description: 15 minutes to 30 days from now. }
    LiveScheduleSlot:
      type: object
      required: [id, title, startsAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 60 }
        startsAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    LiveScheduleList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/LiveScheduleSlot' }
    SetLiveCoverRequest:
      type: object
      additionalProperties: false
      required: [mediaId]
      properties:
        mediaId: { type: string, format: uuid, description: "A READY, unattached LIVE_COVER asset of the caller." }
    LiveCover:
      type: object
      required: [coverUrl]
      properties:
        coverUrl: { type: string, format: uri, description: "WebP, 640 px square (smaller if the photo was)." }
    PostText:
      type: string
      maxLength: 2200
      description: After NFC and trim; control, bidi-override and zero-width characters are refused (§11.2).
    PostSettings:
      type: object
      additionalProperties: false
      required: [commentsEnabled, whoCanComment, hideLikeCount]
      properties:
        commentsEnabled: { type: boolean }
        whoCanComment: { type: string, enum: [EVERYONE, FOLLOWERS, NOBODY] }
        hideLikeCount:
          type: boolean
          description: "Others see `likeCount: null` and cannot list likes."
    PostSettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        commentsEnabled: { type: boolean }
        whoCanComment: { type: string, enum: [EVERYONE, FOLLOWERS, NOBODY] }
        hideLikeCount: { type: boolean }
    PostStatus:
      type: string
      enum: [DRAFT, SCHEDULED, PUBLISHED]
    CreatePostRequest:
      type: object
      additionalProperties: false
      properties:
        text: { $ref: '#/components/schemas/PostText' }
        mediaIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uuid }
        location: { type: [string, 'null'], maxLength: 80 }
        status: { allOf: [{ $ref: '#/components/schemas/PostStatus' }], default: PUBLISHED }
        publishAt: { type: string, format: date-time, description: Required for SCHEDULED; forbidden otherwise. }
        settings: { $ref: '#/components/schemas/PostSettingsPatch' }
    UpdatePostRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        text: { $ref: '#/components/schemas/PostText' }
        location: { type: [string, 'null'], maxLength: 80 }
        status: { $ref: '#/components/schemas/PostStatus' }
        publishAt: { type: string, format: date-time }
        settings: { $ref: '#/components/schemas/PostSettingsPatch' }
    Post:
      type: object
      required: [id, format, author, text, media, location, hashtags, mentions, status, createdAt, publishAt, publishedAt, editedAt, pinned, likeCount, commentCount, shareCount, repostCount, viewCount, viewerHasLiked, viewerHasSaved, viewerHasReposted, isSelf, settings, moderation, repostedBy]
      properties:
        id: { type: string, format: uuid }
        format: { type: string, enum: [POST], description: REEL arrives with M2. }
        author: { $ref: '#/components/schemas/UserSummary' }
        text: { type: string }
        media:
          type: array
          items: { $ref: '#/components/schemas/MediaAsset' }
        location: { type: [string, 'null'] }
        hashtags:
          type: array
          items: { type: string }
        mentions:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
        status: { $ref: '#/components/schemas/PostStatus' }
        createdAt: { type: string, format: date-time }
        publishAt: { type: [string, 'null'], format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
        editedAt: { type: [string, 'null'], format: date-time }
        pinned: { type: boolean }
        likeCount:
          type: [integer, 'null']
          minimum: 0
          description: null for others when the author hides it.
        commentCount: { type: integer, minimum: 0 }
        shareCount: { type: integer, minimum: 0 }
        repostCount: { type: integer, minimum: 0 }
        viewCount: { type: integer, minimum: 0 }
        viewerHasLiked: { type: boolean }
        viewerHasSaved: { type: boolean }
        viewerHasReposted: { type: boolean }
        isSelf: { type: boolean }
        settings: { $ref: '#/components/schemas/PostSettings' }
        moderation:
          type: string
          enum: [VISIBLE, PENDING]
          description: PENDING (author only) while its images wait for moderation (CP-006 Q2).
        repostedBy:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
          description: In the following feed, the followed account that reposted it.
    PostPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Post' }
        page: { $ref: '#/components/schemas/PageInfo' }
    UserSummaryPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
        page: { $ref: '#/components/schemas/PageInfo' }
    LikeState:
      type: object
      required: [liked, likeCount]
      properties:
        liked: { type: boolean }
        likeCount: { type: [integer, 'null'], minimum: 0 }
    SaveState:
      type: object
      required: [saved]
      properties:
        saved: { type: boolean }
    RepostState:
      type: object
      required: [reposted, repostCount]
      properties:
        reposted: { type: boolean }
        repostCount: { type: integer, minimum: 0 }
    ShareState:
      type: object
      required: [shareCount]
      properties:
        shareCount: { type: integer, minimum: 0 }
    RecordViewsRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [postId, watchedMs]
            properties:
              postId: { type: string, format: uuid }
              watchedMs: { type: integer, minimum: 0, maximum: 3600000 }
    Comment:
      type: object
      required: [id, postId, author, text, createdAt, likeCount, viewerHasLiked, replyCount, parentId, mentions, pinned, canDelete]
      properties:
        id: { type: string, format: uuid }
        postId: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/UserSummary' }
        text: { type: string, minLength: 1, maxLength: 500 }
        createdAt: { type: string, format: date-time }
        likeCount: { type: integer, minimum: 0 }
        viewerHasLiked: { type: boolean }
        replyCount: { type: integer, minimum: 0 }
        parentId: { type: [string, 'null'], format: uuid }
        mentions:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
        pinned: { type: boolean }
        canDelete:
          type: boolean
          description: The caller wrote it or owns the post.
    CommentPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
        page: { $ref: '#/components/schemas/PageInfo' }
    CreateCommentRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }
        parentId: { type: string, format: uuid }
    Hashtag:
      type: object
      required: [tag, postCount]
      properties:
        tag: { type: string }
        postCount: { type: integer, minimum: 0 }
    HashtagList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Hashtag' }
    TrendingSearch:
      type: object
      required: [term, tag]
      properties:
        term:
          type: string
          minLength: 2
          maxLength: 64
          description: The counted form (lower case, spaces collapsed); search with it as `q`.
        tag:
          type: [string, 'null']
          enum: [TRENDING, NEW, null]
          description: NEW = first searched in the last 24 h; TRENDING = at least 3 searchers in the last 24 h and at least twice the 24 h before; null otherwise.
    TrendingSearchList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/TrendingSearch' }
    RecordSearchQueryRequest:
      type: object
      additionalProperties: false
      required: [q]
      properties:
        q: { type: string, minLength: 1, maxLength: 64 }
    SearchPage:
      type: object
      required: [type, data, page]
      properties:
        type: { type: string, enum: [users, hashtags, posts] }
        data:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/UserSummary'
              - $ref: '#/components/schemas/Hashtag'
              - $ref: '#/components/schemas/Post'
        page: { $ref: '#/components/schemas/PageInfo' }
    BlockState:
      type: object
      required: [blocked]
      properties:
        blocked: { type: boolean }
    MuteState:
      type: object
      required: [muted]
      properties:
        muted: { type: boolean }
    ReportReason:
      type: string
      enum: [SPAM, NUDITY, VIOLENCE, HATE, HARASSMENT, ILLEGAL, OTHER]
    CreateStoryRequest:
      type: object
      additionalProperties: false
      required: [mediaId]
      properties:
        mediaId: { type: string, format: uuid, description: "A READY, unattached STORY_IMAGE asset of the caller." }
        text:
          type: string
          maxLength: 200
          description: After NFC and trim; §6 hygiene; at most 3 line breaks. Mentions are parsed (§11.6, at most 10); hashtags stay plain text.
    Story:
      type: object
      required: [id, author, media, text, mentions, createdAt, expiresAt, viewerHasSeen, isSelf, viewCount]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/UserSummary' }
        media: { $ref: '#/components/schemas/MediaAsset' }
        text: { type: string, description: '"" when none.' }
        mentions:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: createdAt + 24 hours. }
        viewerHasSeen: { type: boolean, description: Always true for the author's own stories. }
        isSelf: { type: boolean }
        viewCount:
          type: [integer, 'null']
          minimum: 0
          description: Distinct viewers other than the author; the author only (null for everyone else).
    StoryList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Story' }
    StoryPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Story' }
        page: { $ref: '#/components/schemas/PageInfo' }
    StoryTrayItem:
      type: object
      required: [user, storyCount, hasUnseen, latestAt]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        storyCount: { type: integer, minimum: 1, description: Active stories. }
        hasUnseen: { type: boolean, description: Any active story the caller has not seen (false for the caller's own entry). }
        latestAt: { type: string, format: date-time, description: The newest active story. }
    StoryTrayPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/StoryTrayItem' }
        page: { $ref: '#/components/schemas/PageInfo' }
    NotificationType:
      type: string
      description: "`LIVE_SCHEDULED_SOON` (v1.14-live, CP-016 C): a followed host goes live in about 15 minutes. (v1.21-live, CP-018) `CP_REQUEST` / `CP_ACCEPTED` (target USER: the other person), `FAMILY_JOIN_ACCEPTED` / `FAMILY_JOIN_DECLINED` (target FAMILY, actor the leader or deputy who answered), `MEDAL_AWARDED` (system, target MEDAL: the medal code). (v1.28-live, D146) `PREMIUM_USERNAME_EXPIRING` / `PREMIUM_USERNAME_EXPIRED` (system, target PREMIUM_USERNAME: the name, `endsAt`). Clients ignore values they do not know."
      enum: [LIKE_POST, LIKE_COMMENT, COMMENT, REPLY, MENTION, FOLLOW, REPOST, POST_PUBLISHED, CONTENT_REMOVED, LIVE_SCHEDULED_SOON, CP_REQUEST, CP_ACCEPTED, FAMILY_JOIN_ACCEPTED, FAMILY_JOIN_DECLINED, MEDAL_AWARDED, PREMIUM_USERNAME_EXPIRING, PREMIUM_USERNAME_EXPIRED]
    NotificationTarget:
      type: object
      required: [type, id, postId, thumbUrl, text]
      properties:
        type: { type: string, enum: [POST, COMMENT, STORY, USER, FAMILY, MEDAL, PREMIUM_USERNAME], description: "(v1.21-live) FAMILY and MEDAL are new; (v1.28-live, D146) PREMIUM_USERNAME; clients ignore target types they do not know." }
        id: { type: string, description: "A post, comment or story id, a username for USER, a family id for FAMILY, a medal code for MEDAL, the username for PREMIUM_USERNAME." }
        postId: { type: [string, 'null'], format: uuid, description: "For a COMMENT, its post." }
        thumbUrl: { type: [string, 'null'], format: uri, description: "The post or story photo (320 px), when it has one." }
        text: { type: [string, 'null'], maxLength: 80, description: "A short excerpt of the comment or caption, the scheduled live's title (LIVE_SCHEDULED_SOON) or the family's name (FAMILY)." }
        startsAt: { type: string, format: date-time, description: "LIVE_SCHEDULED_SOON only (v1.14-live): when the live is planned to start." }

        with the same `clientId` → 200 with the first message (409 `IDEMPOTENCY_CONFLICT` when that
        id was used in another family); 403 `AUTH_FORBIDDEN` (not a member); 403
        `FAMILY_CHAT_MUTED`. The leader's live blocked words are masked (§10.14) before it is stored.
      parameters:
        - $ref: '#/components/parameters/FamilyIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FamilyChatSendRequest' }

# Kabso Live — local development infrastructure (NOT for production).
#
#   docker compose up -d                    # Postgres + Redis (Phase 1)
#   docker compose --profile storage up -d  # + MinIO S3-compatible storage and bucket init (Phase 3)
#
# All ports bind to 127.0.0.1 only. Credentials are dev defaults, overridable from `.env`
# (copied from `.env.example` by scripts/dev-setup.sh). Never reuse them anywhere else.
name: kabso

services:
  postgres:
    # postgres:16.15-alpine — multi-arch index digest resolved 2026-10-15 (scripts/image-digests.sh)
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      # Local admin (superuser). Only the init script uses it; the API and migrations use the
      # least-privilege roles below (SEC-011 / KL-013, docs/DEPLOYMENT.md §5.1).
      POSTGRES_DB: ${POSTGRES_DB:-kabso_dev}
      POSTGRES_USER: ${POSTGRES_USER:-kabso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kabso_dev_password}
      # Read by infra/postgres/initdb/10-kabso-roles.sh on FIRST start (empty volume) only.
      KABSO_TEST_DB: ${KABSO_TEST_DB:-kabso_test}
      KABSO_DB_MIGRATOR_USER: ${KABSO_DB_MIGRATOR_USER:-kabso_migrator}
      KABSO_DB_MIGRATOR_PASSWORD: ${KABSO_DB_MIGRATOR_PASSWORD:-kabso_migrator_dev_password}
      KABSO_DB_APP_USER: ${KABSO_DB_APP_USER:-kabso_app}
      KABSO_DB_APP_PASSWORD: ${KABSO_DB_APP_PASSWORD:-kabso_app_dev_password}
      # One runtime login per database (KL-013b): the *_test database gets its own.
      KABSO_DB_APP_TEST_USER: ${KABSO_DB_APP_TEST_USER:-kabso_app_test}
      KABSO_DB_APP_TEST_PASSWORD: ${KABSO_DB_APP_TEST_PASSWORD:-kabso_app_test_dev_password}
      # Clear-text dev passwords and a shared migration role are accepted only in development.
      KABSO_DB_ENV: development
      # `prisma migrate dev` needs a shadow database. Local development only.
      KABSO_DB_MIGRATOR_CREATEDB: "true"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/bootstrap-roles.sql:/kabso/bootstrap-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    # redis:7.4-alpine — multi-arch index digest resolved 2026-10-15
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Upstream MinIO stopped publishing community container images (Docker Hub minio/minio and
  # minio/mc are no longer pullable). Default is the community-maintained build from pgsty
  # (AGPL-3.0, same `minio` binary and S3 API; bundles `mc` and `curl`). Override with
  # MINIO_IMAGE if your organisation mirrors an approved image. Dev use only.
  # Default pinned: pgsty/minio:RELEASE.2026-08-04T00-00-00Z (multi-arch index digest, 2026-10-15).
  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
    profiles: ["storage"]
    restart: unless-stopped
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kabso_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kabso_minio_dev_password}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot job: creates the media bucket (idempotent) and exits.
  minio-init:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
    profiles: ["storage"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kabso_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kabso_minio_dev_password}
      S3_BUCKET: ${S3_BUCKET:-kabso-media-dev}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        echo "bucket $${S3_BUCKET} ready"

volumes:
  postgres-data:
  redis-data:
  minio-data:
